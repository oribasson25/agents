<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Widget Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    padding: 32px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  h2 { font-size: 15px; color: #888; font-weight: 400; }
  .test-box {
    background: #fff;
    border: 1px solid #dde1e7;
    border-radius: 12px;
    padding: 16px;
    width: 100%;
    max-width: 480px;
    font-size: 13px;
  }
  .test-box h3 { font-size: 13px; margin-bottom: 10px; color: #444; }
  pre {
    background: #1a1a2e;
    color: #a0f0c0;
    font-size: 12px;
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    min-height: 40px;
  }
  button {
    background: #6c63ff;
    color: #fff;
    border: none;
    padding: 7px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 10px;
  }
  button:hover { background: #5a52e0; }
  .status-ok { color: #22c55e; font-weight: 700; }
  .status-err { color: #ef4444; font-weight: 700; }
  .note { font-size: 12px; color: #999; margin-top: 8px; }
</style>
</head>
<body>

<h2>Widget Test — Third-party iframe simulation</h2>

<!-- Direct endpoint test -->
<div class="test-box">
  <h3>1. Test chat endpoint directly (no iframe)</h3>
  <pre id="endpointResult">לחץ "Test Endpoint" כדי לבדוק את ה-API ישירות</pre>
  <button onclick="testEndpoint()">Test Endpoint</button>
  <div class="note">בודק שה-/api/widget/{id}/chat עונה כראוי לפני הiframe</div>
</div>

<!-- Iframe -->
<div class="test-box" style="padding: 0; overflow: hidden; border-radius: 16px; max-width: 480px;">
  <iframe
    src="https://8legs.vercel.app/api/widget/3b96818f-0dfb-428b-813e-6ddcd1720a75?title=+weather&accent=%23ff9861&placeholder=Type+a+message%E2%80%A6&height=500"
    width="100%"
    height="500px"
    frameborder="0"
    style="border:none; display:block;"
    sandbox="allow-scripts allow-forms"
  ></iframe>
</div>

<div class="note">פתח DevTools (F12) → Console כדי לראות logs מה-widget</div>

<script>
const AGENT_ID = '3b96818f-0dfb-428b-813e-6ddcd1720a75';
const BASE     = 'https://8legs.vercel.app';

async function testEndpoint() {
  const el = document.getElementById('endpointResult');
  el.textContent = 'Testing...';
  el.className = '';
  try {
    const r = await fetch(`${BASE}/api/widget/${AGENT_ID}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'user', content: 'ping' }] })
    });
    const text = await r.text();
    if (r.ok) {
      el.innerHTML = '<span class="status-ok">✓ OK (' + r.status + ')</span>\n' + text;
    } else {
      el.innerHTML = '<span class="status-err">✗ Error ' + r.status + '</span>\n' + text;
    }
  } catch (e) {
    el.innerHTML = '<span class="status-err">✗ Network/CORS error</span>\n' + e.message;
  }
}
</script>
</body>
</html>
