<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentForge</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <style>
    :root {
      --bg-app: #0f1117;
      --bg-sidebar: #13151c;
      --bg-card: #1a1d27;
      --bg-panel: #1e2130;
      --bg-input: #252837;
      --bg-hover: #2a2d3e;
      --primary: #6c63ff;
      --primary-hover: #7c74ff;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --teal: #14b8a6;
      --text: #f0f0f5;
      --text-2: #9ca3af;
      --text-muted: #5c6380;
      --border: #2a2d3e;
      --border-focus: #6c63ff;
      --r-sm: 6px;
      --r-md: 12px;
      --r-lg: 18px;
      --r-xl: 24px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-app);
      color: var(--text);
      font-family: 'Segoe UI', 'Arial', sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes cardHighlight {
      0% { box-shadow: 0 0 0 2px var(--primary), var(--shadow); }
      50% { box-shadow: 0 0 20px 4px var(--primary), var(--shadow); }
      100% { box-shadow: var(--shadow); }
    }
    @keyframes pulseDot {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fade-in { animation: fadeIn 0.25s ease both; }
    .slide-in-right { animation: slideInRight 0.3s cubic-bezier(0.16,1,0.3,1) both; }
    .card-highlight { animation: cardHighlight 1.2s ease-out; }

    .typing-dot {
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--text-2);
      border-radius: 50%;
      animation: pulseDot 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }

    input, textarea, select {
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 10px 14px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--border-focus); }
    input[type="range"] {
      padding: 0;
      height: 6px;
      cursor: pointer;
      accent-color: var(--primary);
    }
    input[type="color"] { padding: 2px; height: 36px; cursor: pointer; }
    select option { background: var(--bg-input); }

    button {
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: all 0.15s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .monaco-container { border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
  const { useState, useReducer, useEffect, useRef, useCallback, createContext, useContext } = React;

  /* ─────────────────── CONSTANTS ─────────────────── */
  const CLAUDE_MODELS = ['claude-opus-4-5', 'claude-sonnet-4-5', 'claude-haiku-4-5'];
  const OPENAI_MODELS = ['gpt-4o', 'gpt-4o-mini', 'gpt-4-turbo', 'gpt-3.5-turbo'];

  /* ─────────────────── HELPERS ─────────────────── */
  function uid() { return crypto.randomUUID(); }
  function isHebrew(text) { return /^[\u0590-\u05FF]/.test((text || '').trim()); }
  function fmtTime(date) {
    if (!date) return '';
    return new Date(date).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', hour12: false });
  }
  function fmtDuration(ms) { return (ms / 1000).toFixed(2) + 's'; }

  /* ─────────────────── API ─────────────────── */
  function getPassword() { return sessionStorage.getItem('agentforge_pw') || ''; }
  function apiFetch(path, opts = {}) {
    const pw = getPassword();
    const headers = { 'Content-Type': 'application/json', 'x-app-password': pw, ...(opts.headers || {}) };
    return fetch(path, { ...opts, headers });
  }
  async function apiList() { return apiFetch('/api/agents').then(r => r.json()); }
  async function apiCreate(agent) {
    return apiFetch('/api/agents', { method: 'POST', body: JSON.stringify(agent) }).then(r => r.json());
  }
  async function apiUpdate(agent) {
    return apiFetch(`/api/agents/${agent.id}`, { method: 'PUT', body: JSON.stringify(agent) }).then(r => r.json());
  }
  async function apiDelete(id) {
    return apiFetch(`/api/agents/${id}`, { method: 'DELETE' });
  }

  /* ─────────────────── DEBOUNCE ─────────────────── */
  function useDebounce(fn, delay) {
    const timerRef = useRef(null);
    return useCallback((...args) => {
      clearTimeout(timerRef.current);
      timerRef.current = setTimeout(() => fn(...args), delay);
    }, [fn, delay]);
  }

  /* ─────────────────── STATE / REDUCER ─────────────────── */
  const AppContext = createContext(null);

  function makeAgent(overrides = {}) {
    return {
      id: uid(),
      name: 'New Agent',
      avatar: '🤖',
      openingMessage: 'Hello! How can I help you today?',
      basePrompt: '',
      skills: [],
      tools: [],
      apiConfig: { provider: 'claude', apiKey: '', model: 'claude-sonnet-4-5' },
      createdAt: new Date().toISOString(),
      ...overrides,
    };
  }

  function reducer(state, action) {
    switch (action.type) {
      case 'HYDRATE': return { ...state, agents: action.agents };
      case 'CREATE_AGENT': {
        const agent = makeAgent();
        return { ...state, agents: [agent, ...state.agents], view: 'editor', editingId: agent.id };
      }
      case 'UPDATE_AGENT': return {
        ...state,
        agents: state.agents.map(a => a.id === action.agent.id ? action.agent : a),
      };
      case 'DELETE_AGENT': return {
        ...state,
        agents: state.agents.filter(a => a.id !== action.id),
        view: state.editingId === action.id ? 'list' : state.view,
        editingId: state.editingId === action.id ? null : state.editingId,
      };
      case 'DUPLICATE_AGENT': {
        const src = state.agents.find(a => a.id === action.id);
        if (!src) return state;
        const copy = { ...JSON.parse(JSON.stringify(src)), id: uid(), name: src.name + ' (Copy)', _isNew: true };
        const idx = state.agents.findIndex(a => a.id === action.id);
        const agents = [...state.agents];
        agents.splice(idx + 1, 0, copy);
        return { ...state, agents };
      }
      case 'SET_VIEW': return { ...state, view: action.view, editingId: action.editingId || state.editingId };
      case 'OPEN_CHAT': return { ...state, chatAgentId: action.id };
      case 'CLOSE_CHAT': return { ...state, chatAgentId: null };
      default: return state;
    }
  }

  /* ─────────────────── EMPTY STATE ─────────────────── */
  function EmptyState({ icon, title, subtitle }) {
    return (
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12, padding: 48, opacity: 0.6 }}>
        <div style={{ fontSize: 48 }}>{icon}</div>
        <div style={{ color: 'var(--text)', fontWeight: 600 }}>{title}</div>
        {subtitle && <div style={{ color: 'var(--text-2)', fontSize: 13 }}>{subtitle}</div>}
      </div>
    );
  }

  /* ─────────────────── ICON BUTTON ─────────────────── */
  function IconBtn({ onClick, title, children, danger, style }) {
    return (
      <button
        onClick={onClick}
        title={title}
        style={{
          background: 'transparent',
          color: danger ? 'var(--danger)' : 'var(--text-2)',
          padding: '5px 7px',
          borderRadius: 'var(--r-sm)',
          fontSize: 15,
          ...style,
        }}
        onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
        onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
      >
        {children}
      </button>
    );
  }

  /* ─────────────────── RICH PROMPT EDITOR ─────────────────── */
  function RichPromptEditor({ value, onChange }) {
    const [mode, setMode] = useState('edit');
    const [collapsed, setCollapsed] = useState(new Set());
    const textRef = useRef(null);

    useEffect(() => {
      if (textRef.current) {
        textRef.current.style.height = 'auto';
        textRef.current.style.height = Math.max(320, textRef.current.scrollHeight) + 'px';
      }
    }, [value, mode]);

    function insertHeading() {
      const el = textRef.current;
      if (!el) return;
      const pos = el.selectionStart;
      const newVal = value.slice(0, pos) + '\n## New Section\n' + value.slice(pos);
      onChange(newVal);
    }

    function toggleSection(key) {
      setCollapsed(s => { const n = new Set(s); n.has(key) ? n.delete(key) : n.add(key); return n; });
    }

    function collapseAll(sections) { setCollapsed(new Set(sections.map(s => s.key))); }
    function expandAll() { setCollapsed(new Set()); }

    // Parse sections for preview
    function parseSections() {
      const lines = (value || '').split('\n');
      const sections = [];
      let current = null;
      lines.forEach((line, i) => {
        const m = line.match(/^## (.+)$/);
        if (m) {
          if (current) sections.push(current);
          current = { key: m[1] + '_' + i, title: m[1], lines: [] };
        } else if (current) {
          current.lines.push(line);
        } else {
          if (!sections.length || sections[sections.length-1].key !== '__intro') {
            sections.push({ key: '__intro', title: null, lines: [line] });
          } else {
            sections[sections.length-1].lines.push(line);
          }
        }
      });
      if (current) sections.push(current);
      return sections;
    }

    function renderInlineChips(text) {
      const parts = text.split(/(@\w+|#\w+)/g);
      return parts.map((part, i) => {
        if (part.match(/^@\w+$/)) return <span key={i} style={{ background: 'rgba(108,99,255,0.2)', color: 'var(--primary)', borderRadius: 4, padding: '1px 5px', fontSize: 12, fontWeight: 600 }}>{part}</span>;
        if (part.match(/^#\w+$/)) return <span key={i} style={{ background: 'rgba(20,184,166,0.2)', color: 'var(--teal)', borderRadius: 4, padding: '1px 5px', fontSize: 12, fontWeight: 600 }}>{part}</span>;
        return part;
      });
    }

    const sections = parseSections();
    const sectionKeys = sections.filter(s => s.title).map(s => s.key);

    return (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {/* Toolbar */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '6px 8px', background: 'var(--bg-hover)', borderRadius: 'var(--r-sm)', flexWrap: 'wrap' }}>
          <button onClick={insertHeading} style={{ background: 'var(--bg-input)', color: 'var(--text-2)', padding: '4px 10px', borderRadius: 'var(--r-sm)', fontSize: 12, fontWeight: 600 }}>## Heading</button>
          <button onClick={() => collapseAll(sections.filter(s=>s.title))} style={{ background: 'transparent', color: 'var(--text-muted)', padding: '4px 8px', borderRadius: 'var(--r-sm)', fontSize: 12 }}>Collapse All</button>
          <button onClick={expandAll} style={{ background: 'transparent', color: 'var(--text-muted)', padding: '4px 8px', borderRadius: 'var(--r-sm)', fontSize: 12 }}>Expand All</button>
          <div style={{ flex: 1 }} />
          <div style={{ display: 'flex', background: 'var(--bg-input)', borderRadius: 'var(--r-sm)', overflow: 'hidden' }}>
            {['edit','preview'].map(m => (
              <button key={m} onClick={() => setMode(m)} style={{ padding: '4px 12px', fontSize: 12, background: mode === m ? 'var(--primary)' : 'transparent', color: mode === m ? '#fff' : 'var(--text-2)', borderRadius: 'var(--r-sm)', textTransform: 'capitalize' }}>{m}</button>
            ))}
          </div>
        </div>

        {mode === 'edit' ? (
          <div style={{ position: 'relative' }}>
            <textarea
              ref={textRef}
              value={value || ''}
              onChange={e => onChange(e.target.value)}
              dir="auto"
              style={{ fontFamily: "'JetBrains Mono','Fira Code',monospace", fontSize: 13, minHeight: 320, resize: 'none', lineHeight: 1.6, borderRadius: 'var(--r-md)' }}
              placeholder="Write your system prompt here…"
            />
            <span style={{ position: 'absolute', bottom: 10, right: 14, fontSize: 11, color: 'var(--text-muted)' }}>{(value || '').length}</span>
          </div>
        ) : (
          <div style={{ background: 'var(--bg-input)', borderRadius: 'var(--r-md)', border: '1px solid var(--border)', minHeight: 320, padding: '12px 16px', overflowY: 'auto' }}>
            {sections.length === 0 && <span style={{ color: 'var(--text-muted)', fontSize: 13 }}>No content yet…</span>}
            {sections.map(section => (
              <div key={section.key} style={{ marginBottom: 8 }}>
                {section.title ? (
                  <>
                    <div
                      onClick={() => toggleSection(section.key)}
                      style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 12px', background: 'var(--bg-hover)', borderRadius: 'var(--r-sm)', cursor: 'pointer', marginBottom: 4 }}
                    >
                      <span style={{ color: 'var(--text-muted)', fontSize: 12 }}>{collapsed.has(section.key) ? '▶' : '▼'}</span>
                      <span style={{ fontWeight: 700, color: 'var(--text)', fontSize: 14 }}>{section.title}</span>
                    </div>
                    {!collapsed.has(section.key) && (
                      <div style={{ padding: '4px 16px', color: 'var(--text-2)', fontSize: 13, lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>
                        {section.lines.map((ln, i) => <div key={i}>{renderInlineChips(ln) || '\u00a0'}</div>)}
                      </div>
                    )}
                  </>
                ) : (
                  <div style={{ padding: '4px 4px', color: 'var(--text-2)', fontSize: 13, lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>
                    {section.lines.map((ln, i) => <div key={i}>{renderInlineChips(ln) || '\u00a0'}</div>)}
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  /* ─────────────────── MONACO EDITOR ─────────────────── */
  let monacoLoadPromise = null;
  function loadMonaco() {
    if (monacoLoadPromise) return monacoLoadPromise;
    monacoLoadPromise = new Promise(resolve => {
      if (window.monaco) { resolve(window.monaco); return; }
      require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
      require(['vs/editor/editor.main'], () => resolve(window.monaco));
    });
    return monacoLoadPromise;
  }

  function MonacoPython({ value, onChange }) {
    const containerRef = useRef(null);
    const editorRef = useRef(null);

    useEffect(() => {
      let editor;
      loadMonaco().then(monaco => {
        if (!containerRef.current) return;
        editor = monaco.editor.create(containerRef.current, {
          value: value || '',
          language: 'python',
          theme: 'vs-dark',
          fontSize: 14,
          fontFamily: "'JetBrains Mono', 'Fira Code', monospace",
          lineNumbers: 'on',
          minimap: { enabled: true },
          automaticLayout: true,
          bracketPairColorization: { enabled: true },
          scrollBeyondLastLine: false,
          padding: { top: 12, bottom: 12 },
        });
        editorRef.current = editor;
        editor.onDidChangeModelContent(() => {
          if (onChange) onChange(editor.getValue());
        });
      });
      return () => { if (editorRef.current) editorRef.current.dispose(); };
    }, []);

    // Sync external value changes without causing loops
    useEffect(() => {
      const ed = editorRef.current;
      if (ed && ed.getValue() !== value) ed.setValue(value || '');
    }, [value]);

    return <div ref={containerRef} className="monaco-container" style={{ height: 420 }} />;
  }

  /* ─────────────────── CONFIGURATION TAB ─────────────────── */
  const EMOJI_OPTIONS = ['🤖','🧠','💼','🎯','🔥','🚀','⚡','💡','🛡️','🌟','👾','🎨','🔬','📊','🗺️','🎤','🌐','🔑','⚙️','🦁'];

  function ConfigurationTab({ agent, onUpdate }) {
    const [showKey, setShowKey] = useState(false);
    const [showEmojiPicker, setShowEmojiPicker] = useState(false);
    const models = agent.apiConfig.provider === 'claude' ? CLAUDE_MODELS : OPENAI_MODELS;

    function update(path, val) {
      const updated = JSON.parse(JSON.stringify(agent));
      path.reduce((obj, key, i) => {
        if (i === path.length - 1) obj[key] = val;
        return obj[key];
      }, updated);
      onUpdate(updated);
    }

    return (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 20, maxWidth: 720 }}>
        {/* Identity */}
        <div style={{ background: 'var(--bg-panel)', borderRadius: 'var(--r-lg)', padding: 24, border: '1px solid var(--border)' }}>
          <div style={{ fontWeight: 700, marginBottom: 16, fontSize: 15 }}>Identity</div>
          <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start', flexWrap: 'wrap' }}>
            {/* Avatar */}
            <div style={{ position: 'relative' }}>
              <button
                onClick={() => setShowEmojiPicker(v => !v)}
                style={{ width: 64, height: 64, borderRadius: '50%', background: 'linear-gradient(135deg,var(--primary),var(--teal))', fontSize: 30, display: 'flex', alignItems: 'center', justifyContent: 'center', border: '2px solid var(--border)' }}
              >{agent.avatar}</button>
              {showEmojiPicker && (
                <div style={{ position: 'absolute', top: 72, left: 0, background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 'var(--r-md)', padding: 10, zIndex: 100, display: 'grid', gridTemplateColumns: 'repeat(5,1fr)', gap: 4 }}>
                  {EMOJI_OPTIONS.map(e => (
                    <button key={e} onClick={() => { update(['avatar'], e); setShowEmojiPicker(false); }} style={{ fontSize: 22, background: 'transparent', borderRadius: 6, padding: 4 }}>{e}</button>
                  ))}
                </div>
              )}
            </div>
            <div style={{ flex: 1, minWidth: 200, display: 'flex', flexDirection: 'column', gap: 10 }}>
              <div>
                <label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 4, display: 'block' }}>Agent Name</label>
                <input value={agent.name} onChange={e => update(['name'], e.target.value)} dir="auto" />
              </div>
              <div>
                <label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 4, display: 'block' }}>Opening Message</label>
                <input value={agent.openingMessage} onChange={e => update(['openingMessage'], e.target.value)} dir="auto" />
              </div>
            </div>
          </div>
        </div>

        {/* API Config */}
        <div style={{ background: 'var(--bg-panel)', borderRadius: 'var(--r-lg)', padding: 24, border: '1px solid var(--border)' }}>
          <div style={{ fontWeight: 700, marginBottom: 16, fontSize: 15 }}>API Configuration</div>
          {/* Provider toggle */}
          <div style={{ marginBottom: 16 }}>
            <label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 6, display: 'block' }}>Provider</label>
            <div style={{ display: 'inline-flex', background: 'var(--bg-input)', borderRadius: 'var(--r-xl)', padding: 3, gap: 2 }}>
              {['claude','openai'].map(p => (
                <button key={p} onClick={() => { update(['apiConfig','provider'], p); update(['apiConfig','model'], p === 'claude' ? CLAUDE_MODELS[1] : OPENAI_MODELS[0]); }}
                  style={{ padding: '6px 18px', borderRadius: 'var(--r-xl)', fontWeight: 600, fontSize: 13, background: agent.apiConfig.provider === p ? 'var(--primary)' : 'transparent', color: agent.apiConfig.provider === p ? '#fff' : 'var(--text-2)' }}>
                  {p === 'claude' ? '🟣 Claude' : '🟢 OpenAI'}
                </button>
              ))}
            </div>
          </div>
          {/* API Key */}
          <div style={{ marginBottom: 16 }}>
            <label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 4, display: 'block' }}>API Key</label>
            <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
              <input type={showKey ? 'text' : 'password'} value={agent.apiConfig.apiKey} onChange={e => update(['apiConfig','apiKey'], e.target.value)} placeholder="sk-..." style={{ flex: 1 }} />
              <button onClick={() => setShowKey(v=>!v)} style={{ background: 'var(--bg-input)', color: 'var(--text-2)', padding: '8px 12px', borderRadius: 'var(--r-md)', border: '1px solid var(--border)', fontSize: 16 }}>{showKey ? '🙈' : '👁'}</button>
            </div>
          </div>
          {/* Model */}
          <div>
            <label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 4, display: 'block' }}>Model</label>
            <select value={agent.apiConfig.model} onChange={e => update(['apiConfig','model'], e.target.value)} style={{ borderRadius: 'var(--r-md)' }}>
              {models.map(m => <option key={m} value={m}>{m}</option>)}
            </select>
          </div>
        </div>

        {/* Base Prompt */}
        <div style={{ background: 'var(--bg-panel)', borderRadius: 'var(--r-lg)', padding: 24, border: '1px solid var(--border)' }}>
          <div style={{ fontWeight: 700, marginBottom: 16, fontSize: 15 }}>Base Prompt</div>
          <RichPromptEditor value={agent.basePrompt} onChange={v => update(['basePrompt'], v)} />
        </div>
      </div>
    );
  }

  /* ─────────────────── SKILLS TAB ─────────────────── */
  function SkillsTab({ agent, onUpdate }) {
    const [expandedId, setExpandedId] = useState(null);
    const [addOpen, setAddOpen] = useState(false);
    const [newSkill, setNewSkill] = useState({ name: '', description: '', prompt: '' });

    function addSkill() {
      if (!newSkill.name.trim()) return;
      const skill = { id: uid(), ...newSkill };
      onUpdate({ ...agent, skills: [...agent.skills, skill] });
      setNewSkill({ name: '', description: '', prompt: '' });
      setAddOpen(false);
    }

    function updateSkill(id, field, val) {
      onUpdate({ ...agent, skills: agent.skills.map(s => s.id === id ? { ...s, [field]: val } : s) });
    }

    function deleteSkill(id) {
      onUpdate({ ...agent, skills: agent.skills.filter(s => s.id !== id) });

  /* ─────────────────── MINI CHAT WIDGET ─────────────────── */
  function MiniChatWidget({ agent, accent, radius, height, placeholder }) {
    const [messages, setMessages] = useState(() => {
      const ts = new Date();
      return [{ id: uid(), role: 'agent', content: agent.openingMessage || 'Hello!', timestamp: ts, isOpening: true }];
    });
    const [input, setInput] = useState('');
    const [pending, setPending] = useState(false);
    const listRef = useRef(null);

    useEffect(() => {
      if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
    }, [messages]);

    async function sendMessage() {
      const text = input.trim();
      if (!text || pending) return;
      setInput('');
      const t0 = performance.now();
      const userMsg = { id: uid(), role: 'user', content: text, timestamp: new Date() };
      const typingId = uid();
      setMessages(m => [...m, userMsg, { id: typingId, role: 'typing' }]);
      setPending(true);

      const { apiKey, provider, model } = agent.apiConfig;
      const systemPrompt = buildSystemPrompt(agent);
      const history = messages.filter(m => m.role === 'user' || m.role === 'agent').map(m => ({
        role: m.role === 'agent' ? 'assistant' : 'user',
        content: m.content,
      }));
      history.push({ role: 'user', content: text });

      try {
        let content;
        if (provider === 'claude') {
          const resp = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
            body: JSON.stringify({ model, max_tokens: 1024, system: systemPrompt, messages: history }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.error?.message || JSON.stringify(data));
          content = data.content[0].text;
        } else {
          const resp = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
            body: JSON.stringify({ model, messages: [{ role: 'system', content: systemPrompt }, ...history] }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.error?.message || JSON.stringify(data));
          content = data.choices[0].message.content;
        }
        const dt = performance.now() - t0;
        setMessages(m => m.filter(x => x.id !== typingId).concat({ id: uid(), role: 'agent', content, timestamp: new Date(), durationMs: dt }));
      } catch (err) {
        const dt = performance.now() - t0;
        setMessages(m => m.filter(x => x.id !== typingId).concat({ id: uid(), role: 'error', content: err.message, timestamp: new Date(), durationMs: dt }));
      } finally {
        setPending(false);
      }
    }

    const noKey = !agent.apiConfig.apiKey;

    return (
      <div style={{ display: 'flex', flexDirection: 'column', height, borderRadius: radius, overflow: 'hidden', border: `1px solid ${accent}44`, boxShadow: `0 4px 24px rgba(0,0,0,0.4)` }}>
        {/* Header */}
        <div style={{ background: accent, padding: '12px 16px', display: 'flex', alignItems: 'center', gap: 10 }}>
          <span style={{ fontSize: 22 }}>{agent.avatar}</span>
          <span style={{ fontWeight: 700, color: '#fff', fontSize: 15 }}>{agent.name}</span>
        </div>
        {noKey && (
          <div style={{ background: 'rgba(245,158,11,0.15)', borderBottom: '1px solid rgba(245,158,11,0.3)', padding: '8px 16px', fontSize: 12, color: 'var(--warning)', textAlign: 'center' }}>
            Add an API key in Configuration to test live
          </div>
        )}
        {/* Messages */}
        <div ref={listRef} style={{ flex: 1, overflowY: 'auto', padding: '12px 16px', display: 'flex', flexDirection: 'column', gap: 10, background: 'var(--bg-app)' }}>
          {messages.map(msg => <ChatBubble key={msg.id} msg={msg} accent={accent} />)}
        </div>
        {/* Input */}
        <div style={{ padding: '10px 12px', background: 'var(--bg-panel)', borderTop: '1px solid var(--border)' }}>
          <div style={{ display: 'flex', gap: 8 }}>
            <textarea
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
              dir="auto"
              rows={1}
              disabled={pending || noKey}
              placeholder={placeholder || 'Type a message…'}
              style={{ flex: 1, resize: 'none', fontSize: 13, padding: '8px 12px', borderRadius: 'var(--r-md)' }}
            />
            <button onClick={sendMessage} disabled={pending || noKey || !input.trim()} style={{ background: accent, color: '#fff', padding: '0 14px', borderRadius: 'var(--r-md)', fontWeight: 700, fontSize: 18 }}>➤</button>
          </div>
        </div>
      </div>
    );
  }

  function ChatBubble({ msg, accent }) {
    if (msg.role === 'typing') {
      return (
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          <div style={{ background: 'var(--bg-panel)', padding: '12px 16px', borderRadius: '18px 18px 18px 4px', display: 'flex', gap: 5, alignItems: 'center' }}>
            <span className="typing-dot" />
            <span className="typing-dot" />
            <span className="typing-dot" />
          </div>
        </div>
      );
    }
    if (msg.role === 'user') {
      const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
      return (
        <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
          <div style={{ maxWidth: '75%', background: accent || 'var(--primary)', color: '#fff', padding: '10px 14px', borderRadius: '18px 18px 4px 18px', fontSize: 14, lineHeight: 1.5 }} dir={dir}>{msg.content}</div>
        </div>
      );
    }
    if (msg.role === 'error') {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 3, alignItems: 'flex-start' }}>
          <div style={{ maxWidth: '80%', background: 'rgba(239,68,68,0.15)', border: '1px solid rgba(239,68,68,0.3)', color: 'var(--danger)', padding: '10px 14px', borderRadius: '18px 18px 18px 4px', fontSize: 13 }}>⚠ {msg.content}</div>
          <div style={{ fontSize: 11, color: 'var(--danger)', paddingLeft: 4 }}>⚠ Failed after {fmtDuration(msg.durationMs)} &nbsp;•&nbsp; 🕐 {fmtTime(msg.timestamp)}</div>
        </div>
      );
    }
    // agent
    const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
    return (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 3, alignItems: 'flex-start' }}>
        <div style={{ maxWidth: '80%', background: 'var(--bg-panel)', color: 'var(--text)', padding: '10px 14px', borderRadius: '18px 18px 18px 4px', fontSize: 14, lineHeight: 1.5, whiteSpace: 'pre-wrap' }} dir={dir}>{msg.content}</div>
        <div style={{ fontSize: 11, color: 'var(--text-muted)', paddingLeft: 4 }}>
          {msg.isOpening ? `🕐 ${fmtTime(msg.timestamp)}` : `⏱ ${fmtDuration(msg.durationMs)}   •   🕐 ${fmtTime(msg.timestamp)}`}
        </div>
      </div>
    );
  }

  function buildSystemPrompt(agent) {
    let system = agent.basePrompt || '';
    if (agent.skills && agent.skills.length > 0) {
      system += '\n\n' + agent.skills.map(s => `## Skill: ${s.name}\n${s.description ? s.description + '\n' : ''}${s.prompt}`).join('\n\n');
    }
    return system.trim();
  }

  /* ─────────────────── EXPORT TAB ─────────────────── */
  function ExportTab({ agent }) {
    const [title, setTitle] = useState(agent.name);
    const [accent, setAccent] = useState('#6c63ff');
    const [radius, setRadius] = useState(16);
    const [widgetHeight, setWidgetHeight] = useState(500);
    const [placeholder, setPlaceholder] = useState('Type a message…');
    const [copied, setCopied] = useState(false);

    const iframeCode = generateIframeHtml(agent, { title, accent, radius, widgetHeight, placeholder });
    const iframeTag = `<iframe src="data:text/html;charset=utf-8,${encodeURIComponent(iframeCode)}" width="100%" height="${widgetHeight}px" frameborder="0" style="border-radius:${radius}px;border:none;"></iframe>`;

    function copyIframe() {
      navigator.clipboard.writeText(iframeTag).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      });
    }

    return (
      <div style={{ display: 'flex', gap: 24, height: 'calc(100vh - 160px)', overflow: 'hidden' }}>
        {/* Controls */}
        <div style={{ width: 280, flexShrink: 0, background: 'var(--bg-panel)', borderRadius: 'var(--r-lg)', padding: 20, border: '1px solid var(--border)', display: 'flex', flexDirection: 'column', gap: 16, overflowY: 'auto' }}>
          <div style={{ fontWeight: 700, fontSize: 15 }}>Export Controls</div>
          <div>
            <label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 4, display: 'block' }}>Widget Title</label>
            <input value={title} onChange={e => setTitle(e.target.value)} dir="auto" />
          </div>
          <div>
            <label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 4, display: 'block' }}>Accent Color</label>
            <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
              <input type="color" value={accent} onChange={e => setAccent(e.target.value)} style={{ width: 48, flexShrink: 0 }} />
              <input value={accent} onChange={e => setAccent(e.target.value)} style={{ fontFamily: 'monospace', fontSize: 13 }} />
            </div>
          </div>
          <div>
            <label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 6, display: 'flex', justifyContent: 'space-between' }}>
              <span>Border Radius</span><span style={{ color: 'var(--text)' }}>{radius}px</span>
            </label>
            <input type="range" min="0" max="24" value={radius} onChange={e => setRadius(Number(e.target.value))} style={{ width: '100%' }} />
          </div>
          <div>
            <label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 6, display: 'flex', justifyContent: 'space-between' }}>
              <span>Widget Height</span><span style={{ color: 'var(--text)' }}>{widgetHeight}px</span>
            </label>

          </div>
          <div>

            <input value={placeholder} onChange={e => setPlaceholder(e.target.value)} dir="auto" />
          </div>
          <button onClick={copyIframe} style={{ background: copied ? 'var(--success)' : 'var(--primary)', color: '#fff', padding: '10px 16px', borderRadius: 'var(--r-md)', fontWeight: 600, fontSize: 14, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
            {copied ? '✓ Copied!' : '📋 Copy iframe Code'}
          </button>
        </div>

        {/* Preview + code */}
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 16, overflowY: 'auto', minWidth: 0 }}>
          <div style={{ background: 'var(--bg-panel)', borderRadius: 'var(--r-lg)', padding: 20, border: '1px solid var(--border)', position: 'relative', flexShrink: 0 }}>
            <div style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 12 }}>Live Preview</div>
            <span style={{ position: 'absolute', top: 16, right: 16, background: 'var(--bg-hover)', color: 'var(--text-2)', fontSize: 11, padding: '3px 8px', borderRadius: 'var(--r-sm)', fontWeight: 600 }}>PREVIEW</span>
            <MiniChatWidget agent={agent} accent={accent} radius={radius} height={widgetHeight} placeholder={placeholder} />

            <div style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 8 }}>iframe Embed Code</div>
            <pre style={{ background: 'var(--bg-app)', borderRadius: 'var(--r-md)', padding: 14, fontSize: 12, fontFamily: "'JetBrains Mono','Fira Code',monospace", color: 'var(--text-2)', overflowX: 'auto', whiteSpace: 'pre-wrap', wordBreak: 'break-all', userSelect: 'all', maxHeight: 160, overflowY: 'auto' }}>{iframeTag}</pre>
          </div>
        </div>
      </div>
    );

  function generateIframeHtml(agent, { title, accent, radius, widgetHeight, placeholder }) {
    const systemPrompt = buildSystemPrompt(agent);
    const apiKey = (agent.apiConfig && agent.apiConfig.apiKey) || '';
    const provider = (agent.apiConfig && agent.apiConfig.provider) || 'claude';
    const model = (agent.apiConfig && agent.apiConfig.model) || 'claude-sonnet-4-5';
    const safeTitle = (title || agent.name || 'Agent').replace(/`/g, '');
    const safePlaceholder = (placeholder || 'Type a message…').replace(/`/g, '');
    const safePrompt = systemPrompt.replace(/\\/g, '\\\\').replace(/`/g, '\\`');
    const safeKey = apiKey.replace(/`/g, '');

    return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#f0f0f5;font-family:'Segoe UI',Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#header{background:${accent};padding:12px 16px;display:flex;align-items:center;gap:10px}
#header .av{font-size:22px}
#header .nm{font-weight:700;color:#fff;font-size:15px}
#messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
#messages::-webkit-scrollbar{width:4px}
#messages::-webkit-scrollbar-thumb{background:#2a2d3e;border-radius:2px}
.bubble-wrap{display:flex;flex-direction:column}
.bubble-wrap.user{align-items:flex-end}
.bubble-wrap.agent,.bubble-wrap.error{align-items:flex-start}
.bubble{max-width:80%;padding:10px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.bubble.user{background:${accent};color:#fff;border-radius:18px 18px 4px 18px}
.bubble.agent{background:#1e2130;color:#f0f0f5;border-radius:18px 18px 18px 4px}
.bubble.error{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#ef4444;border-radius:18px 18px 18px 4px}
.meta{font-size:11px;color:#5c6380;padding:2px 4px}
.meta.err{color:#ef4444}
.typing{display:flex;gap:5px;padding:12px 16px;background:#1e2130;border-radius:18px 18px 18px 4px;width:fit-content}
.dot{width:8px;height:8px;background:#9ca3af;border-radius:50%;animation:pd 1.2s infinite ease-in-out}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes pd{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
#inputbar{padding:10px 12px;background:#1e2130;border-top:1px solid #2a2d3e;display:flex;gap:8px}
textarea{flex:1;background:#252837;color:#f0f0f5;border:1px solid #2a2d3e;border-radius:12px;padding:8px 12px;font-family:inherit;font-size:13px;outline:none;resize:none}
textarea:focus{border-color:${accent}}
button{background:${accent};color:#fff;border:none;padding:0 14px;border-radius:12px;font-size:18px;cursor:pointer;font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div id="header"><span class="av">${agent.avatar || '🤖'}</span><span class="nm">${safeTitle}</span></div>
<div id="messages"></div>
<div id="inputbar">
  <textarea id="inp" placeholder="${safePlaceholder}" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
  <button onclick="sendMsg()">➤</button>
</div>
<script>
var SYSTEM=\`${safePrompt}\`;
var API_KEY=\`${safeKey}\`;
var PROVIDER='${provider}';
var MODEL='${model}';
var history=[];
var pending=false;
function isHeb(t){return /^[\\u0590-\\u05FF]/.test((t||'').trim())}
function fmt(d){return new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false})}
var msgs=document.getElementById('messages');
function addMsg(role,content,ts,dt){
  var wrap=document.createElement('div');
  wrap.className='bubble-wrap '+role;
  var b=document.createElement('div');
  b.className='bubble '+role;
  b.textContent=content;
  b.dir=isHeb(content)?'rtl':'ltr';
  wrap.appendChild(b);
  if(role==='agent'||role==='error'){
    var m=document.createElement('div');
    m.className='meta'+(role==='error'?' err':'');
    m.textContent=role==='error'?('⚠ Failed after '+dt+'   •   🕐 '+fmt(ts)):(dt?('⏱ '+dt+'   •   🕐 '+fmt(ts)):('🕐 '+fmt(ts)));
    wrap.appendChild(m);
  }
  msgs.appendChild(wrap);
  msgs.scrollTop=msgs.scrollHeight;
}
function showTyping(){
  var d=document.createElement('div');d.id='typing';d.className='typing';
  d.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
}
function hideTyping(){var d=document.getElementById('typing');if(d)d.remove()}
addMsg('agent','${(agent.openingMessage || 'Hello!').replace(/'/g,"\\'")}',new Date());
async function sendMsg(){
  var inp=document.getElementById('inp');
  var text=inp.value.trim();
  if(!text||pending)return;
  inp.value='';inp.style.height='auto';
  history.push({role:'user',content:text});
  addMsg('user',text);
  pending=true;
  var t0=performance.now();
  showTyping();
  try{
    var body,url,hdrs;
    if(PROVIDER==='claude'){
      url='https://api.anthropic.com/v1/messages';
      hdrs={'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
      body=JSON.stringify({model:MODEL,max_tokens:1024,system:SYSTEM,messages:history});
    }else{
      url='https://api.openai.com/v1/chat/completions';
      hdrs={'Content-Type':'application/json','Authorization':'Bearer '+API_KEY};
      body=JSON.stringify({model:MODEL,messages:[{role:'system',content:SYSTEM},...history]});
    }
    var r=await fetch(url,{method:'POST',headers:hdrs,body:body});
    var data=await r.json();
    if(!r.ok)throw new Error(data.error?.message||JSON.stringify(data));
    var content=PROVIDER==='claude'?data.content[0].text:data.choices[0].message.content;
    var dt=((performance.now()-t0)/1000).toFixed(2)+'s';
    history.push({role:'assistant',content:content});
    hideTyping();addMsg('agent',content,new Date(),dt);
  }catch(e){
    var dt=((performance.now()-t0)/1000).toFixed(2)+'s';
    hideTyping();addMsg('error',e.message,new Date(),dt);
    history.pop();
  }
  pending=false;
}
<\/script>
</body>
</html>`;
  }

  /* ─────────────────── CHAT TEST DRAWER ─────────────────── */
  function ChatTestDrawer({ agent, onClose }) {
    const [messages, setMessages] = useState(() => [
      { id: uid(), role: 'agent', content: agent.openingMessage || 'Hello!', timestamp: new Date(), isOpening: true },
    ]);
    const [input, setInput] = useState('');
    const [pending, setPending] = useState(false);
    const listRef = useRef(null);

    useEffect(() => {
      function onKey(e) { if (e.key === 'Escape') onClose(); }
      document.addEventListener('keydown', onKey);
      return () => document.removeEventListener('keydown', onKey);
    }, [onClose]);

    useEffect(() => {
      if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
    }, [messages]);

    async function sendMessage() {
      const text = input.trim();
      if (!text || pending) return;
      setInput('');
      const t0 = performance.now();

      // Skill switch detection
      const skillMatch = text.match(/^#(\w+)/);
      let skillBanner = null;
      if (skillMatch) {
        const skill = agent.skills.find(s => s.name.toLowerCase() === skillMatch[1].toLowerCase());
        if (skill) skillBanner = skill.name;
      }

      const userMsg = { id: uid(), role: 'user', content: text, timestamp: new Date() };
      const typingId = uid();
      const newMsgs = [...messages, userMsg];
      if (skillBanner) newMsgs.push({ id: uid(), role: 'skill', content: `Switched to skill: ${skillBanner}`, timestamp: new Date() });
      newMsgs.push({ id: typingId, role: 'typing' });
      setMessages(newMsgs);
      setPending(true);

      const { apiKey, provider, model } = agent.apiConfig;
      const systemPrompt = buildSystemPrompt(agent);
      const history = messages.filter(m => m.role === 'user' || m.role === 'agent').map(m => ({
        role: m.role === 'agent' ? 'assistant' : 'user',
        content: m.content,
      }));
      history.push({ role: 'user', content: text });

      try {
        let content;
        if (provider === 'claude') {
          const resp = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
            body: JSON.stringify({ model, max_tokens: 1024, system: systemPrompt, messages: history }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.error?.message || JSON.stringify(data));
          content = data.content[0].text;
        } else {
          const resp = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
            body: JSON.stringify({ model, messages: [{ role: 'system', content: systemPrompt }, ...history] }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.error?.message || JSON.stringify(data));
          content = data.choices[0].message.content;
        }
        const dt = performance.now() - t0;
        setMessages(m => m.filter(x => x.id !== typingId).concat({ id: uid(), role: 'agent', content, timestamp: new Date(), durationMs: dt }));
      } catch (err) {
        const dt = performance.now() - t0;
        setMessages(m => m.filter(x => x.id !== typingId).concat({ id: uid(), role: 'error', content: err.message, timestamp: new Date(), durationMs: dt }));
      } finally {
        setPending(false);
      }
    }

    const hasKey = !!agent.apiConfig.apiKey;

    return (
      <>
        {/* Backdrop */}
        <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', zIndex: 200 }} />
        {/* Drawer */}
        <div className="slide-in-right" style={{ position: 'fixed', top: 0, right: 0, bottom: 0, width: 420, background: 'var(--bg-sidebar)', borderLeft: '1px solid var(--border)', zIndex: 201, display: 'flex', flexDirection: 'column', boxShadow: '-4px 0 24px rgba(0,0,0,0.5)' }}>
          {/* Header */}
          <div style={{ padding: '16px 20px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{ width: 40, height: 40, borderRadius: '50%', background: 'linear-gradient(135deg,var(--primary),var(--teal))', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20, flexShrink: 0 }}>{agent.avatar}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 700, fontSize: 15 }}>{agent.name}</div>
              <div style={{ fontSize: 12, color: hasKey ? 'var(--success)' : 'var(--danger)', display: 'flex', alignItems: 'center', gap: 4 }}>
                <span style={{ width: 7, height: 7, borderRadius: '50%', background: hasKey ? 'var(--success)' : 'var(--danger)', display: 'inline-block' }} />
                {hasKey ? 'Connected' : 'No API key'}
              </div>
            </div>
            <IconBtn onClick={onClose} title="Close">✕</IconBtn>
          </div>

          {/* Messages */}
          <div ref={listRef} style={{ flex: 1, overflowY: 'auto', padding: '16px 20px', display: 'flex', flexDirection: 'column', gap: 12 }}>
            {messages.map(msg => {
              if (msg.role === 'typing') return (
                <div key={msg.id} style={{ display: 'flex', gap: 6 }}>
                  <div style={{ background: 'var(--bg-panel)', padding: '12px 16px', borderRadius: '18px 18px 18px 4px', display: 'flex', gap: 5, alignItems: 'center' }}>
                    <span className="typing-dot" /><span className="typing-dot" /><span className="typing-dot" />
                  </div>
                </div>
              );
              if (msg.role === 'skill') return (
                <div key={msg.id} style={{ textAlign: 'center' }}>
                  <span style={{ background: 'rgba(20,184,166,0.15)', color: 'var(--teal)', borderRadius: 'var(--r-xl)', padding: '4px 14px', fontSize: 12, border: '1px solid rgba(20,184,166,0.3)' }}>⚡ {msg.content}</span>
                </div>
              );
              if (msg.role === 'user') {
                const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
                return (
                  <div key={msg.id} style={{ display: 'flex', justifyContent: 'flex-end' }}>
                    <div style={{ maxWidth: '78%', background: 'var(--primary)', color: '#fff', padding: '10px 14px', borderRadius: '18px 18px 4px 18px', fontSize: 14, lineHeight: 1.5 }} dir={dir}>{msg.content}</div>
                  </div>
                );
              }
              if (msg.role === 'error') return (
                <div key={msg.id} style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                  <div style={{ maxWidth: '80%', background: 'rgba(239,68,68,0.12)', border: '1px solid rgba(239,68,68,0.3)', color: 'var(--danger)', padding: '10px 14px', borderRadius: '18px 18px 18px 4px', fontSize: 13 }}>⚠ {msg.content}</div>
                  <div style={{ fontSize: 11, color: 'var(--danger)', paddingLeft: 4 }}>⚠ Failed after {fmtDuration(msg.durationMs)} &nbsp;•&nbsp; 🕐 {fmtTime(msg.timestamp)}</div>
                </div>
              );
              // agent
              const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
              return (
                <div key={msg.id} style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                  <div style={{ maxWidth: '80%', background: 'var(--bg-panel)', color: 'var(--text)', padding: '10px 14px', borderRadius: '18px 18px 18px 4px', fontSize: 14, lineHeight: 1.5, whiteSpace: 'pre-wrap' }} dir={dir}>{msg.content}</div>
                  <div style={{ fontSize: 11, color: 'var(--text-muted)', paddingLeft: 4 }}>
                    {msg.isOpening ? `🕐 ${fmtTime(msg.timestamp)}` : `⏱ ${fmtDuration(msg.durationMs)}   •   🕐 ${fmtTime(msg.timestamp)}`}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Input */}
          <div style={{ padding: '12px 16px', borderTop: '1px solid var(--border)', background: 'var(--bg-app)' }}>
            <div style={{ display: 'flex', gap: 8, marginBottom: 6 }}>
              <textarea
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
                dir="auto"
                rows={1}
                disabled={pending}
                placeholder="Message…"
                style={{ flex: 1, resize: 'none', fontSize: 14 }}
              />
              <button onClick={sendMessage} disabled={pending || !input.trim()} style={{ background: 'var(--primary)', color: '#fff', padding: '0 14px', borderRadius: 'var(--r-md)', fontWeight: 700, fontSize: 18 }}>➤</button>
            </div>
            <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>Use #SkillName to switch skills &nbsp;•&nbsp; @toolName to call tools</div>
          </div>
        </div>
      </>
    );
  }

  /* ─────────────────── AGENT EDITOR ─────────────────── */
  function AgentEditor({ agent, onUpdate, onBack }) {
    const [tab, setTab] = useState('configuration');
    const TABS = ['configuration','skills','tools','export'];

    return (
      <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
        {/* Back + title */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
          <button onClick={onBack} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13 }}>← Back</button>
          <span style={{ fontSize: 22 }}>{agent.avatar}</span>
          <span style={{ fontWeight: 700, fontSize: 18 }}>{agent.name}</span>
        </div>
        {/* Tab bar */}
        <div style={{ display: 'flex', gap: 4, marginBottom: 20, background: 'var(--bg-panel)', padding: 4, borderRadius: 'var(--r-md)', width: 'fit-content', border: '1px solid var(--border)' }}>
          {TABS.map(t => (
            <button key={t} onClick={() => setTab(t)}
              style={{ padding: '6px 16px', borderRadius: 'var(--r-sm)', fontWeight: 600, fontSize: 13, textTransform: 'capitalize', background: tab === t ? 'var(--primary)' : 'transparent', color: tab === t ? '#fff' : 'var(--text-2)' }}>
              {t}
            </button>
          ))}
        </div>
        {/* Content */}
        <div style={{ flex: 1, overflowY: 'auto', paddingRight: 4 }}>
          {tab === 'configuration' && <ConfigurationTab agent={agent} onUpdate={onUpdate} />}
          {tab === 'skills' && <SkillsTab agent={agent} onUpdate={onUpdate} />}
          {tab === 'tools' && <ToolsTab agent={agent} onUpdate={onUpdate} />}
          {tab === 'export' && <ExportTab agent={agent} />}
        </div>
      </div>
    );
  }

  /* ─────────────────── AGENT CARD ─────────────────── */
  function AgentCard({ agent, onEdit, onTest, onDuplicate, onDelete, onExport, isNew }) {
    const [hovered, setHovered] = useState(false);

    return (
      <div
        className={isNew ? 'card-highlight fade-in' : 'fade-in'}
        onMouseEnter={() => setHovered(true)}
        onMouseLeave={() => setHovered(false)}
        style={{
          background: 'var(--bg-card)',
          borderRadius: 'var(--r-lg)',
          border: `1px solid ${hovered ? 'var(--primary)' : 'var(--border)'}`,
          boxShadow: hovered ? '0 0 16px rgba(108,99,255,0.2), var(--shadow)' : 'var(--shadow)',
          padding: 20,
          display: 'flex',
          flexDirection: 'column',
          gap: 14,
          transition: 'border-color 0.2s, box-shadow 0.2s',
          cursor: 'pointer',
        }}
        onClick={onEdit}
      >
        {/* Avatar + name */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <div style={{ width: 52, height: 52, borderRadius: '50%', background: 'linear-gradient(135deg,var(--primary),var(--teal))', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24, flexShrink: 0 }}>
            {agent.avatar}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontWeight: 700, fontSize: 15, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{agent.name}</div>
            <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 2 }}>{new Date(agent.createdAt).toLocaleDateString()}</div>
          </div>
        </div>
        {/* Badges */}
        <div style={{ display: 'flex', gap: 6 }}>
          <span style={{ background: 'rgba(108,99,255,0.15)', color: 'var(--primary)', borderRadius: 'var(--r-sm)', padding: '2px 8px', fontSize: 12, fontWeight: 600 }}>🎯 {agent.skills.length} skills</span>
          <span style={{ background: 'rgba(20,184,166,0.15)', color: 'var(--teal)', borderRadius: 'var(--r-sm)', padding: '2px 8px', fontSize: 12, fontWeight: 600 }}>⚙️ {agent.tools.length} tools</span>
        </div>
        {/* Actions */}
        <div style={{ display: 'flex', gap: 4, borderTop: '1px solid var(--border)', paddingTop: 12 }} onClick={e => e.stopPropagation()}>
          {[
            { label: '✏️ Edit', fn: onEdit },
            { label: '💬 Test', fn: onTest },
            { label: '📋 Copy', fn: onDuplicate },
            { label: '📤 Export', fn: onExport },
            { label: '🗑', fn: onDelete, danger: true },
          ].map(({ label, fn, danger }) => (
            <button key={label} onClick={fn}
              style={{ flex: label === '🗑' ? 0 : 1, padding: '6px 4px', borderRadius: 'var(--r-sm)', fontSize: 12, fontWeight: 500, background: 'var(--bg-hover)', color: danger ? 'var(--danger)' : 'var(--text-2)', border: 'none' }}
              onMouseEnter={e => e.currentTarget.style.background = danger ? 'rgba(239,68,68,0.1)' : 'var(--bg-input)'}
              onMouseLeave={e => e.currentTarget.style.background = 'var(--bg-hover)'}
            >{label}</button>
          ))}
        </div>
      </div>
    );
  }

  /* ─────────────────── AGENT LIST VIEW ─────────────────── */
  function AgentListView({ agents, onNew, onEdit, onTest, onDuplicate, onDelete, onExport }) {
    return (
      <div style={{ position: 'relative', height: '100%' }}>
        <div style={{ marginBottom: 24 }}>
          <div style={{ fontWeight: 700, fontSize: 24 }}>Agents</div>
          <div style={{ color: 'var(--text-2)', fontSize: 14, marginTop: 4 }}>{agents.length} agent{agents.length !== 1 ? 's' : ''}</div>
        </div>
        {agents.length === 0 ? (
          <EmptyState icon="🤖" title="No agents yet" subtitle="Click + New Agent to create your first agent" />
        ) : (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(260px,1fr))', gap: 16 }}>
            {agents.map(a => (
              <AgentCard
                key={a.id}
                agent={a}
                isNew={a._isNew}
                onEdit={() => onEdit(a.id)}
                onTest={() => onTest(a.id)}
                onDuplicate={() => onDuplicate(a.id)}
                onDelete={() => onDelete(a.id)}
                onExport={() => onEdit(a.id)}
              />
            ))}
          </div>
        )}
        {/* FAB */}
        <button onClick={onNew}
          style={{ position: 'fixed', bottom: 32, right: 32, background: 'var(--primary)', color: '#fff', padding: '14px 24px', borderRadius: 'var(--r-xl)', fontWeight: 700, fontSize: 15, boxShadow: '0 4px 20px rgba(108,99,255,0.5)', zIndex: 50 }}
          onMouseEnter={e => e.currentTarget.style.background = 'var(--primary-hover)'}
          onMouseLeave={e => e.currentTarget.style.background = 'var(--primary)'}
        >＋ New Agent</button>
      </div>
    );
  }

  /* ─────────────────── SIDEBAR ─────────────────── */
  function Sidebar({ activeNav, onNav }) {
    const items = [
      { id: 'home', label: 'Home', icon: '🏠' },
      { id: 'docs', label: 'Documentation', icon: '📖' },
      { id: 'settings', label: 'Settings', icon: '⚙️' },
    ];
    return (
      <div style={{ width: 240, flexShrink: 0, background: 'var(--bg-sidebar)', borderRight: '1px solid var(--border)', display: 'flex', flexDirection: 'column', height: '100vh' }}>
        {/* Logo */}
        <div style={{ padding: '22px 20px 18px', display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ width: 32, height: 32, borderRadius: 8, background: 'var(--primary)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18 }}>🔮</div>
          <span style={{ fontWeight: 800, fontSize: 17, letterSpacing: '-0.3px' }}>AgentForge</span>
        </div>
        <div style={{ flex: 1, padding: '8px 12px', display: 'flex', flexDirection: 'column', gap: 2 }}>
          {items.map(item => (
            <button key={item.id} onClick={() => onNav(item.id)}
              style={{
                display: 'flex', alignItems: 'center', gap: 12, padding: '10px 12px', borderRadius: 'var(--r-md)',
                background: activeNav === item.id ? 'rgba(108,99,255,0.12)' : 'transparent',
                color: activeNav === item.id ? 'var(--text)' : 'var(--text-2)',
                fontWeight: activeNav === item.id ? 600 : 400,
                borderLeft: `3px solid ${activeNav === item.id ? 'var(--primary)' : 'transparent'}`,
                fontSize: 14, textAlign: 'left',
              }}
              onMouseEnter={e => { if (activeNav !== item.id) e.currentTarget.style.background = 'var(--bg-hover)'; }}
              onMouseLeave={e => { if (activeNav !== item.id) e.currentTarget.style.background = 'transparent'; }}
            >
              <span>{item.icon}</span>{item.label}
            </button>
          ))}
        </div>
        <div style={{ padding: '12px 20px', borderTop: '1px solid var(--border)' }}>
          <span style={{ fontSize: 11, color: 'var(--text-muted)', background: 'var(--bg-hover)', borderRadius: 'var(--r-sm)', padding: '3px 8px' }}>v1.0.0</span>
        </div>
      </div>
    );
  }

  /* ─────────────────── PASSWORD GATE ─────────────────── */
  function PasswordGate({ children }) {
    const [unlocked, setUnlocked] = useState(!!sessionStorage.getItem('agentforge_pw'));
    const [pw, setPw] = useState('');
    const [error, setError] = useState('');
    const [checking, setChecking] = useState(false);

    async function unlock() {
      setChecking(true);
      setError('');
      try {
        const resp = await fetch('/api/agents', { headers: { 'x-app-password': pw } });
        if (resp.ok) {
          sessionStorage.setItem('agentforge_pw', pw);
          setUnlocked(true);
        } else {
          setError('Wrong password. Try again.');
        }
      } catch {
        setError('Could not connect to server.');
      } finally {
        setChecking(false);
      }
    }

    if (unlocked) return children;

    return (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', background: 'var(--bg-app)' }}>
        <div style={{ background: 'var(--bg-card)', borderRadius: 'var(--r-xl)', padding: 40, width: 360, boxShadow: 'var(--shadow)', border: '1px solid var(--border)' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 28 }}>
            <div style={{ width: 40, height: 40, borderRadius: 10, background: 'var(--primary)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 22 }}>🔮</div>
            <div>
              <div style={{ fontWeight: 800, fontSize: 20 }}>AgentForge</div>
              <div style={{ fontSize: 13, color: 'var(--text-2)' }}>Enter your access password</div>
            </div>
          </div>
          <input
            type="password"
            value={pw}
            onChange={e => setPw(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && unlock()}
            placeholder="Password"
            autoFocus
            style={{ marginBottom: 12 }}
          />
          {error && <div style={{ color: 'var(--danger)', fontSize: 13, marginBottom: 10 }}>⚠ {error}</div>}
          <button onClick={unlock} disabled={checking || !pw} style={{ width: '100%', background: 'var(--primary)', color: '#fff', padding: '11px 16px', borderRadius: 'var(--r-md)', fontWeight: 700, fontSize: 15 }}>
            {checking ? 'Checking…' : 'Unlock →'}
          </button>
        </div>
      </div>
    );
  }

  /* ─────────────────── APP ─────────────────── */
  function App() {
    const [state, dispatch] = useReducer(reducer, {
      agents: [],
      view: 'list',
      editingId: null,
      chatAgentId: null,
    });
    const [nav, setNav] = useState('home');
    const [loading, setLoading] = useState(true);

    // Load agents on mount
    useEffect(() => {
      apiList().then(agents => {
        dispatch({ type: 'HYDRATE', agents });
        setLoading(false);
      }).catch(() => {
        // If backend is unreachable (e.g. local without vercel dev), just start empty
        setLoading(false);
      });
    }, []);

    // Debounced save
    const saveAgent = useCallback(async (agent) => {
      dispatch({ type: 'UPDATE_AGENT', agent });
      await apiUpdate(agent).catch(() => {});
    }, []);
    const saveAgentDebounced = useDebounce(saveAgent, 600);

    function handleUpdate(agent) {
      dispatch({ type: 'UPDATE_AGENT', agent });
      saveAgentDebounced(agent);
    }

    async function handleCreate() {
      const agent = makeAgent();
      dispatch({ type: 'UPDATE_AGENT', agent }); // pre-add optimistically
      dispatch({ type: 'SET_VIEW', view: 'editor', editingId: agent.id });
      await apiCreate(agent).catch(() => {});
      dispatch({ type: 'HYDRATE', agents: [] }); // reload
      apiList().then(agents => dispatch({ type: 'HYDRATE', agents })).catch(() => {});
    }

    async function handleDelete(id) {
      dispatch({ type: 'DELETE_AGENT', id });
      await apiDelete(id).catch(() => {});
    }

    async function handleDuplicate(id) {
      const src = state.agents.find(a => a.id === id);
      if (!src) return;
      const copy = { ...JSON.parse(JSON.stringify(src)), id: uid(), name: src.name + ' (Copy)', _isNew: true, createdAt: new Date().toISOString() };
      dispatch({ type: 'UPDATE_AGENT', agent: copy });
      dispatch({ type: 'HYDRATE', agents: [copy, ...state.agents] });
      await apiCreate(copy).catch(() => {});
    }

    const editingAgent = state.agents.find(a => a.id === state.editingId);
    const chatAgent = state.agents.find(a => a.id === state.chatAgentId);

    if (loading) return (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', background: 'var(--bg-app)', flexDirection: 'column', gap: 16 }}>
        <div style={{ width: 40, height: 40, border: '3px solid var(--border)', borderTop: '3px solid var(--primary)', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />
        <div style={{ color: 'var(--text-2)', fontSize: 14 }}>Loading agents…</div>
      </div>
    );

    return (
      <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
        <Sidebar activeNav={nav} onNav={id => { setNav(id); if (id === 'home') dispatch({ type: 'SET_VIEW', view: 'list' }); }} />
        <div style={{ flex: 1, overflowY: 'auto', padding: '32px 32px 80px', background: 'var(--bg-app)' }}>
          {nav !== 'home' ? (
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', paddingTop: 60, gap: 12 }}>
              <div style={{ fontSize: 48 }}>{nav === 'docs' ? '📖' : '⚙️'}</div>
              <div style={{ fontWeight: 700, fontSize: 20 }}>{nav === 'docs' ? 'Documentation' : 'Settings'}</div>
              <div style={{ color: 'var(--text-2)', fontSize: 14 }}>Coming soon</div>
            </div>
          ) : state.view === 'editor' && editingAgent ? (
            <AgentEditor
              agent={editingAgent}
              onUpdate={handleUpdate}
              onBack={() => dispatch({ type: 'SET_VIEW', view: 'list' })}
            />
          ) : (
            <AgentListView
              agents={state.agents}
              onNew={handleCreate}
              onEdit={id => dispatch({ type: 'SET_VIEW', view: 'editor', editingId: id })}
              onTest={id => dispatch({ type: 'OPEN_CHAT', id })}
              onDuplicate={handleDuplicate}
              onDelete={handleDelete}
              onExport={id => dispatch({ type: 'SET_VIEW', view: 'editor', editingId: id })}
            />
          )}
        </div>

        {chatAgent && <ChatTestDrawer agent={chatAgent} onClose={() => dispatch({ type: 'CLOSE_CHAT' })} />}
      </div>
    );
  }

  /* ─────────────────── ROOT ─────────────────── */
  ReactDOM.createRoot(document.getElementById('root')).render(
    <PasswordGate>
      <App />
    </PasswordGate>
  );
  </script>
</body>
</html>
