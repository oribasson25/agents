            <li><strong>Skills</strong> — מצבים ממוקדים שה-AI Chatbot עובר ביניהם, כל אחד עם פרומפט משלו</li>
            <li><strong>Tools</strong> — פונקציות Python שה-AI Chatbot קורא בזמן שיחה, ועוד כלי מובנה לשליחת מייל</li>
            <li><strong>Knowledge</strong> — מסמכים וסריקת אתרים שנשלפים לפי הקשר</li>
            <li><strong>Export / WhatsApp</strong> — הטמעה באתר וחיבור למספר WhatsApp</li>
          </UL>

          <H3>איך זה בנוי</H3>
          <UL>
            <li><strong>Frontend</strong> — קובץ HTML אחד עם React שנטען מ-CDN, בלי build step</li>
            <li><strong>Backend</strong> — Vercel Serverless Functions תחת <Code>/api</Code></li>
            <li><strong>Database</strong> — Neon PostgreSQL; AI Chatbot נשמר כ-JSONB בטבלת <Code>agents</Code></li>
            <li><strong>מודלים</strong> — Claude (Anthropic), OpenAI, או Ollama מקומי</li>
            <li><strong>הרצת כלים</strong> — Python serverless עם <Code>pip install</Code> לפי דרישה</li>
            <li><strong>סריקת אתרים</strong> — Playwright + Chromium שמריץ JavaScript לפני החילוץ</li>
          </UL>

          <H3>איפה כל דבר יושב</H3>
          <P>בסייד-בר: <strong>Home</strong> (צ'אט — כאן בונים AI Chatbot בשיחה), <strong>AI Chatbots</strong> (ה-AI Chatbots שלך), <strong>Interactions</strong> (שיחות של משתמשי קצה), <strong>Documentation</strong> (הדף הזה), <strong>Settings</strong>, ו-<strong>Admin</strong> למשתמשי אדמין בלבד. מתחת לפריטים האלה רשימת השיחות האחרונות ב-Home, ובתחתיתה <strong>כל השיחות →</strong> להיסטוריה המלאה של כל האסיסטנטים. הכפתור <strong>שאל את האסיסטנט</strong> בפינה הימנית התחתונה פותח את אסיסטנט המערכת מכל מסך חוץ מ-Home, שהוא כבר צ'אט.</P>
        </div>
      ),

      /* ─────────────── HOME ─────────────── */
      home: (
        <div dir="rtl">
          <H2>דף הבית — צ׳אט</H2>
          <P>הדבר הראשון שרואים אחרי התחברות הוא שיחה, לא רשימה: הלוגו באמצע המסך, ברכה לפי השעה עם שם המשתמש, ושדה אחד מתחתיו. מה שכותבים שם הולך לאסיסטנט המערכת — אותו אסיסטנט שמתפעל את הפלטפורמה, עם כל הכלים שלו.</P>

          <H3>ראיון — כשמבקשים AI Chatbot חדש</H3>
          <P>בכל פעם שמבקשים לבנות AI Chatbot חדש, בכל ניסוח, השיחה הופכת לראיון: שאלה אחת בכל פעם — מה ה-AI Chatbot צריך לעשות ולמי, באיזו שפה הוא מדבר, מאיפה מגיעות התשובות ובאיזה ערוץ הוא חי. ברגע שיש מספיק מידע הוא קורא ל-<Code>create_agent</Code> באמצע השיחה וממשיך לחדד משם, במקום לחכות לסוף. זה לא תלוי בכמה AI Chatbots כבר יש בחשבון — גם ה-AI Chatbot העשירי מתחיל בראיון.</P>

          <H3>בלי ראיון — שאלות ושינויים</H3>
          <P>שאלת ידע על הפלטפורמה, או שינוי ב-AI Chatbot שכבר קיים, לא מפעילים ראיון: הוא עונה או מבצע בתור אחד, ושואל שאלה חוזרת רק אם באמת אי אפשר בלעדיה. "תעשה אותו יותר ידידותי" הוא שינוי, לא AI Chatbot חדש.</P>

          <H3>כפתורי תשובה</H3>
          <P>כששאלה של האסיסטנט יש לה כמה תשובות סבירות, הוא מסיים את ההודעה בשורת <Code>::options::</Code> והמסך הופך אותה לכפתורים. מודל שלא כותב את השורה הזאת פשוט מקבל הודעה בלי כפתורים — שום דבר לא נשבר.</P>

          <H3>הכרטיס שמתמלא</H3>
          <P>בצד המסך יושב כרטיס של ה-AI Chatbot שנבנה בשיחה הזאת: שם ואווטאר, תפקיד, Skills, Tools וערוץ — כל שורה מסומנת כשהיא מתמלאת, עם פס התקדמות ושני כפתורים, <strong>פתח בעורך</strong> ו<strong>בדוק בצ׳אט</strong>. הכרטיס מופיע רק כשיש מה להראות: בראיון, או אחרי שהאסיסטנט יצר או שינה AI Chatbot. במובייל הוא נוסע בתוך השיחה עצמה.</P>

          <H3>שיחות קודמות</H3>
          <P>כל שיחה נשמרת אוטומטית אחרי כל תור, ומופיעה ברשימה בסייד-בר מתחת לפריטי הניווט. לחיצה על שיחה פותחת אותה בדף הבית וממשיכה אותה; ה-<strong>+</strong> שליד הכותרת מתחיל שיחה חדשה.</P>
          <Warn>בלי מפתח API במסך Settings אי אפשר לשלוח — השדה נעול והמסך אומר את זה.</Warn>
        </div>
      ),

      /* ─────────────── AGENTS ─────────────── */
      agents: (
        <div dir="rtl">
          <H2>AI Chatbots</H2>

          <H3>חשבון והתחברות</H3>
          <P>ההרשמה דורשת שם משתמש, סיסמה וטלפון. כל AI Chatbot שייך למשתמש שיצר אותו, ומשתמש רגיל רואה רק את ה-AI Chatbots שלו. ההתחברות מחזיקה טוקן ב-<Code>sessionStorage</Code>, כך שסגירת הדפדפן מנתקת.</P>

          <H3>AI Chatbots של הפתיחה</H3>
          <P>חשבון חדש מתחיל עם עותק של AI Chatbots של הדוגמה <Code>weather</Code> ו-<Code>bobi</Code> — כולל הפרומפט, הסקילים, הכלים ובסיס הידע של כל אחד — כדי שיהיה ממה להתחיל. מה שלא מועתק: מפתח ה-API, הגדרות ה-WhatsApp, חיבור ה-Gmail והערכים של ה-Secrets. שמות ה-Secrets נשארים כרמז למה שצריך למלא.</P>
          <P>ההעתקה חיה: שינוי באחד מה-AI Chatbots האלה משפיע על ההרשמות הבאות. בטאב Admin יש שורת מצב שמראה לכל תבנית אם היא נמצאת ומה היא נושאת.</P>
          <Warn>ה-AI Chatbots האלה לא יענו עד שיוגדר מפתח API לחשבון במסך Settings.</Warn>

          <H3>כרטיס AI Chatbot</H3>
          <P>כל AI Chatbot בטאב <strong>AI Chatbots</strong> מוצג בכרטיס עם האווטאר, השם, תאריך היצירה ומספר הסקילים והכלים. בתחתית הכרטיס חמש פעולות:</P>
          <UL>
            <li><strong>Edit</strong> — פתיחת עורך ה-AI Chatbot (גם לחיצה על הכרטיס עצמו)</li>
            <li><strong>Test</strong> — שיחה אמיתית עם ה-AI Chatbot, בדיוק כמו של משתמש קצה: רצה בשרת, מנותבת לפי אחוזי הבראנצ'ים, ונרשמת ב-Interactions</li>
            <li><strong>Duplicate</strong> — שכפול ה-AI Chatbot, כולל סקילים וכלים</li>
            <li><strong>Export</strong> — פתיחת לשונית ההטמעה</li>
            <li><strong>Delete</strong> — מחיקה מיידית של ה-AI Chatbot וכל מה שתלוי בו</li>
          </UL>
          <Warn>מחיקת AI Chatbot מוחקת גם את המסמכים והשיחות שלו, וסוגרת את ערוץ ה-WhatsApp והווידג'ט שלו. אין ביטול.</Warn>

          <H3>שמירה</H3>
          <P>אין כפתור Save בשום מקום בעורך. כל שינוי נשמר אוטומטית מעט אחרי שהפסקת להקליד, וכתוב "saved automatically" בכותרת המסכים שנשמרים כך.</P>
        </div>
      ),

      /* ─────────────── CONFIGURATION ─────────────── */
      config: (
        <div dir="rtl">
          <H2>Configuration</H2>

          <H3>Identity</H3>
          <UL>
            <li><strong>AI Chatbot Name</strong> — מופיע בכרטיס, בווידג'ט וב-Interactions</li>
            <li><strong>Avatar</strong> — אמוג'י מתוך רשימה, או העלאת תמונה</li>
            <li><strong>Opening Message</strong> — ההודעה הראשונה שה-AI Chatbot אומר בווידג'ט ובצ'אט הבדיקה</li>
          </UL>

          <H3>Base Prompt</H3>
          <P>הפרומפט הקבוע של ה-AI Chatbot, שנשלח לפני כל שיחה. העורך תומך בכתיבה עם כותרות <Code>## Section</Code> שאפשר לקפל, ובמצב Preview שמדגיש הזכרות של <Code>@tool</Code> ו-<Code>#Skill</Code>.</P>
          <P>הפרומפט הסופי שהמודל מקבל מורכב מהפרומפט הזה, ואחריו הידע הרלוונטי שנשלף לשיחה, ואחריו כל הסקילים תחת כותרת <Code>## Skill: שם</Code>.</P>
          <Tip>ציין במפורש שפה, טון, מה מותר ומה אסור, ומה לעשות כשאין תשובה. פרומפט מפורט מצמצם המצאות.</Tip>

          <H3>מודל ומפתח API — ברמת החשבון</H3>
          <P>המפתח, הספק והמודל מוגדרים <strong>פעם אחת במסך Settings</strong> ומשמשים את כל ה-AI Chatbots, כל הערוצים והאסיסטנטים. אין הגדרה נפרדת לכל AI Chatbot.</P>
          <UL>
            <li><strong>Claude</strong> — <Code>claude-opus-4-5</Code>, <Code>claude-sonnet-4-5</Code>, <Code>claude-haiku-4-5</Code>. דורש מפתח Anthropic.</li>
            <li><strong>OpenAI</strong> — <Code>gpt-4o</Code>, <Code>gpt-4o-mini</Code>, <Code>gpt-4-turbo</Code>, <Code>gpt-3.5-turbo</Code>. דורש מפתח OpenAI.</li>
            <li><strong>Ollama</strong> — מודל מקומי. במקום מפתח מזינים כתובת שרת, והקריאות עוברות דרך פרוקסי בשרת.</li>
          </UL>
          <P>באותו מסך בוחרים גם את <strong>שפת האסיסטנט</strong> — עברית או אנגלית.</P>
          <Warn>בלי מפתח (או בלי כתובת Ollama) אף AI Chatbot לא יענה בשום ערוץ, והאסיסטנטים חסומים. ההערה בפינה הימנית העליונה מציגה את המצב בכל מסך.</Warn>

          <H3>DLP — מניעת דליפת מידע</H3>
          <P>שני מסננים אופציונליים: <strong>מספרי כרטיס אשראי</strong> (16 ספרות עם או בלי מפרידים) ו-<strong>תעודת זהות</strong> (9 ספרות). כשהם דולקים:</P>
          <UL>
            <li>הטקסט של המשתמש ממוסך ל-<Code>[MASKED]</Code> לפני שהוא נשלח למודל</li>
            <li>ההיסטוריה נשמרת ממוסכת, כך שגם ב-Interactions לא יופיע המקור</li>
            <li>נוספת לפרומפט הוראת אבטחה שלא לחזור על מידע מזהה</li>
          </UL>
        </div>
      ),

      /* ─────────────── SKILLS ─────────────── */
      skills: (
        <div dir="rtl">
          <H2>Skills</H2>
          <P>סקיל הוא מצב ממוקד של ה-AI Chatbot — למשל "בדיקת מזג אוויר" או "פתיחת קריאת שירות" — עם פרומפט משלו. לחיצה על הלשונית פותחת מסך עבודה: רשימת הסקילים בצד, עורך הפרומפט במרכז, ופאנל הגדרות בצד.</P>

          <H3>מה מגדירים בסקיל</H3>
          <UL>
            <li><strong>Name</strong> — השם המדויק שדרכו ה-AI Chatbot עובר לסקיל</li>
            <li><strong>Description</strong> — <em>מתי</em> להשתמש בסקיל. זה מה שהמודל קורא כדי להחליט לעבור אליו, ולכן הוא החלק הכי חשוב</li>
            <li><strong>Skill Prompt</strong> — ההוראות שה-AI Chatbot מבצע כשהסקיל פעיל</li>
          </UL>

          <H3>איך ה-AI Chatbot עובר בין סקילים</H3>
          <P>כשל-AI Chatbot יש סקילים, המודל מקבל כלי פנימי בשם <Code>switch_skill</Code> שמקבל <Code>skill_name</Code>. הוא קורא לו כשהמשתמש מגיע לתחום של סקיל מסוים. בטקסט הפרומפט הקונבנציה היא לכתוב <Code>#SkillName</Code> בלי רווחים, וכדי לקרוא לכלי — <Code>@tool_name</Code>.</P>
          <P>כל הסקילים נמצאים בפרומפט המערכת מהרגע הראשון, כל אחד תחת <Code>## Skill: שם</Code> עם התיאור מעליו. כשסקיל פעיל בצ'אט הבדיקה, שליפת הידע מצטמצמת למסמכים של אותו סקיל.</P>

          <H3>עורך הפרומפט</H3>
          <UL>
            <li><Code>## Heading</Code> מוסיף כותרת סקציה; Collapse All / Expand All מקפלים אותן</li>
            <li>מצב <strong>Preview</strong> מציג את הפרומפט לפי סקציות ומדגיש <Code>@tool</Code> ו-<Code>#Skill</Code></li>
            <li>מונה התווים בפינה עוזר לשמור על פרומפט קצר</li>
          </UL>
          <Tip>עדיף כמה סקילים קצרים וממוקדים על סקיל אחד ארוך. התיאור צריך להיות "מתי", לא "מה".</Tip>
        </div>
      ),

      /* ─────────────── TOOLS ─────────────── */
      tools: (
        <div dir="rtl">
          <H2>Tools</H2>
          <P>לשונית Tools נפתחת ישר במסך עבודה: רשימת הכלים בצד, עורך קוד במרכז, פאנל הרצה מתחתיו, ופאנל הגדרות בצד עם שלוש לשוניות.</P>

          <H3>send_email — הכלי המובנה</H3>
          <P>בסקציית <strong>BUILT-IN</strong> בסייד-בר. מתג אחד מפעיל אותו, ומתחתיו מחברים חשבון Gmail <strong>ל-AI Chatbot הזה</strong> — כל AI Chatbot שולח מהכתובת שלו. אחרי החיבור הכלי זמין בצ'אט הבדיקה, בווידג'ט וב-WhatsApp, והמודל קורא לו עם <Code>to</Code>, <Code>subject</Code> ו-<Code>body</Code>.</P>

          <H3>כלי Python — חוזה ההרצה</H3>
          <P>הקוד רץ ב-serverless מבודד, וחייב להגדיר פונקציה בשם <Code>run</Code>:</P>
          <Block>{`import os
import urllib.request, json

def run(**kwargs):
    city = kwargs.get("city", "")
    key  = os.environ.get("WEATHER_KEY", "")
    url  = f"https://api.example.com/w?city={city}&key={key}"
    try:
        with urllib.request.urlopen(url, timeout=10) as r:
            data = json.loads(r.read())
        return f"{data['temp']}°C, {data['desc']}"
    except Exception as e:
        return f"Could not fetch the weather: {e}"`}</Block>
          <UL>
            <li>הפרמטרים המוצהרים מגיעים כ-<Code>kwargs</Code> — קרא אותם עם <Code>kwargs.get</Code></li>
            <li>מה שהפונקציה מחזירה עובר ל-<Code>str()</Code> ונמסר למודל כתוצאה</li>
            <li>זמינות ספריית התקן, ובנוסף כל חבילה שרשמת ב-Packages</li>
            <li>אין דיסק מתמיד ואין רשת פנימית; HTTPS יוצא מותר</li>
            <li>מוטב להחזיר מחרוזת שגיאה קריאה מלזרוק חריגה</li>
          </UL>

          <H3>Configuration</H3>
          <UL>
            <li><strong>Name</strong> — שם באנגלית בסגנון <Code>snake_case</Code>; זה השם שהמודל קורא לו</li>
            <li><strong>Description</strong> — משפט שאומר מתי להשתמש בכלי</li>
            <li><strong>Parameters</strong> — שם, טיפוס (string / number / integer / boolean) ותיאור לכל פרמטר. אלה בדיוק המפתחות שיגיעו ל-<Code>kwargs</Code></li>
            <li><strong>Packages</strong> — חבילות pip מופרדות בפסיק, למשל <Code>requests, beautifulsoup4</Code></li>
          </UL>

          <H3>Secrets</H3>
          <P>זוגות מפתח–ערך שנחשפים לקוד דרך <Code>os.environ["KEY"]</Code>. שם המפתח נשלח לאסיסטנט כדי שידע להשתמש בו; <strong>הערך עצמו לא נשלח</strong>.</P>

          <H3>הרצה ובדיקה</H3>
          <P>הפאנל התחתון מריץ את הכלי בלי לצאת מהמסך: <strong>Input</strong> מציג שדה לכל פרמטר מוצהר, <strong>Run</strong> מריץ, וזמן הריצה מוצג ליד הכפתור. אחרי הרצה הפאנל עובר ל-<strong>Output</strong> אם הצליח או ל-<strong>Errors</strong> אם נפל, ונקודה צבעונית מסמנת איפה יש תוכן.</P>

          <H3>שימוש בכלי מתוך פרומפט</H3>
          <P>הכלים נמסרים למודל כפונקציות אמיתיות, כך שהוא יכול לקרוא להם מעצמו. כדי לכוון אותו, כתוב את שם הכלי עם <Code>@</Code> בפרומפט הבסיס או בפרומפט של סקיל, וציין אילו פרמטרים להעביר.</P>
          <Warn>שינוי שם כלי אחרי שהזכרת אותו בפרומפט שובר את ההפניה — עדכן גם את הפרומפט.</Warn>
        </div>
      ),

      /* ─────────────── PLATFORM ASSISTANT ─────────────── */
      platform: (
        <div dir="rtl">
          <H2>אסיסטנט המערכת</H2>
          <P>אותו אסיסטנט מופיע בשני מקומות: <strong>דף הבית</strong>, שהוא שיחה איתו על כל המסך, והכפתור <strong>שאל את האסיסטנט</strong> בפינה הימנית התחתונה בכל מסך אחר. <strong>Build with the assistant</strong> בראש טאב AI Chatbots מעביר לדף הבית עם השאלה כבר מוקלדת. לחיצה על הכפתור הצף פותחת צ'אט צף ולחיצה נוספת מקפלת אותו — כך שאפשר לבקש שינוי בזמן שרואים את מה שרוצים לשנות. זה לא AI Chatbot שאתה בונה אלא אסיסטנט שמתפעל את המערכת בשבילך — הוא מבצע פעולות, לא רק מסביר איפה ללחוץ.</P>

          <H3>מה הוא עושה</H3>
          <UL>
            <li>בונה AI Chatbot חדש מאפס — פרומפט, סקילים, כלי Python והודעת פתיחה, בפעולה אחת</li>
            <li>משנה AI Chatbot קיים — משפר פרומפט, מוסיף או מתקן סקיל, כותב כלי</li>
            <li>מריץ כלי שכתב כדי לבדוק שהוא עובד, ומתקן לפי השגיאה</li>
            <li>מדליק <Code>send_email</Code>, מגדיר DLP, משנה שם ואווטאר</li>
            <li>עונה על שאלות על הפלטפורמה — איך סקילים עוברים, מה חוזה ההרצה של כלי, איך מחברים WhatsApp</li>
            <li>שולף מה קרה בשיחות לפי AI Chatbot, ערוץ או מילת חיפוש</li>
            <li>מוחק AI Chatbot — עם שאלה בצ'אט ואישור בדפדפן לפני</li>
          </UL>

          <H3>מה הוא לא יכול</H3>
          <P>לחבר Gmail, להעלות קבצים לבסיס הידע, ולהזין את מפתח ה-API. אלה פעולות שדורשות אותך בממשק, והוא יגיד לך בדיוק לאן ללכת.</P>

          <H3>שפה</H3>
          <P>ההודעה הפותחת שלו מפרטת את כל מה שהוא יודע לעשות, ואפשר לבחור בין <strong>אסיסטנט בעברית</strong> ל<strong>אסיסטנט באנגלית</strong> במסך Settings.</P>

          <H3>הוא רואה מה נשבר</H3>
          <P>יש לו כלי <Code>get_recent_errors</Code> שמחזיר כשלים אמיתיים משבועיים אחורה: כלי שזרק חריגה בשיחה אמיתית, תשובה שהווידג'ט לא הצליח לייצר, טוקן WhatsApp שפג, שגיאת ספק. כשאומרים לו "משהו לא עובד" הוא מונחה לבדוק את הלוג לפני שהוא מנחש, ואחרי שהוא מתקן כלי — להריץ אותו ולבדוק.</P>

          <H3>שקיפות</H3>
          <P>כל קריאה לכלי מוצגת בשיחה עם הפרמטרים והתוצאה, כך שרואים בדיוק מה הוא עשה. הוא רץ על המפתח והמודל של החשבון, ומודל חזק יותר נותן תוצאות טובות יותר במשימות מורכבות.</P>
          <Tip>נסה: "בנה AI Chatbot שירות לקוחות לחברת ביטוח, עם סקיל לפתיחת תביעה" או "תוסיף ל-AI Chatbot weather כלי לתחזית חמישה ימים ותריץ אותו".</Tip>
        </div>
      ),

      /* ─────────────── ASSISTANT ─────────────── */
      assistant: (
        <div dir="rtl">
          <H2>אסיסטנט הבנייה</H2>
          <P>גם ב-Tools וגם ב-Skills יש לשונית <strong>Assistant</strong> בפאנל הצד, וכפתור <strong>Ask AI</strong> ליד העורך שמקפיץ אליה. זה צ'אט שכותב בשבילך — והתוצאה נכתבת ישר לתוך העורך והשדות, לא כטקסט שצריך להעתיק.</P>

          <H3>איך זה עובד</H3>
          <UL>
            <li>הוא משתמש ב-<strong>מפתח ובמודל של ה-AI Chatbot עצמו</strong>, בלי כלים ובלי בסיס הידע</li>
            <li>כל תשובה שמכילה קוד או פרומפט מוחלת מיד, עם כפתור <strong>Undo</strong> שמחזיר בדיוק את מה שהיה</li>
            <li>השיחה נשמרת כשעוברים לשונית, ומתאפסת כשעוברים לכלי או לסקיל אחר</li>
            <li>שאלה בלי בקשת שינוי מקבלת תשובה בלי לגעת בעורך</li>
          </UL>

          <H3>מה הוא יודע על ה-AI Chatbot שלך</H3>
          <UL>
            <li><strong>בכלי:</strong> השם, התיאור, הפרמטרים המוצהרים, ה-Packages, <em>שמות</em> ה-Secrets, והקוד הנוכחי — כולל עריכות שעשית ידנית בין הודעה להודעה</li>
            <li><strong>בסקיל:</strong> השם, התיאור, הפרומפט הנוכחי, הפרומפט הבסיס של ה-AI Chatbot, ורשימת הכלים והסקילים האמיתיים שלו — כדי שכל <Code>@tool</Code> ו-<Code>#Skill</Code> שהוא כותב יצביע על משהו שקיים</li>
          </UL>

          <H3>מה הוא ממלא</H3>
          <P>בכלי הוא כותב את הקוד וגם את השם, התיאור, הפרמטרים וה-Packages. בסקיל הוא כותב את הפרומפט וגם את השם והתיאור. הפרומפט של סקיל נכתב <strong>תמיד באנגלית</strong>, חוץ ממשפטים שה-AI Chatbot אמור לומר למשתמש מילה-במילה בשפה אחרת.</P>
          <P>רשימת הפרמטרים שהוא מחזיר מחליפה את הרשימה כולה, כך שההצהרה והקוד תמיד מסכימים על ה-<Code>kwargs</Code>.</P>

          <H3>הם רואים את השגיאות</H3>
          <P>אסיסטנט הכלי מקבל אוטומטית את <strong>ההרצה האחרונה</strong> של הכלי — הקלטים, ההצלחה או הכשל, וטקסט השגיאה המלא — ואת הכשלים שנרשמו לכלי הזה בשיחות אמיתיות. אסיסטנט הסקיל מקבל את הכשלים של ה-AI Chatbot. כלומר אחרי הרצה שנפלה אפשר לכתוב פשוט "תתקן" — בלי להעתיק traceback.</P>

          <H3>קיצורי דרך</H3>
          <UL>
            <li><strong>Write it for me</strong> — כתיבה מאפס לפי השם והתיאור</li>
            <li><strong>Explain the code</strong> / <strong>Add steps</strong> — הסבר על הקוד, או פירוק הפרומפט לשלבים</li>
            <li><strong>Add error handling</strong> / <strong>Tighten it</strong> — חיסון הקוד, או צמצום הפרומפט</li>
            <li><strong>Review it</strong> — ביקורת ותיקון</li>
          </UL>
          <Tip>תאר את המשימה בשפה חופשית ("כלי שמביא מזג אוויר לפי עיר") ותן לו למלא שם, תיאור, פרמטרים וקוד בבת אחת. מודל חזק יותר בהגדרות ה-AI Chatbot נותן קוד טוב יותר.</Tip>
        </div>
      ),

      /* ─────────────── ASSISTANT HISTORY ─────────────── */
      history: (
        <div dir="rtl">
          <H2>היסטוריית אסיסטנטים</H2>
          <P><strong>כל השיחות →</strong>, מתחת לרשימת השיחות בסייד-בר, שומרת כל שיחה עם כל אחד משלושת האסיסטנטים — של המערכת, של הכלים ושל הסקילים. רשימת השיחות עצמה בסייד-בר מראה רק את האחרונות של אסיסטנט המערכת, אלה שנפתחות בדף הבית.</P>

          <H3>מה יש בה</H3>
          <UL>
            <li>סינון לפי סוג האסיסטנט: מערכת, כלים, סקילים או הכל</li>
            <li>חיפוש בתוך כל תוכן השיחות</li>
            <li>לכל שיחה: על איזה AI Chatbot ואיזה כלי או סקיל היא הייתה, מספר הודעות ומתי</li>
            <li>פתיחת שיחה מציגה את התמלול המלא — כולל <strong>כל קריאה לכלי</strong> עם הפרמטרים והתוצאה, וסימון על מה שנכתב לעורך</li>
            <li>קפיצה ל-AI Chatbot שהשיחה עסקה בו, ומחיקת שיחה מההיסטוריה</li>
          </UL>
          <P>השיחה נשמרת אוטומטית אחרי כל תור. שיחה חדשה מתחילה כשלוחצים "שיחה חדשה" בדף הבית או בצ'אט הצף, או כשעוברים לכלי או לסקיל אחר.</P>
          <Tip>ההיסטוריה שימושית במיוחד כדי לחזור לקוד או לפרומפט שאסיסטנט כתב לך לפני שבוע, ולראות מה בדיוק הוא שינה ולמה.</Tip>
        </div>
      ),

      /* ─────────────── TABLES ─────────────── */
      tables: (
        <div dir="rtl">
          <H2>Tables</H2>
          <P>טבלה היא שורות שהחשבון שלך מחזיק — מחירון, הזמנות, לידים, מלאי — וה-AI Chatbots קוראים מהן וכותבים אליהן תוך כדי שיחה. בניגוד ל-Knowledge, שהוא טקסט שנשלף לפי הקשר, טבלה היא נתונים מובנים שאפשר לחפש בהם, להוסיף אליהם ולעדכן אותם.</P>
          <P>הטבלה שייכת <strong>לחשבון ולא ל-AI Chatbot אחד</strong>. כמה מהם יכולים לקרוא מאותה טבלה, וזה כל הרעיון: אותו מחירון משרת את סוכן המכירות ואת סוכן השירות.</P>

          <H3>יצירה</H3>
          <P>בטאב <strong>Tables</strong>: שם, משפט שמסביר מה יש בטבלה, ועמודות. לכל עמודה טיפוס — <Code>text</Code>, <Code>number</Code>, <Code>date</Code> או <Code>yes/no</Code> — והערכים נשמרים בצורה הזאת. מספר שאינו מספר לא נשמר, ותאריך נשמר כיום.</P>
          <Tip>המשפט שמסביר מה יש בטבלה הוא מה שה-AI Chatbot קורא כדי להחליט מתי להשתמש בה. שווה להשקיע בו.</Tip>

          <H3>מי ניגש אליה</H3>
          <P>בכל AI Chatbot יש טאב <strong>Tables</strong> משלו, ושם מסמנים אילו טבלאות מותר לו לגעת בהן. לא מסומן — לא קיים בשבילו, והוא לא מקבל בכלל את הכלים.</P>

          <H3>מה הוא רשאי לעשות</H3>
          <UL>
            <li><Code>table_list</Code> — אילו טבלאות יש לו ומה העמודות שלהן</li>
            <li><Code>table_find</Code> — חיפוש בטבלה; כל שורה חוזרת עם <Code>row_id</Code></li>
            <li><Code>table_add_row</Code> — הוספת שורה</li>
            <li><Code>table_update_row</Code> — עדכון שורה לפי ה-<Code>row_id</Code>; רק השדות שנשלחו משתנים</li>
          </UL>
          <Warn>AI Chatbot לעולם לא מוחק שורה ולא משנה את מבנה הטבלה. מחיקה היא שלך בלבד, במסך Tables.</Warn>
          <P>זה עובד בכל הערוצים באותה צורה — צ'אט הבדיקה, הווידג'ט באתר ו-WhatsApp מריצים את אותו קוד.</P>

          <H3>מי כתב מה</H3>
          <P>כל שורה זוכרת מי הוסיף אותה — אתה, או ה-AI Chatbot ששמו מופיע בתחתית הגיליון. שורה שנראית מוזרה היא שורה שאפשר לאתר.</P>

          <H3>גם האסיסטנט</H3>
          <P>אפשר לבקש מאסיסטנט המערכת "תבנה לי טבלת הזמנות עם מספר, לקוח וסטטוס" והיא תיווצר. הוא גם קורא וכותב שורות, ויכול לחבר טבלה ל-AI Chatbot.</P>
        </div>
      ),

      /* ─────────────── KNOWLEDGE ─────────────── */
      knowledge: (
        <div dir="rtl">
          <H2>Knowledge (RAG)</H2>
          <P>בסיס הידע הוא אוסף מסמכים שה-AI Chatbot שולף מהם קטעים רלוונטיים לכל הודעה, ומקבל אותם בפרומפט תחת <Code>## Relevant Context</Code>.</P>

          <H3>איך מוסיפים מסמכים</H3>
          <UL>
            <li><strong>הדבקת טקסט</strong> — כותרת ותוכן</li>
            <li><strong>העלאת קובץ</strong> — PDF או DOCX; הטקסט מחולץ בשרת ונשמר כמסמך</li>
            <li><strong>סריקת אתר</strong> — ראה למטה</li>
          </UL>

          <H3>ידע גלובלי מול ידע של סקיל</H3>
          <P>מסמך יכול להיות משויך לכל ה-AI Chatbot או לסקיל מסוים. בצ'אט הבדיקה השליפה מצטמצמת למסמכים הגלובליים ולאלה של הסקיל הפעיל. בווידג'ט וב-WhatsApp כל הסקילים פעילים במקביל, ולכן נשלפים שם המסמכים של כולם.</P>

          <H3>סידור אוטומטי בהעלאה</H3>
          <P>כשמוסיפים מסמך, הוא עובר פעם אחת דרך המודל של החשבון ונכתב מחדש לצורה שאפשר למצוא בה: סעיפים קצרים תחת כותרות, כל סעיף על נושא אחד, הפניות מפוענחות (<Code>הוא</Code>, <Code>החברה</Code> מוחלפים בשם עצמו), ובסוף כל סעיף שורת <strong>מילות מפתח בעברית ובאנגלית</strong>.</P>
          <P>שורת מילות המפתח היא הסיבה שאפשר לשאול בעברית על מסמך שכתוב באנגלית — החיפוש הוא לקסיקלי ולא סמנטי, ובלי המילים בעברית לא הייתה חפיפה בכלל.</P>
          <UL>
            <li>המקור נשמר תמיד. הכפתור <Code>↩</Code> בכרטיס המסמך מחזיר אותו</li>
            <li>כפתור הסידור מריץ אותו שוב, תמיד מהמקור ולא מעל סידור קודם</li>
            <li>אם אין מפתח API או שהמודל נכשל, המסמך נשמר כמו שהוא ומסומן <strong>גולמי</strong></li>
            <li>דפים שנסרקו מאתר מחולקים לקטעים אבל לא עוברים סידור — סריקה יכולה להיות מאה דפים, וזה מאה קריאות מודל</li>
          </UL>

          <H3>איך השליפה עובדת</H3>
          <P>כל מסמך מחולק לקטעי חיפוש של כמה מאות תווים, עם חפיפה קלה ביניהם וכותרת הסעיף נגררת לתוך כל קטע. השליפה מחזירה קטעים, לא את המסמך כולו — כך ה-AI Chatbot מקבל את מה שרלוונטי במקום קובץ שלם.</P>
          <P>החיפוש הוא <Code>tsvector</Code> של PostgreSQL על ההודעה האחרונה. המילים בשאלה מחוברות ב-<strong>OR</strong> ולא ב-AND, והאינדקס מחזיק כל מסמך גם ב-<Code>simple</Code> (מילים כפי שנכתבו — מה שעברית צריכה) וגם ב-<Code>english</Code> (גזעי מילים — כך ש-<Code>experience</Code> מוצא <Code>experiences</Code>).</P>
          <Tip>עדיין שווה לתת למסמך כותרת תיאורית ולפצל לפי נושא. הסידור האוטומטי עושה הרבה, אבל מסמך שמאורגן היטב מלכתחילה תמיד יימצא טוב יותר.</Tip>

          <H3>סריקת אתרים</H3>
          <P>מזינים כתובת אחת, בוחרים כמה עמודים לקרוא, והסורק עובר על <strong>כל הדומיין</strong> — לא רק על הדף שהוזן. כל דף נשמר כמסמך מסומן <Code>web</Code>, הכותרות (<Code>h1</Code>-<Code>h6</Code>) נשמרות כסעיפים, וכל דף מחולק לקטעי חיפוש כמו כל מסמך אחר. הסריקה מתרעננת אוטומטית פעמיים ביום.</P>
          <P>איך הוא מוצא את הדומיין: מתחילים מהכתובת שהוזנה ואחרי כל הפניה שהיא עושה, ומשם עוקבים אחרי כל קישור פנימי בכל דף. במקביל נקרא ה-<Code>sitemap.xml</Code> של האתר, וזו הדרך היחידה להגיע לדפים שאף דף אחר לא מקשר אליהם. <Code>example.com</Code> ו-<Code>www.example.com</Code> הם אותו אתר; תת-דומיין כמו <Code>blog.example.com</Code> הוא אתר אחר ודורש כתובת משלו.</P>
          <Warn>הסורק קורא את ה-HTML שהשרת מחזיר — הוא <strong>לא מריץ JavaScript</strong>. אתר שנבנה בדפדפן (React, Vue, Angular) יחזיר דפים כמעט ריקים, והממשק יסמן כמה דפים כאלה נמצאו. במקרה כזה עדיף להדביק את התוכן ידנית.</Warn>
          <UL>
            <li>דפים שנסרקו <strong>לא</strong> עוברים את הסידור האוטומטי — סריקה יכולה להיות מאות דפים. אפשר להריץ את הסידור על דף בודד ידנית</li>
            <li>עמוד גדול במיוחד נחתך ב-60 אלף תווים</li>
            <li><Code>robots.txt</Code> של האתר מכובד. דפים שהאתר חוסם לא נקראים</li>
            <li>המסמכים של הסריקה הקודמת נמחקים רק כשיש דף חדש להחליף אותם. אתר שלא עונה משאיר את הידע הקיים במקומו ומסמן שגיאה</li>
            <li>מסמן <strong>נשאר עוד מהאתר</strong> כשנגמרו העמודים שהוקצו או הזמן — אפשר להעלות את מספר העמודים ולהריץ שוב</li>
          </UL>
          <P>בנוסף, כשמשתמש שולח כתובת בצ'אט הבדיקה, עד שלוש כתובות מההודעה נסרקות מיד ונמסרות למודל תחת <Code>## Fetched Web Pages</Code> — בלי להישמר בבסיס הידע.</P>
        </div>
      ),

      /* ─────────────── TEST ─────────────── */
      test: (
        <div dir="rtl">
          <H2>בדיקת ה-AI Chatbot</H2>
          <P>יש שתי דרכים לדבר עם AI Chatbot, והן לא אותו דבר:</P>
          <UL>
            <li><strong>Test במסך ה-AI Chatbots</strong> — שיחה אמיתית. היא רצה בשרת דרך אותו ערוץ שהווידג'ט משתמש בו, מנותבת לבראנץ' לפי אחוזי התנועה, ונשמרת ב-<strong>Interactions</strong> ככל שיחה אחרת.</li>
            <li><strong>Test בתוך עורך ה-AI Chatbot</strong> — בדיקה ידנית מול ההגדרות שעל המסך, כולל הבראנץ' שאתה נמצא עליו כרגע, בלי לפרסם כלום. נשמרת ב-<strong>Manual tests</strong>.</li>
          </UL>
          <P>הבדיקה הידנית היא זו שמראה קריאות לכלים, מעבר סקילים וזמני תגובה — היא רצה בדפדפן, ולכן היא יכולה להראות את מה שקורה בדרך.</P>

          <H3>מה רואים בצ'אט</H3>
          <UL>
            <li><strong>קריאות לכלים</strong> — כל קריאה מוצגת עם הפרמטרים שנשלחו והתוצאה שחזרה</li>
            <li><strong>מעבר סקיל</strong> — כשה-AI Chatbot עובר לסקיל, מוצג כרטיס עם שמו והתיאור</li>
            <li><strong>זמני תגובה</strong> — משך כל תשובה במילישניות</li>
            <li><strong>מיסוך DLP</strong> — הודעה שמוסכה מסומנת ככזו</li>
          </UL>

          <H3>היסטוריה — לשונית Manual tests</H3>
          <P>כל שיחת בדיקה נשמרת בשרת אוטומטית, אחרי כל תור, כך שסגירת טאב באמצע לא מאבדת את ההרצה. אייקון השעון בכותרת הצ'אט מציג אותן, ואותן שיחות בדיוק מופיעות בלשונית <strong>Manual tests</strong> של ה-AI Chatbot — עם חיפוש בכל התמלילים, משך זמן, ומחיקה.</P>
          <P>הן <strong>לא</strong> מופיעות ב-<strong>Interactions</strong>, ובכוונה: שם יושבות שיחות של משתמשי קצה אמיתיים דרך הווידג'ט או WhatsApp, ואלה השיחות שלך עם ה-AI Chatbot שלך.</P>
          <P><strong>כל האסיסטנטים קוראים אותן.</strong> האסיסטנטים של הכלים, הסקילים והבייס-פרומט מקבלים את ההרצות האחרונות כחלק מהקונטקסט, ואסיסטנט המערכת יכול לבקש אותן בעצמו דרך <Code>get_test_conversations</Code>. לכן אפשר לומר לאסיסטנט "ה-AI Chatbot ענה לא נכון, תתקן" בלי להעתיק לו את השיחה.</P>
          <Warn>כל שיחה מתחילה מאפס — ה-AI Chatbot לא זוכר שיחות קודמות. מה שצריך שיהיה זמין תמיד צריך להיות בפרומפט או בבסיס הידע.</Warn>
        </div>
      ),

      /* ─────────────── CLI ─────────────── */
      cli: (
        <div dir="rtl">
          <H2>עריכה מ-IDE</H2>
          <P>אותו AI Chatbot שאתה עורך בממשק אפשר למשוך לתיקייה, לערוך בעורך שלך, ולדחוף בחזרה. לכל AI Chatbot יש גם ריפו פרטי ב-GitHub, ו-<Code>git push</Code> אליו מופעל בדיוק כמו <Code>8legs push</Code>.</P>

          <H3>התקנה</H3>
          <Block>{`npm i -g @8legs/cli     # ואז 8legs <פקודה> מכל תיקייה
npx @8legs/cli <פקודה>   # בלי להתקין כלום`}</Block>
          <P>דורש Node 18 ומעלה. אין לחבילה שום תלות חיצונית.</P>

          <H3>התחברות</H3>
          <P>צור טוקן ב-<strong>Settings → Personal access tokens</strong>: תן לו שם שתזהה (המחשב, הסביבה) ולחץ צור. הוא מוצג פעם אחת בלבד — בשרת נשמר רק ה-hash שלו, והשם הוא מה שיעזור לדעת איזה טוקן לבטל.</P>
          <Block>{`8legs login
8legs list`}</Block>

          <H3>כל הפקודות</H3>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, marginBottom: 16 }}>
            <tbody>
              {[
                ['login', 'שומר טוקן. --token <t> מדלג על ההדבקה'],
                ['logout', 'מוחק את הטוקן השמור'],
                ['whoami', 'לאיזו התקנה אתה מחובר, וכמה AI Chatbots יש'],
                ['list', 'ה-AI Chatbots שלך, עם ה-id של כל אחד'],
                ['pull <AI Chatbot>', 'מוריד AI Chatbot לתיקייה. לפי id או לפי שם'],
                ['pull', 'מרענן את התיקייה שאתה בתוכה'],
                ['status', 'מה שונה מקומית, ואם ה-AI Chatbot זז בפלטפורמה'],
                ['diff [קובץ]', 'השינויים עצמם, שורה-שורה'],
                ['validate', 'בודק את התיקייה לפני דחיפה'],
                ['push', 'שולח את השינויים'],
                ['open', 'פותח את ה-AI Chatbot בדפדפן'],
                ['git', 'מכוון את ה-origin של התיקייה לריפו של ה-AI Chatbot'],
                ['branches', 'הבראנצ׳ים, ואחוז השיחות של כל אחד'],
                ['branch <שם>', 'פותח בראנץ׳ ומעביר אליו את התיקייה'],
                ['checkout <שם>', 'מחליף את התיקייה לבראנץ׳ אחר'],
                ['merge [שם]', 'מחיל את הבראנץ׳ על main — כלומר מפעיל אותו'],
                ['traffic <שם> <%>', 'שולח אחוז מהשיחות האמיתיות לבראנץ׳'],
                ['traffic --stop', 'כל השיחות חוזרות ל-main'],
              ].map(([cmd, what]) => (
                <tr key={cmd} style={{ borderBottom: '1px solid var(--border)' }}>
                  <td dir="ltr" style={{ padding: '7px 10px 7px 0', fontFamily: 'monospace', color: 'var(--teal)',
                                         whiteSpace: 'nowrap', verticalAlign: 'top', textAlign: 'left' }}>{cmd}</td>
                  <td style={{ padding: '7px 0 7px 14px', color: 'var(--text-2)', lineHeight: 1.6 }}>{what}</td>
                </tr>
              ))}
            </tbody>
          </table>

          <H3>דגלים</H3>
          <UL>
            <li><Code>--branch &lt;שם&gt;</Code> — למשוך בראנץ׳ במקום main</li>
            <li><Code>--dir &lt;נתיב&gt;</Code> — לאיזו תיקייה למשוך</li>
            <li><Code>--force</Code> — מרשה ל-pull או ל-checkout לדרוס שינויים מקומיים</li>
            <li><Code>--host &lt;url&gt;</Code> — התקנה אחרת של הפלטפורמה</li>
            <li><Code>--token &lt;טוקן&gt;</Code> — התחברות בלי prompt</li>
          </UL>

          <H3>מבנה התיקייה</H3>
          <Block>{`config.json              זהות, ערוצים, מיסוך מידע
prompt.md                הפרומפט הבסיסי
skills/<שם>/skill.json   למה הסקיל, ואילו כלים שלו
skills/<שם>/prompts/skill.md   ההוראות שלו
tools/<שם>/tool.json     פרמטרים, חבילות, שמות משתני סביבה
tools/<שם>/run.py        הקוד
AGENTS.md                איך לערוך את ה-AI Chatbot — בשביל Claude Code
.8legs/lock.json         id, בראנץ׳, גרסה`}</Block>

          <Warn>אל תשנה <Code>id</Code> באף קובץ. זה איך שהפלטפורמה מזהה את הדבר שכבר קיים אצלה — שינוי שלו מוחק סקיל ויוצר אחר במקומו.</Warn>

          <H3>מה לא נמצא בתיקייה</H3>
          <UL>
            <li><strong>סודות.</strong> מפתח ה-API, טוקני WhatsApp וערכי משתני הסביבה של כלים נשארים בפלטפורמה. <Code>config.json</Code> מפנה אליהם בצורת <Code>{'{{global.NAME}}'}</Code>; אל תחליף הפניה בערך אמיתי, push מתעלם ממנו.</li>
            <li><strong>מסמכי ידע.</strong> יש להם מחזור חיים משלהם — העלאה, פיצול לקטעים, אינדוקס — וקרול של מאות עמודים לא אמור להיות קומיט.</li>
          </UL>

          <H3>עבודה עם git</H3>
          <Block>{`8legs pull <id>
8legs git                # מכוון את origin לריפו של ה-AI Chatbot
# ערוך, ואז
git add -A && git commit -m "…" && git push`}</Block>
          <P>הריפו נוצר ב-pull הראשון. קומיט שעובר ולידציה מסומן ✓ ב-GitHub והופך לחי; קומיט שנופל מסומן ✗ עם הסיבה, <strong>וה-AI Chatbot החי לא זז</strong>. git כבר קיבל את הדחיפה, אז אי אפשר לדחות אותה — רק לא להפעיל אותה.</P>

          <H3>בראנצ׳ים וניתוב שיחות</H3>
          <Block>{`8legs branch warmer-tone      # פותח בראנץ׳ ועובר אליו
# ערוך ודחוף — main לא זז
8legs traffic warmer-tone 20  # 20% מהשיחות האמיתיות אליו
8legs branches                # לראות את החלוקה
8legs merge warmer-tone       # להפעיל אותו על כולם
8legs traffic --stop          # או להחזיר הכל ל-main`}</Block>
          <P>הבראנץ׳ של שיחה מוגרל פעם אחת, בהודעה הראשונה, ונשמר עליה. אף אחד לא רואה את ה-AI Chatbot מתחלף באמצע שיחה.</P>

          <H3>כשדחיפה נדחית</H3>
          <UL>
            <li><strong>"The AI Chatbot changed on the platform"</strong> — מישהו ערך בממשק. <Code>8legs pull</Code> לוקח את הגרסה שלו, ואז תחזור על העריכה ותדחוף שוב. שום דבר לא נכתב.</li>
            <li><strong>קובץ שלא נפרס</strong> — גם כאן שום דבר לא נכתב. דחיפה היא הכל-או-כלום: JSON שבור לא יכול להשאיר AI Chatbot חי מעודכן בחצי.</li>
          </UL>

          <Tip>עריכה בממשק נכנסת ל<strong>טיוטה</strong>, לא ל-AI Chatbot החי — הפס בראש עורך ה-AI Chatbot הוא מה שמפרסם אותה. ב-CLI הטיוטה היא בראנץ׳ בשם <Code>draft</Code>.</Tip>
        </div>
      ),

      /* ─────────────── WIDGET ─────────────── */
      widget: (
        <div dir="rtl">
          <H2>הטמעה באתר</H2>
          <P>לשונית <strong>Export</strong> מייצרת קוד הטמעה מוכן, עם תצוגה מקדימה חיה של הווידג'ט.</P>

          <H3>מה אפשר לעצב</H3>
          <UL>
            <li>כותרת, צבע ראשי וצבע הכותרת</li>
            <li>טקסט ה-placeholder בתיבת ההקלדה</li>
            <li>גובה ורדיוס פינות</li>
          </UL>

          <H3>שתי דרכי הטמעה</H3>
          <UL>
            <li><strong>iframe</strong> — הטמעה קבועה בתוך הדף</li>
            <li><strong>כפתור צף</strong> — קטע script שמוסיף בועה בפינה שנפתחת ונסגרת, עם האווטאר של ה-AI Chatbot</li>
          </UL>

          <H3>מה קורה מאחורי הקלעים</H3>
          <P>הווידג'ט מדבר עם נקודת קצה ציבורית של ה-AI Chatbot. היא מחזירה רק את מה שדרוש לתצוגה — שם, אווטאר והודעת פתיחה — ולא את המפתחות או ההגדרות. ה-AI Chatbot עונה בצד השרת עם המפתח שלו, כולל כלים, בסיס ידע ו-DLP, וכל שיחה נשמרת ומופיעה ב-Interactions כערוץ <Code>Widget</Code>.</P>
          <Warn>הווידג'ט פתוח לכל מי שמגיע לדף שבו הטמעת אותו, וכל שיחה מחויבת למפתח ה-API של ה-AI Chatbot. אל תטמיע AI Chatbot יקר בדף ציבורי בלי מעקב ב-Interactions.</Warn>
        </div>
      ),

      /* ─────────────── WHATSAPP ─────────────── */
      whatsapp: (
        <div dir="rtl">
          <H2>ערוץ WhatsApp</H2>
          <P>לשונית <strong>Whatsapp</strong> מחברת את ה-AI Chatbot למספר WhatsApp Business דרך Meta Cloud API. אנשים כותבים למספר, וה-AI Chatbot עונה עם אותו פרומפט, כלים וידע.</P>

          <H3>מה צריך מ-Meta</H3>
          <UL>
            <li><strong>Phone Number ID</strong> — מזהה המספר ב-WhatsApp Business</li>
            <li><strong>Access Token</strong> — טוקן קבוע לשליחת הודעות</li>
            <li><strong>App Secret</strong> — לאימות שכל הודעה נכנסת באמת מ-Meta</li>
            <li><strong>Verify Token</strong> — מחרוזת שאתה בוחר (יש כפתור שמגריל אותה) ומזין גם ב-Meta</li>
          </UL>

          <H3>שלבי החיבור</H3>
          <UL>
            <li>מלא את ארבעת השדות ולחץ <strong>Test connection</strong> — הבדיקה מאמתת מול Meta ומחזירה את שם התצוגה של המספר</li>
            <li>העתק את כתובת ה-Webhook מהמסך והדבק אותה ב-Meta יחד עם ה-Verify Token</li>
            <li>הפעל את המתג בראש הלשונית</li>
          </UL>

          <H3>מה קורה בכל הודעה</H3>
          <UL>
            <li>החתימה של Meta מאומתת מול ה-App Secret; בקשה בלי חתימה תקפה נדחית</li>
            <li>הודעה מטופלת פעם אחת בלבד, גם אם Meta שולחת אותה שוב</li>
            <li>ההיסטוריה נשמרת פר שולח, ועשרים ההודעות האחרונות נשלחות למודל כהקשר</li>
            <li>תשובה ארוכה מפוצלת לכמה הודעות; הודעות שאינן טקסט מקבלות תשובה מנומסת</li>
          </UL>
          <Warn>מספר WhatsApp יכול להיות מחובר ל-AI Chatbot אחד בלבד. אם תזין מספר שכבר מחובר ל-AI Chatbot אחר, השמירה תידחה עם הודעה.</Warn>
        </div>
      ),

      /* ─────────────── INTERACTIONS ─────────────── */
      interactions: (
        <div dir="rtl">
          <H2>Interactions</H2>
          <P>לשונית בסייד-בר שמרכזת כל השיחות שנוהלו עם ה-AI Chatbots שלך, בכל הערוצים.</P>

          <H3>העמודות</H3>
          <UL>
            <li><strong>AI Chatbot</strong> — ה-AI Chatbot שענה</li>
            <li><strong>Channel</strong> — Widget, WhatsApp או Test chat</li>
            <li><strong>Started</strong> — מתי השיחה התחילה</li>
            <li><strong>Duration</strong> — מהפעילות הראשונה עד האחרונה בשיחה</li>
            <li><strong>Messages</strong> — מספר ההודעות</li>
            <li><strong>Conversation</strong> — ההודעה הראשונה של המשתמש; לחיצה על השורה פותחת את התמלול המלא</li>
          </UL>

          <H3>סינון וחיפוש</H3>
          <P>מתחת לכל כותרת יש פילטר: בחירת AI Chatbot, ערוץ, טווח תאריכים, מינימום ומקסימום שניות, ומינימום הודעות. תיבת החיפוש בעמודת Conversation מחפשת בתוך <strong>כל תוכן ההודעות</strong>, לא רק בתצוגה המקדימה. Started, Duration ו-Messages ניתנים למיון בלחיצה, ו-Clear filters מאפס הכול.</P>
          <P>לאדמין יש כפתור נוסף שמרחיב את הרשימה לכל המשתמשים ומוסיף עמודת Owner.</P>
        </div>
      ),

      /* ─────────────── ADMIN ─────────────── */
      admin: (
        <div dir="rtl">
          <H2>Admin</H2>
          <P>לשונית שמופיעה רק למשתמשי אדמין.</P>

          <H3>משתמשים</H3>
          <UL>
            <li>טבלה עם שם משתמש, טלפון, הרשאה, מספר AI Chatbots והתחברות אחרונה</li>
            <li><strong>View AI Chatbots</strong> — צפייה ועריכה של ה-AI Chatbots של אותו משתמש, כולל שכפול AI Chatbot משלך אליו</li>
            <li><strong>Reset Password</strong> — מגריל סיסמה זמנית ומציג אותה פעם אחת</li>
            <li><strong>Delete User</strong> — מוחק את המשתמש, ה-AI Chatbots שלו, השיחות והמסמכים. דורש הקלדת שם המשתמש לאישור, ואי אפשר למחוק את עצמך</li>
          </UL>
          <Warn>שכפול AI Chatbot למשתמש אחר לא מעביר את חיבור ה-Gmail ואת הגדרות ה-WhatsApp — הן מתאפסות בכוונה, כדי שלא יעברו טוקנים ומספרים בין משתמשים.</Warn>

          <H3>Chat History</H3>
          <P>תצוגת כל השיחות בכל המערכת, עם תמלול מלא. Interactions נוח יותר לסינון; זה נוח יותר לסקירה כללית.</P>
        </div>
      ),

      /* ─────────────── OPS ─────────────── */
      ops: (
        <div dir="rtl">
          <H2>תשתית ותחזוקה</H2>

          <H3>משתני סביבה</H3>
          <UL>
            <li><Code>DATABASE_URL</Code> — מחרוזת החיבור ל-Neon</li>
            <li><Code>JWT_SECRET</Code> — חתימת טוקני ההתחברות ומצב ה-OAuth של Gmail</li>
            <li><Code>GOOGLE_CLIENT_ID</Code> / <Code>GOOGLE_CLIENT_SECRET</Code> — נדרשים לחיבור Gmail</li>
            <li><Code>APP_URL</Code> — כתובת הבסיס לחזרה מ-OAuth (אם לא מוגדר, נגזרת מהבקשה)</li>
          </UL>

          <H3>מיגרציות</H3>
          <P>סכימת הבסיס נמצאת ב-<Code>schema.sql</Code>, וכל שינוי אחריה בתיקיית <Code>migrations/</Code>. הרצה:</P>
          <Block>{`npm install
npm run migrate -- --dry   # מה יורץ
npm run migrate            # הרצה בפועל`}</Block>
          <P>הריצה קוראת <Code>DATABASE_URL</Code> מהסביבה או מקובץ <Code>.env</Code>, מריצה כל קובץ פעם אחת ורושמת אותו בטבלת <Code>schema_migrations</Code>. הקבצים כתובים כך שהרצה חוזרת לא מזיקה.</P>

          <H3>משימות מתוזמנות</H3>
          <P>סריקת האתרים של כל ה-AI Chatbots רצה פעמיים ביום דרך Vercel Cron. ל-webhook של WhatsApp ולסריקות יש חלונות זמן ארוכים יותר מברירת המחדל.</P>
        </div>
      ),

      /* ─────────────── SECURITY ─────────────── */
      security: (
        <div dir="rtl">
          <H2>אבטחה ופרטיות</H2>

          <H3>מה מופרד בין משתמשים</H3>
          <UL>
            <li>AI Chatbot שייך למשתמש, וכל קריאה לשרת מאמתת בעלות לפני שהיא מחזירה או משנה משהו</li>
            <li>חיבור Gmail הוא פר AI Chatbot, וניתן לגישה רק לבעל ה-AI Chatbot</li>
            <li>מספר WhatsApp הוא בלעדי ל-AI Chatbot אחד, וניתוב הודעה נקבע לפי הוכחת ה-App Secret — לא לפי מי שהזין את המספר אחרון</li>
          </UL>

          <H3>מה חשוב לדעת על סודות</H3>
          <UL>
            <li>מפתחות ה-API, טוקני WhatsApp וה-Secrets של הכלים נשמרים בהגדרות ה-AI Chatbot בבסיס הנתונים</li>
            <li>ערכי Secrets נחשפים לקוד הכלי שלך בזמן ריצה — כל מי שיכול לערוך את הכלי יכול לקרוא אותם</li>
            <li>האסיסטנט מקבל את שמות ה-Secrets בלבד, לא את הערכים</li>
          </UL>

          <H3>מה חשוף לציבור</H3>
          <UL>
            <li>הווידג'ט וה-webhook של WhatsApp פונים לעולם; שיחה דרכם מחויבת למפתח שלך</li>
            <li>בסיס הידע נשלף לתוך התשובות — אל תכניס אליו מה שלא מוכן להיאמר ללקוח</li>
            <li>DLP מסתיר תבניות של כרטיס אשראי ותעודת זהות, ולא כל מידע מזהה. הוא שכבת הגנה, לא ערובה</li>
          </UL>
          <Tip>עקוב אחרי Interactions כדי לראות מה באמת נשאל ומה ה-AI Chatbot ענה. זה הכלי הכי טוב לתפוס גם דליפות וגם תשובות שגויות.</Tip>
        </div>
      ),
    };

    return (
      <div style={stacked ? { display: 'flex', flexDirection: 'column', gap: 16 } : { display: 'flex', gap: 32, maxWidth: 1000, margin: '0 auto' }}>
        {/* Sidebar nav — on a phone, a strip of chips above the text */}
        <div style={{ width: stacked ? '100%' : 200, flexShrink: 0 }}>
          {!stacked && <div style={{ fontWeight: 700, fontSize: 11, color: 'var(--text-muted)', letterSpacing: 1, marginBottom: 10, textTransform: 'uppercase' }}>תוכן עניינים</div>}
          <div className={stacked ? 'm-scroll-x' : undefined} dir={stacked ? 'rtl' : undefined} style={stacked ? { display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 4 } : { display: 'flex', flexDirection: 'column', gap: 2 }}>
            {sections.map(s => (
              <button key={s.id} onClick={() => setActive(s.id)}
                style={stacked ? {
                  flexShrink: 0, whiteSpace: 'nowrap', height: 36, padding: '0 13px', borderRadius: 999, fontSize: 13,
                  background: active === s.id ? 'var(--primary-dim)' : 'var(--bg-card)',
                  color: active === s.id ? 'var(--primary)' : 'var(--text-2)',
                  fontWeight: active === s.id ? 700 : 500,
                  border: `1px solid ${active === s.id ? 'rgba(239,159,39,0.35)' : 'var(--border)'}`,
                } : {
                  textAlign: 'right', padding: '8px 10px', borderRadius: 'var(--r-sm)', fontSize: 13,
                  background: active === s.id ? 'rgba(239,159,39,0.10)' : 'transparent',
                  color: active === s.id ? 'var(--primary)' : 'var(--text-2)',
                  fontWeight: active === s.id ? 600 : 400,
                  borderRight: `3px solid ${active === s.id ? 'var(--primary)' : 'transparent'}`,
                }}
                onMouseEnter={e => { if (active !== s.id) e.currentTarget.style.background = 'var(--bg-hover)'; }}
                onMouseLeave={e => { if (active !== s.id) e.currentTarget.style.background = 'transparent'; }}
              >{s.label}</button>
            ))}
          </div>
        </div>
        {/* Content */}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ marginBottom: 6, fontSize: 11, color: 'var(--text-muted)', letterSpacing: 1, textTransform: 'uppercase' }}>תיעוד</div>
          <div style={{ fontWeight: 800, fontSize: 28, marginBottom: 24, color: 'var(--text)' }}>📖 מדריך 8Legs.ai</div>
          {content[active]}
        </div>
      </div>
    );
  }

  /* ─────────────────── AGENT LIST VIEW ─────────────────── */
  /* ─────────────────── TABLES ─────────────────── */
  /*
   * Rows an account keeps and its AI Chatbots read and write. A table belongs
   * to the account rather than to one chatbot, so several of them can answer
   * from the same rows; which chatbot may touch which is ticked per chatbot,
   * in the editor's own Tables tab.
   */

  const COLUMN_TYPES = [
    { id: 'text',    label: 'text' },
    { id: 'number',  label: 'number' },
    { id: 'date',    label: 'date' },
    { id: 'boolean', label: 'yes/no' },
  ];

  const TYPE_HE = { text: 'טקסט', number: 'מספר', date: 'תאריך', boolean: 'כן/לא' };

  /** How a stored value reads in a cell. */
  function cellText(value, type) {
    if (value === '' || value === null || value === undefined) return '';
    if (type === 'boolean') return value ? L('yes', 'כן') : L('no', 'לא');
    return String(value);
  }

  function NewTableDialog({ onCancel, onCreate }) {
    const [name, setName] = useState('');
    const [description, setDescription] = useState('');
    const [columns, setColumns] = useState([{ name: '', type: 'text' }]);
    const [busy, setBusy] = useState(false);
    const [error, setError] = useState('');

    function setCol(i, patch) {
      setColumns(cs => cs.map((c, n) => (n === i ? { ...c, ...patch } : c)));
    }
    const filled = columns.filter(c => c.name.trim());

    async function create() {
      setBusy(true); setError('');
      try {
        await onCreate({ name: name.trim(), description: description.trim(), columns: filled });
      } catch (err) { setError(err.message); setBusy(false); }
    }

    return (
      <div onClick={onCancel} style={{
        position: 'fixed', inset: 0, background: 'rgba(13,15,20,0.45)', zIndex: 300,
        display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 30,
      }}>
        <div className="fade-in" onClick={e => e.stopPropagation()} dir={uiDir()} style={{
          width: 'min(620px, 100%)', maxHeight: '90%', overflowY: 'auto',
          background: 'var(--bg-card)', border: '1px solid var(--border)',
          borderRadius: 'var(--r-xl)', boxShadow: 'var(--shadow-lg)',
        }}>
          <div style={{ padding: '16px 20px', borderBottom: '1px solid var(--border)', fontWeight: 800, fontSize: 16 }}>
            {L('New table', 'טבלה חדשה')}
          </div>
          <div style={{ padding: '18px 20px', display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div>
              <label className="field-label">{L('Name', 'שם')}</label>
              <input value={name} onChange={e => setName(e.target.value)} dir="auto" autoFocus
                placeholder={L('e.g. Orders', 'למשל הזמנות')} />
            </div>
            <div>
              <label className="field-label">
                {L('What is in it', 'מה יש בה')}{' '}
                <span style={{ color: 'var(--text-muted)', fontWeight: 400 }}>
                  {L('— the AI Chatbots read this to decide when to use it', '— ה-AI Chatbots קוראים את זה כדי להחליט מתי להשתמש בה')}
                </span>
              </label>
              <input value={description} onChange={e => setDescription(e.target.value)} dir="auto"
                placeholder={L('e.g. every order, its status and when it is due', 'למשל כל הזמנה, הסטטוס שלה ומתי היא אמורה להגיע')} />
            </div>
            <div>
              <label className="field-label">{L('Columns', 'עמודות')}</label>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {columns.map((c, i) => (
                  <div key={i} style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                    <input value={c.name} onChange={e => setCol(i, { name: e.target.value })} dir="auto"
                      placeholder={L('column name', 'שם העמודה')} style={{ fontFamily: MONO, fontSize: 13 }} />
                    <select value={c.type} onChange={e => setCol(i, { type: e.target.value })} style={{ width: 132 }}
                      title={c.type === 'date' ? L('Dates are read day first: 9.1.2025 is the 9th of January', 'תאריכים נקראים יום קודם: 9.1.2025 הוא ה-9 בינואר') : ''}>
                      {COLUMN_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
                    </select>
                    <IconBtn danger title={L('Remove', 'הסר')}
                      onClick={() => setColumns(cs => cs.filter((_, n) => n !== i))}>✕</IconBtn>
                  </div>
                ))}
              </div>
              <Btn size="sm" icon={Icons.plus} style={{ marginTop: 8 }}
                onClick={() => setColumns(cs => [...cs, { name: '', type: 'text' }])}>
                {L('Add column', 'הוסף עמודה')}
              </Btn>
            </div>
            {error && <div style={{ color: 'var(--danger)', fontSize: 12.5 }}>{error}</div>}
          </div>
          <div style={{
            padding: '14px 20px', borderTop: '1px solid var(--border)', background: 'var(--bg-panel)',
            display: 'flex', justifyContent: 'flex-end', gap: 10,
          }}>
            <Btn onClick={onCancel}>{L('Cancel', 'ביטול')}</Btn>
            <Btn variant="primary" disabled={busy || !name.trim() || !filled.length} onClick={create}>
              {busy ? L('Creating…', 'יוצר…') : L('Create table', 'צור טבלה')}
            </Btn>
          </div>
        </div>
      </div>
    );
  }

  /** One table as a sheet: search, edit a cell in place, add and remove rows. */
  function TableSheet({ table, agents, onBack, onChanged }) {
    const [rows, setRows] = useState([]);
    const [total, setTotal] = useState(0);
    const [query, setQuery] = useState('');
    const [loading, setLoading] = useState(true);
    const [editing, setEditing] = useState(null);   // { rowId, key }
    const [draft, setDraft] = useState('');
    const [error, setError] = useState('');
    const [pendingDelete, setPendingDelete] = useState(false);

    const columns = table.columns || [];

    const load = useCallback(() => {
      setLoading(true);
      return apiTableRows(table.id, { q: query, limit: 200 })
        .then(d => { setRows(d.rows || []); setTotal(d.total || 0); setLoading(false); })
        .catch(err => { setError(err.message); setLoading(false); });
    }, [table.id, query]);

    useEffect(() => {
      const t = setTimeout(load, query ? 250 : 0);
      return () => clearTimeout(t);
    }, [load]);

    async function commit(row, col) {
      setEditing(null);
      if (String(row.data[col.key] ?? '') === draft) return;
      try {
        const saved = await apiUpdateTableRow(table.id, row.id, { [col.key]: draft });
        setRows(rs => rs.map(r => (r.id === row.id ? { ...r, data: saved.data } : r)));
        // A value the column cannot hold used to leave the cell blank and say
        // nothing, which reads as "it did not save my Hebrew".
        const no = (saved.refused || [])[0];
        setError(no ? L(`"${no.value}" is not a ${no.type}, so the ${no.column} cell was left as it was.`,
                        `"${no.value}" הוא לא ${TYPE_HE[no.type] || no.type}, ולכן התא ${no.column} נשאר כפי שהיה.`) : '');
        onChanged();
      } catch (err) { setError(err.message); }
    }

    async function addRow() {
      try {
        const made = await apiAddTableRow(table.id, {});
        setRows(rs => [...rs, { id: made.id, data: made.data, written_by: 'user' }]);
        setTotal(t => t + 1);
        onChanged();
      } catch (err) { setError(err.message); }
    }

    async function removeRow(rowId) {
      try {
        await apiDeleteTableRow(table.id, rowId);
        setRows(rs => rs.filter(r => r.id !== rowId));
        setTotal(t => Math.max(0, t - 1));
        onChanged();
      } catch (err) { setError(err.message); }
    }

    /* Who reads it, by name — the reason a table is worth keeping shared. */
    const readers = (agents || []).filter(a => (a.tables || []).includes(table.id));
    const writerName = id => {
      if (id === 'user') return L('you', 'אתה');
      const a = (agents || []).find(x => x.id === id);
      return a ? a.name : L('an AI Chatbot', 'AI Chatbot');
    };

    const th = { padding: '11px 14px', textAlign: 'start', whiteSpace: 'nowrap', borderBottom: '1px solid var(--border)', background: 'var(--bg-card)', position: 'sticky', top: 0 };
    const td = { padding: '8px 14px', borderTop: '1px solid var(--border)', fontSize: 13, verticalAlign: 'middle' };

    return (
      /* flex:1 rather than height:100% — the column around it is sized by its
         content, so a percentage here collapses and the sheet ends mid-screen. */
      <div style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0, gap: 14 }}>
        <PageHeader
          eyebrow={L('Table', 'טבלה')}
          title={table.name}
          subtitle={`${plural(total, L('row', 'שורה'))} · ${plural(columns.length, L('column', 'עמודה'))}`}
          actions={
            <React.Fragment>
              <Btn onClick={onBack}>{L('← All tables', '← כל הטבלאות')}</Btn>
              <Btn danger icon={Icons.trash} onClick={() => setPendingDelete(true)}>{L('Delete', 'מחק')}</Btn>
            </React.Fragment>
          }
        />

        <div style={{ ...WORKSPACE_PANEL, flex: 1, minHeight: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 14px', borderBottom: '1px solid var(--border)', background: 'var(--bg-panel)', flexWrap: 'wrap', flexShrink: 0 }}>
            <SearchField value={query} onChange={setQuery} placeholder={L('Search every cell', 'חיפוש בכל התאים')} style={{ maxWidth: 300, height: 34 }} />
            <span style={{ marginInlineStart: 'auto', fontSize: 11.5, color: 'var(--text-muted)' }}>
              {loading ? L('Loading…', 'טוען…') : `${rows.length} / ${total}`}
            </span>
          </div>

          <div style={{ flex: 1, minHeight: 0, overflow: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse' }}>
              <thead>
                <tr>
                  <th style={{ ...th, width: 42 }}></th>
                  {columns.map(c => (
                    <th key={c.key} style={th}>
                      <div style={{ display: 'flex', alignItems: 'baseline', gap: 7 }}>
                        <Eyebrow>{c.name}</Eyebrow>
                        <span style={{ fontSize: 9.5, color: 'var(--text-muted)', opacity: 0.75 }}>{c.type}</span>
                      </div>
                    </th>
                  ))}
                  <th style={{ ...th, width: 56 }}></th>
                </tr>
              </thead>
              <tbody>
                {rows.map((row, i) => (
                  <tr key={row.id}>
                    <td style={{ ...td, color: 'var(--text-muted)', fontSize: 11, fontFamily: MONO }}>{i + 1}</td>
                    {columns.map(c => {
                      const open = editing && editing.rowId === row.id && editing.key === c.key;
                      return (
                        <td key={c.key} style={td}>
                          {open ? (
                            <input autoFocus value={draft} onChange={e => setDraft(e.target.value)}
                              onBlur={() => commit(row, c)}
                              onKeyDown={e => {
                                if (e.key === 'Enter') { e.preventDefault(); commit(row, c); }
                                if (e.key === 'Escape') setEditing(null);
                              }}
                              dir="auto" style={{ height: 30, fontSize: 13, padding: '0 8px' }} />
                          ) : (
                            <div dir="auto" tabIndex={0}
                              onClick={() => { setEditing({ rowId: row.id, key: c.key }); setDraft(String(row.data[c.key] ?? '')); }}
                              style={{ minHeight: 24, display: 'flex', alignItems: 'center', padding: '2px 6px', margin: '-2px -6px', borderRadius: 6, cursor: 'text', fontFamily: c.type === 'number' || c.type === 'date' ? MONO : 'inherit' }}
                              onMouseEnter={e => { e.currentTarget.style.background = 'var(--bg-hover)'; }}
                              onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; }}>
                              {cellText(row.data[c.key], c.type) || <span style={{ color: 'var(--text-muted)' }}>—</span>}
                            </div>
                          )}
                        </td>
                      );
                    })}
                    <td style={td}>
                      <IconBtn danger title={L('Delete row', 'מחק שורה')} onClick={() => removeRow(row.id)}>{Icons.trash}</IconBtn>
                    </td>
                  </tr>
                ))}
                {!loading && rows.length === 0 && (
                  <tr><td colSpan={columns.length + 2} style={{ ...td, textAlign: 'center', color: 'var(--text-muted)', padding: 30 }}>
                    {query ? L('No row matches that search.', 'אין שורה שתואמת את החיפוש.') : L('No rows yet.', 'אין עדיין שורות.')}
                  </td></tr>
                )}
              </tbody>
            </table>
          </div>

          <button onClick={addRow} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 14px', borderTop: '1px solid var(--border)', color: 'var(--primary)', fontWeight: 650, fontSize: 12.5, width: '100%', background: 'transparent', flexShrink: 0 }}
            onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-panel)'}
            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
            {Icons.plus} {L('Add row', 'הוסף שורה')}
          </button>

          <div style={{ padding: '9px 14px', borderTop: '1px solid var(--border)', background: 'var(--bg-panel)', fontSize: 11.5, color: 'var(--text-muted)', display: 'flex', gap: 14, flexWrap: 'wrap', alignItems: 'center', flexShrink: 0 }}>
            <span>
              {readers.length
                ? <React.Fragment>{L('Read and written by', 'קוראים וכותבים')} {readers.map(a => <Chip key={a.id} tone="teal" style={{ marginInlineStart: 6 }}>{a.name}</Chip>)}</React.Fragment>
                : L('No AI Chatbot uses this yet — tick it in a chatbot’s Tables tab.', 'שום AI Chatbot לא משתמש בה עדיין — סמן אותה בטאב Tables של אחד מהם.')}
            </span>
            {rows.length > 0 && rows[rows.length - 1].updated_at && (
              <span style={{ marginInlineStart: 'auto' }}>
                {L('Last written by', 'נכתב לאחרונה על ידי')} <b style={{ color: 'var(--text-2)' }}>{writerName(rows[rows.length - 1].written_by)}</b>
              </span>
            )}
          </div>
        </div>

        {error && <div style={{ color: 'var(--danger)', fontSize: 12.5 }}>{error}</div>}

        {pendingDelete && (
          <ConfirmDialog
            title={L(`Delete "${table.name}"?`, `למחוק את "${table.name}"?`)}
            body={L('Every row goes with it, and any AI Chatbot that was reading it stops being able to. This cannot be undone.',
                    'כל השורות נמחקות איתה, וכל AI Chatbot שקרא ממנה מפסיק לקרוא. אין ביטול.')}
            confirmLabel={L('Delete table', 'מחק טבלה')}
            onConfirm={async () => { await apiDeleteTable(table.id); setPendingDelete(false); onChanged(); onBack(); }}
            onCancel={() => setPendingDelete(false)} />
        )}
      </div>
    );
  }

  function TablesView({ agents, onChanged }) {
    const [tables, setTables] = useState(null);
    const [openId, setOpenId] = useState(null);
    const [creating, setCreating] = useState(false);
    const [error, setError] = useState('');

    const load = useCallback(() => (
      apiListTables()
        .then(d => { setTables(d.tables || []); setError(''); })
        .catch(err => { setTables([]); setError(err.message); })
    ), []);
    useEffect(() => { load(); }, [load]);

    const open = (tables || []).find(t => t.id === openId);
    if (open) {
      return <TableSheet table={open} agents={agents} onBack={() => setOpenId(null)}
                onChanged={() => { load(); onChanged && onChanged(); }} />;
    }

    return (
      <div style={{ position: 'relative' }}>
        <PageHeader
          eyebrow={L('Shared knowledge', 'ידע משותף')}
          title="Tables"
          subtitle={L('Rows your AI Chatbots can read and write, shared across all of them',
                      'שורות שה-AI Chatbots שלך קוראים וכותבים, משותפות לכולם')}
          actions={<Btn variant="primary" icon={Icons.plus} onClick={() => setCreating(true)}>{L('New table', 'טבלה חדשה')}</Btn>}
        />

        {error && <div style={{ color: 'var(--danger)', fontSize: 12.5, marginBottom: 14 }}>{error}</div>}

        {tables === null ? (
          <div style={{ color: 'var(--text-muted)', fontSize: 13 }}>{L('Loading…', 'טוען…')}</div>
        ) : tables.length === 0 ? (
          <EmptyState icon="▤" title={L('No tables yet', 'אין עדיין טבלאות')}
            subtitle={L('A table is rows every AI Chatbot you tick can read and add to — a price list, orders, leads. Make one here, or ask the assistant for it.',
                        'טבלה היא שורות שכל AI Chatbot שתסמן יכול לקרוא ולהוסיף אליהן — מחירון, הזמנות, לידים. צור אחת כאן, או בקש מהאסיסטנט.')} />
        ) : (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(330px,1fr))', gap: 16 }}>
            {tables.map(t => {
              const readers = (agents || []).filter(a => (a.tables || []).includes(t.id));
              return (
                <div key={t.id} onClick={() => setOpenId(t.id)} style={{
                  background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 'var(--r-lg)',
                  padding: '16px 18px', display: 'flex', flexDirection: 'column', gap: 12, cursor: 'pointer',
                }}
                  onMouseEnter={e => { e.currentTarget.style.borderColor = 'rgba(239,159,39,0.35)'; e.currentTarget.style.boxShadow = 'var(--shadow)'; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.boxShadow = 'none'; }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0 }}>
                    <div style={{ width: 34, height: 34, borderRadius: 10, flexShrink: 0, background: 'var(--teal-dim)', color: 'var(--teal)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      {Icons.database}
                    </div>
                    <div style={{ minWidth: 0 }}>
                      <div dir="auto" style={{ fontWeight: 700, fontSize: 15, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{t.name}</div>
                      <div style={{ fontSize: 11.5, color: 'var(--text-muted)', marginTop: 2 }}>{plural(t.row_count, L('row', 'שורה'))}</div>
                    </div>
                  </div>
                  {t.description && (
                    <div dir="auto" style={{ fontSize: 12, color: 'var(--text-2)', lineHeight: 1.6 }}>{t.description}</div>
                  )}
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
                    {(t.columns || []).slice(0, 6).map(c => (
                      <span key={c.key} style={{ fontFamily: MONO, fontSize: 11, padding: '3px 8px', borderRadius: 999, background: 'var(--bg-panel)', border: '1px solid var(--border)', color: 'var(--text-2)' }}>
                        {c.name} <span style={{ color: 'var(--text-muted)' }}>{c.type}</span>
                      </span>
                    ))}
                    {(t.columns || []).length > 6 && (
                      <span style={{ fontSize: 11, color: 'var(--text-muted)', alignSelf: 'center' }}>+{t.columns.length - 6}</span>
                    )}
                  </div>
                  <div style={{ borderTop: '1px solid var(--border)', paddingTop: 11, fontSize: 11.5, color: 'var(--text-muted)', display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                    {readers.length
                      ? <React.Fragment>{L('Used by', 'בשימוש')} {readers.slice(0, 3).map(a => <Chip key={a.id} tone="teal">{a.name}</Chip>)}</React.Fragment>
                      : L('Not used by any AI Chatbot yet', 'עדיין לא בשימוש')}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {creating && (
          <NewTableDialog
            onCancel={() => setCreating(false)}
            onCreate={async spec => {
              const made = await apiCreateTable(spec);
              setCreating(false);
              await load();
              setOpenId(made.id);
              onChanged && onChanged();
            }} />
        )}
      </div>
    );
  }

  /** Which tables one AI Chatbot may read and write. */
  function AgentTablesTab({ agent, onUpdate }) {
    const [tables, setTables] = useState(null);
    useEffect(() => { apiListTables().then(d => setTables(d.tables || [])).catch(() => setTables([])); }, []);

    const ticked = agent.tables || [];
    function toggle(id) {
      const next = ticked.includes(id) ? ticked.filter(x => x !== id) : [...ticked, id];
      onUpdate({ ...agent, tables: next });
    }

    return (
      <div style={{ maxWidth: 720 }}>
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 4 }}>
            {L('Which tables this AI Chatbot can use', 'אילו טבלאות ה-AI Chatbot הזה יכול להשתמש בהן')}
          </div>
          <div style={{ fontSize: 12.5, color: 'var(--text-muted)', lineHeight: 1.65 }}>
            {L('It can read from and write to the ones you tick, in any conversation — the website widget, WhatsApp and the test chat alike. It can never delete a row.',
               'הוא קורא וכותב לאלה שתסמן, בכל שיחה — בווידג׳ט באתר, בוואטסאפ ובצ׳אט הבדיקה. הוא לעולם לא מוחק שורה.')}
          </div>
        </div>

        {tables === null ? (
          <div style={{ color: 'var(--text-muted)', fontSize: 13 }}>{L('Loading…', 'טוען…')}</div>
        ) : tables.length === 0 ? (
          <EmptyState icon="▤" title={L('No tables yet', 'אין עדיין טבלאות')}
            subtitle={L('Make one in the Tables tab first, then come back and tick it here.',
                        'צור אחת בטאב Tables, ואז חזור לכאן וסמן אותה.')} />
        ) : (
          <React.Fragment>
            {tables.map(t => {
              const on = ticked.includes(t.id);
              return (
                <button key={t.id} onClick={() => toggle(t.id)} style={{
                  display: 'flex', alignItems: 'center', gap: 12, width: '100%', textAlign: 'start',
                  padding: '11px 12px', borderRadius: 'var(--r-md)', marginBottom: 8,
                  border: `1px solid ${on ? 'rgba(239,159,39,0.45)' : 'var(--border)'}`,
                  background: on ? 'rgba(239,159,39,0.06)' : 'var(--bg-panel)',
                }}>
                  <span style={{
                    width: 18, height: 18, borderRadius: 5, flexShrink: 0, fontSize: 11, fontWeight: 800,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    border: `1.5px solid ${on ? 'var(--primary)' : 'var(--border)'}`,
                    background: on ? 'var(--primary)' : 'var(--bg-card)', color: '#0a0a0a',
                  }}>{on ? '✓' : ''}</span>
                  <span style={{ flex: 1, minWidth: 0 }}>
                    <span dir="auto" style={{ display: 'block', fontWeight: 650, fontSize: 13.5, color: 'var(--text)' }}>{t.name}</span>
                    <span style={{ display: 'block', fontSize: 11.5, color: 'var(--text-muted)', marginTop: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                      {plural(t.row_count, L('row', 'שורה'))} · {(t.columns || []).map(c => c.name).join(', ')}
                    </span>
                  </span>
                </button>
              );
            })}
            {ticked.length > 0 && (
              <div style={{ marginTop: 14, padding: '11px 13px', borderRadius: 'var(--r-md)', background: 'var(--bg-panel)', border: '1px solid var(--border)', fontSize: 12, color: 'var(--text-2)', lineHeight: 1.7 }}>
                {L('With one ticked, this AI Chatbot gets four tools it can call mid-conversation:', 'כשמסומנת טבלה, ה-AI Chatbot מקבל ארבעה כלים שהוא יכול לקרוא להם תוך כדי שיחה:')}{' '}
                <code style={{ fontFamily: MONO, color: 'var(--teal)' }}>table_list</code>,{' '}
                <code style={{ fontFamily: MONO, color: 'var(--teal)' }}>table_find</code>,{' '}
                <code style={{ fontFamily: MONO, color: 'var(--teal)' }}>table_add_row</code>{' '}
                {L('and', 'ו-')}{' '}
                <code style={{ fontFamily: MONO, color: 'var(--teal)' }}>table_update_row</code>.{' '}
                {L('Say in its prompt when to use them, or it will decide for itself.', 'כתוב בפרומפט שלו מתי להשתמש בהם, אחרת הוא יחליט בעצמו.')}
              </div>
            )}
          </React.Fragment>
        )}
      </div>
    );
  }

  function AgentListView({ agents, onNew, onEdit, onTest, onDuplicate, onDelete, onExport, onBuildInChat }) {
    const [query, setQuery]   = useState('');
    const [branch, setBranch] = useState('');
    const [channel, setChannel] = useState('');
    /* The chosen shape of the list outlives the session — it is a preference,
       not state. */
    const [view, setView] = useState(() => localStorage.getItem('agentforge_agents_view') || 'grid');
    function pickView(v) { setView(v); localStorage.setItem('agentforge_agents_view', v); }

    const branches = Array.from(new Set(agents.map(agentBranch))).sort();
    const channels = Array.from(new Set(agents.map(agentChannel))).sort();

    const shown = agents.filter(a =>
      (!query || a.name.toLowerCase().includes(query.toLowerCase())) &&
      (!branch || agentBranch(a) === branch) &&
      (!channel || agentChannel(a) === channel));

    const cardProps = a => ({
      key: a.id, agent: a, isNew: a._isNew,
      onEdit: () => onEdit(a.id),
      onTest: () => onTest(a.id),
      onDuplicate: () => onDuplicate(a.id),
      onDelete: () => onDelete(a.id),
      onExport: () => onExport(a.id),

      const on = view === id;

          style={{
            width: 34, height: 34, display: 'flex', alignItems: 'center', justifyContent: 'center',
            borderRadius: 8, cursor: 'pointer',

            color: on ? 'var(--sel-ink)' : 'var(--text-muted)',

          }}>{icon}</button>

    };

    return (
      <div style={{ position: 'relative', height: '100%' }}>
        <PageHeader
          eyebrow="AI Chatbot studio"
          title="AI Chatbots"
          actions={
            <React.Fragment>
              {/* The moment someone wants an agent is the moment to mention
                  that something here can build one for them. */}
              <Btn icon={Icons.sparkle}
                title="Let the assistant build an AI Chatbot for you"
                onClick={() => onBuildInChat(NEW_AGENT_ASK())}>
                Build with the assistant

              <Btn variant="primary" icon={Icons.plus} onClick={onNew}>New AI Chatbot</Btn>
            </React.Fragment>
          }
        />

        {agents.length > 0 && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 20, flexWrap: 'wrap' }}>
            <SearchField value={query} onChange={setQuery} placeholder="Search AI Chatbots" style={{ maxWidth: 300 }} />
            <SelectPill value={branch} onChange={setBranch} icon={Icons.branch}
              placeholder="All branches" width={172}
              options={branches.map(b => ({ value: b, label: b }))} />
            <SelectPill value={channel} onChange={setChannel} icon={Icons.filter}
              placeholder="All channels" width={168}
              options={channels.map(c => ({ value: c, label: c }))} />
            <div style={{ marginInlineStart: 'auto', display: 'flex', alignItems: 'center', gap: 14 }}>
              <CountLabel n={shown.length} noun="AI CHATBOT" />
              <div style={{ display: 'flex', gap: 2, padding: 3, borderRadius: 10, background: 'var(--bg-panel)', border: '1px solid var(--border)' }}>
                {viewBtn('grid', Icons.grid, 'Grid')}
                {viewBtn('rows', Icons.rows, 'List')}
              </div>
            </div>
          </div>
        )}

        {agents.length === 0 ? (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16, padding: '64px 48px', background: 'var(--bg-card)', borderRadius: 'var(--r-xl)', border: '1px dashed var(--border)' }}>
            <div style={{ width: 56, height: 56, borderRadius: 16, background: 'var(--bg-panel)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-muted)' }}>
              {Icons.bot}
            </div>
            <div>
              <div style={{ color: 'var(--text)', fontWeight: 700, fontSize: 15, textAlign: 'center', marginBottom: 6 }}>No AI Chatbots yet</div>
              <div style={{ color: 'var(--text-muted)', fontSize: 13, textAlign: 'center', lineHeight: 1.6 }}>
                Not sure where to start? Describe what you want in plain words<br />and the assistant will build the agent for you.
              </div>
            </div>
            <Btn variant="primary" icon={Icons.sparkle}
              onClick={() => onBuildInChat(FIRST_AGENT_ASK())}>
              Build my first AI Chatbot with the assistant
            </Btn>
            <div style={{ color: 'var(--text-muted)', fontSize: 12 }}>or press “New AI Chatbot” to build it yourself</div>
          </div>
        ) : view === 'grid' ? (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(358px,1fr))', gap: 16 }}>
            {/* Searching is looking for something that exists — the tile for
                making a new one only gets in the way then. */}
            {!query && !branch && !channel && (
              <NewAgentTile onNew={onNew} onAssistant={() => onBuildInChat(NEW_AGENT_ASK())} />
            )}
            {shown.map(a => <AgentCard {...cardProps(a)} />)}
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {shown.map(a => <AgentRow {...cardProps(a)} />)}
          </div>
        )}

        {agents.length > 0 && shown.length === 0 && (
          <div style={{ marginTop: 18, padding: '28px 20px', textAlign: 'center', color: 'var(--text-muted)', fontSize: 13, background: 'var(--bg-card)', border: '1px dashed var(--border)', borderRadius: 'var(--r-lg)' }}>
            No AI Chatbot matches this search.
          </div>
        )}
      </div>
