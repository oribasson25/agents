  function PlatformAssistantView({ agents, onAgentsChanged, language, compact, seed }) {
    const [messages, setMessages] = useState([]);   // { id, role: user|assistant|tool|error, … }
    const [input, setInput] = useState('');
    const [pending, setPending] = useState(false);
    const listRef = useRef(null);
    const sessionIdRef = useRef(uid());
    const agentsRef = useRef(agents);
    useEffect(() => { agentsRef.current = agents; }, [agents]);

    useEffect(() => {
      if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
    }, [messages, pending]);

    // A question handed in from outside (an example chip, or "build with the
    // assistant") is asked straight away. The nonce is what makes a repeat of
    // the same text ask again.
    const seededRef = useRef(null);
    useEffect(() => {
      if (!seed || !seed.text || seed.nonce === seededRef.current) return;
      seededRef.current = seed.nonce;
      if (accountApiUsable()) send(seed.text);
      else setInput(seed.text);
    }, [seed]);

    const noKey = !accountApiUsable();

    function persist(all) {
      const real = all.filter(m => m.role === 'user' || m.role === 'assistant' || m.role === 'tool');
      if (!real.some(m => m.role === 'user')) return;
      saveAssistantSession({
        id: sessionIdRef.current,
        kind: 'platform',
        subject: '',
        title: (real.find(m => m.role === 'user') || {}).content || '',
        messages: real.map(m => m.role === 'tool'
          ? { role: 'tool', name: m.name, input: m.input, result: m.result }
          : { role: m.role, content: m.content }),
      });
    }

    function startNewChat() {
      setMessages([]);
      setInput('');
      sessionIdRef.current = uid();
    }

    function findAgent(id) {
      return (agentsRef.current || []).find(a => a.id === id) || null;
    }

    function toolShape(tool) {
      return {
        id: uid(),
        name: tool.name || 'new_tool',
        description: tool.description || '',
        parameters: (tool.parameters || []).filter(p => p && p.name).map(p => ({
          name: p.name,
          type: PARAM_TYPES.includes((p.type || '').toLowerCase()) ? p.type.toLowerCase() : 'string',
          description: p.description || '',
        })),
        packages: tool.packages || '',
        envVars: [],
        code: tool.code || DEFAULT_TOOL_CODE,
      };
    }

    function skillShape(skill) {
      return { id: uid(), name: skill.name || 'New Skill', description: skill.description || '', prompt: skill.prompt || '' };
    }

    async function execute(name, input) {
      const step = { id: uid(), role: 'tool', name, input };
      setMessages(m => [...m, step]);
      const done = (result) => {
        setMessages(m => m.map(x => x.id === step.id ? { ...x, result } : x));
        return result;
      };

      try {
        if (name === 'list_agents') {
          const list = (agentsRef.current || []).map(a => ({
            id: a.id, name: a.name, opening_message: a.openingMessage,
            skills: (a.skills || []).map(s => s.name),
            tools: (a.tools || []).map(t => t.name),
            email_enabled: !!a.emailEnabled,
            whatsapp_enabled: !!(a.whatsapp && a.whatsapp.enabled),
          }));
          return done(JSON.stringify(list, null, 1));
        }

        if (name === 'get_agent') {
          const agent = findAgent(input.agent_id);
          if (!agent) return done(`No agent with id ${input.agent_id}. Call list_agents.`);
          return done(JSON.stringify(stripUiFields(agent), null, 1));
        }

        if (name === 'create_agent') {
          const created = makeAgent({
            name: input.name || 'New Agent',
            avatar: input.avatar || DEFAULT_AVATAR,
            basePrompt: input.base_prompt || '',
            openingMessage: input.opening_message || 'Hello! How can I help you today?',
            skills: (input.skills || []).map(skillShape),
            tools: (input.tools || []).map(toolShape),
          });
          await apiCreate(created);
          await onAgentsChanged();
          return done(`Created agent "${created.name}" with id ${created.id}.`);
        }

        if (name === 'update_agent') {
          const agent = findAgent(input.agent_id);
          if (!agent) return done(`No agent with id ${input.agent_id}. Call list_agents.`);
          const updated = { ...stripUiFields(agent) };
          if (input.name !== undefined) updated.name = input.name;
          if (input.avatar !== undefined) updated.avatar = input.avatar;
          if (input.base_prompt !== undefined) updated.basePrompt = input.base_prompt;
          if (input.opening_message !== undefined) updated.openingMessage = input.opening_message;
          if (input.email_enabled !== undefined) updated.emailEnabled = !!input.email_enabled;
          if (input.dlp_credit_card !== undefined || input.dlp_israeli_id !== undefined) {
            updated.dlp = {
              ...(agent.dlp || {}),
              ...(input.dlp_credit_card !== undefined ? { creditCard: !!input.dlp_credit_card } : {}),
              ...(input.dlp_israeli_id !== undefined ? { israeliId: !!input.dlp_israeli_id } : {}),
            };
          }
          if (input.skills !== undefined) {
            updated.skills = (input.skills || []).map(s => {
              const existing = (agent.skills || []).find(x => x.name === s.name);
              return { ...skillShape(s), id: existing ? existing.id : uid(), ...(existing ? { prompt: s.prompt !== undefined ? s.prompt : existing.prompt, description: s.description !== undefined ? s.description : existing.description } : {}) };
            });
          }
          if (input.tools !== undefined) {
            updated.tools = (input.tools || []).map(t => {
              const existing = (agent.tools || []).find(x => x.name === t.name);
              const shaped = toolShape(t);
              return existing
                ? { ...existing, ...shaped, id: existing.id, envVars: existing.envVars || [], code: t.code !== undefined ? t.code : existing.code }
                : shaped;
            });
          }
          await apiUpdate(updated);
          await onAgentsChanged();
          const touched = Object.keys(input).filter(k => k !== 'agent_id');
          return done(`Updated "${updated.name}" (${touched.join(', ') || 'nothing'}).`);
        }

        if (name === 'delete_agent') {
          const agent = findAgent(input.agent_id);
          if (!agent) return done(`No agent with id ${input.agent_id}.`);
          const ok = window.confirm(`למחוק את הסוכן "${agent.name}" וכל מה ששייך לו?\n\nDelete the agent "${agent.name}" and everything it owns?`);
          if (!ok) return done('The user declined the deletion. Nothing was deleted.');
          await apiDelete(agent.id);
          await onAgentsChanged();
          return done(`Deleted "${agent.name}".`);
        }

        if (name === 'run_tool') {
          const agent = findAgent(input.agent_id);
          if (!agent) return done(`No agent with id ${input.agent_id}.`);
          const tool = (agent.tools || []).find(t => t.name === input.tool_name);
          if (!tool) return done(`Agent "${agent.name}" has no tool named ${input.tool_name}.`);
          const resp = await fetch('/api/run-tool', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              code: tool.code || '',
              inputs: input.inputs || {},
              packages: (tool.packages || '').split(',').map(x => x.trim()).filter(Boolean),
              env_vars: Object.fromEntries((tool.envVars || []).filter(e => e.key).map(e => [e.key, e.value])),
            }),
          });
          const data = await resp.json();
          return done(data.error ? `Error: ${data.error}` : `Output: ${data.result}`);
        }

        if (name === 'get_recent_errors') {
          const limit = Math.min(Math.max(parseInt(input.limit, 10) || 15, 1), 50);
          const server = await fetchServerErrors({ agentId: input.agent_id || '', source: input.source || '', limit });
          const local = sessionErrors({ agentId: input.agent_id || null, limit }).filter(e => !input.source || e.source === input.source);
          if (server.length === 0 && local.length === 0) {
            return done('No failures recorded. Note this only covers the last 14 days on the server plus this browser session.');
          }
          return done([
            `From the server (widget, WhatsApp, tools in production) — ${server.length}:`,
            formatErrors(server),
            '',
            `From this browser session (test runs, provider errors) — ${local.length}:`,
            formatErrors(local),
          ].join('\n'));
        }

        if (name === 'get_test_conversations') {
          const data = await apiListTestSessions(input.agent_id, {
            q: input.search || '',
            limit: Math.min(Math.max(parseInt(input.limit, 10) || 5, 1), 20),
          });
          const rows = data.sessions || [];
          if (rows.length === 0) return done('No manual test conversations for that agent yet.');
          return done(formatTestConversations(rows, 20));
        }

        if (name === 'list_interactions') {
          const data = await apiListInteractions({
            agentId: input.agent_id || '',
            q: input.search || '',
            limit: Math.min(Math.max(parseInt(input.limit, 10) || 10, 1), 50),
          });
          const rows = (data.sessions || []).map(s => ({
            agent: s.agent_name, channel: s.source,
            started: s.started_at, duration_seconds: s.duration_seconds,
            messages: s.message_count,
            first_user_message: ((s.messages || []).find(m => m.role === 'user') || {}).content || '',
          }));
          return done(JSON.stringify({ total: data.total, showing: rows.length, conversations: rows }, null, 1));
        }

        return done(`Unknown tool: ${name}`);
      } catch (err) {
        return done(`Error: ${err.message}`);
      }
    }

    async function send(text) {
      const question = (text || '').trim();
      if (!question || pending || noKey) return;
      setInput('');
      const history = [
        ...messages.filter(m => m.role === 'user' || m.role === 'assistant').map(m => ({ role: m.role, content: m.content })),
        { role: 'user', content: question },
      ];
      setMessages(m => [...m, { id: uid(), role: 'user', content: question }]);
      setPending(true);
      try {
        const reply = await callWithToolDefs({
          system: buildPlatformAssistantPrompt(agentsRef.current, language),
          history,
          tools: PLATFORM_TOOLS,
          execute,
        });
        setMessages(m => {
          const next = [...m, { id: uid(), role: 'assistant', content: reply || '—' }];
          persist(next);
          return next;
        });
      } catch (err) {
        recordError('assistant', err.message, { kind: 'platform' });
        setMessages(m => [...m, { id: uid(), role: 'error', content: err.message }]);
      } finally {
        setPending(false);
      }
    }

    const opening = PLATFORM_OPENING[language === 'en' ? 'en' : 'he'];
    const dir = language === 'en' ? 'ltr' : 'rtl';

    return (
      <div style={{ display: 'flex', flexDirection: 'column', height: '100%', minHeight: compact ? 0 : 560, maxWidth: compact ? 'none' : 900 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: compact ? 10 : 16, flexShrink: 0 }}>
          {!compact && <div style={{ width: 38, height: 38, borderRadius: 11, background: 'var(--primary-dim)', border: '1px solid rgba(239,159,39,0.3)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--primary)' }}>{Icons.sparkle}</div>}
          <div style={{ flex: 1, minWidth: 0 }}>
            {!compact && <div style={{ fontWeight: 800, fontSize: 22, letterSpacing: '-0.02em' }}>Assistant</div>}
            <div style={{ fontSize: compact ? 11 : 12, color: 'var(--text-muted)', marginTop: compact ? 0 : 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {language === 'en' ? 'Operates the platform for you' : 'מתפעל את המערכת בשבילך'} · {accountApi().model || 'no model'}
            </div>
          </div>
          {messages.length > 0 && (
            <button onClick={startNewChat}
              style={{ fontSize: 11.5, fontWeight: 600, padding: '5px 11px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: 'var(--text-2)', flexShrink: 0 }}>
              {language === 'en' ? 'New chat' : 'שיחה חדשה'}
            </button>
          )}
        </div>

        {noKey && (
          <div style={{ background: 'rgba(245,158,11,0.12)', border: '1px solid rgba(245,158,11,0.35)', borderRadius: 'var(--r-md)', padding: '10px 14px', fontSize: 13, color: 'var(--warning)', marginBottom: 12 }}>
            {language === 'en'
              ? 'Set an API key in Settings to use the assistant.'
              : 'כדי להשתמש באסיסטנט צריך להגדיר מפתח API במסך Settings.'}
          </div>
        )}

        <div ref={listRef} style={{ flex: 1, minHeight: 0, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 12, padding: '4px 2px' }}>
          <div dir={dir} style={{ background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 'var(--r-lg)', padding: '14px 16px', fontSize: 13, lineHeight: 1.75, whiteSpace: 'pre-wrap', color: 'var(--text-2)' }}>
            {opening}
          </div>

          {messages.map(msg => {
            if (msg.role === 'user') {
              return (
                <div key={msg.id} dir="auto" style={{ alignSelf: 'flex-end', maxWidth: '85%', background: 'var(--primary)', color: '#0a0a0a', padding: '9px 13px', borderRadius: '16px 16px 4px 16px', fontSize: 13.5, whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>
                  {msg.content}
                </div>
              );
            }
            if (msg.role === 'tool') {
              const args = Object.entries(msg.input || {})
                .map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : String(v)}`)
                .join(', ');
              return (
                <div key={msg.id} dir="ltr" style={{ alignSelf: 'stretch', background: 'var(--bg-panel)', border: '1px solid var(--border)', borderRadius: 'var(--r-md)', padding: '8px 12px', fontSize: 11.5, fontFamily: "'JetBrains Mono','Fira Code',monospace", color: 'var(--text-muted)' }}>
                  <div style={{ color: 'var(--teal)' }}>🔧 {msg.name}({args.length > 160 ? args.slice(0, 160) + '…' : args})</div>
                  {msg.result !== undefined && (
                    <div style={{ marginTop: 4, whiteSpace: 'pre-wrap', wordBreak: 'break-word', maxHeight: 160, overflowY: 'auto' }}>
                      {msg.result.length > 1200 ? msg.result.slice(0, 1200) + '…' : msg.result}
                    </div>
                  )}
                </div>
              );
            }
            if (msg.role === 'error') {
              return (
                <div key={msg.id} style={{ background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.3)', color: 'var(--danger)', padding: '9px 13px', borderRadius: 'var(--r-md)', fontSize: 12.5, wordBreak: 'break-word' }}>
                  {msg.content}
                </div>
              );
            }
            return (
              <div key={msg.id} dir="auto" style={{ alignSelf: 'stretch', background: 'var(--bg-card)', border: '1px solid var(--border)', padding: '11px 14px', borderRadius: '16px 16px 16px 4px', fontSize: 13.5, lineHeight: 1.7, whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>
                {msg.content}
              </div>
            );
          })}

          {pending && <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{language === 'en' ? 'Working…' : 'עובד…'}</div>}
        </div>

        <div style={{ display: 'flex', gap: 8, marginTop: 12, flexShrink: 0 }}>
          <textarea
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input); } }}
            dir="auto"
            rows={2}
            disabled={pending || noKey}
            placeholder={language === 'en' ? 'Ask for anything — build an agent, change one, or ask how something works…' : 'בקש כל דבר — לבנות סוכן, לשנות סוכן, או לשאול איך משהו עובד…'}
            style={{ flex: 1, resize: 'none', fontSize: 13.5, padding: '10px 14px', borderRadius: 'var(--r-md)' }}
          />
          <button onClick={() => send(input)} disabled={pending || noKey || !input.trim()}
            style={{ background: 'var(--primary)', color: '#0a0a0a', padding: '0 18px', borderRadius: 'var(--r-md)', fontWeight: 700, fontSize: 17, opacity: pending || noKey || !input.trim() ? 0.5 : 1 }}>➤</button>
        </div>
      </div>
    );
  }

  /* ─────────────────── FLOATING ASSISTANT ─────────────────── */
  // The platform assistant follows you across every screen: a bubble that
  // expands into a chat and collapses back, so you can ask it to change
  // something while looking at the thing you want changed.
  // Remembered once, forever: the intro card and the attention ring are a
  // first-visit thing, never a welcome mat you have to push aside every time.
  const ASSISTANT_INTRO_KEY = 'agentforge_assistant_intro_v1';

  function introSeen() {
    try { return localStorage.getItem(ASSISTANT_INTRO_KEY) === '1'; } catch (e) { return true; }
  }
  function markIntroSeen() {
    try { localStorage.setItem(ASSISTANT_INTRO_KEY, '1'); } catch (e) { /* private mode */ }
  }

  /** Anything on screen can hand the assistant a question and pop it open. */
  function askAssistant(prompt) {
    window.dispatchEvent(new CustomEvent('assistant:ask', { detail: { prompt: prompt || '' } }));
  }

  const ASSISTANT_INTRO = {
    he: {
      label: 'שאל את האסיסטנט',
      title: 'האסיסטנט מתפעל את המערכת בשבילך',
      lines: [
        'בונה סוכן שלם מאפס — פרומפט, סקילים וכלים',
        'משנה סוכן קיים, כותב כלי Python ומריץ אותו כדי לבדוק',
        'עונה על כל שאלה על הפלטפורמה ומראה מה קרה בשיחות',
      ],
      examples: ['בנה לי סוכן שירות לקוחות', 'איך מחברים WhatsApp?'],
      dismiss: 'הבנתי',
    },
    en: {
      label: 'Ask the assistant',
      title: 'The assistant operates the platform for you',
      lines: [
        'Builds a whole agent from scratch — prompt, skills and tools',
        'Changes an existing agent, writes a Python tool and runs it to check',
        'Answers any question about the platform and shows what happened in conversations',
      ],
      examples: ['Build me a customer support agent', 'How do I connect WhatsApp?'],
      dismiss: 'Got it',
    },
  };

  /**
   * The first-visit card above the assistant button. It exists because a bare
   * orange circle in the corner tells you nothing about what it can do.
   */
  function AssistantIntroCard({ copy, ltr, onPick, onDismiss }) {
    return (
      <div className="fade-in" dir={ltr ? 'ltr' : 'rtl'} style={{
        position: 'fixed', bottom: 92, right: 24, zIndex: 200,
        width: 'min(340px, calc(100vw / var(--ui-zoom) - 32px))',
        background: 'var(--bg-sidebar)', border: '1px solid var(--primary)',
        borderRadius: 'var(--r-lg)', padding: '15px 16px 14px',
        boxShadow: '0 12px 40px rgba(0,0,0,0.45), 0 0 0 4px var(--primary-glow)',
      }}>
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 9, marginBottom: 9 }}>
          <span style={{ display: 'flex', color: 'var(--primary)', flexShrink: 0, marginTop: 1 }}>{Icons.sparkle}</span>
          <div style={{ flex: 1, fontWeight: 800, fontSize: 14, lineHeight: 1.45 }}>{copy.title}</div>
          <button onClick={onDismiss} title={copy.dismiss}
            style={{ background: 'none', border: 'none', color: 'var(--text-muted)', fontSize: 16, lineHeight: 1, padding: 0, flexShrink: 0 }}>×</button>
        </div>
        <ul style={{ margin: 0, padding: ltr ? '0 0 0 18px' : '0 18px 0 0', fontSize: 12.5, lineHeight: 1.65, color: 'var(--text-2)' }}>
          {copy.lines.map(line => <li key={line} style={{ marginBottom: 2 }}>{line}</li>)}
        </ul>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginTop: 12 }}>
          {copy.examples.map(ex => (
            <button key={ex} onClick={() => onPick(ex)}
              style={{ background: 'var(--bg-card)', border: '1px solid var(--border)', color: 'var(--text-2)', borderRadius: 999, padding: '5px 11px', fontSize: 12, fontWeight: 600, textAlign: 'start' }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--primary)'; e.currentTarget.style.color = 'var(--text)'; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.color = 'var(--text-2)'; }}
            >{ex}</button>
          ))}
        </div>
        <div style={{
          position: 'absolute', bottom: -7, [ltr ? 'left' : 'right']: 28,
          width: 12, height: 12, background: 'var(--bg-sidebar)',
          borderRight: '1px solid var(--primary)', borderBottom: '1px solid var(--primary)',
          transform: 'rotate(45deg)',
        }} />
      </div>
    );
  }

  function FloatingAssistant({ agents, onAgentsChanged, language }) {
    const [open, setOpen] = useState(false);
    const [intro, setIntro] = useState(false);
    const [seed, setSeed] = useState(null);
    const copy = ASSISTANT_INTRO[language === 'en' ? 'en' : 'he'];

    // The card arrives a beat after the page settles, so it reads as a hint
    // rather than as something blocking the screen you just asked for.
    useEffect(() => {
      if (introSeen()) return;
      const t = setTimeout(() => setIntro(true), 900);
      return () => clearTimeout(t);
    }, []);

    function reveal(prompt) {
      markIntroSeen();
      setIntro(false);
      setOpen(true);
      if (prompt) setSeed({ text: prompt, nonce: uid() });
    }

    function dismissIntro() {
      markIntroSeen();
      setIntro(false);
    }

    // "Build with the assistant" and the example chips reach it from anywhere.
    useEffect(() => {
      const onAsk = e => reveal((e.detail || {}).prompt);
      window.addEventListener('assistant:ask', onAsk);
      return () => window.removeEventListener('assistant:ask', onAsk);
    }, []);

    return (
      <React.Fragment>
        {open && (
          <div className="slide-in-right" style={{
            position: 'fixed', bottom: 92, right: 24, zIndex: 200,
            width: 'min(430px, calc(100vw / var(--ui-zoom) - 32px))', height: 'min(640px, calc(100vh / var(--ui-zoom) - 140px))',
            background: 'var(--bg-sidebar)', border: '1px solid var(--border)',
            borderRadius: 'var(--r-lg)', boxShadow: '0 12px 40px rgba(0,0,0,0.45)',
            display: 'flex', flexDirection: 'column', overflow: 'hidden',
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '11px 14px', borderBottom: '1px solid var(--border)', background: 'var(--bg-panel)', flexShrink: 0 }}>
              <span style={{ display: 'flex', color: 'var(--primary)' }}>{Icons.sparkle}</span>
              <div style={{ flex: 1, fontWeight: 700, fontSize: 14 }}>Assistant</div>
              <IconBtn onClick={() => setOpen(false)} title={language === 'en' ? 'Collapse' : 'לקפל'}>▾</IconBtn>
            </div>
            <div style={{ flex: 1, minHeight: 0, padding: '12px 14px 14px', display: 'flex', flexDirection: 'column' }}>
              <PlatformAssistantView
                compact
                seed={seed}
                agents={agents}
                language={language}
                onAgentsChanged={onAgentsChanged}
              />
            </div>
          </div>
        )}

        {/* First visit only: says what the thing in the corner actually is. */}
        {intro && !open && (
          <AssistantIntroCard copy={copy} ltr={language === 'en'} onPick={reveal} onDismiss={dismissIntro} />
        )}

        {/* A labelled pill, not a mystery circle — it only shrinks once it is open. */}
        <button
          onClick={() => { markIntroSeen(); setIntro(false); setOpen(v => !v); }}
          className={!open && intro ? 'assistant-ring' : undefined}
          title={open ? (language === 'en' ? 'Collapse the assistant' : 'לקפל את האסיסטנט') : copy.label}
          style={{
            position: 'fixed', bottom: 24, right: 24, zIndex: 200,
            height: 52, borderRadius: 999,
            padding: open ? 0 : '0 20px 0 17px',
            width: open ? 52 : 'auto',
            background: 'var(--primary)', color: '#0a0a0a',
            border: 'none', fontSize: open ? 22 : 14, fontWeight: 700,
            boxShadow: '0 6px 22px var(--primary-glow)',
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 9,
            whiteSpace: 'nowrap', transition: 'transform 0.15s',
          }}
          onMouseEnter={e => { e.currentTarget.style.transform = 'scale(1.04)'; }}
          onMouseLeave={e => { e.currentTarget.style.transform = 'none'; }}
        >
          {open ? '▾' : copy.label}
        </button>
      </React.Fragment>
    );
  }

  /* ─────────────────── ASSISTANT HISTORY ─────────────────── */
  const ASSISTANT_KINDS = {
    platform: { label: 'מערכת · Platform', short: 'Platform', tone: 'skills', color: 'var(--violet)' },
    tool:     { label: 'כלי · Tool',        short: 'Tool',     tone: 'tools',  color: 'var(--primary)' },
    skill:    { label: 'סקיל · Skill',      short: 'Skill',    tone: 'teal',   color: 'var(--teal)' },
  };

  function AssistantHistoryView({ onOpenAgent, stacked }) {
    const [kind, setKind] = useState('');
    const [query, setQuery] = useState('');
    const [data, setData] = useState(null);
    const [error, setError] = useState(null);
    const [loading, setLoading] = useState(true);
    const [open, setOpen] = useState(null);
    const [tick, setTick] = useState(0);

    useEffect(() => {
      let live = true;
      setLoading(true);
      const t = setTimeout(() => {
        apiListAssistantSessions({ kind, q: query, limit: 60 })
          .then(d => { if (live) { setData(d); setError(null); setLoading(false); } })
          .catch(err => { if (live) { setError(err.message); setLoading(false); } });
      }, 250);
      return () => { live = false; clearTimeout(t); };
    }, [kind, query, tick]);

    async function remove(session) {
      if (!window.confirm(`למחוק את השיחה הזאת מההיסטוריה?\n\nDelete this conversation from the history?`)) return;
      await deleteAssistantSession(session.id).catch(() => {});
      if (open && open.id === session.id) setOpen(null);
      setTick(t => t + 1);
    }

    /* ---- one conversation ---- */
    if (open) {
      const meta = ASSISTANT_KINDS[open.kind] || { label: open.kind, color: 'var(--text-2)' };
      const msgs = open.messages || [];
      return (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 22, flexWrap: 'wrap' }}>
            <button onClick={() => setOpen(null)} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13, border: '1px solid var(--border)' }}>← Back</button>
            <div style={{ width: 1, height: 20, background: 'var(--border)' }} />
            <div style={{ minWidth: 0 }}>
              <div style={{ fontWeight: 800, fontSize: 18, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 620 }}>
                {open.title || '(ללא כותרת)'}
              </div>
              <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 3 }}>
                <span style={{ color: meta.color, fontWeight: 700 }}>{meta.label}</span>
                {open.agent_name ? ` · ${open.agent_name}` : ''}
                {open.subject ? ` · ${open.subject}` : ''}
                {` · ${new Date(open.updated_at).toLocaleString()} · ${msgs.length} הודעות`}
              </div>
            </div>
            {open.agent_id && onOpenAgent && (
              <button onClick={() => onOpenAgent(open.agent_id)}
                style={{ marginLeft: 'auto', background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13, border: '1px solid var(--border)' }}>
                Open agent
              </button>
            )}
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, width: '100%' }}>
            {msgs.map((m, i) => {
              if (m.role === 'tool') {
                const args = Object.entries(m.input || {}).map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : String(v)}`).join(', ');
                return (
                  <div key={i} dir="ltr" style={{ background: 'var(--bg-panel)', border: '1px solid var(--border)', borderRadius: 'var(--r-md)', padding: '8px 12px', fontSize: 11.5, fontFamily: "'JetBrains Mono','Fira Code',monospace", color: 'var(--text-muted)' }}>
                    <div style={{ color: 'var(--teal)' }}>🔧 {m.name}({args.length > 200 ? args.slice(0, 200) + '…' : args})</div>
                    {m.result && <div style={{ marginTop: 4, whiteSpace: 'pre-wrap', wordBreak: 'break-word', maxHeight: 200, overflowY: 'auto' }}>{m.result}</div>}
                  </div>
                );
              }
              const isUser = m.role === 'user';
              return (
                <div key={i} dir="auto" style={{
                  alignSelf: isUser ? 'flex-end' : 'stretch', maxWidth: isUser ? '85%' : '100%',
                  background: isUser ? 'var(--primary)' : 'var(--bg-card)',
                  color: isUser ? '#0a0a0a' : 'var(--text)',
                  border: isUser ? 'none' : '1px solid var(--border)',
                  padding: '10px 13px', borderRadius: isUser ? '16px 16px 4px 16px' : '16px 16px 16px 4px',
                  fontSize: 13.5, lineHeight: 1.7, whiteSpace: 'pre-wrap', wordBreak: 'break-word',
                }}>
                  {m.content}
                  {m.applied && m.applied.length > 0 && (
                    <div style={{ fontSize: 11, color: 'var(--success)', marginTop: 6 }}>✓ נכתב לעורך ({m.applied.join(' + ')})</div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    /* ---- the list ---- */
    const sessions = data?.sessions || [];
    const scopes = [
      { id: '',         label: 'All' },
      { id: 'platform', label: 'Platform' },
      { id: 'tool',     label: 'Tools' },
      { id: 'skill',    label: 'Skills' },
    ];
    const th = { padding: '15px 16px 11px', textAlign: 'start', whiteSpace: 'nowrap' };
    const td = { padding: '12px 16px', fontSize: 13, verticalAlign: 'middle' };

    /* ---- phone: the same list as cards ---- */
    if (stacked) {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12 }}>
            <div style={{ fontWeight: 800, fontSize: 32, letterSpacing: '-0.035em' }}>Assistant</div>
            <CountLabel n={sessions.length} noun="CHAT" />
          </div>
          <Btn variant="primary" icon={Icons.sparkle} onClick={() => askAssistant('')}
               style={{ height: 48, fontSize: 14 }}>Ask the assistant</Btn>
          <SearchField value={query} onChange={setQuery} placeholder="Search all conversations" style={{ height: 48, flex: 'none' }} />
          <div className="m-scroll-x" style={{ display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 2 }}>
            {scopes.map(sc => (
              <Chip key={sc.id} onClick={() => setKind(sc.id)} tone={kind === sc.id ? 'tools' : 'neutral'}
                    style={{ height: 34, padding: '0 14px', fontSize: 12.5 }}>{sc.label}</Chip>
            ))}
          </div>
          {loading ? (
            <div style={{ color: 'var(--text-muted)', fontSize: 13, padding: 20, textAlign: 'center' }}>טוען…</div>
          ) : sessions.length === 0 ? (
            <div style={{ padding: '40px 20px', textAlign: 'center', background: 'var(--bg-card)', border: '1px dashed var(--border)', borderRadius: 'var(--r-lg)', color: 'var(--text-muted)', fontSize: 13 }}>
              עוד לא דיברת עם האסיסטנטים.
            </div>
          ) : sessions.map(sx => {
            const meta = ASSISTANT_KINDS[sx.kind] || { short: sx.kind, tone: 'neutral' };
            return (
              <button key={sx.id} onClick={() => setOpen(sx)}
                style={{ width: '100%', textAlign: 'left', display: 'flex', flexDirection: 'column', gap: 8, padding: '13px 14px', background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 16, color: 'var(--text)' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <Chip tone={meta.tone}>{meta.short}</Chip>
                  <span style={{ fontFamily: MONO, fontSize: 11, color: 'var(--text-muted)', flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {sx.agent_name ? `${sx.agent_name}${sx.subject ? ' · ' + sx.subject : ''}` : 'Workspace'}
                  </span>
                  <span style={{ fontFamily: MONO, fontSize: 11, color: 'var(--text-muted)' }}>{sx.message_count} msg</span>
                </div>
                <div dir="auto" style={{ fontSize: 13.5, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{sx.title || '(ללא כותרת)'}</div>
                <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>{new Date(sx.updated_at).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })}</div>
              </button>
            );
          })}
        </div>
      );
    }

    return (
      <div>
        <PageHeader
          eyebrow="Working with the builder"
          title="Assistant"
          actions={<Btn variant="primary" icon={Icons.sparkle} onClick={() => askAssistant('')}>Ask the assistant</Btn>}
        />

        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14, flexWrap: 'wrap' }}>
          <SegTabs items={scopes} value={kind} onChange={setKind} />
          <SearchField value={query} onChange={setQuery} placeholder="Search all conversations" style={{ maxWidth: 300 }} />
          <div style={{ marginInlineStart: 'auto' }}>
            <CountLabel n={sessions.length} noun="CONVERSATION" />
          </div>
        </div>

        {error ? (
          <div style={{ padding: 20, borderRadius: 'var(--r-lg)', border: '1px solid rgba(239,68,68,0.3)', background: 'rgba(239,68,68,0.08)', color: 'var(--danger)', fontSize: 13 }}>{error}</div>
        ) : loading ? (
          <div style={{ color: 'var(--text-2)', padding: 30 }}>טוען…</div>
        ) : sessions.length === 0 ? (
          <div style={{ textAlign: 'center', color: 'var(--text-muted)', padding: '60px 20px', fontSize: 14, background: 'var(--bg-card)', border: '1px dashed var(--border)', borderRadius: 'var(--r-lg)' }}>
            <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 12, color: 'var(--text-muted)' }}>{Icons.sparkle}</div>
            {query || kind ? 'אין שיחות שתואמות את הסינון.' : 'עוד לא דיברת עם האסיסטנטים. הכפתור "שאל את האסיסטנט" בפינה למטה פותח את הצ\'אט.'}
          </div>
        ) : (
          <div style={{ background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 'var(--r-lg)', overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 880 }}>
              <thead>
                <tr style={{ borderBottom: '1px solid var(--border)' }}>
                  <th style={th}><Eyebrow>Scope</Eyebrow></th>
                  <th style={th}><Eyebrow>Context</Eyebrow></th>
                  <th style={th}><Eyebrow>Started</Eyebrow></th>
                  <th style={th}><Eyebrow>Size</Eyebrow></th>
                  <th style={th}><Eyebrow>First message</Eyebrow></th>
                  <th style={{ ...th, width: 70 }} />
                </tr>
              </thead>
              <tbody>
                {sessions.map(sx => {
                  const meta = ASSISTANT_KINDS[sx.kind] || { short: sx.kind, tone: 'neutral' };
                  const when = new Date(sx.updated_at);
                  return (
                    <tr key={sx.id} onClick={() => setOpen(sx)}
                      style={{ borderTop: '1px solid var(--border)', cursor: 'pointer' }}
                      onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                      onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                    >
                      <td style={td}><Chip tone={meta.tone}>{meta.short}</Chip></td>
                      <td style={{ ...td, fontFamily: MONO, fontSize: 12, color: 'var(--text-2)', whiteSpace: 'nowrap' }}>
                        {sx.agent_name
                          ? <span>{sx.agent_name}{sx.subject ? <span style={{ color: 'var(--text-muted)' }}> · {sx.subject}</span> : null}</span>
                          : <span style={{ color: 'var(--text-muted)' }}>Workspace</span>}
                      </td>
                      <td style={{ ...td, color: 'var(--text-2)', whiteSpace: 'nowrap' }}>
                        {when.toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' })}
                        <span style={{ color: 'var(--text-muted)', fontFamily: MONO, fontSize: 11.5 }}>
                          {' · '}{when.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                        </span>
                      </td>
                      <td style={{ ...td, fontFamily: MONO, fontSize: 12, color: 'var(--text-2)', whiteSpace: 'nowrap' }}>{sx.message_count} msg</td>
                      <td style={{ ...td, maxWidth: 380 }}>
                        <div dir="auto" style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{sx.title || '(ללא כותרת)'}</div>
                      </td>
                      <td style={{ ...td, textAlign: 'end', whiteSpace: 'nowrap' }}>
                        <IconBtn onClick={e => { e.stopPropagation(); remove(sx); }} danger title="מחיקה">{Icons.trash}</IconBtn>
                        <span style={{ color: 'var(--text-muted)', marginInlineStart: 6 }}>›</span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    );
  }

  /* ─────────────────── API KEY REMINDER ─────────────────── */
  // Pinned top-right of the content area, in both languages. One key serves the
  // whole account, and nothing answers until it is set.
  function ApiKeyNote() {
    const cfg = accountApi();
    const missing = !accountApiUsable(cfg);
    const isOllama = cfg.provider === 'ollama';
    const headline = {
      he: missing ? (isOllama ? 'לא הוגדר שרת Ollama' : 'לא הוגדר API Key') : `מוגדר: ${cfg.provider} · ${cfg.model}`,
      en: missing ? (isOllama ? 'No Ollama server set' : 'No API Key set') : `Using ${cfg.provider} · ${cfg.model}`,
    };
    const body = {
      he: missing
        ? 'הגדירו מפתח אחד במסך Settings — הוא משמש את כל הסוכנים, כל הערוצים והאסיסטנט. עד אז שום דבר לא יענה.'
        : 'המפתח מוגדר פעם אחת במסך Settings ומשמש את כל הסוכנים, כל הערוצים והאסיסטנט.',
      en: missing
        ? 'Set one key in Settings — it drives every agent, every channel and the assistant. Nothing answers until you do.'
        : 'The key is set once in Settings and drives every agent, every channel and the assistant.',
    };
    const strongStyle = { color: missing ? 'var(--warning)' : 'var(--text)' };

    /* What the key IS is on permanent display in the sidebar's runtime card.
       This banner exists only for the case where there isn't one. */
    if (!missing) return null;

    return (
      <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 16 }}>
        <div style={{
          maxWidth: 470, display: 'flex', gap: 9, alignItems: 'flex-start',
          padding: '10px 13px', borderRadius: 'var(--r-md)', fontSize: 12, lineHeight: 1.6,
          background: missing ? 'rgba(245,158,11,0.10)' : 'var(--bg-card)',
          border: `1px solid ${missing ? 'rgba(245,158,11,0.35)' : 'var(--border)'}`,
          color: 'var(--text-2)',
        }}>
          <span style={{ flexShrink: 0 }}>🔑</span>
          <div style={{ minWidth: 0 }}>
            <div dir="rtl" style={{ textAlign: 'right' }}>
              <strong style={strongStyle}>{headline.he}</strong>{' — '}{body.he}
            </div>
            <div dir="ltr" style={{ textAlign: 'left', marginTop: 6, paddingTop: 6, borderTop: '1px solid var(--border)' }}>
              <strong style={strongStyle}>{headline.en}</strong>{' — '}{body.en}
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* ─────────────────── LOGIN GATE ─────────────────── */
  function LoginGate({ onLogin }) {
    const [mode, setMode] = useState('login'); // 'login' | 'register'
    const [username, setUsername] = useState('');
    const [password, setPassword] = useState('');
    const [phone, setPhone] = useState('');
    const [error, setError] = useState('');
    const [loading, setLoading] = useState(false);

    function switchMode(m) {
      setMode(m);
      setError('');
      setUsername('');
      setPassword('');
      setPhone('');
    }

    async function handleLogin() {
      if (!username || !password) return;
      setLoading(true);
      setError('');
      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (resp.ok) {
          const data = await resp.json();
          sessionStorage.setItem('agentforge_auth', JSON.stringify(data));
          onLogin(data);
        } else {
          setError('Invalid username or password.');
        }
      } catch {
        setError('Could not connect to server.');
      } finally {
        setLoading(false);
      }
    }

    async function handleRegister() {
      if (!username || !password || !phone) return;
      setLoading(true);
      setError('');
      try {
        const resp = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, phone }),
        });
        if (resp.ok) {
          const data = await resp.json();
          sessionStorage.setItem('agentforge_auth', JSON.stringify(data));
          onLogin(data);
        } else {
          const body = await resp.json().catch(() => ({}));
          setError(body.error || 'Registration failed.');
        }
      } catch {
        setError('Could not connect to server.');
      } finally {
        setLoading(false);
      }
    }

    /* The welcome panel keeps its dark gradient, so its text carries its own
       ink — the page's text colour is written for a light background. */
    const HERO_INK = '#f2f3f7';
    const HERO_INK_DIM = 'rgba(242,243,247,0.66)';

    const isLogin = mode === 'login';
    const canSubmit = isLogin ? (username && password) : (username && password && phone);
    const isMobile = useIsMobile();   // on a phone the form is the whole screen

    return (
      <div style={{ display: 'flex', height: 'calc(100vh / var(--ui-zoom))', background: 'var(--bg-app)', overflow: 'hidden' }}>
        {/* Left panel - branding */}
        <div style={{ flex: 1, display: isMobile ? 'none' : 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', background: 'linear-gradient(135deg, #0b0d10 0%, #0f1320 100%)', borderRight: '1px solid var(--border)', position: 'relative', overflow: 'hidden' }}>
          {/* Decorative glow */}
          <div style={{ position: 'absolute', top: '30%', left: '50%', transform: 'translate(-50%,-50%)', width: 400, height: 400, borderRadius: '50%', background: 'radial-gradient(circle, rgba(239,159,39,0.08) 0%, transparent 70%)', pointerEvents: 'none' }} />
          {/* Watermark logo */}
          {/* The watermark is tuned for the light page; on this dark panel the
              same opacity reads as a second logo. */}
          <BgLogo size={420} wrapStyle={{ bottom: '-60px', left: '-60px', opacity: 0.35 }} />
          <div style={{ position: 'relative', zIndex: 1, textAlign: 'center', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
            <svg viewBox="200 20 280 230" width="220" height="90" role="img" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="340" cy="108" rx="21" ry="29" fill="#EF9F27"/>
              <ellipse cx="340" cy="72" rx="14" ry="14" fill="#EF9F27"/>
              <circle cx="335" cy="70" r="3.5" fill="#854F0B"/>
              <circle cx="345" cy="70" r="3.5" fill="#854F0B"/>
              <path d="M345,136 C372,138 390,122 390,98 C390,72 374,56 379,38" fill="none" stroke="#EF9F27" strokeWidth="8" strokeLinecap="round"/>
              <polygon points="375,40 382,24 389,40" fill="#D85A30"/>
              <polyline points="319,95 293,80 278,72" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
              <polyline points="319,105 291,102 276,100" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
              <polyline points="319,115 291,119 276,124" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
              <polyline points="319,125 293,136 281,146" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
              <polyline points="361,95 387,80 402,72" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
              <polyline points="361,105 389,102 404,100" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
              <polyline points="361,115 389,119 404,124" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
              <polyline points="361,125 387,136 399,146" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
              <path d="M328,62 L313,48" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round"/>

              <path d="M367,48 L376,40" fill="none" stroke="#EF9F27" strokeWidth="4" strokeLinecap="round"/>
              <path d="M367,48 L371,57" fill="none" stroke="#EF9F27" strokeWidth="4" strokeLinecap="round"/>
              <text x="340" y="210" textAnchor="middle" fontFamily="'Plus Jakarta Sans','Segoe UI',sans-serif" fontSize="52" fontWeight="700">
                <tspan fill={HERO_INK}>8Legs</tspan><tspan fill="#EF9F27">.ai</tspan>
              </text>
            </svg>
            <div style={{ marginTop: 28 }}>
              <div style={{ fontSize: 20, fontWeight: 800, color: HERO_INK, letterSpacing: '-0.02em', marginBottom: 10 }}>Your Agents. Your Rules.</div>

            </div>
            {/* Feature pills */}
            <div style={{ display: 'flex', gap: 8, marginTop: 32, flexWrap: 'wrap', justifyContent: 'center' }}>
              {['Claude & GPT models', 'RAG knowledge base', 'Custom tools'].map(f => (

              ))}
            </div>
          </div>
          {/* Footer */}

        {/* Right panel - form */}

              <div style={{ fontSize: 13, color: 'var(--text-muted)', fontWeight: 500 }}>
                {isLogin ? 'Sign in to access your agents' : 'Get started for free'}

            </div>

            {/* Tab toggle */}
            <div style={{ display: 'flex', gap: 0, marginBottom: 22, background: 'var(--bg-panel)', borderRadius: 'var(--r-md)', padding: 4, border: '1px solid var(--border)' }}>
              {['login', 'register'].map(m => (
                <button key={m} onClick={() => switchMode(m)}
                  style={{ flex: 1, padding: '8px 0', borderRadius: 8, fontWeight: 600, fontSize: 13,
                    background: mode === m ? 'var(--primary)' : 'transparent',
                    color: mode === m ? '#0a0a0a' : 'var(--text-2)',
                    transition: 'all 0.18s ease',
                    boxShadow: mode === m ? '0 1px 8px var(--primary-glow)' : 'none',
                  }}>
                  {m === 'login' ? 'Sign in' : 'Register'}
                </button>
              ))}
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <div style={{ position: 'relative' }}>
                <div style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', color: 'var(--text-muted)', display: 'flex' }}>{Icons.user}</div>
                <input type="text" value={username} onChange={e => setUsername(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && (isLogin ? handleLogin() : handleRegister())}
                  placeholder="Username" autoFocus style={{ paddingLeft: 38 }} />
              </div>
              <div style={{ position: 'relative' }}>
                <div style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', color: 'var(--text-muted)', display: 'flex' }}>{Icons.lock}</div>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && (isLogin ? handleLogin() : handleRegister())}
                  placeholder="Password" style={{ paddingLeft: 38 }} />
              </div>
              {!isLogin && (
                <input type="tel" value={phone} onChange={e => setPhone(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && handleRegister()}

            {error && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, color: 'var(--danger)', fontSize: 13, marginTop: 12, padding: '10px 12px', background: 'rgba(239,68,68,0.08)', borderRadius: 'var(--r-sm)', border: '1px solid rgba(239,68,68,0.2)' }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                {error}

            <button onClick={isLogin ? handleLogin : handleRegister} disabled={loading || !canSubmit}
              style={{ width: '100%', background: 'var(--primary)', color: '#0a0a0a', padding: '12px 16px', borderRadius: 'var(--r-md)', fontWeight: 700, fontSize: 14, marginTop: 16, boxShadow: '0 2px 12px var(--primary-glow)', transition: 'all 0.18s ease' }}
              onMouseEnter={e => { if (!loading && canSubmit) { e.currentTarget.style.background = 'var(--primary-hover)'; e.currentTarget.style.transform = 'translateY(-1px)'; }}}
              onMouseLeave={e => { e.currentTarget.style.background = 'var(--primary)'; e.currentTarget.style.transform = 'none'; }}
            >
              {loading ? (isLogin ? 'Signing in…' : 'Registering…') : (isLogin ? 'Sign in' : 'Create account')}
            </button>
          </div>
        </div>
      </div>
    );
  }

  /* ─────────────────── ADMIN: CHAT HISTORY ─────────────────── */
  function AdminChatHistoryView({ onBack }) {
    const PAGE_SIZE = 20;
    const [data, setData]           = useState(null);
    const [offset, setOffset]       = useState(0);
    const [openSession, setOpenSession] = useState(null);

    function load(off) {
      setData(null);
      adminListChatSessions({ limit: PAGE_SIZE, offset: off })
        .then(d => { setData(d); setOffset(off); })
        .catch(() => setData({ sessions: [], total: 0 }));
    }

    useEffect(() => { load(0); }, []);

    if (openSession) {
      const msgs = openSession.messages || [];
      return (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
            <button onClick={() => setOpenSession(null)} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13 }}>← Back</button>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, fontWeight: 700, fontSize: 20 }}>
                <div style={{ width: 32, height: 32, borderRadius: '50%', background: 'var(--bg-panel)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, overflow: 'hidden' }}><AvatarDisplay value={openSession.agent_avatar || '🤖'} size={32} /></div>
                {openSession.agent_name}
              </div>
              <div style={{ color: 'var(--text-2)', fontSize: 12, marginTop: 2 }}>
                {new Date(openSession.started_at).toLocaleString()} · {msgs.filter(m => m.role === 'user').length} user messages
              </div>
            </div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, width: '100%' }}>
            {msgs.filter(m => m.role === 'user' || m.role === 'assistant').map((m, i) => (
              <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: m.role === 'user' ? 'flex-end' : 'flex-start' }}>
                <div style={{
                  maxWidth: '80%', padding: '10px 14px', fontSize: 14, lineHeight: 1.5,
                  whiteSpace: 'pre-wrap', wordBreak: 'break-word', borderRadius: m.role === 'user' ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
                  background: m.role === 'user' ? 'var(--primary)' : 'var(--bg-card)',
                  color: m.role === 'user' ? '#fff' : 'var(--text)',
                  border: m.role === 'assistant' ? '1px solid var(--border)' : 'none',
                }}>{m.content}</div>
                <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 3, padding: '0 4px' }}>
                  {m.role === 'user' ? 'User' : openSession.agent_name}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const total = data?.total || 0;
    const totalPages = Math.ceil(total / PAGE_SIZE);
    const currentPage = Math.floor(offset / PAGE_SIZE);

    return (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
          <button onClick={onBack} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13 }}>← Back</button>
          <div>
            <div style={{ fontWeight: 700, fontSize: 22 }}>Chat History</div>
            {data && <div style={{ color: 'var(--text-2)', fontSize: 13, marginTop: 2 }}>{total} conversation{total !== 1 ? 's' : ''} across all agents</div>}
          </div>
        </div>

        {!data ? (
          <div style={{ color: 'var(--text-2)', padding: 40 }}>Loading…</div>
        ) : data.sessions.length === 0 ? (
          <div style={{ textAlign: 'center', color: 'var(--text-muted)', paddingTop: 60, fontSize: 14 }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>💬</div>
            No conversations yet.
          </div>
        ) : (
          <>
            <div style={{ background: 'var(--bg-card)', borderRadius: 'var(--r-lg)', border: '1px solid var(--border)', overflow: 'hidden' }}>
              {data.sessions.map((s, i) => {
                const msgs = s.messages || [];
                const userMsgs = msgs.filter(m => m.role === 'user');
                const preview = userMsgs[0]?.content?.slice(0, 80) || '—';
                return (
                  <div key={s.id}
                    onClick={() => setOpenSession(s)}
                    style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '14px 18px', cursor: 'pointer', borderBottom: i < data.sessions.length - 1 ? '1px solid var(--border)' : 'none' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                  >
                    <div style={{ width: 40, height: 40, borderRadius: '50%', background: 'var(--bg-panel)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, overflow: 'hidden' }}><AvatarDisplay value={s.agent_avatar || '🤖'} size={40} /></div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 14, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', marginBottom: 3 }}>{preview}</div>
                      <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>
                        <span style={{ color: 'var(--text-2)', fontWeight: 500 }}>{s.agent_name}</span>
                        &nbsp;·&nbsp;{userMsgs.length} message{userMsgs.length !== 1 ? 's' : ''}
                        &nbsp;·&nbsp;{new Date(s.started_at).toLocaleDateString()} {new Date(s.started_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                      </div>
                    </div>
                    <div style={{ fontSize: 16, color: 'var(--text-muted)', flexShrink: 0 }}>›</div>
                  </div>
                );
              })}
            </div>

            {totalPages > 1 && (
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, marginTop: 20 }}>
                <button onClick={() => load((currentPage - 1) * PAGE_SIZE)} disabled={currentPage === 0}
                  style={{ padding: '6px 14px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: currentPage === 0 ? 'var(--text-muted)' : 'var(--text)', cursor: currentPage === 0 ? 'default' : 'pointer', fontSize: 13 }}>← Prev</button>
                <span style={{ fontSize: 13, color: 'var(--text-2)' }}>{currentPage + 1} / {totalPages}</span>
                <button onClick={() => load((currentPage + 1) * PAGE_SIZE)} disabled={currentPage >= totalPages - 1}
                  style={{ padding: '6px 14px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: currentPage >= totalPages - 1 ? 'var(--text-muted)' : 'var(--text)', cursor: currentPage >= totalPages - 1 ? 'default' : 'pointer', fontSize: 13 }}>Next →</button>
              </div>
            )}
          </>
        )}
      </div>
    );
  }

  /* ─────────────────── ADMIN: USERS LIST ─────────────────── */
  function AdminView({ onSelectUser, myAgents }) {
    const [tab, setTab]             = useState('users');
    const [users, setUsers]         = useState(null);
    const [resetting, setResetting] = useState(null);
    const [resetResult, setResetResult] = useState({});
    const [deleting, setDeleting]   = useState(null);   // userId awaiting confirmation
    const [confirmText, setConfirmText] = useState('');
    const [deleteBusy, setDeleteBusy] = useState(false);
    const [deleteError, setDeleteError] = useState({});
    const [starter, setStarter] = useState(null);   // { templates: [{ name, found, … }], allFound }

    useEffect(() => {
      adminStarterAgent()
        .then(setStarter)
        .catch(() => setStarter({ templates: [], allFound: false, error: 'Could not check.' }));
    }, []);

    useEffect(() => {
      adminListUsers().then(setUsers).catch(() => setUsers([]));
    }, []);

    async function handleDelete(u) {
      setDeleteBusy(true);
      setDeleteError(e => ({ ...e, [u.id]: null }));
      try {
        await adminDeleteUser(u.id, confirmText);
        setUsers(list => list.filter(x => x.id !== u.id));
        setDeleting(null);
        setConfirmText('');
      } catch (err) {
        setDeleteError(e => ({ ...e, [u.id]: err.message }));
      } finally {
        setDeleteBusy(false);
      }
    }

    async function handleReset(userId) {
      setResetting(userId);
      try {
        const { tempPassword } = await adminResetPassword(userId);
        setResetResult(r => ({ ...r, [userId]: tempPassword }));
      } catch {
        setResetResult(r => ({ ...r, [userId]: 'Error' }));
      } finally {
        setResetting(null);
      }
    }

    if (tab === 'history') {
      return <AdminChatHistoryView onBack={() => setTab('users')} />;
    }

    if (!users) return <div style={{ color: 'var(--text-2)', padding: 40 }}>Loading…</div>;

    const th = { padding: '15px 16px 11px', textAlign: 'start', whiteSpace: 'nowrap' };
    const td = { padding: '13px 16px', fontSize: 13, verticalAlign: 'middle' };

    return (
      <div>
        <PageHeader
          eyebrow="Access"
          title="Admin"
          actions={
            <SegTabs value={tab} onChange={setTab}
              items={[{ id: 'users', label: 'Users' }, { id: 'history', label: 'Chat history' }]} />
          }
        />

        {/* The starter agents are matched by name, so a rename can silently
            stop new sign-ups from getting one. Say so out loud, per agent. */}
        {starter && (
          <div style={{
            display: 'flex', alignItems: 'center', gap: 22, flexWrap: 'wrap',
            padding: '15px 18px', marginBottom: 18, borderRadius: 'var(--r-lg)',
            background: 'var(--bg-card)',
            border: `1px solid ${starter.allFound ? 'var(--border)' : 'rgba(245,158,11,0.35)'}`,
          }}>
            <div style={{ minWidth: 190 }}>
              <div style={{ fontWeight: 700, fontSize: 14 }}>Starter agents</div>
              <div style={{ fontSize: 11.5, color: 'var(--text-muted)', marginTop: 3 }}>
                Copied into every new account on sign-up
              </div>
            </div>
            {(starter.templates || []).map(t => (
              <div key={t.name} style={{ display: 'flex', alignItems: 'baseline', gap: 8, minWidth: 0 }}>
                <span style={{ color: t.found ? 'var(--success)' : 'var(--warning)' }}>{t.found ? '✓' : '⚠'}</span>
                <span dir="ltr" style={{ fontFamily: MONO, fontSize: 12.5, fontWeight: 600 }}>{t.name}</span>
                <span style={{ color: 'var(--text-muted)', fontSize: 11.5 }}>
                  {t.found
                    ? `${t.skills} skills · ${t.tools} tools`
                    : `${t.reason} — name an agent of yours exactly this to fix it.`}
                </span>
              </div>
            ))}
            {starter.error && <div style={{ color: 'var(--danger)', fontSize: 12 }}>{starter.error}</div>}
          </div>
        )}

        <div style={{ background: 'var(--bg-card)', borderRadius: 'var(--r-lg)', border: '1px solid var(--border)', overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 880 }}>
            <thead>
              <tr style={{ borderBottom: '1px solid var(--border)' }}>
                {['User', 'Phone', 'Role', 'Agents', 'Last login', 'Actions'].map(h => (
                  <th key={h} style={th}><Eyebrow>{h}</Eyebrow></th>
                ))}
              </tr>
            </thead>
            <tbody>
              {users.map(u => (
                <tr key={u.id} style={{ borderTop: '1px solid var(--border)' }}>
                  <td style={td}>
                    <button onClick={() => onSelectUser(u)}
                      style={{ display: 'flex', alignItems: 'center', gap: 10, background: 'transparent', padding: 0, cursor: 'pointer' }}>
                      <div style={{ width: 30, height: 30, borderRadius: '50%', flexShrink: 0, background: 'var(--primary-dim)', border: '1px solid rgba(239,159,39,0.25)', color: 'var(--primary)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        {Icons.user}
                      </div>
                      <span style={{ fontWeight: 650, color: 'var(--text)' }}>{u.username}</span>
                    </button>
                  </td>
                  <td style={{ ...td, color: 'var(--text-2)', fontFamily: MONO, fontSize: 12 }}>{u.phone || '—'}</td>
                  <td style={td}>
                    <Chip tone={u.is_admin ? 'tools' : 'neutral'}>{u.is_admin ? 'Admin' : 'User'}</Chip>
                  </td>
                  <td style={{ ...td, color: 'var(--text-2)', fontFamily: MONO, fontSize: 12.5 }}>{u.agent_count}</td>
                  <td style={{ ...td, color: 'var(--text-2)', whiteSpace: 'nowrap' }}>
                    {u.last_login_at
                      ? <React.Fragment>
                          {new Date(u.last_login_at).toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' })}
                          <span style={{ color: 'var(--text-muted)', fontFamily: MONO, fontSize: 11.5 }}>
                            {' · '}{new Date(u.last_login_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                          </span>
                        </React.Fragment>
                      : '—'}
                  </td>
                  <td style={td}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                      <Btn size="sm" onClick={() => onSelectUser(u)}>View agents</Btn>
                      <Btn size="sm" onClick={() => handleReset(u.id)} disabled={resetting === u.id}>
                        {resetting === u.id ? '…' : 'Reset password'}
                      </Btn>
                      {resetResult[u.id] && (
                        <Chip tone="live" mono>New: {resetResult[u.id]}</Chip>
                      )}
                      {deleting === u.id ? (
                        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                          <input
                            autoFocus
                            value={confirmText}
                            onChange={e => setConfirmText(e.target.value)}
                            placeholder={`type "${u.username}"`}
                            style={{ fontSize: 12, padding: '5px 9px', borderRadius: 'var(--r-sm)', background: 'var(--bg-input)', border: '1px solid var(--border)', color: 'var(--text)', width: 150 }}
                          />
                          <Btn size="sm" danger onClick={() => handleDelete(u)} disabled={deleteBusy || confirmText !== u.username}>
                            {deleteBusy ? '…' : 'Delete forever'}
                          </Btn>
                          <Btn size="sm" onClick={() => { setDeleting(null); setConfirmText(''); }}>Cancel</Btn>
                        </div>
                      ) : (
                        <Btn size="sm" danger
                          title={`Delete ${u.username} with all their agents and conversations`}
                          onClick={() => { setDeleting(u.id); setConfirmText(''); setDeleteError(e => ({ ...e, [u.id]: null })); }}>
                          Delete
                        </Btn>
                      )}
                      {deleteError[u.id] && (
                        <span style={{ fontSize: 12, color: 'var(--danger)' }}>{deleteError[u.id]}</span>
                      )}
                    </div>
                    {deleting === u.id && (
                      <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 7, maxWidth: 360, lineHeight: 1.5 }}>
                        Deletes the user, their {u.agent_count} agent{u.agent_count !== 1 ? 's' : ''}, and every conversation, document and channel those agents own. This cannot be undone.
                      </div>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  /* ─────────────────── ADMIN: USER AGENTS ─────────────────── */
  function UserAgentsView({ targetUser, myAgents, onBack, stacked }) {
    const [agents, setAgents] = useState(null);
    const [duplicating, setDuplicating] = useState(false);
    const [showDupPicker, setShowDupPicker] = useState(false);
    const [editingAgent, setEditingAgent] = useState(null);

    useEffect(() => {
      reload();
    }, [targetUser.id]);

    function reload() {
      adminListUserAgents(targetUser.id).then(setAgents).catch(() => setAgents([]));
    }

    const saveAdminAgent = useCallback(async (agent) => {
      await adminUpdateAgent(agent).catch(() => {});
    }, []);
    const saveAdminAgentDebounced = useDebounce(saveAdminAgent, 600);

    function handleAdminUpdate(agent) {
      setEditingAgent(agent);
      saveAdminAgentDebounced(agent);
    }

    async function handleDelete(agentId) {
      if (!confirm('Delete this agent?')) return;
      await adminDeleteAgent(agentId).catch(() => {});
      reload();
    }

    async function handleDuplicateTo(sourceAgentId) {
      setDuplicating(true);
      setShowDupPicker(false);
      try {
        await adminDuplicateTo(sourceAgentId, targetUser.id);
        reload();
      } catch {
        alert('Failed to duplicate agent.');
      } finally {
        setDuplicating(false);
      }
    }

    if (editingAgent) {
      // On a phone the desktop editor does not fit; the phone editor does,
      // minus Test — an admin has no test chat for someone else's agent.
      if (stacked) return (
        <MobileAgentEditor
          agent={editingAgent}
          onUpdate={handleAdminUpdate}
          onBack={() => { setEditingAgent(null); reload(); }}
        />
      );
      return (
        <AgentEditor
          agent={editingAgent}
          onUpdate={handleAdminUpdate}
          onBack={() => { setEditingAgent(null); reload(); }}
        />
      );
    }

    return (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
          <button onClick={onBack} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13 }}>← Back</button>
          <div>
            <div style={{ fontWeight: 700, fontSize: 22 }}>Agents of {targetUser.username}</div>
            {agents && <div style={{ color: 'var(--text-2)', fontSize: 13 }}>{agents.length} agent{agents.length !== 1 ? 's' : ''}</div>}
          </div>
          <div style={{ marginLeft: 'auto', position: 'relative' }}>
            <button onClick={() => setShowDupPicker(v => !v)} disabled={duplicating}
              style={{ background: 'var(--primary)', color: '#fff', padding: '8px 16px', borderRadius: 'var(--r-md)', fontWeight: 600, fontSize: 13 }}>
              {duplicating ? 'Duplicating…' : '＋ Duplicate My Agent Here'}
            </button>
            {showDupPicker && (
              <div style={{ position: 'absolute', right: 0, top: '110%', background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 'var(--r-lg)', padding: 8, minWidth: 220, zIndex: 100, boxShadow: 'var(--shadow)' }}>
                <div style={{ fontSize: 12, color: 'var(--text-2)', padding: '4px 8px 8px' }}>Pick one of your agents to copy:</div>
                {myAgents.length === 0 && <div style={{ fontSize: 13, color: 'var(--text-muted)', padding: '8px' }}>No agents to copy</div>}
                {myAgents.map(a => (
                  <button key={a.id} onClick={() => handleDuplicateTo(a.id)}
                    style={{ display: 'block', width: '100%', textAlign: 'left', padding: '8px 12px', borderRadius: 'var(--r-md)', fontSize: 13, background: 'transparent', color: 'var(--text)' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                  >
                    {a.avatar || '🤖'} {a.name}
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>

        {!agents ? (
          <div style={{ color: 'var(--text-2)' }}>Loading…</div>
        ) : agents.length === 0 ? (
          <EmptyState icon="🤖" title="No agents" subtitle="This user has no agents yet" />
        ) : (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(260px,1fr))', gap: 16 }}>
            {agents.map(a => (
              <div key={a.id} style={{ background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 'var(--r-lg)', padding: 20 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
                  <AvatarDisplay value={a.avatar || '🤖'} size={28} />
                  <div style={{ fontWeight: 600, flex: 1 }}>{a.name}</div>
                </div>
                <div style={{ color: 'var(--text-2)', fontSize: 12, marginBottom: 14, lineHeight: 1.4, minHeight: 32 }}>
                  {a.basePrompt ? a.basePrompt.slice(0, 80) + (a.basePrompt.length > 80 ? '…' : '') : <i>No description</i>}
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button onClick={() => setEditingAgent(a)}
                    style={{ flex: 1, fontSize: 12, padding: '6px', borderRadius: 'var(--r-sm)', background: 'var(--bg-hover)', color: 'var(--text-2)', border: '1px solid var(--border)' }}>
                    ✏️ Edit
                  </button>
                  <button onClick={() => handleDelete(a.id)}
                    style={{ flex: 1, fontSize: 12, padding: '6px', borderRadius: 'var(--r-sm)', background: 'transparent', color: 'var(--danger)', border: '1px solid var(--danger)' }}>
                    🗑️ Delete
                  </button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  /* ─────────────────── APP ─────────────────── */
  /* ─────────────────── SETTINGS PANEL ─────────────────── */
  /** A command, in a box, with a button that copies it. */
  function CopyableCommand({ command, note }) {
    const [copied, setCopied] = useState(false);
    return (
      <div>
        <div dir="ltr" style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <code style={{ flex: 1, fontFamily: 'monospace', fontSize: 12, background: 'var(--bg-app)',
                         border: '1px solid var(--border)', borderRadius: 'var(--r-sm)',
                         padding: '8px 10px', overflowX: 'auto', whiteSpace: 'nowrap' }}>{command}</code>
          <button onClick={() => navigator.clipboard.writeText(command).then(() => {
                    setCopied(true); setTimeout(() => setCopied(false), 2000);
                  })}
            style={{ padding: '8px 14px', borderRadius: 'var(--r-sm)', cursor: 'pointer', flexShrink: 0,
                     background: copied ? 'var(--success)' : 'var(--bg-hover)',
                     border: '1px solid var(--border)',
                     color: copied ? '#0a0a0a' : 'var(--text-1)', fontSize: 12, fontWeight: 700 }}>
            {copied ? '✓' : 'העתק'}
          </button>
        </div>
        {note && <div style={{ fontSize: 11.5, color: 'var(--text-muted)', marginTop: 6 }}>{note}</div>}
      </div>
    );
  }

  /**
   * Personal access tokens — what the CLI uses instead of a password.
   *
   * A created token is shown once and never again: only its hash is stored, so
   * there is nothing left to show on the next load. That is the point, but it
   * means the one moment it is on screen has to be obvious and easy to copy.
   */
  function TokensSection({ sectionStyle, sectionHeader, rowStyle, iconBox }) {
    const [tokens, setTokens] = useState([]);
    const [loading, setLoading] = useState(true);
    const [busy, setBusy] = useState(false);
    const [fresh, setFresh] = useState(null);
    const [error, setError] = useState(null);
    /* A token is named by the person making it. Three of them called CLI tell
       you nothing on the day you have to decide which one to revoke. */
    const [name, setName] = useState('');

    async function load() {
      try { setTokens(await apiListTokens()); setError(null); }
      catch (e) { setError(e.message); }
      finally { setLoading(false); }
    }
    useEffect(() => { load(); }, []);

    async function create() {
      const clean = name.trim();
      if (!clean || busy) return;
      setBusy(true);
      setError(null);
      try {
        const created = await apiCreateToken(clean);
        setFresh({ token: created.token, name: clean });
        setName('');
        await load();
      } catch (e) { setError(e.message); }
      finally { setBusy(false); }
    }

    async function revoke(id) {
      setBusy(true);
      try { await apiRevokeToken(id); await load(); }
      catch (e) { setError(e.message); }
      finally { setBusy(false); }
    }

      <div style={sectionStyle}>
        <div style={sectionHeader}>Personal access tokens</div>

              style={{ width: 200, padding: '7px 12px', fontSize: 13 }}

            <button onClick={create} disabled={busy || !name.trim()}

              style={{ padding: '8px 16px', borderRadius: 'var(--r-sm)',

                       background: name.trim() ? 'var(--primary)' : 'var(--bg-hover)',

                       border: `1px solid ${name.trim() ? 'var(--primary)' : 'var(--border)'}`,
                       fontSize: 13, fontWeight: 700, whiteSpace: 'nowrap',

          <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--text-muted)' }}>התקנה</div>
          <CopyableCommand command="npm i -g @8legs/cli"
            note="ואז 8legs login מכל תיקייה. דורש Node 18 ומעלה." />
          <CopyableCommand command="npx @8legs/cli login"
            note="בלי להתקין כלום — npx מוריד אותו בכל הרצה." />
        </div>

        {fresh && (

            <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--warning)', marginBottom: 8 }}>

      setSaved(false);

        // with a GPT model, so move the model to that provider's default.
        if (key === 'provider' && !(MODELS_BY_PROVIDER[value] || []).includes(next.model)) {

              {error && <span style={{ fontSize: 12, color: 'var(--danger)' }}>{error}</span>}
              {!usable && <span style={{ fontSize: 12, color: 'var(--warning)' }}>
