  <style>
    /* One palette. The interface is light; there is no theme to choose. */
    :root {
      --bg-app: #f2f4f8;
      --bg-sidebar: #e8ecf2;
      --bg-card: #ffffff;
      --bg-panel: #f6f8fb;
      --bg-input: #eef0f5;
      --bg-hover: #e2e6ef;
      --primary: #EF9F27;
      --primary-hover: #F5B34D;
      --primary-dim: rgba(239,159,39,0.10);
      --primary-glow: rgba(239,159,39,0.20);
      --success: #16a34a;
      --warning: #b45309;
      --danger: #dc2626;
      --teal: #0d9488;
      --teal-dim: rgba(13,148,136,0.10);
      --violet: #6d5ce0;
      --violet-dim: rgba(109,92,224,0.10);
      /* Page navigation is amber; a selection *inside* a page is the inverse
         surface — a dark chip with light ink. */
      --sel: #0d0f14;
      --sel-ink: #ffffff;
      --text: #0d0f14;
      --text-2: #445068;
      --text-muted: #8a97b0;
      --border: #d8dde8;
      --border-focus: #EF9F27;
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --r-xl: 20px;
      --shadow: 0 4px 24px rgba(15,23,42,0.06);
      --shadow-lg: 0 8px 40px rgba(15,23,42,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /*
     * The whole UI is drawn at 72%, which is where it was found to read best —
     * the same thing browser zoom does, but as the default for everyone. It
     * was 80%, and 80% of the browser's own 90% is what people were settling
     * on by hand, so that is the default now.
     * `zoom` multiplies viewport units too, so every 100vh/100vw inside this
     * subtree is divided by --ui-zoom to keep filling the screen. Change the
     * one number below to rescale the entire app.
     */
    :root { --ui-zoom: 0.72; }
    html { height: 100%; }
    body {
      background: var(--bg-app);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
      overflow: hidden;
      height: 100%;
      zoom: var(--ui-zoom);
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes cardHighlight {
      0% { box-shadow: 0 0 0 2px var(--primary), var(--shadow); }
      50% { box-shadow: 0 0 20px 4px var(--primary), var(--shadow); }
      100% { box-shadow: var(--shadow); }
    }
    @keyframes pulseDot {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Draws the eye to the assistant until it has been opened once — never after. */
    @keyframes assistantRing {
      0%   { box-shadow: 0 6px 22px var(--primary-glow), 0 0 0 0 rgba(239,159,39,0.55); }
      70%  { box-shadow: 0 6px 22px var(--primary-glow), 0 0 0 14px rgba(239,159,39,0); }
      100% { box-shadow: 0 6px 22px var(--primary-glow), 0 0 0 0 rgba(239,159,39,0); }
    }

    /* ── the mark, alive ──
       The home screen's spider breathes: the body drifts, the legs step in
       opposite phase, and a halo behind it swells. `.spider-busy` is the same
       motion at speed, which is how the screen says the model is thinking.
       Nothing here runs unless an ancestor carries `.spider-anim`, so the
       sidebar mark and the watermark are untouched. */
    @keyframes spiderFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes spiderLegL  { 0%, 100% { transform: rotate(0deg); } 35% { transform: rotate(2.6deg); }  70% { transform: rotate(-1.6deg); } }
    @keyframes spiderLegR  { 0%, 100% { transform: rotate(0deg); } 35% { transform: rotate(-2.6deg); } 70% { transform: rotate(1.6deg); } }
    @keyframes spiderHalo  { 0%, 100% { transform: scale(0.92); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 0.95; } }

    .sp-legs-l, .sp-legs-r { transform-origin: 340px 110px; transform-box: view-box; }
    .spider-anim .sp-body  { animation: spiderFloat 5.2s ease-in-out infinite; }
    .spider-anim .sp-legs-l { animation: spiderLegL 3.4s ease-in-out infinite; }
    .spider-anim .sp-legs-r { animation: spiderLegR 3.4s ease-in-out infinite; }
    .spider-anim .sp-halo   { animation: spiderHalo 4.2s ease-in-out infinite; }
    .spider-busy .sp-legs-l, .spider-busy .sp-legs-r { animation-duration: 1.05s; }
    .spider-busy .sp-halo { animation-duration: 1.4s; }

    .fade-in { animation: fadeIn 0.25s ease both; }
    .slide-in-right { animation: slideInRight 0.3s cubic-bezier(0.16,1,0.3,1) both; }
    .card-highlight { animation: cardHighlight 1.2s ease-out; }
    .assistant-ring { animation: assistantRing 2.4s ease-out infinite; }

    /* ── phones ──
       The one place CSS knows about mobile. Everything else is a separate
       React branch (see MOBILE), so none of this touches the desktop. */
    @media (max-width: 768px) {
      :root { --ui-zoom: 1; }                       /* the 80% desktop scale is wrong on a phone */
      .m-app { height: 100vh; height: 100dvh; height: var(--app-h, 100dvh); }
      .m-nav, .m-sheet { padding-bottom: env(safe-area-inset-bottom); }
      .m-root input, .m-root textarea, .m-root select { font-size: 16px; }   /* iOS zooms in on anything smaller */
      .m-scroll-x { scrollbar-width: none; -webkit-overflow-scrolling: touch; }
      .m-scroll-x::-webkit-scrollbar { display: none; }
      .m-root button { -webkit-tap-highlight-color: transparent; }
    }

    .typing-dot {
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--text-2);
      border-radius: 50%;
      animation: pulseDot 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }

    input, textarea, select {
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 10px 14px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--primary-dim);
    }
    input[type="range"] {
      padding: 0;
      height: 6px;
      cursor: pointer;
      accent-color: var(--primary);
    }
    input[type="color"] { padding: 2px; height: 36px; cursor: pointer; }
    select option { background: var(--bg-input); }

    button {
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: all 0.18s ease;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .monaco-container { border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--border); }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      letter-spacing: 0.01em;
    }

    .bg-logo-watermark {
      opacity: 0.045;
    }

    /* ── right-to-left text in a left-to-right layout ──
       A Hebrew sentence in a box that is laid out for English comes out with
       its full stop on the wrong side, and a truncated one loses its opening
       words instead of its closing ones — the ellipsis lands at the head.
       `plaintext` makes every block take its direction from its own first
       letter, which is what each of these boxes actually wants. It is scoped
       to the interface language so an English layout is never reordered. */
    [data-ui-lang="he"] :is(div, p, span, li, label, button, a, h1, h2, h3, h4, td, th) {
      unicode-bidi: plaintext;
    }

    /* ── the phone's viewport ──
       An open keyboard does not shrink 100dvh on iOS: the composer ends up
       under the keys and the shell looks stretched. --app-h is the visual
       viewport, set from JS while a phone is on screen; the .m-app rule that
       uses it is in the phone block above. */

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <script type="text/babel" data-presets="react">

  /* ─────────────────── BG WATERMARK ─────────────────── */
  /* Every colour in the mark comes off one hue, so the same drawing can stand
     for the platform in amber and for an AI Chatbot in whatever it was given. */
  function shade(hex, amount) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return hex;
    const n = parseInt(m[1], 16);
    const mix = c => Math.round(amount < 0 ? c * (1 + amount) : c + (255 - c) * amount);
    const out = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(mix);
    return '#' + out.map(c => c.toString(16).padStart(2, '0')).join('');
  }

  function spiderPaths(color = '#EF9F27', ink, flag) {
    const eye = ink || shade(color, -0.55);
    const tip = flag || shade(color, -0.35);
    return (
      <>
        <ellipse cx="340" cy="108" rx="21" ry="29" fill={color}/>
        <ellipse cx="340" cy="72" rx="14" ry="14" fill={color}/>

        <polygon points="375,40 382,24 389,40" fill={tip}/>

            nothing for the callers that draw the mark still. */}
        <g className="sp-legs-l">
          <polyline points="319,95 293,80 278,72" fill="none" stroke={color} strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
          <polyline points="319,105 291,102 276,100" fill="none" stroke={color} strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>

          <polyline points="319,125 293,136 281,146" fill="none" stroke={color} strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
        </g>
        <g className="sp-legs-r">
          <polyline points="361,95 387,80 402,72" fill="none" stroke={color} strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
          <polyline points="361,105 389,102 404,100" fill="none" stroke={color} strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
          <polyline points="361,115 389,119 404,124" fill="none" stroke={color} strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
          <polyline points="361,125 387,136 399,146" fill="none" stroke={color} strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
        </g>
        <path d="M328,62 L313,48" fill="none" stroke={color} strokeWidth="4.5" strokeLinecap="round"/>
        <path d="M313,48 L304,40" fill="none" stroke={color} strokeWidth="4" strokeLinecap="round"/>

        <path d="M367,48 L371,57" fill="none" stroke={color} strokeWidth="4" strokeLinecap="round"/>
      </>
    );
  }

  /* The brand's own colouring, which is what every existing caller draws. */
  const spiderSvgPaths = spiderPaths('#EF9F27', '#854F0B', '#D85A30');

  function BgLogo({ size = 560, wrapStyle = {} }) {
    return (
      <div style={{
        position: 'absolute', pointerEvents: 'none', userSelect: 'none',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        ...wrapStyle,
      }}>
        <svg
          className="bg-logo-watermark"
          viewBox="285 18 115 140"
          width={size} height={size}
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
        >
          {spiderSvgPaths}
        </svg>
      </div>
    );
  }

  /**
   * The mark at full size, breathing. `busy` speeds it up while a turn is in
   * flight; `still` is the same drawing with no motion at all.
   * prefers-reduced-motion flattens every animation in this file, so this one
   * needs no separate escape hatch.
   */
  function SpiderLogo({ size = 168, busy, still, style }) {
    const cls = ['spider-stage', still ? '' : 'spider-anim', busy ? 'spider-busy' : ''].filter(Boolean).join(' ');
    return (
      <div className={cls} style={{
        position: 'relative', width: size, height: size, flexShrink: 0,
        display: 'flex', alignItems: 'center', justifyContent: 'center', ...style,
      }}>
        <div className="sp-halo" style={{
          position: 'absolute', inset: 0, borderRadius: '50%', pointerEvents: 'none',
          background: 'radial-gradient(circle, rgba(239,159,39,0.30) 0%, rgba(239,159,39,0.10) 42%, rgba(239,159,39,0) 68%)',
        }} />
        <div className="sp-body" style={{ display: 'flex' }}>
          <svg viewBox="285 18 115 140" width={Math.round(size * 0.8)} height={Math.round(size * 0.8)}
               aria-hidden="true" style={{ overflow: 'visible' }}>
            {spiderSvgPaths}
          </svg>
        </div>
      </div>
    );
  }

    docs: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>,
    settings: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
    admin: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
    sparkle: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18 16l.9 2.1L21 19l-2.1.9L18 22l-.9-2.1L15 19l2.1-.9z"/></svg>,

    edit: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,

  /* The mono face the redesign leans on: branch names, model ids, eyebrow
     labels and every number in a table. */
  const MONO = "'JetBrains Mono','Fira Code',ui-monospace,monospace";

  /* ─────────────────── CONSTANTS ─────────────────── */
  const CLAUDE_MODELS = ['claude-opus-4-5', 'claude-sonnet-4-5', 'claude-haiku-4-5'];
  const OPENAI_MODELS = ['gpt-4o', 'gpt-4o-mini', 'gpt-4-turbo', 'gpt-3.5-turbo'];
  const OLLAMA_MODELS = ['gemma4:4b', 'gemma4:12b', 'gemma4:27b', 'gemma3:latest', 'llama3.2:latest', 'mistral:latest', 'qwen2.5:latest'];

  /* ─────────────────── HELPERS ─────────────────── */
  function uid() { return crypto.randomUUID(); }
  function isHebrew(text) { return /^[\u0590-\u05FF]/.test((text || '').trim()); }
  function fmtTime(date) {
    if (!date) return '';
    return new Date(date).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', hour12: false });
  }
  function fmtDuration(ms) { return (ms / 1000).toFixed(2) + 's'; }

  /* ─────────────────── ERROR LOG ─────────────────── */
  // What failed in this browser session. The server keeps its own log for the
  // widget and WhatsApp; together they are what the assistants read when asked
  // to fix something, so nobody has to copy a traceback into the chat.
  const SESSION_ERRORS = [];
  const SESSION_ERROR_LIMIT = 40;

  function recordError(source, message, context = {}) {
    const text = String((message && message.message) || message || '').slice(0, 4000);
    if (!text) return;
    SESSION_ERRORS.unshift({ at: new Date().toISOString(), source, message: text, context });
    if (SESSION_ERRORS.length > SESSION_ERROR_LIMIT) SESSION_ERRORS.length = SESSION_ERROR_LIMIT;
  }

  function sessionErrors({ agentId = null, toolName = null, limit = 8 } = {}) {
    return SESSION_ERRORS
      .filter(e => !agentId || e.context.agentId === agentId)
      .filter(e => !toolName || e.context.tool === toolName)
      .slice(0, limit);
  }

  function formatErrors(errors) {
    if (!errors || errors.length === 0) return '(none recorded)';
    return errors.map(e => {
      const when = e.at || e.created_at;
      const where = e.context && (e.context.tool || e.context.skill) ? ` ${e.context.tool || e.context.skill}` : '';
      const agent = e.agent_name ? ` [${e.agent_name}]` : '';
      return `- ${when} · ${e.source}${where}${agent}: ${e.message}`;
    }).join('\n');
  }

  async function fetchServerErrors(params = {}) {
    try {
      const qs = new URLSearchParams(Object.entries(params).filter(([, v]) => v !== '' && v != null));
      const r = await apiFetch(`/api/errors?${qs}`);
      if (!r.ok) return [];
      const d = await r.json();
      return d.errors || [];
    } catch (_) {
      return [];
    }
  }

  /**
   * The manual test conversations, for the assistants. When someone says "it
   * answered the wrong thing", this is the transcript that says what it
   * actually answered — so the fix does not have to be guessed from a summary.
   */
  async function fetchTestConversations(agentId, limit = 5) {
    if (!agentId) return [];
    try {
      const d = await apiListTestSessions(agentId, { limit });
      return d.sessions || [];
    } catch (_) {
      return [];
    }
  }

  function formatTestConversations(sessions, maxTurns = 12) {
    if (!sessions || sessions.length === 0) return '(none yet)';
    return sessions.map(sn => {
      const msgs = sn.messages || [];
      const shown = msgs.slice(-maxTurns);
      const head = `- ${new Date(sn.started_at).toLocaleString()} · ${msgs.length} messages`
        + (shown.length < msgs.length ? ` (last ${shown.length} shown)` : '');
      const body = shown.map(m => {
        const who = m.role === 'user' ? 'user' : 'agent';
        const tools = (m.tools || []).map(t => ` [called ${t.name} -> ${String(t.result || '').slice(0, 120)}]`).join('');
        const text = String(m.content || '').replace(/\s+/g, ' ').slice(0, 400);
        return `    ${who}: ${text}${m.skill ? ` [skill ${m.skill}]` : ''}${tools}`;
      }).join('\n');
      return `${head}\n${body}`;
    }).join('\n');
  }

  /* ─────────────────── ACCOUNT API SETTINGS ─────────────────── */
  // One key, provider and model for the whole account: every agent, every
  // channel and every assistant. Kept in a module variable so the many call
  // sites don't each have to thread it through props; App owns the state and
  // mirrors it here, so a change re-renders the tree that reads it.
  const MODELS_BY_PROVIDER = { claude: CLAUDE_MODELS, openai: OPENAI_MODELS, ollama: OLLAMA_MODELS };
  const DEFAULT_MODEL = { claude: CLAUDE_MODELS[1], openai: OPENAI_MODELS[0], ollama: OLLAMA_MODELS[0] };

  let ACCOUNT_API = { provider: 'claude', apiKey: '', model: DEFAULT_MODEL.claude, ollamaHost: '', assistantLanguage: 'en' };
  function accountApi() { return ACCOUNT_API; }
  function setAccountApi(cfg) {
    ACCOUNT_API = { ...ACCOUNT_API, ...(cfg || {}) };
    UI_LANG = ACCOUNT_API.assistantLanguage === 'he' ? 'he' : 'en';
    // The bidi rule for Hebrew is a stylesheet's job, and this is how it hears
    // about the language.
    try { document.documentElement.setAttribute('data-ui-lang', UI_LANG); } catch (e) { /* no DOM */ }
  }

  /* ── the interface's language ──
     English unless the account switched it in Settings. Mirrored in a module
     variable rather than passed down: every string a person reads goes through
     L(), and the setting is read in hundreds of places that have no business
     taking a prop for it. Changing it re-renders the tree, because the same
     save that changes it also sets the settings state in App. */
  let UI_LANG = 'en';
  function uiLang() { return UI_LANG; }
  function uiHe() { return UI_LANG === 'he'; }
  /** L('Delete', 'מחק') — the English first, because that is the default. */
  function L(en, he) { return UI_LANG === 'he' ? he : en; }
  function uiDir() { return UI_LANG === 'he' ? 'rtl' : 'ltr'; }
  function accountApiUsable(cfg) {
    const c = cfg || ACCOUNT_API;
    return c.provider === 'ollama' ? !!c.ollamaHost : !!c.apiKey;
  }

  /* ─────────────────── API ─────────────────── */
  function getAuth() {
    try { return JSON.parse(sessionStorage.getItem('agentforge_auth') || 'null'); } catch { return null; }
  }
  function getToken() { const a = getAuth(); return a ? a.token : ''; }
  function apiFetch(path, opts = {}) {
    const token = getToken();
    const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...(opts.headers || {}) };
    return fetch(path, { ...opts, headers });
  }
  // Keys prefixed with "_" are UI-only state (_isNew drives the one-off
  // highlight on a freshly duplicated card). They must never be persisted:
  // a stored _isNew makes the card glow again on every single load.
  function stripUiFields(agent) {
    return Object.fromEntries(Object.entries(agent || {}).filter(([k]) => !k.startsWith('_')));
  }

  async function apiList() {
    const agents = await apiFetch('/api/agents').then(r => r.json());
    /* _branch says whether this is the live agent or an unpublished draft, so
       it survives the UI-field strip that _isNew is the reason for. */
    return Array.isArray(agents)
      ? agents.map(a => ({ ...stripUiFields(a), _branch: a._branch }))
      : agents;
  }
  async function apiCreate(agent) {
    const r = await apiFetch('/api/agents', { method: 'POST', body: JSON.stringify(stripUiFields(agent)) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      const err = new Error(data.error || `Create failed (${r.status})`);
      err.status = r.status;
      throw err;
    }
    return data;
  }
  async function apiUpdate(agent) {
    const r = await apiFetch(`/api/agents/${agent.id}`, { method: 'PUT', body: JSON.stringify(stripUiFields(agent)) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      const err = new Error(data.error || `Save failed (${r.status})`);
      err.status = r.status;
      throw err;
    }
    return data;
  }
  async function apiDelete(id) {
    return apiFetch(`/api/agents/${id}`, { method: 'DELETE' });
  }

  async function apiBranches(agentId, diff) {
    const q = diff ? `?diff=${encodeURIComponent(diff)}` : '';
    const r = await apiFetch(`/api/agents/${agentId}/branches${q}`);
    if (!r.ok) throw new Error(`Could not load branches (${r.status})`);
    return r.json();
  }
  async function apiBranchAction(agentId, body, method = 'POST') {
    const r = await apiFetch(`/api/agents/${agentId}/branches`, { method, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `That did not work (${r.status})`);
    return d;
  }
  async function apiDeleteBranch(agentId, branch) {
    const r = await apiFetch(`/api/agents/${agentId}/branches?branch=${encodeURIComponent(branch)}`, { method: 'DELETE' });
    if (!r.ok) throw new Error(`Could not discard it (${r.status})`);
  }
  async function apiAgentOnBranch(agentId, branch) {
    const r = await apiFetch(`/api/agents/${agentId}?branch=${encodeURIComponent(branch)}`);
    if (!r.ok) throw new Error(`Could not load that branch (${r.status})`);
    return r.json();
  }
  async function apiSaveOnBranch(agent, branch) {
    const r = await apiFetch(`/api/agents/${agent.id}?branch=${encodeURIComponent(branch)}`,
      { method: 'PUT', body: JSON.stringify(stripUiFields(agent)) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `Save failed (${r.status})`);
    return d;
  }

  async function apiListTokens() {
    const r = await apiFetch('/api/tokens');
    if (!r.ok) throw new Error(`Could not load tokens (${r.status})`);
    const rows = await r.json();
    return Array.isArray(rows) ? rows : [];
  }
  async function apiCreateToken(name) {
    const r = await apiFetch('/api/tokens', { method: 'POST', body: JSON.stringify({ name }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `Could not create a token (${r.status})`);
    return d;
  }
  async function apiRevokeToken(id) {
    const r = await apiFetch(`/api/tokens?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
    if (!r.ok && r.status !== 204) throw new Error(`Could not revoke the token (${r.status})`);
  }

  async function apiGetSettings() {
    const r = await apiFetch('/api/settings');
    if (!r.ok) throw new Error(`Could not load settings (${r.status})`);
    return r.json();
  }
  async function apiSaveSettings(patch) {
    const r = await apiFetch('/api/settings', { method: 'PUT', body: JSON.stringify(patch) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `Could not save settings (${r.status})`);
    return d;
  }

  async function apiListAssistantSessions(params = {}) {
    const qs = new URLSearchParams(Object.entries(params).filter(([, v]) => v !== '' && v != null));
    const r = await apiFetch(`/api/assistant-sessions?${qs}`);
    if (!r.ok) throw new Error(`Could not load assistant history (${r.status})`);
    return r.json();
  }
  // Saved once per turn; a failure here must never interrupt the conversation.
  function saveAssistantSession(session) {
    return apiFetch('/api/assistant-sessions', { method: 'PUT', body: JSON.stringify(session) }).catch(() => {});
  }
  async function deleteAssistantSession(id) {
    return apiFetch(`/api/assistant-sessions?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
  }

  /* ── manual test conversations ──
     Stored server-side under source 'test': hidden from Interactions, shown in
     the agent's Manual tests tab, and readable by every assistant. */
  async function saveTestSession(id, agentId, messages) {
    try {
      await apiFetch('/api/chat-sessions', {
        method: 'PUT',
        body: JSON.stringify({ id, agentId, messages }),
      });
    } catch (_) { /* never let a failed save break the conversation */ }
  }

  async function apiListTestSessions(agentId, params = {}) {
    const qs = new URLSearchParams(
      Object.entries({ source: 'test', agentId, limit: 50, ...params })
        .filter(([, v]) => v !== '' && v !== null && v !== undefined)
    );

  /**
   * One turn of a real conversation.
   *
   * The same endpoint the embedded widget posts to: the agent runs on the
   * server, branch routing picks which version answers, and the conversation
   * is stored as a 'widget' interaction. Deliberately a plain fetch with no
   * token — this is the end user's path, not the builder's.
   */
  async function liveChatTurn(agentId, messages, sessionId) {
    const r = await fetch(`/api/widget/${agentId}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, sessionId }),
    });
    const raw = await r.text();
    let data;
    try { data = JSON.parse(raw); }
    catch (_) { throw new Error(`Server returned non-JSON (${r.status}): ${raw.slice(0, 200)}`); }
    if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
    if (!data.content) throw new Error('Empty response from server');
    return data.content;
  }

  /**
   * What Google's refusal actually means.

   * `access_denied` is what every mailbox but the ones on the Cloud project's
   * test-user list gets back while the OAuth consent screen is still in
   * Testing. It reads as "no permission" and sends people looking for a
   * setting in this platform, which does not have one.

  function gmailFailureText(code) {
    const raw = String(code || '');
    if (/access_denied|admin_policy_enforced|org_internal/i.test(raw)) {
      return L(
        'Google would not let that mailbox connect.\n\n'
        + 'This is set on Google\'s side, not here. While the project\'s OAuth consent screen is in '
        + '"Testing", only the Google accounts listed as Test users may connect — every other address '
        + 'is refused exactly like this. Add the address under APIs & Services → OAuth consent screen → '
        + 'Test users, or publish the consent screen and have the app verified.\n\n'
        + '(If you pressed Cancel on Google\'s screen, this is also what comes back.)\n\n'
        + `Google said: ${raw}`,
        'גוגל לא אפשרה לתיבה הזו להתחבר.\n\n'
        + 'זו הגדרה בצד של גוגל, לא כאן. כל עוד מסך ההסכמה (OAuth consent screen) של הפרויקט במצב '
        + '"Testing", רק חשבונות גוגל שרשומים כ-Test users יכולים להתחבר — כל כתובת אחרת נדחית בדיוק ככה. '
        + 'צריך להוסיף את הכתובת ב-APIs & Services ← OAuth consent screen ← Test users, או לפרסם את מסך '
        + 'ההסכמה ולעבור אימות.\n\n'
        + '(אם לחצת ביטול במסך של גוגל, זו אותה תשובה.)\n\n'
        + `גוגל אמרה: ${raw}`);
    }
    return L(`Gmail connection failed: ${raw}`, `חיבור Gmail נכשל: ${raw}`);
  }

  /* ─────────────────── DEBOUNCE ─────────────────── */
  function useDebounce(fn, delay) {
    const timerRef = useRef(null);
    return useCallback((...args) => {
      clearTimeout(timerRef.current);
      timerRef.current = setTimeout(() => fn(...args), delay);
    }, [fn, delay]);
  }

  /* ─────────────────── STATE / REDUCER ─────────────────── */
  const AppContext = createContext(null);

  function makeAgent(overrides = {}) {
    return {
      id: uid(),
      name: 'New AI Chatbot',
      avatar: DEFAULT_AVATAR,
      openingMessage: 'Hello! How can I help you today?',
      basePrompt: '',
      skills: [],
      tools: [],
      apiConfig: { provider: 'claude', apiKey: '', model: 'claude-sonnet-4-5', ollamaHost: '' },
      dlp: { creditCard: false, israeliId: false },
      scrapeUrls: [],
      emailEnabled: false,
      whatsapp: { enabled: false, phoneNumberId: '', accessToken: '', appSecret: '', verifyToken: '' },
      createdAt: new Date().toISOString(),
      ...overrides,
    };
  }

  function reducer(state, action) {
    switch (action.type) {
      case 'HYDRATE': return { ...state, agents: action.agents };
      case 'CREATE_AGENT': {
        const agent = makeAgent();
        return { ...state, agents: [agent, ...state.agents], view: 'editor', editingId: agent.id };
      }
      case 'UPDATE_AGENT': return {
        ...state,
        agents: state.agents.map(a => a.id === action.agent.id ? action.agent : a),
      };
      /* Which version you are editing, and nothing else. The save that reports
         it is debounced, so by the time the answer comes back the agent in
         hand may already have later keystrokes in it — replacing the whole
         record here would throw them away. */
      case 'SET_BRANCH': return {
        ...state,
        agents: state.agents.map(a => a.id === action.id ? { ...a, _branch: action.branch } : a),
      };
      case 'DELETE_AGENT': return {
        ...state,
        agents: state.agents.filter(a => a.id !== action.id),
        view: state.editingId === action.id ? 'list' : state.view,
        editingId: state.editingId === action.id ? null : state.editingId,
      };
      case 'DUPLICATE_AGENT': {
        const src = state.agents.find(a => a.id === action.id);
        if (!src) return state;
        const copy = { ...JSON.parse(JSON.stringify(src)), id: uid(), name: src.name + ' (Copy)', _isNew: true };
        const idx = state.agents.findIndex(a => a.id === action.id);
        const agents = [...state.agents];
        agents.splice(idx + 1, 0, copy);
        return { ...state, agents };
      }
      // Drops _isNew once the highlight has played, so leaving the page and
      // coming back doesn't replay it.
      case 'CLEAR_NEW': return { ...state, agents: state.agents.map(a => a._isNew ? stripUiFields(a) : a) };
      case 'SET_VIEW': return { ...state, view: action.view, editingId: action.editingId || state.editingId };
      /* `agent` carries the exact version to talk to — the branch the editor
         is on, which is not the copy the list holds. `live` runs the
         conversation through the real channel instead of the test path. */
      case 'OPEN_CHAT': return {
        ...state,
        chatAgentId: action.id,
        chatAgentSnapshot: action.agent || null,
        chatBranch: action.branch || null,
        chatLive: !!action.live,
        chatInitialSessionId: action.sessionId || null,
      };
      case 'CLOSE_CHAT': return {
        ...state,
        chatAgentId: null, chatAgentSnapshot: null, chatBranch: null,
        chatLive: false, chatInitialSessionId: null,
      };
      default: return state;
    }
  }

  /* ═══════════════════ DESIGN PRIMITIVES ═══════════════════

  /** The small uppercase mono label that sits over every page title. */
  /**

        ? { fontSize: 11, fontWeight: 700, color: 'var(--text-muted)', ...style }

  /**
   * Two weights, one shape. `primary` is the amber one — at most one per
   * screen; everything else is `ghost`, a card-coloured button that only
   * lights up under the cursor.
   */
  function Btn({ variant = 'ghost', icon, children, onClick, title, disabled, danger, style, size = 'md' }) {
    const [hot, setHot] = useState(false);
    const pad = size === 'sm' ? '7px 12px' : '10px 17px';
    const font = size === 'sm' ? 12.5 : 13;
    const primary = variant === 'primary';
    const base = primary
      ? { background: hot ? 'var(--primary-hover)' : 'var(--primary)', color: '#0a0a0a', border: '1px solid transparent', boxShadow: hot ? '0 4px 18px var(--primary-glow)' : '0 2px 10px var(--primary-glow)' }
      : { background: hot ? 'var(--bg-hover)' : 'var(--bg-card)', color: danger ? 'var(--danger)' : (hot ? 'var(--text)' : 'var(--text-2)'), border: `1px solid ${hot && !danger ? 'rgba(239,159,39,0.35)' : 'var(--border)'}` };
    return (
      <button onClick={onClick} title={title} disabled={disabled}
        onMouseEnter={() => !disabled && setHot(true)} onMouseLeave={() => setHot(false)}
        style={{
          display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 7,
          padding: pad, borderRadius: 'var(--r-md)', fontSize: font, fontWeight: 600,
          whiteSpace: 'nowrap', cursor: disabled ? 'default' : 'pointer',

          ...base, ...style,
        }}>
        {icon && <span style={{ display: 'flex', alignItems: 'center' }}>{icon}</span>}
        {children}
      </button>
    );
  }

  /**
   * A one-line field that becomes as many lines as the text needs.

   * An opening message is often a paragraph; in a plain input everything past
   * the first line simply scrolls out of sight.
   */
  function GrowField({ value, onChange, placeholder, minRows = 1, maxRows = 6, style }) {
    const ref = useRef(null);
    const resize = useCallback(() => {
      const el = ref.current;
      if (!el) return;
      const line = 21;                       // 14px text at 1.5
      const pad = 21;                        // 10px top + 10px bottom + border
      el.style.height = 'auto';
      const wanted = Math.max(el.scrollHeight, minRows * line + pad);
      el.style.height = Math.min(wanted, maxRows * line + pad) + 'px';
      el.style.overflowY = wanted > maxRows * line + pad ? 'auto' : 'hidden';
    }, [minRows, maxRows]);

    useEffect(() => { resize(); }, [value, resize]);

    return (
      <textarea
        ref={ref}
        dir="auto"
        rows={minRows}
        value={value || ''}
        placeholder={placeholder}
        onChange={e => { onChange(e.target.value); resize(); }}
        style={{ resize: 'none', lineHeight: 1.5, display: 'block', ...style }}
      />
    );
  }

  /**
   * Ask before something that cannot be undone.
   *
   * It states what is about to disappear rather than asking "are you sure",
   * because that is the question the person actually needs answered.
   */
  function ConfirmDialog({ title, body, confirmLabel, cancelLabel, busy, onConfirm, onCancel }) {
    confirmLabel = confirmLabel || L('Delete', 'מחק');
    cancelLabel = cancelLabel || L('Cancel', 'ביטול');
    useEffect(() => {
      function onKey(e) {
        if (e.key === 'Escape') onCancel();
        if (e.key === 'Enter' && !busy) onConfirm();
      }
      document.addEventListener('keydown', onKey);
      return () => document.removeEventListener('keydown', onKey);
    }, [onCancel, onConfirm, busy]);

    return (
      <div onClick={onCancel} style={{
        position: 'fixed', inset: 0, background: 'rgba(15,23,42,0.35)',
        display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 400, padding: 20,
      }}>
        <div onClick={e => e.stopPropagation()} dir="rtl" style={{
          width: 'min(430px, 100%)', background: 'var(--bg-card)',
          border: '1px solid var(--border)', borderRadius: 'var(--r-lg)',
          boxShadow: 'var(--shadow-lg)', padding: 22,
        }}>
          <div dir="auto" style={{ fontWeight: 800, fontSize: 16.5, lineHeight: 1.4 }}>{title}</div>
          {body && (
            <div dir="auto" style={{ fontSize: 13, color: 'var(--text-2)', marginTop: 10, lineHeight: 1.7 }}>{body}</div>
          )}
          <div style={{ display: 'flex', gap: 10, marginTop: 20, justifyContent: 'flex-start' }}>
            <button onClick={onConfirm} disabled={busy}
              style={{ padding: '9px 18px', borderRadius: 'var(--r-md)', cursor: busy ? 'default' : 'pointer',
                       background: 'var(--danger)', color: '#fff', border: '1px solid var(--danger)',
                       fontSize: 13, fontWeight: 700, opacity: busy ? 0.6 : 1 }}>
              {busy ? '…' : confirmLabel}
            </button>
            <button onClick={onCancel} disabled={busy}
              style={{ padding: '9px 18px', borderRadius: 'var(--r-md)', cursor: 'pointer',
                       background: 'var(--bg-card)', color: 'var(--text-2)',
                       border: '1px solid var(--border)', fontSize: 13, fontWeight: 600 }}>
              {cancelLabel}
            </button>
          </div>
        </div>
      </div>
    );
  }

  /* ─────────────────── ICON BUTTON ─────────────────── */
  function IconBtn({ onClick, title, children, danger, style, disabled }) {

  /* An AI Chatbot wears the platform's mark, in a colour of its own. Eight of
     them, one per leg, all far enough apart to tell at 18px. */
  const AVATAR_COLORS = [
    '#EF9F27',  // the brand's amber
    '#0d9488',  // teal
    '#6d5ce0',  // violet
    '#2563eb',  // blue
    '#16a34a',  // green
    '#dc2626',  // red
    '#db2777',  // pink
    '#475569',  // slate
  ];
  const DEFAULT_AVATAR_COLOR = AVATAR_COLORS[0];

  /**
   * The colour an AI Chatbot's mark is drawn in.
   *
   * What is stored is a hex colour. Anything else is from before the mark
   * replaced emoji and uploaded pictures — those are turned into a colour by
   * their own text, so an AI Chatbot that used to be 🤖 keeps one colour
   * rather than changing every time the page loads.
   */
  function avatarColor(value) {
    const v = (value || '').trim();
    if (/^#[0-9a-f]{6}$/i.test(v)) return v;
    if (!v) return DEFAULT_AVATAR_COLOR;
    let h = 0;
    for (let i = 0; i < v.length; i++) h = (h * 31 + v.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  /* The same drawing as a plain string, for the HTML this app hands out
     rather than renders: the embed snippet. `api/_mark.js` is the server's
     copy of this, for the widget it serves. */
function markSvgString(color, size = 30) {
  const c = /^#[0-9a-f]{6}$/i.test((color || '').trim()) ? color.trim() : '#EF9F27';
  const dark = (hex, amount) => {
    const n = parseInt(hex.slice(1), 16);
    const mix = v => Math.round(v * (1 + amount));
    return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(mix)
      .map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('');
  };
  const eye = dark(c, -0.55), tip = dark(c, -0.35);
  const leg = (pts) => `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="272 20 136 136" width="${size}" height="${size}">`
    + `<ellipse cx="340" cy="108" rx="21" ry="29" fill="${c}"/>`
    + `<ellipse cx="340" cy="72" rx="14" ry="14" fill="${c}"/>`
    + `<circle cx="335" cy="70" r="3.5" fill="${eye}"/><circle cx="345" cy="70" r="3.5" fill="${eye}"/>`
    + `<path d="M345,136 C372,138 390,122 390,98 C390,72 374,56 379,38" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round"/>`
    + `<polygon points="375,40 382,24 389,40" fill="${tip}"/>`
    + leg('319,95 293,80 278,72') + leg('319,105 291,102 276,100') + leg('319,115 291,119 276,124') + leg('319,125 293,136 281,146')
    + leg('361,95 387,80 402,72') + leg('361,105 389,102 404,100') + leg('361,115 389,119 404,124') + leg('361,125 387,136 399,146')
    + `<path d="M328,62 L313,48" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round"/>`
    + `<path d="M313,48 L304,40" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`
    + `<path d="M313,48 L309,57" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`
    + `<path d="M352,62 L367,48" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round"/>`
    + `<path d="M367,48 L376,40" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`
    + `<path d="M367,48 L371,57" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`
    + `</svg>`;
}

  function AvatarDisplay({ value, size = 22, style: extraStyle = {} }) {
    return (
      <svg viewBox="272 20 136 136" width={size} height={size} aria-hidden="true"
           style={{ flexShrink: 0, display: 'block', ...extraStyle }}>
        {spiderPaths(avatarColor(value))}
      </svg>
    );
  }

  /* ─────────────────── RICH PROMPT EDITOR ─────────────────── */
  function RichPromptEditor({ value, onChange, fill }) {
    // Opens as a read-through of the prompt — collapsible sections, @tool and
    // #Skill highlighted. Editing is a deliberate click on Edit.
    const [mode, setMode] = useState('preview');
    const [collapsed, setCollapsed] = useState(new Set());
    const textRef = useRef(null);

    useEffect(() => {
      if (fill) return;   // the workspace sizes the editor with flex instead
      if (textRef.current) {
        textRef.current.style.height = 'auto';
        textRef.current.style.height = Math.max(320, textRef.current.scrollHeight) + 'px';
      }
    }, [value, mode, fill]);

    // Pressing Edit means "I want to type now" — with the caret at the END, so
    // the first keystroke appends instead of landing at position 0 and pushing
    // itself into the middle of the first heading.
    useEffect(() => {
      if (mode !== 'edit') return;
      const el = textRef.current;
      if (!el) return;
      el.focus();
      const end = el.value.length;
      el.setSelectionRange(end, end);
    }, [mode]);

    function insertHeading() {
      const el = textRef.current;
      if (!el) return;
      const pos = el.selectionStart;
      const newVal = value.slice(0, pos) + '\n## New Section\n' + value.slice(pos);
      onChange(newVal);
    }

    function toggleSection(key) {
      setCollapsed(s => { const n = new Set(s); n.has(key) ? n.delete(key) : n.add(key); return n; });
    }

    function collapseAll(sections) { setCollapsed(new Set(sections.map(s => s.key))); }
    function expandAll() { setCollapsed(new Set()); }

    // Parse sections for preview
    function parseSections() {
      const lines = (value || '').split('\n');
      const sections = [];
      let current = null;
      lines.forEach((line, i) => {
        const m = line.match(/^## (.+)$/);
        if (m) {
          if (current) sections.push(current);
          current = { key: m[1] + '_' + i, title: m[1], lines: [] };
        } else if (current) {
          current.lines.push(line);
        } else {
          if (!sections.length || sections[sections.length-1].key !== '__intro') {
            sections.push({ key: '__intro', title: null, lines: [line] });
          } else {
            sections[sections.length-1].lines.push(line);
          }
        }
      });
      if (current) sections.push(current);
      return sections;
    }

    function renderInlineChips(text) {
      const parts = text.split(/(@\w+|#\w+)/g);
      return parts.map((part, i) => {
        if (part.match(/^@\w+$/)) return <span key={i} style={{ background: 'rgba(239,159,39,0.2)', color: 'var(--primary)', borderRadius: 4, padding: '1px 5px', fontSize: 12, fontWeight: 600 }}>{part}</span>;
        if (part.match(/^#\w+$/)) return <span key={i} style={{ background: 'rgba(20,184,166,0.2)', color: 'var(--teal)', borderRadius: 4, padding: '1px 5px', fontSize: 12, fontWeight: 600 }}>{part}</span>;
        return part;
      });
    }

    const sections = parseSections();
    const sectionKeys = sections.filter(s => s.title).map(s => s.key);

    return (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, ...(fill ? { height: '100%', minHeight: 0, flex: 1, minWidth: 0, width: '100%' } : {}) }}>
        {/* Toolbar */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '6px 8px', background: 'var(--bg-hover)', borderRadius: 'var(--r-sm)', flexWrap: 'wrap' }}>
          {mode === 'edit' ? (
            <button onClick={insertHeading} style={{ background: 'var(--bg-input)', color: 'var(--text-2)', padding: '4px 10px', borderRadius: 'var(--r-sm)', fontSize: 12, fontWeight: 600 }}>## Heading</button>
          ) : sectionKeys.length > 0 ? (
            <React.Fragment>
              <button onClick={() => collapseAll(sections.filter(s=>s.title))} style={{ background: 'transparent', color: 'var(--text-muted)', padding: '4px 8px', borderRadius: 'var(--r-sm)', fontSize: 12 }}>Collapse All</button>
              <button onClick={expandAll} style={{ background: 'transparent', color: 'var(--text-muted)', padding: '4px 8px', borderRadius: 'var(--r-sm)', fontSize: 12 }}>Expand All</button>
            </React.Fragment>
          ) : null}
          <div style={{ flex: 1 }} />
          <SegTabs value={mode} onChange={setMode} style={{ padding: 2 }}
            items={[{ id: 'preview', label: 'Preview' }, { id: 'edit', label: 'Edit' }]} />
        </div>

        {mode === 'edit' ? (
          <div style={{ position: 'relative', ...(fill ? { flex: 1, minHeight: 0, display: 'flex' } : {}) }}>
            <textarea
              ref={textRef}
              value={value || ''}
              onChange={e => onChange(e.target.value)}
              dir="auto"
              style={{ fontFamily: "'JetBrains Mono','Fira Code',monospace", fontSize: 13, resize: 'none', lineHeight: 1.6, borderRadius: 'var(--r-md)', ...(fill ? { flex: 1, height: '100%', minHeight: 0 } : { minHeight: 320 }) }}
              placeholder="Write your system prompt here…"
            />
            <span style={{ position: 'absolute', bottom: 10, right: 14, fontSize: 11, color: 'var(--text-muted)' }}>{(value || '').length}</span>
          </div>
        ) : (
          <div style={{ background: 'var(--bg-input)', borderRadius: 'var(--r-md)', border: '1px solid var(--border)', padding: '12px 16px', overflowY: 'auto', ...(fill ? { flex: 1, minHeight: 0 } : { minHeight: 320 }) }}>
            {sections.length === 0 && <span style={{ color: 'var(--text-muted)', fontSize: 13 }}>No content yet…</span>}
            {sections.map(section => (
              <div key={section.key} style={{ marginBottom: 8 }}>
                {section.title ? (
                  <>
                    <div
                      onClick={() => toggleSection(section.key)}
                      style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 12px', background: 'var(--bg-hover)', borderRadius: 'var(--r-sm)', cursor: 'pointer', marginBottom: 4 }}
                    >
                      <span style={{ color: 'var(--text-muted)', fontSize: 12 }}>{collapsed.has(section.key) ? '▶' : '▼'}</span>
                      <span style={{ fontWeight: 700, color: 'var(--text)', fontSize: 14 }}>{section.title}</span>
                    </div>
                    {!collapsed.has(section.key) && (
                      <div style={{ padding: '4px 16px', color: 'var(--text-2)', fontSize: 13, lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>
                        {section.lines.map((ln, i) => <div key={i}>{renderInlineChips(ln) || '\u00a0'}</div>)}
                      </div>
                    )}
                  </>
                ) : (
                  <div style={{ padding: '4px 4px', color: 'var(--text-2)', fontSize: 13, lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>
                    {section.lines.map((ln, i) => <div key={i}>{renderInlineChips(ln) || '\u00a0'}</div>)}
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  /* ─────────────────── MONACO EDITOR ─────────────────── */
  let monacoLoadPromise = null;
  function loadMonaco() {
    if (monacoLoadPromise) return monacoLoadPromise;
    monacoLoadPromise = new Promise(resolve => {
      if (window.monaco) { resolve(window.monaco); return; }
      require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
      require(['vs/editor/editor.main'], () => resolve(window.monaco));
    });
    return monacoLoadPromise;
  }

  function MonacoPython({ value, onChange, height = 420, bare }) {
    const containerRef = useRef(null);
    const editorRef = useRef(null);
    // A minimap of forty lines of Python, on a phone, is a stripe of noise
    // taking width the code needs.
    const phone = useIsMobile();
    // The editor is created once and outlives every re-render, so the change
    // handler has to reach the *current* onChange. Capturing the first one made
    // it write into a stale agent, which could undo edits made since — such as
    // wiping a tool that was created after this editor mounted.
    const onChangeRef = useRef(onChange);
    useEffect(() => { onChangeRef.current = onChange; }, [onChange]);
    // Loading a different tool's code calls setValue, which fires a change
    // event; without this the echo would be reported as a user edit.
    const applyingExternal = useRef(false);

    useEffect(() => {
      let editor;
      loadMonaco().then(monaco => {
        if (!containerRef.current) return;
        editor = monaco.editor.create(containerRef.current, {
          value: value || '',
          language: 'python',
          theme: 'vs',
          fontSize: 14,
          fontFamily: "'JetBrains Mono', 'Fira Code', monospace",
          lineNumbers: 'on',
          minimap: { enabled: !phone },
          automaticLayout: true,
          wordWrap: phone ? 'on' : 'off',
          bracketPairColorization: { enabled: true },
          scrollBeyondLastLine: false,
          padding: { top: 12, bottom: 12 },
        });
        editorRef.current = editor;
        editor.onDidChangeModelContent(() => {
          if (applyingExternal.current) return;
          if (onChangeRef.current) onChangeRef.current(editor.getValue());
        });
      });
      return () => { if (editorRef.current) editorRef.current.dispose(); };
    }, []);

    // Sync external value changes without causing loops
    useEffect(() => {
      const ed = editorRef.current;
      if (!ed || ed.getValue() === value) return;
      applyingExternal.current = true;
      try { ed.setValue(value || ''); } finally { applyingExternal.current = false; }
    }, [value]);

    return <div ref={containerRef} className={bare ? undefined : 'monaco-container'} style={{ height }} />;
  }

  /* ─────────────────── PARAMETER EDITOR ─────────────────── */
  function ParameterEditor({ parameters = [], onChange }) {
    function addParam() {
      onChange([...parameters, { name: '', type: 'string', description: '' }]);
    }
    function removeParam(i) {
      onChange(parameters.filter((_, idx) => idx !== i));
    }
    function updateParam(i, field, val) {
      onChange(parameters.map((p, idx) => idx === i ? { ...p, [field]: val } : p));
    }
    return (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
          <label style={{ fontSize: 12, color: 'var(--text-2)' }}>Parameters</label>
          <button onClick={addParam} style={{ background: 'var(--bg-hover)', color: 'var(--primary)', padding: '3px 10px', borderRadius: 'var(--r-sm)', fontSize: 12, fontWeight: 600 }}>＋ Add param</button>
        </div>
        {parameters.length === 0 && (
          <div style={{ fontSize: 12, color: 'var(--text-muted)', padding: '6px 0' }}>No parameters — tool is called without structured inputs.</div>
        )}
        {parameters.map((p, i) => (
          // The description wraps onto its own line, so it stays readable in
          // the workspace's narrow side panel.
          <div key={i} style={{ display: 'flex', gap: 8, marginBottom: 8, alignItems: 'center', flexWrap: 'wrap' }}>
            <input value={p.name} onChange={e => updateParam(i, 'name', e.target.value)} placeholder="param_name" style={{ flex: '1 1 110px', minWidth: 90, fontSize: 12 }} />
            <select value={p.type} onChange={e => updateParam(i, 'type', e.target.value)} style={{ flex: '0 0 96px', fontSize: 12 }}>
              <option value="string">string</option>
              <option value="number">number</option>
              <option value="integer">integer</option>
              <option value="boolean">boolean</option>
            </select>
            <input value={p.description} onChange={e => updateParam(i, 'description', e.target.value)} placeholder="Description for the model…" style={{ flex: '1 1 100%', fontSize: 12 }} />
            <button onClick={() => removeParam(i)} style={{ background: 'transparent', color: 'var(--danger)', padding: '4px 6px', borderRadius: 'var(--r-sm)', fontSize: 14, flexShrink: 0 }}>✕</button>
          </div>
        ))}
        {parameters.length > 0 && (
          <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 4, background: 'var(--bg-hover)', borderRadius: 'var(--r-sm)', padding: '6px 10px' }}>
            In Python: <span style={{ color: 'var(--primary)', fontFamily: 'monospace' }}>def run(**kwargs)</span> →{' '}
            {parameters.map(p => <span key={p.name} style={{ color: 'var(--teal)', fontFamily: 'monospace', marginRight: 8 }}>{p.name} = kwargs.get("{p.name}")</span>)}
          </div>
        )}
      </div>
    );
  }

  /* ─────────────────── CONFIGURATION TAB ─────────────────── */
  /* The platform's own mark, as an image an agent can wear. A new agent gets
     it instead of a stock robot, and the picker offers it back. */
  const DEFAULT_AVATAR = DEFAULT_AVATAR_COLOR;


  function ConfigurationTab({ agent, onUpdate, stacked }) {
    const [pickingColor, setPickingColor] = useState(false);
    const [askAI, setAskAI] = useState(false);

    // The assistant hands back several fields at once, and undo hands the old
    // ones back the same way.
    function applyFields(fields) {
      const updated = JSON.parse(JSON.stringify(agent));
      Object.entries(fields).forEach(([key, val]) => { updated[key] = val; });
      onUpdate(updated);
    }

    function update(path, val) {
      const updated = JSON.parse(JSON.stringify(agent));
      path.reduce((obj, key, i) => {
        if (i === path.length - 1) obj[key] = val;
        return obj[key];
      }, updated);
      onUpdate(updated);
    }


    return (
      /*
       * Two columns: the settings on the left, the base prompt on the right
       * where it gets the full height of the screen, and its assistant opening
       * as a third column beside it.
       */
      <div style={stacked
        ? { display: 'flex', flexDirection: 'column', gap: 14 }                                   /* phone: one column */
        : { display: 'flex', gap: 18, height: '100%', minHeight: 560, alignItems: 'stretch' }}>
        <div style={stacked
          ? { display: 'flex', flexDirection: 'column', gap: 14 }
          : { flex: '0 1 460px', minWidth: 300, display: 'flex', flexDirection: 'column', gap: 20, overflowY: 'auto', paddingRight: 4 }}>
        {/* Identity */}
        <div style={{ background: 'var(--bg-panel)', borderRadius: 'var(--r-lg)', padding: 24, border: '1px solid var(--border)' }}>
          <div style={{ fontWeight: 700, marginBottom: 16, fontSize: 15 }}>Identity</div>
          <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start', flexWrap: 'wrap' }}>
            {/* The mark, in this AI Chatbot's colour. No frame around it —
                the drawing is the avatar, not a tile with something in it. */}
            <div style={{ position: 'relative' }}>
              <button onClick={() => setPickingColor(v => !v)} title="Pick a colour"
                style={{ background: 'transparent', padding: 4, borderRadius: 12, display: 'flex' }}>
                <AvatarDisplay value={agent.avatar} size={56} />
              </button>
              {pickingColor && (
                <div style={{
                  position: 'absolute', top: 70, left: 0, zIndex: 100,
                  background: 'var(--bg-card)', border: '1px solid var(--border)',
                  borderRadius: 'var(--r-md)', padding: 8, boxShadow: 'var(--shadow)',
                  display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 2,
                }}>
                  {AVATAR_COLORS.map(c => {
                    const on = avatarColor(agent.avatar) === c;
                    return (
                      <button key={c} title={c}
                        onClick={() => { update(['avatar'], c); setPickingColor(false); }}
                        style={{
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          padding: 6, borderRadius: 10, background: on ? 'var(--bg-hover)' : 'transparent',
                          border: `1px solid ${on ? 'var(--border)' : 'transparent'}`,
                        }}>
                        <AvatarDisplay value={c} size={26} />
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
            <div style={{ flex: 1, minWidth: 200, display: 'flex', flexDirection: 'column', gap: 10 }}>
              <div>
                <label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 4, display: 'block' }}>AI Chatbot Name</label>
                <input value={agent.name} onChange={e => update(['name'], e.target.value)} dir="auto" />
              </div>
              <div>
                <label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 4, display: 'block' }}>Opening Message</label>
                <GrowField value={agent.openingMessage} onChange={v => update(['openingMessage'], v)}
                           minRows={1} maxRows={8}
                           placeholder="The first thing the AI Chatbot says" />
              </div>
            </div>
          </div>
        </div>

        {/* The key, provider and model are account-wide — see Settings */}

  /* ─────────────────── SKILLS ─────────────────── */
  function SkillsTab({ agent, onUpdate, onRailList }) {
    const skills = agent.skills || [];
    const [target, setTarget] = useState(() => (skills.length ? { kind: 'skill', id: skills[0].id } : null));
    const [panelTab, setPanelTab] = useState('config');   // config | assistant

    const selected = target ? skills.find(sk => sk.id === target.id) || null : null;

    // The open skill can disappear (deleted here or elsewhere) — pick another.
    useEffect(() => {
      if (!selected) setTarget(skills.length ? { kind: 'skill', id: skills[0].id } : null);
    }, [!!selected, skills.length]);

    /* The skills are listed in the editor's rail, under Skills, rather than in
       a column of their own — the prompt is what needs the room. The handlers
       go through a ref so a click never runs against a stale agent. */
    const railRef = useRef({});
    railRef.current = { select: id => setTarget({ kind: 'skill', id }), add: addSkill };
    const railSig = skills.map(sk => `${sk.id}:${sk.name}`).join('|');
    const activeId = target ? target.id : null;
    useEffect(() => {
      if (!onRailList) return;
      onRailList({
        sections: [{
          label: 'Skills',
          items: skills.map(sk => ({
            key: sk.id, label: sk.name || 'untitled', active: sk.id === activeId,
            onClick: () => railRef.current.select(sk.id),
          })),
        }],
        newLabel: '＋ New skill',
        onNew: () => railRef.current.add(),
      });
      return () => onRailList(null);
    }, [onRailList, railSig, activeId]);

    function patch(fields) {
      if (selected) onUpdate({ ...agent, skills: skills.map(sk => sk.id === target.id ? { ...sk, ...fields } : sk) });
    }

    function addSkill() {
      const created = {
        id: uid(),
        name: uniqueName(skills.map(sk => sk.name), 'New Skill', ' '),
        description: '',
        prompt: '',
      };
      onUpdate({ ...agent, skills: [...skills, created] });
      setTarget({ kind: 'skill', id: created.id });
    }

    function deleteCurrent() {
      onUpdate({ ...agent, skills: skills.filter(sk => sk.id !== target.id) });
    }

    // An agent with no skills at all: offer the one action that makes sense.
    if (!selected) {
      return (
        <div style={{ maxWidth: 720 }}>
          <EmptyState icon={Icons.target} title="No skills yet" subtitle="Skills give the AI Chatbot focused modes it can switch into" />
          <button onClick={addSkill}
            style={{ marginTop: 14, background: 'var(--primary)', color: '#0a0a0a', padding: '9px 18px', borderRadius: 'var(--r-md)', fontWeight: 700, fontSize: 13 }}>
            ＋ New skill
          </button>
        </div>
      );
    }

    return (
      <div style={{ display: 'flex', flexDirection: 'column', height: '100%', minHeight: 620, gap: 12 }}>
        <WorkspaceHeader
          badge="#"
          name={selected.name || 'untitled skill'}
          subtitle={selected.description || 'No description — the AI Chatbot uses it to decide when to switch'}
          actions={
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
              <span style={{ fontSize: 11, color: 'var(--success)' }}>saved automatically</span>
              <IconBtn onClick={deleteCurrent} danger title="Delete skill">{Icons.trash}</IconBtn>
            </div>
          }
        />

        <div style={{ flex: 1, minHeight: 0, display: 'flex', gap: 12 }}>
          {/* Prompt */}
          <div style={{ ...WORKSPACE_PANEL, flex: 1, minWidth: 0 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 12px', borderBottom: '1px solid var(--border)', background: 'var(--bg-panel)', flexShrink: 0 }}>
              <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.08em', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Skill Prompt</span>
              <span style={{ fontSize: 12, fontFamily: "'JetBrains Mono','Fira Code',monospace", color: 'var(--text)', background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: '6px 6px 0 0', padding: '5px 12px', marginBottom: -10 }}>
                {(selected.name || 'untitled').replace(/\s+/g, '_')}.md
              </span>
              <button onClick={() => setPanelTab('assistant')} title="Ask AI to write or change this prompt"
                style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 5, fontSize: 12, fontWeight: 700, padding: '4px 11px', borderRadius: 'var(--r-xl)', background: panelTab === 'assistant' ? 'var(--teal)' : 'var(--teal-dim)', color: panelTab === 'assistant' ? '#04211e' : 'var(--teal)', border: '1px solid var(--teal)' }}>
                Ask AI
              </button>
            </div>
            <div style={{ flex: 1, minHeight: 0, padding: 10, display: 'flex', flexDirection: 'column' }}>
              <RichPromptEditor fill value={selected.prompt} onChange={v => patch({ prompt: v })} />
            </div>
          </div>

          {/* Configuration */}
          <div style={{ ...WORKSPACE_PANEL, width: 'clamp(300px, 30%, 420px)', flexShrink: 0 }}>
            <WorkspacePanelTabs
              tabs={[
                { id: 'config', label: 'Configuration' },
                { id: 'assistant', label: 'Assistant' },
              ]}
              active={panelTab}
              onChange={setPanelTab}
            />
            <div style={{ display: panelTab === 'config' ? 'flex' : 'none', flexDirection: 'column', gap: 14, padding: 14, overflowY: 'auto' }}>
              <div>
                <label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 4, display: 'block' }}>Name</label>
                <input value={selected.name} onChange={e => patch({ name: e.target.value })} dir="auto" placeholder="e.g. Code Reviewer" />
              </div>
              <div>
                <label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 4, display: 'block' }}>Description</label>
                <input value={selected.description} onChange={e => patch({ description: e.target.value })} dir="auto" placeholder="When should the AI Chatbot use this skill?" />
              </div>
              <div style={{ fontSize: 11, color: 'var(--text-muted)', lineHeight: 1.6, background: 'var(--bg-hover)', borderRadius: 'var(--r-sm)', padding: '8px 10px' }}>
                💡 The AI Chatbot reads the description to decide when to invoke this skill. Type <span style={{ color: 'var(--teal)' }}>#{(selected.name || 'SkillName').replace(/\s+/g, '')}</span> in chat to force-switch, and <span style={{ color: 'var(--primary)' }}>@toolName</span> in the prompt to call a tool.
              </div>
            </div>

            {/* Kept mounted so the conversation survives tab switches */}
            <div style={{ display: panelTab === 'assistant' ? 'flex' : 'none', flexDirection: 'column', flex: 1, minHeight: 0 }}>
              <AssistantPanel
                agent={agent}
                kind="skill"
                subject={selected}
                targetKey={target.id}
                onApply={patch}
              />
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* ─────────────────── TOOLS TAB ─────────────────── */
  /* ── EnvVarEditor: key-value pairs for tool env vars ── */
  function EnvVarEditor({ envVars = [], onChange }) {
    function add() { onChange([...envVars, { key: '', value: '' }]); }
    function update(i, field, val) { const n = envVars.map((e, idx) => idx === i ? { ...e, [field]: val } : e); onChange(n); }
    function remove(i) { onChange(envVars.filter((_, idx) => idx !== i)); }
    return (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
          <label style={{ fontSize: 12, color: 'var(--text-2)', fontWeight: 600 }}>Environment Variables</label>
          <button onClick={add} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', border: '1px solid var(--border)', borderRadius: 'var(--r-sm)', padding: '3px 10px', fontSize: 12, cursor: 'pointer' }}>＋ Add</button>
        </div>
        {envVars.length === 0
          ? <div style={{ fontSize: 12, color: 'var(--text-muted)', padding: '4px 0' }}>No variables — add API keys or endpoint URLs here.</div>
          : envVars.map((ev, i) => (
            <div key={i} style={{ display: 'flex', gap: 6, marginBottom: 6, alignItems: 'center' }}>
              <input value={ev.key} onChange={e => update(i, 'key', e.target.value)} placeholder="KEY" style={{ flex: '0 0 140px', fontFamily: 'monospace', fontSize: 12 }} />
              <input value={ev.value} onChange={e => update(i, 'value', e.target.value)} placeholder="value" style={{ flex: 1, fontFamily: 'monospace', fontSize: 12 }} />
              <button onClick={() => remove(i)} style={{ background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer', fontSize: 15, padding: '0 4px' }}
                onMouseEnter={e => e.currentTarget.style.color = 'var(--danger)'}
                onMouseLeave={e => e.currentTarget.style.color = 'var(--text-muted)'}>×</button>
            </div>
          ))
        }
      </div>
    );
  }

  /* ── ToolRunPanel: Input / Output / Errors + Run, under the code editor ── */
  function ToolRunPanel({ tool, onResult }) {
    const [tab, setTab] = useState('input');
    const [running, setRunning] = useState(false);
    const [result, setResult] = useState(null); // { ok, text, ms }
    const formRef = useRef(null);
    const params = (tool.parameters || []).filter(p => p.name);

    async function run() {
      setRunning(true);
      setResult(null);
      const t0 = performance.now();
      try {
        const packages = (tool.packages || '').split(',').map(x => x.trim()).filter(Boolean);
        const envVars = Object.fromEntries((tool.envVars || []).filter(ev => ev.key).map(ev => [ev.key, ev.value]));
        // Read the input values straight off the form at submit time.
        const formData = new FormData(formRef.current);
        const typedInputs = {};
        params.forEach(pp => {
          const raw = formData.get(pp.name) || '';
          typedInputs[pp.name] = pp.type === 'integer' ? parseInt(raw, 10) || 0
                               : pp.type === 'number'  ? parseFloat(raw) || 0
                               : raw;
        });
        const resp = await fetch('/api/run-tool', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: tool.code || '', inputs: typedInputs, packages, env_vars: envVars }),
        });
        const data = await resp.json();
        const ms = Math.round(performance.now() - t0);
        const res = data.error ? { ok: false, text: data.error, ms } : { ok: true, text: data.result, ms };
        setResult(res);
        if (onResult) onResult({ ...res, inputs: typedInputs });
        if (!res.ok) recordError('tool', data.error, { tool: tool.name, inputs: typedInputs });
        setTab(res.ok ? 'output' : 'errors');
      } catch (err) {
        const res = { ok: false, text: err.message, ms: Math.round(performance.now() - t0) };
        setResult(res);
        if (onResult) onResult({ ...res, inputs: {} });
        recordError('tool', err.message, { tool: tool.name });
        setTab('errors');
      } finally {
        setRunning(false);
      }
    }

    const tabs = [
      { id: 'input',  label: 'Input' },
      { id: 'output', label: 'Output', dot: result?.ok ? 'var(--success)' : null },
      { id: 'errors', label: 'Errors', dot: result && !result.ok ? 'var(--danger)' : null },
    ];

    return (
      <div style={{ borderTop: '1px solid var(--border)', background: 'var(--bg-panel)', display: 'flex', flexDirection: 'column', height: 208, flexShrink: 0 }}>
        {/* Tab bar + Run */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 2, padding: '0 8px', borderBottom: '1px solid var(--border)', flexShrink: 0 }}>
          {tabs.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)}
              style={{
                background: 'transparent', padding: '9px 12px', fontSize: 12,
                fontWeight: tab === t.id ? 700 : 500,
                color: tab === t.id ? 'var(--text)' : 'var(--text-muted)',
                borderBottom: `2px solid ${tab === t.id ? 'var(--primary)' : 'transparent'}`,
                display: 'flex', alignItems: 'center', gap: 6,
              }}>
              {t.label}
              {t.dot && <span style={{ width: 6, height: 6, borderRadius: '50%', background: t.dot }} />}
            </button>
          ))}
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 10 }}>
            {result && <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>⏱ {result.ms}ms</span>}
            <button onClick={run} disabled={running}
              style={{ background: running ? 'var(--bg-hover)' : 'var(--success)', color: running ? 'var(--text-muted)' : '#04240f', borderRadius: 'var(--r-sm)', padding: '5px 14px', fontWeight: 700, fontSize: 12, display: 'flex', alignItems: 'center', gap: 6 }}>
              {running
                ? <><span style={{ display: 'inline-block', width: 11, height: 11, border: '2px solid var(--text-muted)', borderTop: '2px solid var(--text)', borderRadius: '50%', animation: 'spin 0.7s linear infinite' }} /> Running…</>
                : '▶ Run'}
            </button>
          </div>
        </div>

        {/* Panels — all stay mounted so the form keeps its values */}
        <div style={{ flex: 1, minHeight: 0, overflowY: 'auto' }}>
          <form ref={formRef} onSubmit={e => { e.preventDefault(); run(); }}
            style={{ display: tab === 'input' ? 'flex' : 'none', flexDirection: 'column', gap: 7, padding: '12px 14px' }}>
            {params.length === 0 ? (
              <div style={{ fontSize: 12, color: 'var(--text-muted)', fontFamily: "'JetBrains Mono','Fira Code',monospace" }}>// No inputs configured.</div>
            ) : params.map(pp => (
              <div key={pp.name} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: 12, color: 'var(--text-2)', fontFamily: 'monospace', minWidth: 130, flexShrink: 0 }}>
                  {pp.name}<span style={{ color: 'var(--text-muted)' }}>: {pp.type || 'string'}</span>
                </span>
                <input name={pp.name} placeholder={pp.description || pp.name} style={{ flex: 1, fontSize: 13, fontFamily: 'monospace' }} />
              </div>
            ))}
            <button type="submit" style={{ display: 'none' }} />
          </form>

          <div style={{ display: tab === 'output' ? 'block' : 'none', padding: '12px 14px' }}>
            {result?.ok
              ? <pre style={{ margin: 0, fontSize: 12, fontFamily: "'JetBrains Mono','Fira Code',monospace", color: 'var(--text)', whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>{result.text}</pre>
              : <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>Run the tool to see its output.</div>}
          </div>

          <div style={{ display: tab === 'errors' ? 'block' : 'none', padding: '12px 14px' }}>
            {result && !result.ok
              ? <pre style={{ margin: 0, fontSize: 12, fontFamily: "'JetBrains Mono','Fira Code',monospace", color: 'var(--danger)', whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>{result.text}</pre>
              : <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>No errors.</div>}
          </div>
        </div>
      </div>
    );
  }

  /* ─────────────────── FILE ICON HELPER ─────────────────── */
  function fileIcon(title) {
    const t = (title || '').toLowerCase();
    if (t.endsWith('.pdf') || t.includes('pdf')) return '📕';
    if (t.endsWith('.docx') || t.endsWith('.doc')) return '📘';
    if (t.endsWith('.xlsx') || t.endsWith('.xls')) return '📗';
    return '📄';
  }

  /* ─────────────────── TOOL CODE ASSISTANT ─────────────────── */

  // One-shot chat completion against the agent's own provider/key/model — no
  // agent tools, no RAG, no DLP. This is the builder talking to the model, not
  // an end user talking to the agent.
  async function callPlainLLM(system, history, maxTokens = 4096) {
    const { apiKey, provider, model } = accountApi();

    if (provider === 'claude') {
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({ model, max_tokens: maxTokens, system, messages: history }),
      });
      const d = await r.json();
      if (!r.ok) {
        recordError('provider', d.error?.message || JSON.stringify(d), { provider: 'claude', model });
        throw new Error(d.error?.message || JSON.stringify(d));
      }
      return d.content.find(c => c.type === 'text')?.text || '';
    }

    if (provider === 'ollama') {
      const host = (accountApi().ollamaHost || 'http://localhost:11434').replace(/\/$/, '');
      const r = await fetch('/api/ollama-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ host, path: '/v1/chat/completions', body: { model, messages: [{ role: 'system', content: system }, ...history] } }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error?.message || JSON.stringify(d));
      return d.choices?.[0]?.message?.content || '';
    }

    const r = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({ model, max_tokens: maxTokens, messages: [{ role: 'system', content: system }, ...history] }),
    });
    const d = await r.json();
    if (!r.ok) {
      recordError('provider', d.error?.message || JSON.stringify(d), { provider, model });
      throw new Error(d.error?.message || JSON.stringify(d));
    }
    return d.choices?.[0]?.message?.content || '';
  }

  // The sandbox the generated code has to run in (api/run_tool.py).
  const TOOL_RUNTIME_CONTRACT = [
    'The code MUST define `def run(**kwargs):` — the platform calls that function and nothing else.',
    "The tool's declared parameters arrive as keyword arguments inside kwargs. Read them defensively: kwargs.get('name').",
    'Declared environment variables are readable with os.environ — never hardcode a secret or an API key.',
    'Whatever run() returns is converted with str(), so return a string or something readable as one.',
    'Only the Python standard library is available, plus pip packages listed in the tool\'s Packages field.',
    'There is no persistent filesystem and no local network. Outbound HTTPS is allowed.',
    'Raise nothing on the happy path: catch expected failures and return a short human-readable error string instead.',
  ];

  function buildToolAssistantPrompt(tool, diagnostics = {}) {
    const params = (tool.parameters || []).filter(p => p.name);
    const { lastRun, errors } = diagnostics;
    return [
