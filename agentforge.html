        transition: 'border-color 0.18s, box-shadow 0.18s',
      }}>
        <textarea
          value={value}
          onChange={e => onChange(e.target.value)}
          onFocus={() => setFocus(true)}
          onBlur={() => setFocus(false)}
          onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSend(); } }}
          dir="auto"
          rows={1}
          disabled={disabled}
          placeholder={placeholder}
          style={{
            flex: 1, resize: 'none', border: 'none', background: 'transparent', outline: 'none',
            boxShadow: 'none', fontSize: 14.5, lineHeight: 1.6, padding: '13px 12px', maxHeight: 150,
          }}
        />
        <button onClick={onSend} disabled={disabled || !value.trim()} title="Send"
          style={{
            width: 40, height: 40, borderRadius: '50%', flexShrink: 0, marginBottom: 4,
            background: 'var(--primary)', color: '#0a0a0a', fontSize: 17, fontWeight: 800,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            opacity: disabled || !value.trim() ? 0.45 : 1,
          }}>↑</button>
      </div>
    );
  }

  function HomeChatView({
    agents, user, onAgentsChanged, language, onOpenAgent, onTestAgent,
    onSaved, onSessionChange, onHandoffUsed, restore, newChatNonce, seed, stacked,
  }) {
    const copy = HOME_COPY[language === 'en' ? 'en' : 'he'];
    const dir = language === 'en' ? 'ltr' : 'rtl';
    const hasAgents = (agents || []).length > 0;

    /* Whether this account had any agent when the conversation started. It
       only softens the wording for a newcomer — whether to interview is the
       model's call, on what the user actually asked for. Held from the start
       all the same, so the agent built mid-conversation does not change it. */
    const firstRunRef = useRef(!hasAgents);
    const firstRun = firstRunRef.current;

    const {
      messages, input, setInput, pending, send, noKey, startNewChat, loadSession, listRef, focusAgentId, sessionId,
    } = usePlatformAssistant({
      agents, onAgentsChanged, language, onSaved, seed,
      onSeedUsed: () => onHandoffUsed && onHandoffUsed('seed'),
      systemExtra: homeSystemExtra(!firstRunRef.current, language),
    });

    useEffect(() => {
      if (messages.length === 0) firstRunRef.current = !hasAgents;
    }, [messages.length, hasAgents]);

    /* Two things drive this chat from the outside: the sidebar picking a past
       conversation, and the New chat button. Both arrive as a changing nonce so
       the same pick twice still takes. */
    useEffect(() => { if (onSessionChange) onSessionChange(sessionId); }, [sessionId]);

    /* These arrive from elsewhere in the app — a conversation picked in the
       sidebar, a question a button asked. They are instructions, not state:
       once carried out they have to be cleared, or leaving this screen and
       coming back replays them and the home screen never opens fresh. */
    const restoredRef = useRef(null);
    useEffect(() => {
      if (!restore || restore.nonce === restoredRef.current) return;
      restoredRef.current = restore.nonce;
      loadSession(restore.session);
      if (onHandoffUsed) onHandoffUsed('restore');
    }, [restore]);

    const clearedRef = useRef(newChatNonce);
    useEffect(() => {
      if (newChatNonce === clearedRef.current) return;
      clearedRef.current = newChatNonce;
      startNewChat();
    }, [newChatNonce]);

    const started = messages.length > 0;
    const built = (agents || []).find(a => a.id === focusAgentId) || null;
    const chips = firstRun ? copy.firstChips : copy.backChips;
    const hello = greeting(user && user.username);
    const threadTitle = built
      ? L(`Building ${built.name}`, `בונים את ${built.name}`)
      : firstRun ? copy.buildingFirst : copy.talking;

    const keyWarning = noKey && (
      <div dir={dir} style={{
        background: 'rgba(245,158,11,0.12)', border: '1px solid rgba(245,158,11,0.35)',
        borderRadius: 'var(--r-md)', padding: '9px 14px', fontSize: 12.5, color: 'var(--warning)',
        width: 'min(720px, 100%)', margin: '0 auto 12px', textAlign: 'center',
      }}>{copy.noKey}</div>
    );

    /* ── nothing said yet: the mark in the middle of the screen ── */
    if (!started) {
      return (
        <div style={{
          flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center',
          padding: stacked ? '0 18px 18px' : '0 34px 50px', overflowY: 'auto',
        }}>
          <SpiderLogo size={stacked ? 150 : 200} />
          <div dir={dir} style={{
            fontSize: stacked ? 25 : 30, fontWeight: 800, letterSpacing: '-0.035em',
            textAlign: 'center', marginTop: -4,
          }}>{hello}</div>
          <div dir={dir} style={{
            fontSize: 13.5, color: 'var(--text-2)', textAlign: 'center',
            marginTop: 9, lineHeight: 1.65, maxWidth: 520,
          }}>{firstRun ? copy.firstSub : copy.backSub}</div>

          <div style={{ width: '100%', marginTop: 24 }}>
            {keyWarning}
            <HomeComposer value={input} onChange={setInput} onSend={() => send(input)}
              disabled={pending || noKey} dir={dir}
              placeholder={stacked ? copy.placeholderShort : copy.placeholder} />
          </div>

          <div dir={dir} style={{
            display: 'flex', flexWrap: 'wrap', gap: 8, justifyContent: 'center',
            marginTop: 18, width: 'min(760px, 100%)',
          }}>
            {chips.map(text => (
              <button key={text} onClick={() => send(text)} disabled={noKey}
                style={{
                  background: 'var(--bg-card)', border: '1px solid var(--border)', color: 'var(--text-2)',
                  borderRadius: 999, padding: '8px 15px', fontSize: 12.5, fontWeight: 600,
                }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--primary)'; e.currentTarget.style.color = 'var(--text)'; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.color = 'var(--text-2)'; }}
              >{text}</button>
            ))}
          </div>

          {!stacked && (
            <div dir={dir} style={{ marginTop: 26, fontSize: 11.5, color: 'var(--text-muted)' }}>{copy.foot}</div>
          )}
        </div>
      );
    }

    /* ── in conversation: the mark shrinks into the corner ── */
    const thread = (
      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
        <div dir={dir} style={{
          flexShrink: 0, display: 'flex', alignItems: 'center', gap: 11,
          padding: stacked ? '8px 16px 6px' : '14px 30px 10px',
        }}>
          <div style={{
            width: 38, height: 38, borderRadius: 12, flexShrink: 0,
            background: 'var(--primary-dim)', border: '1px solid rgba(239,159,39,0.28)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <SpiderLogo size={34} busy={pending} />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div dir="auto" style={{ fontWeight: 800, fontSize: 15, letterSpacing: '-0.02em', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {threadTitle}
            </div>
            <div dir="ltr" style={{ fontSize: 11.5, color: 'var(--text-muted)', marginTop: 2, textAlign: dir === 'rtl' ? 'right' : 'left' }}>
              {accountApi().model || 'no model'}
            </div>
          </div>
          <button onClick={startNewChat}
            style={{
              fontSize: 11.5, fontWeight: 650, padding: '6px 12px', borderRadius: 10, flexShrink: 0,
              background: 'var(--bg-card)', border: '1px solid var(--border)', color: 'var(--text-2)',
            }}>{copy.newChat}</button>
        </div>

        <div ref={listRef} style={{
          flex: 1, minHeight: 0, overflowY: 'auto',
          padding: stacked ? '4px 16px 8px' : '6px 30px 10px',
        }}>
          <div style={{ width: 'min(720px, 100%)', margin: '0 auto', display: 'flex', flexDirection: 'column', gap: 12 }}>
            {messages.map((msg, i) => {
              if (msg.role === 'user') {
                return (
                  <div key={msg.id} dir="auto" style={{
                    alignSelf: 'flex-end', maxWidth: '85%', background: 'var(--primary)', color: '#0a0a0a',
                    padding: '10px 14px', borderRadius: '16px 16px 4px 16px', fontSize: 13.5,
                    lineHeight: 1.6, whiteSpace: 'pre-wrap', wordBreak: 'break-word',
                  }}>{msg.content}</div>
                );
              }
              if (msg.role === 'tool') {
                const args = Object.entries(msg.input || {})
                  .map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : String(v)}`)
                  .join(', ');
                return (
                  <div key={msg.id} dir="ltr" style={{
                    alignSelf: 'stretch', background: 'var(--bg-panel)', border: '1px solid var(--border)',
                    borderRadius: 'var(--r-md)', padding: '8px 12px', fontSize: 11.5,
                    fontFamily: MONO, color: 'var(--text-muted)',
                  }}>
                    <div style={{ color: 'var(--teal)' }}>🔧 {msg.name}({args.length > 120 ? args.slice(0, 120) + '…' : args})</div>
                  </div>
                );
              }
              if (msg.role === 'error') {
                return (
                  <div key={msg.id} dir="auto" style={{
                    background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.3)',
                    color: 'var(--danger)', padding: '9px 13px', borderRadius: 'var(--r-md)',
                    fontSize: 12.5, wordBreak: 'break-word',
                  }}>{msg.content}</div>
                );
              }
              /* Only the last answer's options are still worth tapping. */
              const { body, options } = splitOptions(msg.content);
              const live = i === messages.length - 1 && !pending;
              return (
                <div key={msg.id} dir="auto" style={{
                  alignSelf: 'stretch', background: 'var(--bg-card)', border: '1px solid var(--border)',
                  padding: '12px 15px', borderRadius: '16px 16px 16px 4px', fontSize: 13.5,
                  lineHeight: 1.75, wordBreak: 'break-word',
                }}>
                  <div style={{ whiteSpace: 'pre-wrap' }}>{body}</div>
                  {live && options.length > 0 && (
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7, marginTop: 10 }}>
                      {options.map(opt => (
                        <button key={opt} onClick={() => send(opt)}
                          style={{
                            background: 'var(--bg-panel)', border: '1px solid var(--border)', borderRadius: 999,
                            padding: '6px 13px', fontSize: 12, fontWeight: 600, color: 'var(--text-2)',
                          }}
                          onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--primary)'; e.currentTarget.style.color = 'var(--text)'; }}
                          onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.color = 'var(--text-2)'; }}
                        >{opt}</button>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}

            {pending && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '2px 2px 6px' }}>
                <span className="typing-dot" /><span className="typing-dot" /><span className="typing-dot" />
                <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>{copy.thinking}</span>
              </div>
            )}

            {/* On a phone the card rides along with the conversation. */}
            {stacked && (built || firstRun) && (
              <AgentBuildCard agent={built} copy={copy} dir={dir} compact
                onOpen={onOpenAgent} onTest={onTestAgent} />
            )}
          </div>
        </div>

        <div style={{ flexShrink: 0, padding: stacked ? '6px 16px 14px' : '6px 30px 20px' }}>
          {keyWarning}
          <HomeComposer value={input} onChange={setInput} onSend={() => send(input)}
            disabled={pending || noKey} placeholder={copy.answer} dir={dir} />
        </div>
      </div>
    );

    if (stacked) return <div style={{ flex: 1, minHeight: 0, display: 'flex' }}>{thread}</div>;

    /* The column is about an agent taking shape. With nothing being built and
       no interview running, it would be an empty checklist next to a chat
       about something else entirely — so the conversation takes the width. */
    if (!built && !firstRun) return <div style={{ flex: 1, minHeight: 0, display: 'flex' }}>{thread}</div>;

    return (
      <div style={{ flex: 1, minHeight: 0, display: 'flex' }}>
        {thread}
        <aside dir={dir} style={{
          width: 310, flexShrink: 0, borderInlineStart: '1px solid var(--border)',
          background: 'var(--bg-panel)', padding: '16px 18px', overflowY: 'auto',
        }}>
          <Eyebrow style={{ marginBottom: 11 }}>{copy.card.head}</Eyebrow>
          <AgentBuildCard agent={built} copy={copy} dir={dir}
            onOpen={onOpenAgent} onTest={onTestAgent} />
        </aside>
      </div>
    );
  }

  /* ─────────────────── FLOATING ASSISTANT ─────────────────── */
  // The platform assistant follows you across every screen: a bubble that
  // expands into a chat and collapses back, so you can ask it to change
  // something while looking at the thing you want changed.
  // Remembered once, forever: the intro card and the attention ring are a
  // first-visit thing, never a welcome mat you have to push aside every time.
  const ASSISTANT_INTRO_KEY = 'agentforge_assistant_intro_v1';

  function introSeen() {
    try { return localStorage.getItem(ASSISTANT_INTRO_KEY) === '1'; } catch (e) { return true; }
  }
  function markIntroSeen() {
    try { localStorage.setItem(ASSISTANT_INTRO_KEY, '1'); } catch (e) { /* private mode */ }
  }

  /** Anything on screen can hand the assistant a question and pop it open. */
  function askAssistant(prompt) {
    window.dispatchEvent(new CustomEvent('assistant:ask', { detail: { prompt: prompt || '' } }));
  }

  const ASSISTANT_INTRO = {
    he: {
      label: 'שאל את האסיסטנט',
      title: 'האסיסטנט מתפעל את המערכת בשבילך',
      lines: [
        'בונה AI Chatbot שלם מאפס — פרומפט, סקילים וכלים',
        'משנה AI Chatbot קיים, כותב כלי Python ומריץ אותו כדי לבדוק',
        'עונה על כל שאלה על הפלטפורמה ומראה מה קרה בשיחות',
      ],
      examples: ['בנה לי AI Chatbot שירות לקוחות', 'איך מחברים WhatsApp?'],
      dismiss: 'הבנתי',
    },
    en: {
      label: 'Ask the assistant',
      title: 'The assistant operates the platform for you',
      lines: [
        'Builds a whole AI Chatbot from scratch — prompt, skills and tools',
        'Changes an existing AI Chatbot, writes a Python tool and runs it to check',
        'Answers any question about the platform and shows what happened in conversations',
      ],
      examples: ['Build me a customer support AI Chatbot', 'How do I connect WhatsApp?'],
      dismiss: 'Got it',
    },
  };

  /**
   * The first-visit card above the assistant button. It exists because a bare
   * orange circle in the corner tells you nothing about what it can do.
   */
  function AssistantIntroCard({ copy, ltr, onPick, onDismiss }) {
    return (
      <div className="fade-in" dir={ltr ? 'ltr' : 'rtl'} style={{
        position: 'fixed', bottom: 92, right: 24, zIndex: 200,
        width: 'min(340px, calc(100vw / var(--ui-zoom) - 32px))',
        background: 'var(--bg-sidebar)', border: '1px solid var(--primary)',
        borderRadius: 'var(--r-lg)', padding: '15px 16px 14px',
        boxShadow: '0 12px 40px rgba(0,0,0,0.45), 0 0 0 4px var(--primary-glow)',
      }}>
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 9, marginBottom: 9 }}>
          <span style={{ display: 'flex', color: 'var(--primary)', flexShrink: 0, marginTop: 1 }}>{Icons.sparkle}</span>
          <div style={{ flex: 1, fontWeight: 800, fontSize: 14, lineHeight: 1.45 }}>{copy.title}</div>
          <button onClick={onDismiss} title={copy.dismiss}
            style={{ background: 'none', border: 'none', color: 'var(--text-muted)', fontSize: 16, lineHeight: 1, padding: 0, flexShrink: 0 }}>×</button>
        </div>
        <ul style={{ margin: 0, padding: ltr ? '0 0 0 18px' : '0 18px 0 0', fontSize: 12.5, lineHeight: 1.65, color: 'var(--text-2)' }}>
          {copy.lines.map(line => <li key={line} style={{ marginBottom: 2 }}>{line}</li>)}
        </ul>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginTop: 12 }}>
          {copy.examples.map(ex => (
            <button key={ex} onClick={() => onPick(ex)}
              style={{ background: 'var(--bg-card)', border: '1px solid var(--border)', color: 'var(--text-2)', borderRadius: 999, padding: '5px 11px', fontSize: 12, fontWeight: 600, textAlign: 'start' }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--primary)'; e.currentTarget.style.color = 'var(--text)'; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.color = 'var(--text-2)'; }}
            >{ex}</button>
          ))}
        </div>
        <div style={{
          position: 'absolute', bottom: -7, [ltr ? 'left' : 'right']: 28,
          width: 12, height: 12, background: 'var(--bg-sidebar)',
          borderRight: '1px solid var(--primary)', borderBottom: '1px solid var(--primary)',
          transform: 'rotate(45deg)',
        }} />
      </div>
    );
  }

  function FloatingAssistant({ agents, onAgentsChanged, language }) {
    const [open, setOpen] = useState(false);
    const [intro, setIntro] = useState(false);
    const [seed, setSeed] = useState(null);
    const copy = ASSISTANT_INTRO[language === 'en' ? 'en' : 'he'];

    // The card arrives a beat after the page settles, so it reads as a hint
    // rather than as something blocking the screen you just asked for.
    useEffect(() => {
      if (introSeen()) return;
      const t = setTimeout(() => setIntro(true), 900);
      return () => clearTimeout(t);
    }, []);

    function reveal(prompt) {
      markIntroSeen();
      setIntro(false);
      setOpen(true);
      if (prompt) setSeed({ text: prompt, nonce: uid() });
    }

    function dismissIntro() {
      markIntroSeen();
      setIntro(false);
    }

    // "Build with the assistant" and the example chips reach it from anywhere.
    useEffect(() => {
      const onAsk = e => reveal((e.detail || {}).prompt);
      window.addEventListener('assistant:ask', onAsk);
      return () => window.removeEventListener('assistant:ask', onAsk);
    }, []);

    return (
      <React.Fragment>
        {open && (
          <div className="slide-in-right" style={{
            position: 'fixed', bottom: 92, right: 24, zIndex: 200,
            width: 'min(430px, calc(100vw / var(--ui-zoom) - 32px))', height: 'min(640px, calc(100vh / var(--ui-zoom) - 140px))',
            background: 'var(--bg-sidebar)', border: '1px solid var(--border)',
            borderRadius: 'var(--r-lg)', boxShadow: '0 12px 40px rgba(0,0,0,0.45)',
            display: 'flex', flexDirection: 'column', overflow: 'hidden',
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '11px 14px', borderBottom: '1px solid var(--border)', background: 'var(--bg-panel)', flexShrink: 0 }}>
              <span style={{ display: 'flex', color: 'var(--primary)' }}>{Icons.sparkle}</span>
              <div style={{ flex: 1, fontWeight: 700, fontSize: 14 }}>Assistant</div>
              <IconBtn onClick={() => setOpen(false)} title={L('Collapse', 'לקפל')}>▾</IconBtn>
            </div>
            <div style={{ flex: 1, minHeight: 0, padding: '12px 14px 14px', display: 'flex', flexDirection: 'column' }}>
              <PlatformAssistantView
                compact
                seed={seed}
                agents={agents}
                language={language}
                onAgentsChanged={onAgentsChanged}
              />
            </div>
          </div>
        )}

        {/* First visit only: says what the thing in the corner actually is. */}
        {intro && !open && (
          <AssistantIntroCard copy={copy} ltr={language === 'en'} onPick={reveal} onDismiss={dismissIntro} />
        )}

        {/* A labelled pill, not a mystery circle — it only shrinks once it is open. */}
        <button
          onClick={() => { markIntroSeen(); setIntro(false); setOpen(v => !v); }}
          className={!open && intro ? 'assistant-ring' : undefined}
          title={open ? L('Collapse the assistant', 'לקפל את האסיסטנט') : copy.label}
          style={{
            position: 'fixed', bottom: 24, right: 24, zIndex: 200,
            height: 52, borderRadius: 999,
            padding: open ? 0 : '0 20px 0 17px',
            width: open ? 52 : 'auto',
            background: 'var(--primary)', color: '#0a0a0a',
            border: 'none', fontSize: open ? 22 : 14, fontWeight: 700,
            boxShadow: '0 6px 22px var(--primary-glow)',
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 9,
            whiteSpace: 'nowrap', transition: 'transform 0.15s',
          }}
          onMouseEnter={e => { e.currentTarget.style.transform = 'scale(1.04)'; }}
          onMouseLeave={e => { e.currentTarget.style.transform = 'none'; }}
        >
          {open ? '▾' : copy.label}
        </button>
      </React.Fragment>
    );
  }

  /* ─────────────────── ASSISTANT HISTORY ─────────────────── */
  const ASSISTANT_KINDS = {
    platform: { label: L('Platform', 'מערכת · Platform'), short: 'Platform', tone: 'skills', color: 'var(--violet)' },
    tool:     { label: L('Tool', 'כלי · Tool'),          short: 'Tool',     tone: 'tools',  color: 'var(--primary)' },
    skill:    { label: L('Skill', 'סקיל · Skill'),       short: 'Skill',    tone: 'teal',   color: 'var(--teal)' },
  };

  function AssistantHistoryView({ onOpenAgent, stacked }) {
    const [kind, setKind] = useState('');
    const [query, setQuery] = useState('');
    const [data, setData] = useState(null);
    const [error, setError] = useState(null);
    const [loading, setLoading] = useState(true);
    const [open, setOpen] = useState(null);
    const [tick, setTick] = useState(0);

    useEffect(() => {
      let live = true;
      setLoading(true);
      const t = setTimeout(() => {
        apiListAssistantSessions({ kind, q: query, limit: 60 })
          .then(d => { if (live) { setData(d); setError(null); setLoading(false); } })
          .catch(err => { if (live) { setError(err.message); setLoading(false); } });
      }, 250);
      return () => { live = false; clearTimeout(t); };
    }, [kind, query, tick]);

    async function remove(session) {
      if (!window.confirm(L('Delete this conversation from the history?', 'למחוק את השיחה הזאת מההיסטוריה?'))) return;
      await deleteAssistantSession(session.id).catch(() => {});
      if (open && open.id === session.id) setOpen(null);
      setTick(t => t + 1);
    }

    /* ---- one conversation ---- */
    if (open) {
      const meta = ASSISTANT_KINDS[open.kind] || { label: open.kind, color: 'var(--text-2)' };
      const msgs = open.messages || [];
      return (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 22, flexWrap: 'wrap' }}>
            <button onClick={() => setOpen(null)} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13, border: '1px solid var(--border)' }}>← Back</button>
            <div style={{ width: 1, height: 20, background: 'var(--border)' }} />
            <div style={{ minWidth: 0 }}>
              <div style={{ fontWeight: 800, fontSize: 18, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 620 }}>
                {sessionTitle(open.messages) || open.title || L('(untitled)', '(ללא כותרת)')}
              </div>
              <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 3 }}>
                <span style={{ color: meta.color, fontWeight: 700 }}>{meta.label}</span>
                {open.agent_name ? ` · ${open.agent_name}` : ''}
                {open.subject ? ` · ${open.subject}` : ''}
                {` · ${new Date(open.updated_at).toLocaleString()} · ${msgs.length} ` + L('messages', 'הודעות')}
              </div>
            </div>
            {open.agent_id && onOpenAgent && (
              <button onClick={() => onOpenAgent(open.agent_id)}
                style={{ marginLeft: 'auto', background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13, border: '1px solid var(--border)' }}>
                Open AI Chatbot
              </button>
            )}
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, width: '100%' }}>
            {msgs.map((m, i) => {
              if (m.role === 'tool') {
                const args = Object.entries(m.input || {}).map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : String(v)}`).join(', ');
                return (
                  <div key={i} dir="ltr" style={{ background: 'var(--bg-panel)', border: '1px solid var(--border)', borderRadius: 'var(--r-md)', padding: '8px 12px', fontSize: 11.5, fontFamily: "'JetBrains Mono','Fira Code',monospace", color: 'var(--text-muted)' }}>
                    <div style={{ color: 'var(--teal)' }}>🔧 {m.name}({args.length > 200 ? args.slice(0, 200) + '…' : args})</div>
                    {m.result && <div style={{ marginTop: 4, whiteSpace: 'pre-wrap', wordBreak: 'break-word', maxHeight: 200, overflowY: 'auto' }}>{m.result}</div>}
                  </div>
                );
              }
              const isUser = m.role === 'user';
              return (
                <div key={i} dir="auto" style={{
                  alignSelf: isUser ? 'flex-end' : 'stretch', maxWidth: isUser ? '85%' : '100%',
                  background: isUser ? 'var(--primary)' : 'var(--bg-card)',
                  color: isUser ? '#0a0a0a' : 'var(--text)',
                  border: isUser ? 'none' : '1px solid var(--border)',
                  padding: '10px 13px', borderRadius: isUser ? '16px 16px 4px 16px' : '16px 16px 16px 4px',
                  fontSize: 13.5, lineHeight: 1.7, whiteSpace: 'pre-wrap', wordBreak: 'break-word',
                }}>
                  {m.content}
                  {m.applied && m.applied.length > 0 && (
                    <div style={{ fontSize: 11, color: 'var(--success)', marginTop: 6 }}>✓ {L('written to the editor', 'נכתב לעורך')} ({m.applied.join(' + ')})</div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    /* ---- the list ---- */
    const sessions = data?.sessions || [];
    const scopes = [
      { id: '',         label: 'All' },
      { id: 'platform', label: 'Platform' },
      { id: 'tool',     label: 'Tools' },
      { id: 'skill',    label: 'Skills' },
    ];
    const th = { padding: '15px 16px 11px', textAlign: 'start', whiteSpace: 'nowrap' };
    const td = { padding: '12px 16px', fontSize: 13, verticalAlign: 'middle' };

    /* ---- phone: the same list as cards ---- */
    if (stacked) {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12 }}>
            <div style={{ fontWeight: 800, fontSize: 32, letterSpacing: '-0.035em' }}>Assistant</div>
            <CountLabel n={sessions.length} noun="CHAT" />
          </div>
          <Btn variant="primary" icon={Icons.sparkle} onClick={() => askAssistant('')}
               style={{ height: 48, fontSize: 14 }}>Ask the assistant</Btn>

  // whole account, and nothing answers until it is set.
  function ApiKeyNote() {
    const cfg = accountApi();
    const missing = !accountApiUsable(cfg);
    const isOllama = cfg.provider === 'ollama';
    const headline = {
      he: missing ? (isOllama ? 'לא הוגדר שרת Ollama' : 'לא הוגדר API Key') : `מוגדר: ${cfg.provider} · ${cfg.model}`,
      en: missing ? (isOllama ? 'No Ollama server set' : 'No API Key set') : `Using ${cfg.provider} · ${cfg.model}`,
    };
    const body = {
      he: missing
        ? 'הגדירו מפתח אחד במסך Settings — הוא משמש את כל ה-AI Chatbots, כל הערוצים והאסיסטנט. עד אז שום דבר לא יענה.'
        : 'המפתח מוגדר פעם אחת במסך Settings ומשמש את כל ה-AI Chatbots, כל הערוצים והאסיסטנט.',
      en: missing
        ? 'Set one key in Settings — it drives every AI Chatbot, every channel and the assistant. Nothing answers until you do.'
        : 'The key is set once in Settings and drives every AI Chatbot, every channel and the assistant.',
    };
    const strongStyle = { color: missing ? 'var(--warning)' : 'var(--text)' };

    /* What the key IS is on permanent display in the sidebar's runtime card.
       This banner exists only for the case where there isn't one. */
    if (!missing) return null;

    return (
      <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 16 }}>
        <div style={{
          maxWidth: 470, display: 'flex', gap: 9, alignItems: 'flex-start',
          padding: '10px 13px', borderRadius: 'var(--r-md)', fontSize: 12, lineHeight: 1.6,
          background: missing ? 'rgba(245,158,11,0.10)' : 'var(--bg-card)',
          border: `1px solid ${missing ? 'rgba(245,158,11,0.35)' : 'var(--border)'}`,
          color: 'var(--text-2)',
        }}>
          <span style={{ flexShrink: 0 }}>🔑</span>
          <div dir={uiDir()} style={{ minWidth: 0, textAlign: uiHe() ? 'right' : 'left' }}>
            <strong style={strongStyle}>{headline[uiLang()]}</strong>{' — '}{body[uiLang()]}
          </div>
        </div>
      </div>
    );
  }

  /* ─────────────────── LOGIN GATE ─────────────────── */
  function LoginGate({ onLogin }) {
    const [mode, setMode] = useState('login'); // 'login' | 'register'
    const [username, setUsername] = useState('');
    const [password, setPassword] = useState('');
    const [phone, setPhone] = useState('');
    const [error, setError] = useState('');
    const [loading, setLoading] = useState(false);

    function switchMode(m) {
      setMode(m);
      setError('');
      setUsername('');
      setPassword('');
      setPhone('');
    }

    async function handleLogin() {
      if (!username || !password) return;
      setLoading(true);
      setError('');
      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (resp.ok) {
          const data = await resp.json();
          sessionStorage.setItem('agentforge_auth', JSON.stringify(data));
          onLogin(data);
        } else {
          setError('Invalid username or password.');
        }
      } catch {
        setError('Could not connect to server.');
      } finally {
        setLoading(false);
      }
    }

    async function handleRegister() {
      if (!username || !password || !phone) return;
      setLoading(true);
      setError('');
      try {
        const resp = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, phone }),
        });
        if (resp.ok) {
          const data = await resp.json();
          sessionStorage.setItem('agentforge_auth', JSON.stringify(data));
          onLogin(data);
        } else {
          const body = await resp.json().catch(() => ({}));
          setError(body.error || 'Registration failed.');
        }
      } catch {
        setError('Could not connect to server.');
      } finally {
        setLoading(false);
      }
    }

    /* The welcome panel keeps its dark gradient, so its text carries its own
       ink — the page's text colour is written for a light background. */
    const HERO_INK = '#f2f3f7';
    const HERO_INK_DIM = 'rgba(242,243,247,0.66)';

    const isLogin = mode === 'login';
    const canSubmit = isLogin ? (username && password) : (username && password && phone);
    const isMobile = useIsMobile();   // on a phone the form is the whole screen

    return (
      <div style={{ display: 'flex', height: 'calc(100vh / var(--ui-zoom))', background: 'var(--bg-app)', overflow: 'hidden' }}>
        {/* Left panel - branding */}
        <div style={{ flex: 1, display: isMobile ? 'none' : 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', background: 'linear-gradient(135deg, #0b0d10 0%, #0f1320 100%)', borderRight: '1px solid var(--border)', position: 'relative', overflow: 'hidden' }}>
          {/* Decorative glow */}
          <div style={{ position: 'absolute', top: '30%', left: '50%', transform: 'translate(-50%,-50%)', width: 400, height: 400, borderRadius: '50%', background: 'radial-gradient(circle, rgba(239,159,39,0.08) 0%, transparent 70%)', pointerEvents: 'none' }} />
          {/* Watermark logo */}
          {/* The watermark is tuned for the light page; on this dark panel the
              same opacity reads as a second logo. */}
          <BgLogo size={420} wrapStyle={{ bottom: '-60px', left: '-60px', opacity: 0.35 }} />
          <div style={{ position: 'relative', zIndex: 1, textAlign: 'center', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
            <svg viewBox="200 20 280 230" width="220" height="90" role="img" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="340" cy="108" rx="21" ry="29" fill="#EF9F27"/>
              <ellipse cx="340" cy="72" rx="14" ry="14" fill="#EF9F27"/>
              <circle cx="335" cy="70" r="3.5" fill="#854F0B"/>
              <circle cx="345" cy="70" r="3.5" fill="#854F0B"/>
              <path d="M345,136 C372,138 390,122 390,98 C390,72 374,56 379,38" fill="none" stroke="#EF9F27" strokeWidth="8" strokeLinecap="round"/>

  /* ─────────────────── ADMIN: CHAT HISTORY ─────────────────── */
  function AdminChatHistoryView({ onBack }) {
    const PAGE_SIZE = 20;
    const [data, setData]           = useState(null);
    const [offset, setOffset]       = useState(0);
    const [openSession, setOpenSession] = useState(null);

    function load(off) {
      setData(null);
      adminListChatSessions({ limit: PAGE_SIZE, offset: off })
        .then(d => { setData(d); setOffset(off); })
        .catch(() => setData({ sessions: [], total: 0 }));
    }

    useEffect(() => { load(0); }, []);

    if (openSession) {
      const msgs = openSession.messages || [];
      return (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
            <button onClick={() => setOpenSession(null)} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13 }}>← Back</button>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, fontWeight: 700, fontSize: 20 }}>
                <AvatarDisplay value={openSession.agent_avatar} size={32} />
                {openSession.agent_name}
              </div>
              <div style={{ color: 'var(--text-2)', fontSize: 12, marginTop: 2 }}>
                {new Date(openSession.started_at).toLocaleString()} · {msgs.filter(m => m.role === 'user').length} user messages
              </div>
            </div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, width: '100%' }}>
            {msgs.filter(m => m.role === 'user' || m.role === 'assistant').map((m, i) => (
              <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: m.role === 'user' ? 'flex-end' : 'flex-start' }}>
                <div style={{
                  maxWidth: '80%', padding: '10px 14px', fontSize: 14, lineHeight: 1.5,
                  whiteSpace: 'pre-wrap', wordBreak: 'break-word', borderRadius: m.role === 'user' ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
                  background: m.role === 'user' ? 'var(--primary)' : 'var(--bg-card)',
                  color: m.role === 'user' ? '#fff' : 'var(--text)',
                  border: m.role === 'assistant' ? '1px solid var(--border)' : 'none',
                }}>{m.content}</div>
                <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 3, padding: '0 4px' }}>
                  {m.role === 'user' ? 'User' : openSession.agent_name}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const total = data?.total || 0;
    const totalPages = Math.ceil(total / PAGE_SIZE);
    const currentPage = Math.floor(offset / PAGE_SIZE);

    return (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
          <button onClick={onBack} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13 }}>← Back</button>
          <div>
            <div style={{ fontWeight: 700, fontSize: 22 }}>Chat History</div>
            {data && <div style={{ color: 'var(--text-2)', fontSize: 13, marginTop: 2 }}>{total} conversation{total !== 1 ? 's' : ''} across all agents</div>}
          </div>
        </div>

        {!data ? (
          <div style={{ color: 'var(--text-2)', padding: 40 }}>Loading…</div>
        ) : data.sessions.length === 0 ? (
          <div style={{ textAlign: 'center', color: 'var(--text-muted)', paddingTop: 60, fontSize: 14 }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>💬</div>
            No conversations yet.
          </div>
        ) : (
          <>
            <div style={{ background: 'var(--bg-card)', borderRadius: 'var(--r-lg)', border: '1px solid var(--border)', overflow: 'hidden' }}>
              {data.sessions.map((s, i) => {
                const msgs = s.messages || [];
                const userMsgs = msgs.filter(m => m.role === 'user');
                const preview = userMsgs[0]?.content?.slice(0, 80) || '—';
                return (
                  <div key={s.id}
                    onClick={() => setOpenSession(s)}
                    style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '14px 18px', cursor: 'pointer', borderBottom: i < data.sessions.length - 1 ? '1px solid var(--border)' : 'none' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                  >
                    <AvatarDisplay value={s.agent_avatar} size={40} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 14, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', marginBottom: 3 }}>{preview}</div>
                      <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>
                        <span style={{ color: 'var(--text-2)', fontWeight: 500 }}>{s.agent_name}</span>
                        &nbsp;·&nbsp;{userMsgs.length} message{userMsgs.length !== 1 ? 's' : ''}
                        &nbsp;·&nbsp;{new Date(s.started_at).toLocaleDateString()} {new Date(s.started_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                      </div>
                    </div>
                    <div style={{ fontSize: 16, color: 'var(--text-muted)', flexShrink: 0 }}>›</div>
                  </div>
                );
              })}
            </div>

            {totalPages > 1 && (
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, marginTop: 20 }}>
                <button onClick={() => load((currentPage - 1) * PAGE_SIZE)} disabled={currentPage === 0}
                  style={{ padding: '6px 14px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: currentPage === 0 ? 'var(--text-muted)' : 'var(--text)', cursor: currentPage === 0 ? 'default' : 'pointer', fontSize: 13 }}>← Prev</button>
                <span style={{ fontSize: 13, color: 'var(--text-2)' }}>{currentPage + 1} / {totalPages}</span>
                <button onClick={() => load((currentPage + 1) * PAGE_SIZE)} disabled={currentPage >= totalPages - 1}
                  style={{ padding: '6px 14px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: currentPage >= totalPages - 1 ? 'var(--text-muted)' : 'var(--text)', cursor: currentPage >= totalPages - 1 ? 'default' : 'pointer', fontSize: 13 }}>Next →</button>
              </div>
            )}
          </>
        )}
      </div>
    );
  }

  /* ─────────────────── ADMIN: USERS LIST ─────────────────── */
  /**
   * Which AI Chatbots a new account is handed.
   *
   * A starter is frozen when it is marked, so editing your own copy afterwards
   * changes nothing until you refresh it here — and a copy sitting in somebody
   * else's account can never take its place, because this list holds ids. The
   * one thing that needs saying out loud is when the two have drifted apart.
   */
  /** "1 skill", "2 skills" — a count reads wrong without it. */
  function plural(n, noun) { return `${n} ${noun}${n === 1 ? '' : 's'}`; }

  function StarterAgentsPanel() {
    const [data, setData] = useState(null);
    const [busy, setBusy] = useState(null);      // the id being worked on
    const [error, setError] = useState('');
    const [picking, setPicking] = useState(false);

    const load = useCallback(() => (
      adminStarterAgent()
        .then(d => { setData(d); setError(d.error || ''); })
        .catch(err => { setData({ starters: [], candidates: [] }); setError(err.message); })
    ), []);
    useEffect(() => { load(); }, [load]);

    async function act(key, fn) {
      setBusy(key); setError('');
      try { await fn(); await load(); }
      catch (err) { setError(err.message); }
      finally { setBusy(null); }
    }

    const starters = (data && data.starters) || [];
    const candidates = ((data && data.candidates) || []).filter(c => !c.isStarter);

    const card = {
      padding: '15px 18px', marginBottom: 18, borderRadius: 'var(--r-lg)',
      background: 'var(--bg-card)', border: '1px solid var(--border)',
    };

    return (
      <div style={card}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, flexWrap: 'wrap', marginBottom: 12 }}>
          <div style={{ fontWeight: 700, fontSize: 14 }}>Starter AI Chatbots</div>
          <div style={{ fontSize: 11.5, color: 'var(--text-muted)', flex: 1, minWidth: 200 }}>
            Copied into every new account on sign-up, exactly as they were when you marked them.
          </div>
          <Btn size="sm" icon={picking ? undefined : Icons.plus} onClick={() => setPicking(p => !p)}>
            {picking ? 'Close' : 'Add one of yours'}
          </Btn>
        </div>

        {picking && (
          <div style={{
            marginBottom: 14, padding: 10, borderRadius: 'var(--r-md)',
            background: 'var(--bg-panel)', border: '1px solid var(--border)',
          }}>
            {candidates.length === 0 ? (
              <div style={{ fontSize: 12.5, color: 'var(--text-muted)', padding: '6px 4px' }}>
                Every AI Chatbot you own is already a starter.
              </div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 4, maxHeight: 220, overflowY: 'auto' }}>
                {candidates.map(c => (
                  <button key={c.id} disabled={!!busy}
                    onClick={() => act(c.id, () => adminAddStarter(c.id)).then(() => setPicking(false))}
                    style={{
                      display: 'flex', alignItems: 'center', gap: 10, textAlign: 'start',
                      padding: '8px 10px', borderRadius: 8, background: 'transparent',
                      border: '1px solid transparent', color: 'var(--text)', fontSize: 13,
                    }}
                    onMouseEnter={e => { e.currentTarget.style.background = 'var(--bg-hover)'; }}
                    onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; }}>
                    <span dir="auto" style={{ fontWeight: 650, flex: 1, minWidth: 0 }}>{c.name}</span>
                    <span style={{ fontSize: 11.5, color: 'var(--text-muted)' }}>
                      {c.owner} · {c.documents} docs
                    </span>
                    <span style={{ fontSize: 11.5, color: 'var(--primary)', fontWeight: 650 }}>
                      {busy === c.id ? '…' : 'Freeze as starter'}
                    </span>
                  </button>
                ))}
              </div>
            )}
          </div>
        )}

        {starters.length === 0 ? (
          <div style={{
            fontSize: 12.5, color: 'var(--warning)', padding: '10px 12px', lineHeight: 1.6,
            background: 'rgba(245,158,11,0.10)', border: '1px solid rgba(245,158,11,0.35)',
            borderRadius: 'var(--r-md)',
          }}>
            No starters are marked, so a new account begins with nothing in it.
          </div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {starters.map(s => (
              <div key={s.id} style={{
                display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap',
                padding: '10px 12px', borderRadius: 'var(--r-md)',
                background: 'var(--bg-panel)', border: '1px solid var(--border)',
              }}>
                <span dir="auto" style={{ fontWeight: 700, fontSize: 13.5, minWidth: 120 }}>{s.name}</span>
                <span style={{ fontSize: 11.5, color: 'var(--text-muted)', flex: 1, minWidth: 180 }}>
                  {plural(s.skills, 'skill')} · {plural(s.tools, 'tool')} · {plural(s.documents, 'doc')}
                  {s.takenAt ? ` · frozen ${new Date(s.takenAt).toLocaleDateString()}` : ''}
                </span>
                {!s.sourceExists && (
                  <Chip tone="neutral" title="The AI Chatbot this was taken from has been deleted. The copy here still works.">
                    source deleted
                  </Chip>
                )}
                {s.sourceExists && s.sourceChanged && (
                  <Chip tone="tools" title="Your own copy has been edited since this snapshot was taken. New accounts still get the snapshot.">
                    source has changed
                  </Chip>
                )}
                {s.sourceExists && (
                  <Btn size="sm" disabled={busy === s.id}
                    title="Take the snapshot again from the AI Chatbot it came from"
                    onClick={() => act(s.id, () => adminRefreshStarter(s.id, s.sourceAgentId))}>
                    {busy === s.id ? '…' : 'Refresh'}
                  </Btn>
                )}
                <Btn size="sm" danger icon={Icons.trash} disabled={busy === s.id}
                  title="Stop handing this to new accounts"
                  onClick={() => act(s.id, () => adminRemoveStarter(s.id))}>
                  Remove
                </Btn>
              </div>
            ))}
          </div>
        )}

        {error && <div style={{ color: 'var(--danger)', fontSize: 12, marginTop: 10 }}>{error}</div>}
      </div>
    );
  }

  function AdminView({ onSelectUser, myAgents }) {
    const [tab, setTab]             = useState('users');
    const [users, setUsers]         = useState(null);
    const [resetting, setResetting] = useState(null);
    const [resetResult, setResetResult] = useState({});
    const [deleting, setDeleting]   = useState(null);   // userId awaiting confirmation
    const [confirmText, setConfirmText] = useState('');
    const [deleteBusy, setDeleteBusy] = useState(false);
    const [deleteError, setDeleteError] = useState({});
    useEffect(() => {
      adminListUsers().then(setUsers).catch(() => setUsers([]));
    }, []);

    async function handleDelete(u) {
      setDeleteBusy(true);
      setDeleteError(e => ({ ...e, [u.id]: null }));
      try {
        await adminDeleteUser(u.id, confirmText);
        setUsers(list => list.filter(x => x.id !== u.id));
        setDeleting(null);
        setConfirmText('');
      } catch (err) {
        setDeleteError(e => ({ ...e, [u.id]: err.message }));
      } finally {
        setDeleteBusy(false);
      }
    }

    async function handleReset(userId) {
      setResetting(userId);
      try {
        const { tempPassword } = await adminResetPassword(userId);
        setResetResult(r => ({ ...r, [userId]: tempPassword }));
      } catch {
        setResetResult(r => ({ ...r, [userId]: 'Error' }));
      } finally {
        setResetting(null);
      }
    }

    if (tab === 'history') {
      return <AdminChatHistoryView onBack={() => setTab('users')} />;

                      <div style={{ width: 30, height: 30, borderRadius: '50%', flexShrink: 0, background: 'var(--primary-dim)', border: '1px solid rgba(239,159,39,0.25)', color: 'var(--primary)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        {Icons.user}
                      </div>
                      <span style={{ fontWeight: 650, color: 'var(--text)' }}>{u.username}</span>
                    </button>
                  </td>
                  <td style={{ ...td, color: 'var(--text-2)', fontFamily: MONO, fontSize: 12 }}>{u.phone || '—'}</td>

                    <Chip tone={u.is_admin ? 'tools' : 'neutral'}>{u.is_admin ? 'Admin' : 'User'}</Chip>

                      <Btn size="sm" onClick={() => onSelectUser(u)}>View AI Chatbots</Btn>
                      <Btn size="sm" onClick={() => handleReset(u.id)} disabled={resetting === u.id}>

                      </Btn>
                      {resetResult[u.id] && (
                        <Chip tone="live" mono>New: {resetResult[u.id]}</Chip>

                      {deleting === u.id ? (
                        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                          <input

                            style={{ fontSize: 12, padding: '5px 9px', borderRadius: 'var(--r-sm)', background: 'var(--bg-input)', border: '1px solid var(--border)', color: 'var(--text)', width: 150 }}
                          />
                          <Btn size="sm" danger onClick={() => handleDelete(u)} disabled={deleteBusy || confirmText !== u.username}>
                            {deleteBusy ? '…' : 'Delete forever'}
                          </Btn>
                          <Btn size="sm" onClick={() => { setDeleting(null); setConfirmText(''); }}>Cancel</Btn>
                        </div>
                      ) : (
                        <Btn size="sm" danger
                          title={`Delete ${u.username} with all their AI Chatbots and conversations`}
                          onClick={() => { setDeleting(u.id); setConfirmText(''); setDeleteError(e => ({ ...e, [u.id]: null })); }}>
                          Delete

                      )}
                      {deleteError[u.id] && (
                        <span style={{ fontSize: 12, color: 'var(--danger)' }}>{deleteError[u.id]}</span>

                    </div>

                      </div>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  /* ─────────────────── ADMIN: USER AGENTS ─────────────────── */
  function UserAgentsView({ targetUser, myAgents, onBack, stacked }) {
    const [agents, setAgents] = useState(null);
    const [duplicating, setDuplicating] = useState(false);
    const [showDupPicker, setShowDupPicker] = useState(false);
    const [editingAgent, setEditingAgent] = useState(null);

    useEffect(() => {
      reload();
    }, [targetUser.id]);

    function reload() {
      adminListUserAgents(targetUser.id).then(setAgents).catch(() => setAgents([]));
    }

    const saveAdminAgent = useCallback(async (agent) => {
      await adminUpdateAgent(agent).catch(() => {});
    }, []);
    const saveAdminAgentDebounced = useDebounce(saveAdminAgent, 600);

    function handleAdminUpdate(agent) {
      setEditingAgent(agent);
      saveAdminAgentDebounced(agent);
    }

    const [deleting, setDeleting] = useState(null);   // the agent awaiting a yes
    const [deleteBusy, setDeleteBusy] = useState(false);

    async function handleDelete(agent) {
      setDeleting(agent);
    }

    async function reallyDelete(agent) {
      setDeleteBusy(true);
      await adminDeleteAgent(agent.id).catch(() => {});
      setDeleteBusy(false);
      setDeleting(null);
      reload();
    }

    async function handleDuplicateTo(sourceAgentId) {
      setDuplicating(true);
      setShowDupPicker(false);
      try {
        await adminDuplicateTo(sourceAgentId, targetUser.id);
        reload();
      } catch {
        alert('Failed to duplicate AI Chatbot.');
      } finally {
        setDuplicating(false);
      }
    }

    if (editingAgent) {
      // On a phone the desktop editor does not fit; the phone editor does,
      // minus Test — an admin has no test chat for someone else's agent.
      if (stacked) return (
        <MobileAgentEditor
          agent={editingAgent}
          onUpdate={handleAdminUpdate}
          onBack={() => { setEditingAgent(null); reload(); }}
        />
      );
      return (
        <AgentEditor
          agent={editingAgent}
          onUpdate={handleAdminUpdate}
          onBack={() => { setEditingAgent(null); reload(); }}
        />
      );
    }

    return (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
          <button onClick={onBack} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13 }}>← Back</button>
          <div>
            <div style={{ fontWeight: 700, fontSize: 22 }}>Agents of {targetUser.username}</div>
            {agents && <div style={{ color: 'var(--text-2)', fontSize: 13 }}>{agents.length} agent{agents.length !== 1 ? 's' : ''}</div>}
          </div>
          <div style={{ marginLeft: 'auto', position: 'relative' }}>
            <button onClick={() => setShowDupPicker(v => !v)} disabled={duplicating}
              style={{ background: 'var(--primary)', color: '#fff', padding: '8px 16px', borderRadius: 'var(--r-md)', fontWeight: 600, fontSize: 13 }}>
              {duplicating ? 'Duplicating…' : '＋ Duplicate My AI Chatbot Here'}
            </button>
            {showDupPicker && (
              <div style={{ position: 'absolute', right: 0, top: '110%', background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 'var(--r-lg)', padding: 8, minWidth: 220, zIndex: 100, boxShadow: 'var(--shadow)' }}>
                <div style={{ fontSize: 12, color: 'var(--text-2)', padding: '4px 8px 8px' }}>Pick one of your AI Chatbots to copy:</div>
                {myAgents.length === 0 && <div style={{ fontSize: 13, color: 'var(--text-muted)', padding: '8px' }}>No AI Chatbots to copy</div>}
                {myAgents.map(a => (
                  <button key={a.id} onClick={() => handleDuplicateTo(a.id)}
                    style={{ display: 'block', width: '100%', textAlign: 'left', padding: '8px 12px', borderRadius: 'var(--r-md)', fontSize: 13, background: 'transparent', color: 'var(--text)' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                  >
                    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                      <AvatarDisplay value={a.avatar} size={18} /> {a.name}
                    </span>
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>

        {!agents ? (
          <div style={{ color: 'var(--text-2)' }}>Loading…</div>
        ) : agents.length === 0 ? (
          <EmptyState icon="🤖" title="No AI Chatbots" subtitle="This user has no AI Chatbots yet" />
        ) : (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(260px,1fr))', gap: 16 }}>
            {agents.map(a => (
              <div key={a.id} style={{ background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 'var(--r-lg)', padding: 20 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
                  <AvatarDisplay value={a.avatar} size={28} />
                  <div style={{ fontWeight: 600, flex: 1 }}>{a.name}</div>
                </div>
                <div style={{ color: 'var(--text-2)', fontSize: 12, marginBottom: 14, lineHeight: 1.4, minHeight: 32 }}>
                  {a.basePrompt ? a.basePrompt.slice(0, 80) + (a.basePrompt.length > 80 ? '…' : '') : <i>No description</i>}
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button onClick={() => setEditingAgent(a)}
                    style={{ flex: 1, fontSize: 12, padding: '6px', borderRadius: 'var(--r-sm)', background: 'var(--bg-hover)', color: 'var(--text-2)', border: '1px solid var(--border)' }}>
                    ✏️ Edit
                  </button>
                  <button onClick={() => handleDelete(a)}
                    style={{ flex: 1, fontSize: 12, padding: '6px', borderRadius: 'var(--r-sm)', background: 'transparent', color: 'var(--danger)', border: '1px solid var(--danger)' }}>
                    🗑️ Delete
                  </button>
                </div>
              </div>
            ))}
          </div>
        )}

        {deleting && (
          <ConfirmDialog
            title={L(`Delete "${deleting.name}"?`, `למחוק את "${deleting.name}"?`)}
            body={L(`${targetUser.username}'s AI Chatbot goes, and with it every document, conversation and channel it owns. This cannot be undone.`, `ה-AI Chatbot של ${targetUser.username} יימחק על כל המסמכים, השיחות והערוצים שלו. אין ביטול.`)}
            confirmLabel={L('Delete AI Chatbot', 'מחק AI Chatbot')}
            busy={deleteBusy}
            onConfirm={() => reallyDelete(deleting)}
            onCancel={() => setDeleting(null)} />
        )}
      </div>
    );
  }

  /** A command, in a box, with a button that copies it. */
  function CopyableCommand({ command, note }) {
    const [copied, setCopied] = useState(false);
    return (
      <div>
        <div dir="ltr" style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <code style={{ flex: 1, fontFamily: 'monospace', fontSize: 12, background: 'var(--bg-app)',
                         border: '1px solid var(--border)', borderRadius: 'var(--r-sm)',
                         padding: '8px 10px', overflowX: 'auto', whiteSpace: 'nowrap' }}>{command}</code>
          <button onClick={() => navigator.clipboard.writeText(command).then(() => {
                    setCopied(true); setTimeout(() => setCopied(false), 2000);
                  })}
            style={{ padding: '8px 14px', borderRadius: 'var(--r-sm)', cursor: 'pointer', flexShrink: 0,
                     background: copied ? 'var(--success)' : 'var(--bg-hover)',
                     border: '1px solid var(--border)',
                     color: copied ? '#0a0a0a' : 'var(--text-1)', fontSize: 12, fontWeight: 700 }}>
            {copied ? '✓' : L('Copy', 'העתק')}
          </button>
        </div>
        {note && <div style={{ fontSize: 11.5, color: 'var(--text-muted)', marginTop: 6 }}>{note}</div>}
      </div>
    );
  }

  /**
   * Personal access tokens — what the CLI uses instead of a password.
   *
   * A created token is shown once and never again: only its hash is stored, so
   * there is nothing left to show on the next load. That is the point, but it
   * means the one moment it is on screen has to be obvious and easy to copy.
   */
  /**
   * Mint one token: a name, a button that stays inert without one, and the
   * token itself shown the only time it is ever shown. Used in Settings and
   * in the panel that walks you through working from an IDE.
   */
  function TokenMinter({ onCreated, fieldWidth = 200 }) {
    const [name, setName] = useState('');
    const [busy, setBusy] = useState(false);
    const [fresh, setFresh] = useState(null);
    const [error, setError] = useState(null);

    async function create() {
      const clean = name.trim();
      if (!clean || busy) return;
      setBusy(true);
      setError(null);
      try {
        const created = await apiCreateToken(clean);
        setFresh({ token: created.token, name: clean });
        setName('');
        if (onCreated) onCreated();
      } catch (e) { setError(e.message); }
      finally { setBusy(false); }
    }

    return (
      <React.Fragment>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
          <input
            value={name}
            onChange={e => setName(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') create(); }}
            maxLength={80}
            dir="auto"
            placeholder={L('Token name — e.g. laptop', 'שם הטוקן — למשל laptop')}
            style={{ width: fieldWidth, padding: '7px 12px', fontSize: 13 }}
          />
          <button onClick={create} disabled={busy || !name.trim()}
            title={name.trim() ? L('Create a token with this name', 'צור טוקן בשם הזה') : L('Give the token a name first', 'קודם תן לטוקן שם')}
            style={{ padding: '8px 16px', borderRadius: 'var(--r-sm)',
                     cursor: busy || !name.trim() ? 'default' : 'pointer',
                     background: name.trim() ? 'var(--primary)' : 'var(--bg-hover)',
                     color: name.trim() ? '#0a0a0a' : 'var(--text-muted)',
                     border: `1px solid ${name.trim() ? 'var(--primary)' : 'var(--border)'}`,
                     fontSize: 13, fontWeight: 700, whiteSpace: 'nowrap',
                     opacity: busy ? 0.6 : 1, flexShrink: 0 }}>
            {busy ? '…' : L('Create token', 'צור טוקן')}
          </button>
        </div>

        {fresh && (
          <div style={{ marginTop: 12, padding: '12px 14px', borderRadius: 'var(--r-md)',
                        background: 'rgba(250,204,21,0.10)', border: '1px solid rgba(250,204,21,0.35)' }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--warning)', marginBottom: 8 }}>
              <span dir="auto">{fresh.name}</span> — {L('copy it now, it is never shown again', 'העתק עכשיו, הטוקן לא יוצג שוב')}
            </div>
            <CopyableCommand command={fresh.token} note={L('Run 8legs login and paste it there.', 'הרץ 8legs login והדבק אותו שם.')} />
          </div>
        )}

        {error && <div style={{ fontSize: 12, color: 'var(--danger)', marginTop: 8 }}>{error}</div>}
      </React.Fragment>
    );
  }

  function TokensSection({ sectionStyle, sectionHeader, rowStyle, iconBox }) {
    const [tokens, setTokens] = useState([]);
    const [loading, setLoading] = useState(true);
    const [busy, setBusy] = useState(false);
    const [error, setError] = useState(null);

    async function load() {
      try { setTokens(await apiListTokens()); setError(null); }
      catch (e) { setError(e.message); }
      finally { setLoading(false); }
    }
    useEffect(() => { load(); }, []);

    async function revoke(id) {
      setBusy(true);
      try { await apiRevokeToken(id); await load(); }
      catch (e) { setError(e.message); }
      finally { setBusy(false); }
    }

    return (
      <div style={sectionStyle}>
        <div style={sectionHeader}>Personal access tokens</div>

        <div style={{ ...rowStyle, alignItems: 'flex-start', flexWrap: 'wrap', rowGap: 12 }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12, minWidth: 220, flex: '1 1 220px' }}>
            <div style={{ ...iconBox, color: 'var(--text-2)' }}>{Icons.terminal}</div>
            <div>
              <div style={{ fontSize: 14, fontWeight: 600 }}>{L('Editing from your IDE', 'עריכה מה-IDE')}</div>
              <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 3, lineHeight: 1.5 }}>
                {L('A token lets the CLI act as you. Give it a name you will recognise — you can revoke it at any time.', 'טוקן נותן ל-CLI לפעול בשמך. תן לו שם שתזהה — אפשר לבטל אותו בכל רגע.')}
              </div>
            </div>
          </div>
          <div style={{ flexShrink: 0 }}>
            <TokenMinter onCreated={load} />
          </div>
        </div>

        <div style={{ borderTop: '1px solid var(--border)', padding: '14px 20px',
                      display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--text-muted)' }}>{L('Install', 'התקנה')}</div>
          <CopyableCommand command="npm i -g @8legs/cli"
            note={L('Then 8legs login from any folder. Needs Node 18 or newer.', 'ואז 8legs login מכל תיקייה. דורש Node 18 ומעלה.')} />
          <CopyableCommand command="npx @8legs/cli login"
            note={L('Without installing anything — npx downloads it on every run.', 'בלי להתקין כלום — npx מוריד אותו בכל הרצה.')} />
        </div>

        {loading ? (
          <div style={{ ...rowStyle, borderTop: '1px solid var(--border)', color: 'var(--text-muted)', fontSize: 13 }}>{L('Loading…', 'טוען…')}</div>
        ) : tokens.map(t => (
          <div key={t.id} style={{ borderTop: '1px solid var(--border)', ...rowStyle }}>
            <div>
              <div style={{ fontSize: 13, fontWeight: 600 }}>{t.name || 'CLI'}</div>
              <div dir="ltr" style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 3, fontFamily: 'monospace' }}>
                {t.token_prefix}…{'  '}
                {t.last_used_at ? `last used ${new Date(t.last_used_at).toLocaleDateString()}`
                                : 'never used'}
              </div>
            </div>
            <button onClick={() => revoke(t.id)} disabled={busy}
              style={{ padding: '6px 14px', borderRadius: 'var(--r-sm)', cursor: 'pointer',
                       background: 'rgba(239,68,68,0.10)', border: '1px solid rgba(239,68,68,0.25)',
                       color: 'var(--danger)', fontSize: 12, fontWeight: 600 }}>{L('Revoke', 'בטל')}</button>
          </div>
        ))}

        {error && (
          <div style={{ borderTop: '1px solid var(--border)', padding: '12px 20px',
                        fontSize: 12, color: 'var(--danger)' }}>{error}</div>
        )}
      </div>
    );
  }

  function SettingsPanel({ user, onLogout, settings, onSaveSettings, stacked }) {
    const [draft, setDraft] = useState(() => settings || accountApi());
    const [showKey, setShowKey] = useState(false);
    const [saving, setSaving] = useState(false);
    const [saved, setSaved] = useState(false);
    const [error, setError] = useState(null);
    const [section, setSection] = useState('set-model');

    // Adopt the settings once they arrive, unless the user is already editing.
    const dirty = JSON.stringify(draft) !== JSON.stringify(settings || {});
    useEffect(() => { if (settings && !dirty) setDraft(settings); }, [settings]);

    function set(key, value) {
      setSaved(false);
      setDraft(d => {
        const next = { ...d, [key]: value };
        // Switching provider without switching model would pair a Claude key
        // with a GPT model, so move the model to that provider's default.
        if (key === 'provider' && !(MODELS_BY_PROVIDER[value] || []).includes(next.model)) {
          next.model = DEFAULT_MODEL[value];
        }
        return next;
      });
    }

    async function save() {
      setSaving(true);
      setError(null);
      try {
        await onSaveSettings(draft);
        setSaved(true);
      } catch (err) {
        setError(err.message);
      } finally {
        setSaving(false);
      }
    }

    const models = MODELS_BY_PROVIDER[draft.provider] || CLAUDE_MODELS;
    const usable = accountApiUsable(draft);
    const sectionStyle = {
      background: 'var(--bg-card)', borderRadius: 'var(--r-lg)',
      border: '1px solid var(--border)', overflow: 'hidden',
    };
    const sectionHeader = {
      padding: '16px 20px 14px', borderBottom: '1px solid var(--border)',

    const rowStyle = {

  /* ─────────────────── MOBILE ───────────────────
     A separate shell for phones, chosen by useIsMobile(). It shares App's
     state, reducer, handlers and API calls; only the chrome and the screen
     layouts differ. Nothing in here runs above 768px, so the desktop path is
     unchanged byte for byte. */

  const MOBILE_QUERY = '(max-width: 768px)';

  /**
   * The height the phone can actually show. An open keyboard shrinks the
   * visual viewport but leaves 100dvh alone, so a shell sized in dvh keeps its
   * composer under the keys and its header off the top of the screen. Reading
   * it straight from visualViewport is the only number that tells the truth.
   */
  function useViewportHeight(active) {
    useEffect(() => {
      const vv = typeof window !== 'undefined' ? window.visualViewport : null;
      const root = typeof document !== 'undefined' ? document.documentElement : null;
      if (!active || !vv || !root) return;
      const apply = () => {
        root.style.setProperty('--app-h', `${Math.round(vv.height)}px`);
        // Safari scrolls the page to reveal the focused field, which slides the
        // fixed shell out of view; the shell is already the right size.
        if (window.scrollY !== 0) window.scrollTo(0, 0);
      };
      apply();
      vv.addEventListener('resize', apply);
      vv.addEventListener('scroll', apply);
      return () => {
        vv.removeEventListener('resize', apply);
        vv.removeEventListener('scroll', apply);
        root.style.removeProperty('--app-h');
      };
    }, [active]);
  }

  function useIsMobile() {
    const [mobile, setMobile] = useState(() =>
      typeof window !== 'undefined' && window.matchMedia ? window.matchMedia(MOBILE_QUERY).matches : false);
    useEffect(() => {
      if (typeof window === 'undefined' || !window.matchMedia) return;
      const mq = window.matchMedia(MOBILE_QUERY);
      const on = e => setMobile(e.matches);
      if (mq.addEventListener) mq.addEventListener('change', on); else mq.addListener(on);
      return () => { if (mq.removeEventListener) mq.removeEventListener('change', on); else mq.removeListener(on); };
    }, []);
    return mobile;
  }

    const selected = openId ? skills.find(sk => sk.id === openId) || null : null;
