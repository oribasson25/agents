<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8Legs.ai</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='285 18 115 140'%3E%3Cellipse cx='340' cy='108' rx='21' ry='29' fill='%23EF9F27'/%3E%3Cellipse cx='340' cy='72' rx='14' ry='14' fill='%23EF9F27'/%3E%3Ccircle cx='335' cy='70' r='3.5' fill='%23854F0B'/%3E%3Ccircle cx='345' cy='70' r='3.5' fill='%23854F0B'/%3E%3Cpath d='M345,136 C372,138 390,122 390,98 C390,72 374,56 379,38' fill='none' stroke='%23EF9F27' stroke-width='8' stroke-linecap='round'/%3E%3Cpolygon points='375,40 382,24 389,40' fill='%23D85A30'/%3E%3Cpolyline points='319,95 293,80 278,72' fill='none' stroke='%23EF9F27' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpolyline points='319,105 291,102 276,100' fill='none' stroke='%23EF9F27' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpolyline points='319,115 291,119 276,124' fill='none' stroke='%23EF9F27' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpolyline points='319,125 293,136 281,146' fill='none' stroke='%23EF9F27' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpolyline points='361,95 387,80 402,72' fill='none' stroke='%23EF9F27' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpolyline points='361,105 389,102 404,100' fill='none' stroke='%23EF9F27' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpolyline points='361,115 389,119 404,124' fill='none' stroke='%23EF9F27' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpolyline points='361,125 387,136 399,146' fill='none' stroke='%23EF9F27' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M328,62 L313,48' fill='none' stroke='%23EF9F27' stroke-width='4.5' stroke-linecap='round'/%3E%3Cpath d='M313,48 L304,40' fill='none' stroke='%23EF9F27' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M313,48 L309,57' fill='none' stroke='%23EF9F27' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M352,62 L367,48' fill='none' stroke='%23EF9F27' stroke-width='4.5' stroke-linecap='round'/%3E%3Cpath d='M367,48 L376,40' fill='none' stroke='%23EF9F27' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M367,48 L371,57' fill='none' stroke='%23EF9F27' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <style>
    :root {
      --bg-app: #080808;
      --bg-sidebar: #0c0c0c;
      --bg-card: #111111;
      --bg-panel: #161616;
      --bg-input: #1c1c1c;
      --bg-hover: #222222;
      --primary: #EF9F27;
      --primary-hover: #F5B34D;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --teal: #14b8a6;
      --text: #f0f0f5;
      --text-2: #9ca3af;
      --text-muted: #5c6380;
      --border: #2a2a2a;
      --border-focus: #EF9F27;
      --r-sm: 6px;
      --r-md: 12px;
      --r-lg: 18px;
      --r-xl: 24px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-app);
      color: var(--text);
      font-family: 'Segoe UI', 'Arial', sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes cardHighlight {
      0% { box-shadow: 0 0 0 2px var(--primary), var(--shadow); }
      50% { box-shadow: 0 0 20px 4px var(--primary), var(--shadow); }
      100% { box-shadow: var(--shadow); }
    }
    @keyframes pulseDot {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fade-in { animation: fadeIn 0.25s ease both; }
    .slide-in-right { animation: slideInRight 0.3s cubic-bezier(0.16,1,0.3,1) both; }
    .card-highlight { animation: cardHighlight 1.2s ease-out; }

    .typing-dot {
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--text-2);
      border-radius: 50%;
      animation: pulseDot 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }

    input, textarea, select {
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 10px 14px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--border-focus); }
    input[type="range"] {
      padding: 0;
      height: 6px;
      cursor: pointer;
      accent-color: var(--primary);
    }
    input[type="color"] { padding: 2px; height: 36px; cursor: pointer; }
    select option { background: var(--bg-input); }

    button {
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: all 0.15s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .monaco-container { border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
  const { useState, useReducer, useEffect, useRef, useCallback, createContext, useContext } = React;

  /* ─────────────────── CONSTANTS ─────────────────── */
  const CLAUDE_MODELS = ['claude-opus-4-5', 'claude-sonnet-4-5', 'claude-haiku-4-5'];
  const OPENAI_MODELS = ['gpt-4o', 'gpt-4o-mini', 'gpt-4-turbo', 'gpt-3.5-turbo'];

  /* ─────────────────── HELPERS ─────────────────── */
  function uid() { return crypto.randomUUID(); }
  function isHebrew(text) { return /^[\u0590-\u05FF]/.test((text || '').trim()); }
  function fmtTime(date) {
    if (!date) return '';
    return new Date(date).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', hour12: false });
  }
  function fmtDuration(ms) { return (ms / 1000).toFixed(2) + 's'; }

  /* ─────────────────── API ─────────────────── */
  function getAuth() {
    try { return JSON.parse(sessionStorage.getItem('agentforge_auth') || 'null'); } catch { return null; }
  }
  function getToken() { const a = getAuth(); return a ? a.token : ''; }
  function apiFetch(path, opts = {}) {
    const token = getToken();
    const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...(opts.headers || {}) };
    return fetch(path, { ...opts, headers });
  }
  async function apiList() { return apiFetch('/api/agents').then(r => r.json()); }
  async function apiCreate(agent) {
    return apiFetch('/api/agents', { method: 'POST', body: JSON.stringify(agent) }).then(r => r.json());
  }
  async function apiUpdate(agent) {
    return apiFetch(`/api/agents/${agent.id}`, { method: 'PUT', body: JSON.stringify(agent) }).then(r => r.json());
  }
  async function apiDelete(id) {
    return apiFetch(`/api/agents/${id}`, { method: 'DELETE' });
  }

  /* ─────────────────── ADMIN API ─────────────────── */
  async function adminListUsers() { return apiFetch('/api/admin/users').then(r => r.json()); }
  async function adminListUserAgents(userId) { return apiFetch(`/api/admin/users/${userId}/agents`).then(r => r.json()); }
  async function adminResetPassword(userId) { return apiFetch(`/api/admin/users/${userId}/reset-password`, { method: 'POST' }).then(r => r.json()); }
  async function adminDeleteAgent(agentId) { return apiFetch(`/api/admin/agents/${agentId}`, { method: 'DELETE' }); }
  async function adminUpdateAgent(agent) { return apiFetch(`/api/admin/agents/${agent.id}`, { method: 'PUT', body: JSON.stringify(agent) }).then(r => r.json()); }
  async function adminDuplicateTo(agentId, targetUserId) { return apiFetch(`/api/admin/agents/${agentId}/duplicate-to/${targetUserId}`, { method: 'POST' }).then(r => r.json()); }

  /* ─────────────────── DEBOUNCE ─────────────────── */
  function useDebounce(fn, delay) {
    const timerRef = useRef(null);
    return useCallback((...args) => {
      clearTimeout(timerRef.current);
      timerRef.current = setTimeout(() => fn(...args), delay);
    }, [fn, delay]);
  }

  /* ─────────────────── STATE / REDUCER ─────────────────── */
  const AppContext = createContext(null);

  function makeAgent(overrides = {}) {
    return {
      id: uid(),
      name: 'New Agent',
      avatar: '🤖',
      openingMessage: 'Hello! How can I help you today?',
      basePrompt: '',
      skills: [],
      tools: [],
      apiConfig: { provider: 'claude', apiKey: '', model: 'claude-sonnet-4-5' },
      createdAt: new Date().toISOString(),
      ...overrides,
    };
  }

  function reducer(state, action) {
    switch (action.type) {
      case 'HYDRATE': return { ...state, agents: action.agents };
      case 'CREATE_AGENT': {
        const agent = makeAgent();
        return { ...state, agents: [agent, ...state.agents], view: 'editor', editingId: agent.id };
      }
      case 'UPDATE_AGENT': return {
        ...state,
        agents: state.agents.map(a => a.id === action.agent.id ? action.agent : a),
      };
      case 'DELETE_AGENT': return {
        ...state,
        agents: state.agents.filter(a => a.id !== action.id),
        view: state.editingId === action.id ? 'list' : state.view,
        editingId: state.editingId === action.id ? null : state.editingId,
      };
      case 'DUPLICATE_AGENT': {
        const src = state.agents.find(a => a.id === action.id);
        if (!src) return state;
        const copy = { ...JSON.parse(JSON.stringify(src)), id: uid(), name: src.name + ' (Copy)', _isNew: true };
        const idx = state.agents.findIndex(a => a.id === action.id);
        const agents = [...state.agents];
        agents.splice(idx + 1, 0, copy);
        return { ...state, agents };
      }
      case 'SET_VIEW': return { ...state, view: action.view, editingId: action.editingId || state.editingId };
      case 'OPEN_CHAT': return { ...state, chatAgentId: action.id };
      case 'CLOSE_CHAT': return { ...state, chatAgentId: null };
      default: return state;
    }
  }

  /* ─────────────────── EMPTY STATE ─────────────────── */
  function EmptyState({ icon, title, subtitle }) {
    return (
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12, padding: 48, opacity: 0.6 }}>
        <div style={{ fontSize: 48 }}>{icon}</div>
        <div style={{ color: 'var(--text)', fontWeight: 600 }}>{title}</div>
        {subtitle && <div style={{ color: 'var(--text-2)', fontSize: 13 }}>{subtitle}</div>}
      </div>
    );
  }

  /* ─────────────────── ICON BUTTON ─────────────────── */
  function IconBtn({ onClick, title, children, danger, style }) {
    return (
      <button
        onClick={onClick}
        title={title}
        style={{
          background: 'transparent',
          color: danger ? 'var(--danger)' : 'var(--text-2)',
          padding: '5px 7px',
          borderRadius: 'var(--r-sm)',
          fontSize: 15,
          ...style,
        }}
        onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
        onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
      >
        {children}
      </button>
    );
  }

  /* ─────────────────── RICH PROMPT EDITOR ─────────────────── */
  function RichPromptEditor({ value, onChange }) {
    const [mode, setMode] = useState('edit');
    const [collapsed, setCollapsed] = useState(new Set());
    const textRef = useRef(null);

    useEffect(() => {
      if (textRef.current) {
        textRef.current.style.height = 'auto';
        textRef.current.style.height = Math.max(320, textRef.current.scrollHeight) + 'px';
      }
    }, [value, mode]);

    function insertHeading() {
      const el = textRef.current;
      if (!el) return;
      const pos = el.selectionStart;
      const newVal = value.slice(0, pos) + '\n## New Section\n' + value.slice(pos);
      onChange(newVal);
    }

    function toggleSection(key) {
      setCollapsed(s => { const n = new Set(s); n.has(key) ? n.delete(key) : n.add(key); return n; });
    }

    function collapseAll(sections) { setCollapsed(new Set(sections.map(s => s.key))); }
    function expandAll() { setCollapsed(new Set()); }

    // Parse sections for preview
    function parseSections() {
      const lines = (value || '').split('\n');
      const sections = [];
      let current = null;
      lines.forEach((line, i) => {
        const m = line.match(/^## (.+)$/);
        if (m) {
          if (current) sections.push(current);
          current = { key: m[1] + '_' + i, title: m[1], lines: [] };
        } else if (current) {
          current.lines.push(line);
        } else {
          if (!sections.length || sections[sections.length-1].key !== '__intro') {
            sections.push({ key: '__intro', title: null, lines: [line] });
          } else {
            sections[sections.length-1].lines.push(line);
          }
        }
      });
      if (current) sections.push(current);
      return sections;
    }

    function renderInlineChips(text) {
      const parts = text.split(/(@\w+|#\w+)/g);
      return parts.map((part, i) => {
        if (part.match(/^@\w+$/)) return <span key={i} style={{ background: 'rgba(239,159,39,0.2)', color: 'var(--primary)', borderRadius: 4, padding: '1px 5px', fontSize: 12, fontWeight: 600 }}>{part}</span>;
        if (part.match(/^#\w+$/)) return <span key={i} style={{ background: 'rgba(20,184,166,0.2)', color: 'var(--teal)', borderRadius: 4, padding: '1px 5px', fontSize: 12, fontWeight: 600 }}>{part}</span>;
        return part;
      });
    }

    const sections = parseSections();
    const sectionKeys = sections.filter(s => s.title).map(s => s.key);

    return (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {/* Toolbar */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '6px 8px', background: 'var(--bg-hover)', borderRadius: 'var(--r-sm)', flexWrap: 'wrap' }}>
          <button onClick={insertHeading} style={{ background: 'var(--bg-input)', color: 'var(--text-2)', padding: '4px 10px', borderRadius: 'var(--r-sm)', fontSize: 12, fontWeight: 600 }}>## Heading</button>
          <button onClick={() => collapseAll(sections.filter(s=>s.title))} style={{ background: 'transparent', color: 'var(--text-muted)', padding: '4px 8px', borderRadius: 'var(--r-sm)', fontSize: 12 }}>Collapse All</button>
          <button onClick={expandAll} style={{ background: 'transparent', color: 'var(--text-muted)', padding: '4px 8px', borderRadius: 'var(--r-sm)', fontSize: 12 }}>Expand All</button>
          <div style={{ flex: 1 }} />
          <div style={{ display: 'flex', background: 'var(--bg-input)', borderRadius: 'var(--r-sm)', overflow: 'hidden' }}>
            {['edit','preview'].map(m => (
              <button key={m} onClick={() => setMode(m)} style={{ padding: '4px 12px', fontSize: 12, background: mode === m ? 'var(--primary)' : 'transparent', color: mode === m ? '#fff' : 'var(--text-2)', borderRadius: 'var(--r-sm)', textTransform: 'capitalize' }}>{m}</button>
            ))}
          </div>
        </div>

        {mode === 'edit' ? (
          <div style={{ position: 'relative' }}>
            <textarea
              ref={textRef}
              value={value || ''}
              onChange={e => onChange(e.target.value)}
              dir="auto"
              style={{ fontFamily: "'JetBrains Mono','Fira Code',monospace", fontSize: 13, minHeight: 320, resize: 'none', lineHeight: 1.6, borderRadius: 'var(--r-md)' }}
              placeholder="Write your system prompt here…"
            />
            <span style={{ position: 'absolute', bottom: 10, right: 14, fontSize: 11, color: 'var(--text-muted)' }}>{(value || '').length}</span>
          </div>
        ) : (
          <div style={{ background: 'var(--bg-input)', borderRadius: 'var(--r-md)', border: '1px solid var(--border)', minHeight: 320, padding: '12px 16px', overflowY: 'auto' }}>
            {sections.length === 0 && <span style={{ color: 'var(--text-muted)', fontSize: 13 }}>No content yet…</span>}
            {sections.map(section => (
              <div key={section.key} style={{ marginBottom: 8 }}>
                {section.title ? (
                  <>
                    <div
                      onClick={() => toggleSection(section.key)}
                      style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 12px', background: 'var(--bg-hover)', borderRadius: 'var(--r-sm)', cursor: 'pointer', marginBottom: 4 }}
                    >
                      <span style={{ color: 'var(--text-muted)', fontSize: 12 }}>{collapsed.has(section.key) ? '▶' : '▼'}</span>
                      <span style={{ fontWeight: 700, color: 'var(--text)', fontSize: 14 }}>{section.title}</span>
                    </div>
                    {!collapsed.has(section.key) && (
                      <div style={{ padding: '4px 16px', color: 'var(--text-2)', fontSize: 13, lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>
                        {section.lines.map((ln, i) => <div key={i}>{renderInlineChips(ln) || '\u00a0'}</div>)}
                      </div>
                    )}
                  </>
                ) : (
                  <div style={{ padding: '4px 4px', color: 'var(--text-2)', fontSize: 13, lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>
                    {section.lines.map((ln, i) => <div key={i}>{renderInlineChips(ln) || '\u00a0'}</div>)}
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  /* ─────────────────── MONACO EDITOR ─────────────────── */
  let monacoLoadPromise = null;
  function loadMonaco() {
    if (monacoLoadPromise) return monacoLoadPromise;
    monacoLoadPromise = new Promise(resolve => {
      if (window.monaco) { resolve(window.monaco); return; }
      require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
      require(['vs/editor/editor.main'], () => resolve(window.monaco));
    });
    return monacoLoadPromise;
  }

  function MonacoPython({ value, onChange }) {
    const containerRef = useRef(null);
    const editorRef = useRef(null);

    useEffect(() => {
      let editor;
      loadMonaco().then(monaco => {
        if (!containerRef.current) return;
        editor = monaco.editor.create(containerRef.current, {
          value: value || '',
          language: 'python',
          theme: 'vs-dark',
          fontSize: 14,
          fontFamily: "'JetBrains Mono', 'Fira Code', monospace",
          lineNumbers: 'on',
          minimap: { enabled: true },
          automaticLayout: true,
          bracketPairColorization: { enabled: true },
          scrollBeyondLastLine: false,
          padding: { top: 12, bottom: 12 },
        });
        editorRef.current = editor;
        editor.onDidChangeModelContent(() => {
          if (onChange) onChange(editor.getValue());
        });
      });
      return () => { if (editorRef.current) editorRef.current.dispose(); };
    }, []);

    // Sync external value changes without causing loops
    useEffect(() => {
      const ed = editorRef.current;
      if (ed && ed.getValue() !== value) ed.setValue(value || '');
    }, [value]);

    return <div ref={containerRef} className="monaco-container" style={{ height: 420 }} />;
  }

  /* ─────────────────── PARAMETER EDITOR ─────────────────── */
  function ParameterEditor({ parameters = [], onChange }) {
    function addParam() {
      onChange([...parameters, { name: '', type: 'string', description: '' }]);
    }
    function removeParam(i) {
      onChange(parameters.filter((_, idx) => idx !== i));
    }
    function updateParam(i, field, val) {
      onChange(parameters.map((p, idx) => idx === i ? { ...p, [field]: val } : p));
    }
    return (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
          <label style={{ fontSize: 12, color: 'var(--text-2)' }}>Parameters</label>
          <button onClick={addParam} style={{ background: 'var(--bg-hover)', color: 'var(--primary)', padding: '3px 10px', borderRadius: 'var(--r-sm)', fontSize: 12, fontWeight: 600 }}>＋ Add param</button>
        </div>
        {parameters.length === 0 && (
          <div style={{ fontSize: 12, color: 'var(--text-muted)', padding: '6px 0' }}>No parameters — tool is called without structured inputs.</div>
        )}
        {parameters.map((p, i) => (
          <div key={i} style={{ display: 'flex', gap: 8, marginBottom: 8, alignItems: 'center' }}>
            <input value={p.name} onChange={e => updateParam(i, 'name', e.target.value)} placeholder="param_name" style={{ width: 130, flexShrink: 0, fontSize: 12 }} />
            <select value={p.type} onChange={e => updateParam(i, 'type', e.target.value)} style={{ width: 100, flexShrink: 0, fontSize: 12 }}>
              <option value="string">string</option>
              <option value="number">number</option>
              <option value="integer">integer</option>
              <option value="boolean">boolean</option>
            </select>
            <input value={p.description} onChange={e => updateParam(i, 'description', e.target.value)} placeholder="Description for the model…" style={{ flex: 1, fontSize: 12 }} />
            <button onClick={() => removeParam(i)} style={{ background: 'transparent', color: 'var(--danger)', padding: '4px 6px', borderRadius: 'var(--r-sm)', fontSize: 14, flexShrink: 0 }}>✕</button>
          </div>
        ))}
        {parameters.length > 0 && (
          <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 4, background: 'var(--bg-hover)', borderRadius: 'var(--r-sm)', padding: '6px 10px' }}>
            In Python: <span style={{ color: 'var(--primary)', fontFamily: 'monospace' }}>def run(**kwargs)</span> →{' '}
            {parameters.map(p => <span key={p.name} style={{ color: 'var(--teal)', fontFamily: 'monospace', marginRight: 8 }}>{p.name} = kwargs.get("{p.name}")</span>)}
          </div>
        )}
      </div>
    );

  /* ── ToolRunner: inline test panel for a single tool ── */
  function ToolRunner({ tool }) {
    const [running, setRunning] = useState(false);
    const [result, setResult] = useState(null); // { ok: bool, text: string, ms: number }

    async function handleSubmit(e) {
      e.preventDefault();
      setRunning(true);
      setResult(null);
      const t0 = performance.now();
      try {
        const packages = (tool.packages || '').split(',').map(s => s.trim()).filter(Boolean);
        const envVars = Object.fromEntries((tool.envVars || []).filter(ev => ev.key).map(ev => [ev.key, ev.value]));
        // FormData reads current input values at submit time — browser-native, no React state needed
        const formData = new FormData(e.target);
        const typedInputs = {};
        (tool.parameters || []).forEach(p => {
          const raw = formData.get(p.name) || '';
          typedInputs[p.name] = p.type === 'integer' ? parseInt(raw, 10) || 0
                               : p.type === 'number'  ? parseFloat(raw) || 0
                               : raw;
        });
        const resp = await fetch('/api/run-tool', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: tool.code || '', inputs: typedInputs, packages, env_vars: envVars }),
        });
        const data = await resp.json();
        const ms = Math.round(performance.now() - t0);
        if (data.error) setResult({ ok: false, text: data.error, ms });
        else setResult({ ok: true, text: data.result, ms });
      } catch (err) {
        setResult({ ok: false, text: err.message, ms: Math.round(performance.now() - t0) });
      } finally {
        setRunning(false);
      }
    }

    return (
      <form onSubmit={handleSubmit} style={{ borderTop: '1px solid var(--border)', paddingTop: 14, display: 'flex', flexDirection: 'column', gap: 10 }}>
        {(tool.parameters || []).length > 0 && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {(tool.parameters || []).map(p => (
              <div key={p.name} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: 12, color: 'var(--text-2)', fontFamily: 'monospace', minWidth: 120, flexShrink: 0 }}>{p.name}<span style={{ color: 'var(--text-muted)' }}>: {p.type || 'string'}</span></span>
                <input name={p.name} placeholder={p.description || p.name} style={{ flex: 1, fontSize: 13, fontFamily: 'monospace' }} />
              </div>
            ))}
          </div>
        )}

        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <span style={{ fontSize: 12, color: 'var(--text-2)', fontWeight: 600 }}>Test Run</span>
          <button type="submit" disabled={running} style={{ background: running ? 'var(--bg-hover)' : 'var(--success)', color: running ? 'var(--text-muted)' : '#fff', border: 'none', borderRadius: 'var(--r-md)', padding: '6px 16px', fontWeight: 700, fontSize: 13, cursor: running ? 'not-allowed' : 'pointer', display: 'flex', alignItems: 'center', gap: 6 }}>
            {running ? <><span style={{ display: 'inline-block', width: 12, height: 12, border: '2px solid var(--text-muted)', borderTop: '2px solid var(--text)', borderRadius: '50%', animation: 'spin 0.7s linear infinite' }} /> Running…</> : '▶ Run'}
          </button>
        </div>

        {result && (
          <div style={{ borderRadius: 'var(--r-md)', overflow: 'hidden', border: `1px solid ${result.ok ? 'rgba(34,197,94,0.3)' : 'rgba(239,68,68,0.35)'}` }}>
            <div style={{ padding: '6px 12px', background: result.ok ? 'rgba(34,197,94,0.1)' : 'rgba(239,68,68,0.12)', display: 'flex', alignItems: 'center', gap: 6 }}>
              <span style={{ fontSize: 13 }}>{result.ok ? '✓' : '✗'}</span>
              <span style={{ fontSize: 12, fontWeight: 600, color: result.ok ? 'var(--success)' : 'var(--danger)' }}>{result.ok ? 'Success' : 'Error'}</span>
              <span style={{ fontSize: 11, color: 'var(--text-muted)', marginLeft: 'auto' }}>⏱ {result.ms}ms</span>
            </div>
            <pre style={{ margin: 0, padding: '10px 12px', fontSize: 12, fontFamily: 'monospace', color: result.ok ? 'var(--text)' : 'var(--danger)', background: 'var(--bg-input)', whiteSpace: 'pre-wrap', wordBreak: 'break-word', maxHeight: 200, overflowY: 'auto' }}>{result.text}</pre>
          </div>
        )}
      </form>
    );
  }

  /* ─────────────────── FILE ICON HELPER ─────────────────── */
  function fileIcon(title) {
    const t = (title || '').toLowerCase();
    if (t.endsWith('.pdf') || t.includes('pdf')) return '📕';
    if (t.endsWith('.docx') || t.endsWith('.doc')) return '📘';
    if (t.endsWith('.xlsx') || t.endsWith('.xls')) return '📗';
    return '📄';

  function ToolsTab({ agent, onUpdate }) {
    const [expandedId, setExpandedId] = useState(null);

    const defaultCode = '# Parameters arrive as kwargs\n# Access env vars with os.environ["MY_KEY"]\nimport os\nimport urllib.request, json\n\ndef run(**kwargs):\n    # Example: call an external API\n    # url = os.environ.get("API_URL", "")\n    # with urllib.request.urlopen(url) as r:\n    #     data = json.loads(r.read())\n    # return str(data)\n    return "result"\n';
    const [newTool, setNewTool] = useState({ name: '', description: '', parameters: [], packages: '', envVars: [], code: defaultCode });

    function addPreset(preset) {
      const already = agent.tools.some(t => t.name === preset.name);
      if (already) return;
      const tool = { id: uid(), ...preset };
      onUpdate({ ...agent, tools: [...agent.tools, tool] });
    }

    function addTool() {
      if (!newTool.name.trim()) return;
      const tool = { id: uid(), ...newTool };
      onUpdate({ ...agent, tools: [...agent.tools, tool] });
      setNewTool({ name: '', description: '', parameters: [], packages: '', envVars: [], code: defaultCode });
      setAddOpen(false);
    }

    function updateTool(id, field, val) {
      onUpdate({ ...agent, tools: agent.tools.map(t => t.id === id ? { ...t, [field]: val } : t) });
    }

    function deleteTool(id) {
      onUpdate({ ...agent, tools: agent.tools.filter(t => t.id !== id) });

  /* ─────────────────── MINI CHAT WIDGET ─────────────────── */
  function MiniChatWidget({ agent, accent, radius, height, placeholder }) {
    const [messages, setMessages] = useState(() => {
      const ts = new Date();
      return [{ id: uid(), role: 'agent', content: agent.openingMessage || 'Hello!', timestamp: ts, isOpening: true }];
    });
    const [input, setInput] = useState('');
    const [pending, setPending] = useState(false);
    const listRef = useRef(null);

    useEffect(() => {
      if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
    }, [messages]);

    async function sendMessage() {
      const text = input.trim();
      if (!text || pending) return;
      setInput('');
      const t0 = performance.now();
      const typingId = uid();
      setMessages(m => [...m, { id: uid(), role: 'user', content: text, timestamp: new Date() }, { id: typingId, role: 'typing' }]);
      setPending(true);

      const history = messages.filter(m => m.role === 'user' || m.role === 'agent').map(m => ({
        role: m.role === 'agent' ? 'assistant' : 'user', content: m.content,
      }));
      history.push({ role: 'user', content: text });

      try {
        const content = await callWithTools(agent, history, async (toolName, toolInput) => {
          setMessages(m => m.filter(x => x.id !== typingId).concat(
            { id: uid(), role: 'tool', content: `@${toolName}(${JSON.stringify(toolInput)})`, timestamp: new Date() },
            { id: typingId, role: 'typing' }
          ));
        });
        const dt = performance.now() - t0;
        setMessages(m => m.filter(x => x.id !== typingId).concat({ id: uid(), role: 'agent', content, timestamp: new Date(), durationMs: dt }));
      } catch (err) {
        const dt = performance.now() - t0;
        setMessages(m => m.filter(x => x.id !== typingId).concat({ id: uid(), role: 'error', content: err.message, timestamp: new Date(), durationMs: dt }));
      } finally {
        setPending(false);
      }
    }

    const noKey = !agent.apiConfig.apiKey;

    return (
      <div style={{ display: 'flex', flexDirection: 'column', height, borderRadius: radius, overflow: 'hidden', border: `1px solid ${accent}44`, boxShadow: `0 4px 24px rgba(0,0,0,0.4)` }}>
        {/* Header */}
        <div style={{ background: accent, padding: '12px 16px', display: 'flex', alignItems: 'center', gap: 10 }}>
          <span style={{ fontSize: 22 }}>{agent.avatar}</span>
          <span style={{ fontWeight: 700, color: '#fff', fontSize: 15 }}>{agent.name}</span>
        </div>
        {noKey && (
          <div style={{ background: 'rgba(245,158,11,0.15)', borderBottom: '1px solid rgba(245,158,11,0.3)', padding: '8px 16px', fontSize: 12, color: 'var(--warning)', textAlign: 'center' }}>
            Add an API key in Configuration to test live
          </div>
        )}
        {/* Messages */}
        <div ref={listRef} style={{ flex: 1, overflowY: 'auto', padding: '12px 16px', display: 'flex', flexDirection: 'column', gap: 10, background: 'var(--bg-app)' }}>
          {messages.map(msg => <ChatBubble key={msg.id} msg={msg} accent={accent} />)}
        </div>
        {/* Input */}
        <div style={{ padding: '10px 12px', background: 'var(--bg-panel)', borderTop: '1px solid var(--border)' }}>
          <div style={{ display: 'flex', gap: 8 }}>
            <textarea
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
              dir="auto"
              rows={1}
              disabled={pending || noKey}
              placeholder={placeholder || 'Type a message…'}
              style={{ flex: 1, resize: 'none', fontSize: 13, padding: '8px 12px', borderRadius: 'var(--r-md)' }}
            />
            <button onClick={sendMessage} disabled={pending || noKey || !input.trim()} style={{ background: accent, color: '#fff', padding: '0 14px', borderRadius: 'var(--r-md)', fontWeight: 700, fontSize: 18 }}>➤</button>
          </div>
        </div>
      </div>
    );
  }

  function ChatBubble({ msg, accent }) {
    if (msg.role === 'tool') return (
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <div style={{ background: 'rgba(245,158,11,0.12)', border: '1px solid rgba(245,158,11,0.3)', color: 'var(--warning)', padding: '8px 14px', borderRadius: '12px', fontSize: 12, fontFamily: 'monospace' }}>
          ⚙️ {msg.content}
        </div>
      </div>
    );
    if (msg.role === 'typing') {
      return (
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          <div style={{ background: 'var(--bg-panel)', padding: '12px 16px', borderRadius: '18px 18px 18px 4px', display: 'flex', gap: 5, alignItems: 'center' }}>
            <span className="typing-dot" />
            <span className="typing-dot" />
            <span className="typing-dot" />
          </div>
        </div>
      );
    }
    if (msg.role === 'user') {
      const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
      return (
        <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
          <div style={{ maxWidth: '75%', background: accent || 'var(--primary)', color: '#fff', padding: '10px 14px', borderRadius: '18px 18px 4px 18px', fontSize: 14, lineHeight: 1.5 }} dir={dir}>{msg.content}</div>
        </div>
      );
    }
    if (msg.role === 'error') {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 3, alignItems: 'flex-start' }}>
          <div style={{ maxWidth: '80%', background: 'rgba(239,68,68,0.15)', border: '1px solid rgba(239,68,68,0.3)', color: 'var(--danger)', padding: '10px 14px', borderRadius: '18px 18px 18px 4px', fontSize: 13 }}>⚠ {msg.content}</div>
          <div style={{ fontSize: 11, color: 'var(--danger)', paddingLeft: 4 }}>⚠ Failed after {fmtDuration(msg.durationMs)} &nbsp;•&nbsp; 🕐 {fmtTime(msg.timestamp)}</div>
        </div>
      );
    }
    // agent
    const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
    return (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 3, alignItems: 'flex-start' }}>
        <div style={{ maxWidth: '80%', background: 'var(--bg-panel)', color: 'var(--text)', padding: '10px 14px', borderRadius: '18px 18px 18px 4px', fontSize: 14, lineHeight: 1.5, whiteSpace: 'pre-wrap' }} dir={dir}>{msg.content}</div>
        <div style={{ fontSize: 11, color: 'var(--text-muted)', paddingLeft: 4 }}>
          {msg.isOpening ? `🕐 ${fmtTime(msg.timestamp)}` : `⏱ ${fmtDuration(msg.durationMs)}   •   🕐 ${fmtTime(msg.timestamp)}`}
        </div>
      </div>
    );
  }

  function buildSystemPrompt(agent, ragChunks = [], webChunks = []) {
    let system = agent.basePrompt || '';
    if (ragChunks && ragChunks.length > 0) {
      system += '\n\n## Relevant Context\n' + ragChunks.map(c => `--- ${c.title}\n${c.content}`).join('\n\n');
    }
    if (webChunks && webChunks.length > 0) {
      system += '\n\n## Fetched Web Pages\nThe following web pages were automatically fetched and are available for you to use. Answer questions about these URLs using the content below — do NOT say you cannot access the internet.\n\n' + webChunks.map(c => `--- ${c.title}\n${c.content}`).join('\n\n');
    }
    if (agent.skills && agent.skills.length > 0) {
      system += '\n\n' + agent.skills.map(s => `## Skill: ${s.name}\n${s.description ? s.description + '\n' : ''}${s.prompt}`).join('\n\n');
    }
    return system.trim();
  }

  /* ─────────────────── TOOL CALLING ENGINE ─────────────────── */
  // onToolCall(name, inputs) — called before executing, so the UI can show a bubble
  async function callWithTools(agent, history, onToolCall, activeSkillId = null) {
    const { apiKey, provider, model } = agent.apiConfig;

    // RAG retrieval — inject relevant knowledge into system prompt
    let ragChunks = [];
    const lastUserMsg = (history.filter(m => m.role === 'user').at(-1) || {}).content || '';
    try {
      if (lastUserMsg.trim()) {
        const ragResp = await apiFetch(`/api/agents/${agent.id}/retrieve`, {
          method: 'POST',
          body: JSON.stringify({ query: lastUserMsg, skill_id: activeSkillId }),
        });
        if (ragResp.ok) {
          const ragData = await ragResp.json();
          ragChunks = ragData.chunks || [];
        }
      }
    } catch (_) {}

    // Auto-scrape any URLs mentioned in the user's message (browser-rendered)
    let webChunks = [];
    try {
      const urlRegex = /https?:\/\/[^\s"'<>)]+/g;
      const urls = [...new Set((lastUserMsg.match(urlRegex) || []).slice(0, 3))];
      if (urls.length > 0) {
        const results = await Promise.allSettled(
          urls.map(url =>
            fetch('/api/scrape-browser', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url }),
            }).then(r => r.json())
          )
        );
        webChunks = results
          .filter(r => r.status === 'fulfilled' && !r.value.error)
          .map(r => ({ title: r.value.title || r.value.url, content: r.value.text }));
      }
    } catch (_) {}

    const systemPrompt = buildSystemPrompt(agent, ragChunks, webChunks);
    const toolDefs = (agent.tools || []);

    function buildClaudeTools() {
      return toolDefs.map(t => ({
        name: t.name,
        description: t.description,
        input_schema: {
          type: 'object',
          properties: Object.fromEntries(
            (t.parameters || []).map(p => [p.name, { type: p.type || 'string', description: p.description || '' }])
          ),
          required: (t.parameters || []).map(p => p.name),
        },
      }));
    }

    function buildOpenAITools() {
      return toolDefs.map(t => ({
        type: 'function',
        function: {
          name: t.name,
          description: t.description,
          parameters: {
            type: 'object',
            properties: Object.fromEntries(
              (t.parameters || []).map(p => [p.name, { type: p.type || 'string', description: p.description || '' }])
            ),
            required: (t.parameters || []).map(p => p.name),
          },
        },
      }));
    }

    async function executeTool(toolName, inputs) {
      const tool = (agent.tools || []).find(t => t.name === toolName);
      const packages = (tool?.packages || '').split(',').map(s => s.trim()).filter(Boolean);
      const envVars = Object.fromEntries((tool?.envVars || []).filter(e => e.key).map(e => [e.key, e.value]));
      const resp = await fetch('/api/run-tool', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: tool?.code || '', inputs, packages, env_vars: envVars }),
      });
      const data = await resp.json();
      return String(data.result ?? data.error ?? 'No output');
    }

    if (provider === 'claude') {
      const claudeHeaders = { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
      let msgs = [...history];

      for (let round = 0; round < 10; round++) {
        const body = { model, max_tokens: 1024, system: systemPrompt, messages: msgs };
        if (toolDefs.length > 0) body.tools = buildClaudeTools();

        const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: claudeHeaders, body: JSON.stringify(body) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error?.message || JSON.stringify(d));

        if (d.stop_reason !== 'tool_use') return d.content.find(c => c.type === 'text')?.text || '';

        // Execute all tool_use blocks (may be multiple)
        const toolUses = d.content.filter(c => c.type === 'tool_use');
        const toolResults = await Promise.all(toolUses.map(async tu => {
          await onToolCall(tu.name, tu.input);
          const result = await executeTool(tu.name, tu.input);
          return { type: 'tool_result', tool_use_id: tu.id, content: result };
        }));

        msgs = [...msgs, { role: 'assistant', content: d.content }, { role: 'user', content: toolResults }];
      }
      throw new Error('Too many tool call rounds (max 10)');

    } else {
      // OpenAI
      const oaiHeaders = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
      let msgs = [{ role: 'system', content: systemPrompt }, ...history];

      for (let round = 0; round < 10; round++) {
        const body = { model, messages: msgs };
        if (toolDefs.length > 0) body.tools = buildOpenAITools();

        const r = await fetch('https://api.openai.com/v1/chat/completions', { method: 'POST', headers: oaiHeaders, body: JSON.stringify(body) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error?.message || JSON.stringify(d));

        const choice = d.choices[0];
        if (choice.finish_reason !== 'tool_calls') return choice.message.content;

        // Execute all tool_calls (may be multiple)
        const toolResultMsgs = await Promise.all((choice.message.tool_calls || []).map(async tc => {
          const inputs = JSON.parse(tc.function.arguments);
          await onToolCall(tc.function.name, inputs);
          const result = await executeTool(tc.function.name, inputs);
          return { role: 'tool', tool_call_id: tc.id, content: result };
        }));

        msgs = [...msgs, choice.message, ...toolResultMsgs];
      }
      throw new Error('Too many tool call rounds (max 10)');
    }
  }

  /* ─────────────────── KNOWLEDGE TAB ─────────────────── */
  function KnowledgeTab({ agent }) {
    const [docs, setDocs] = useState([]);
    const [loading, setLoading] = useState(true);
    const [selectedSkillId, setSelectedSkillId] = useState('__global__');
    const [addOpen, setAddOpen] = useState(false);
    const [newDoc, setNewDoc] = useState({ title: '', content: '' });
    const [saving, setSaving] = useState(false);
    const [uploading, setUploading] = useState(false);
    const [uploadError, setUploadError] = useState('');
    const [editingDocId, setEditingDocId] = useState(null);
    const [editDoc, setEditDoc] = useState({ title: '', content: '' });
    const fileInputRef = useRef(null);

    useEffect(() => {
      apiFetch(`/api/agents/${agent.id}/documents`)
        .then(r => r.json())
        .then(rows => { setDocs(rows); setLoading(false); })
        .catch(() => setLoading(false));
    }, [agent.id]);

    const displayDocs = selectedSkillId === '__global__'
      ? docs.filter(d => !d.skill_id)
      : docs.filter(d => d.skill_id === selectedSkillId);

    async function addDoc() {
      if (!newDoc.title.trim() || !newDoc.content.trim()) return;
      setSaving(true);
      const docId = uid();
      const skillId = selectedSkillId === '__global__' ? null : selectedSkillId;
      try {
        const resp = await apiFetch(`/api/agents/${agent.id}/documents`, {
          method: 'POST',
          body: JSON.stringify({ docId, skillId, title: newDoc.title, content: newDoc.content }),
        });
        if (resp.ok) {
          const doc = await resp.json();
          setDocs(d => [doc, ...d]);
          setNewDoc({ title: '', content: '' });
          setAddOpen(false);
        }
      } finally {
        setSaving(false);
      }
    }

    async function deleteDoc(docId) {
      await apiFetch(`/api/documents/${docId}`, { method: 'DELETE' });
      setDocs(d => d.filter(x => x.id !== docId));
    }

    async function updateDoc(docId) {
      if (!editDoc.title.trim() || !editDoc.content.trim()) return;
      setSaving(true);
      try {
        const resp = await apiFetch(`/api/documents/${docId}`, {
          method: 'PATCH',
          body: JSON.stringify({ title: editDoc.title, content: editDoc.content }),
        });
        if (resp.ok) {
          setDocs(d => d.map(x => x.id === docId ? { ...x, title: editDoc.title, content: editDoc.content } : x));
          setEditingDocId(null);
          setEditDoc({ title: '', content: '' });
        }
      } finally {
        setSaving(false);
      }
    }

    async function handleFileUpload(e) {
      const file = e.target.files?.[0];
      if (!fileInputRef.current) return;
      fileInputRef.current.value = '';
      if (!file) return;

      setUploadError('');
      setUploading(true);

      try {
        const arrayBuf = await file.arrayBuffer();
        const bytes = new Uint8Array(arrayBuf);
        let binary = '';
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        const content_b64 = btoa(binary);

        const resp = await apiFetch('/api/extract-file', {
          method: 'POST',
          body: JSON.stringify({ filename: file.name, content_b64 }),
        });
        const data = await resp.json();

        if (data.error) {
          setUploadError(data.error);
          return;
        }

        setNewDoc({ title: data.title || file.name, content: data.text || '' });
        setAddOpen(true);
      } catch (err) {
        setUploadError('Upload failed: ' + err.message);
      } finally {
        setUploading(false);
      }
    }

    const activeSkillName = selectedSkillId === '__global__'
      ? 'Global'
      : (agent.skills.find(s => s.id === selectedSkillId) || {}).name || '';

    return (
      <div style={{ maxWidth: 720, display: 'flex', flexDirection: 'column', gap: 16 }}>
        <div style={{ fontSize: 12, color: 'var(--text-muted)', background: 'var(--bg-panel)', borderRadius: 'var(--r-md)', padding: '10px 14px', border: '1px solid var(--border)', lineHeight: 1.6 }}>
          📚 Documents are retrieved automatically via full-text search and injected into the system prompt.
          <br />
          <span style={{ color: 'var(--primary)' }}>Global</span> docs apply to all conversations.
          <span style={{ color: 'var(--teal)' }}> Skill docs</span> are only retrieved when that skill is active.
        </div>

        {/* Scope selector */}
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <button
            onClick={() => { setSelectedSkillId('__global__'); setAddOpen(false); }}
            style={{ padding: '6px 14px', borderRadius: 'var(--r-xl)', fontSize: 13, fontWeight: 600,
              background: selectedSkillId === '__global__' ? 'var(--primary)' : 'var(--bg-hover)',
              color: selectedSkillId === '__global__' ? '#fff' : 'var(--text-2)' }}>
            🌐 Global
          </button>
          {agent.skills.map(s => (
            <button key={s.id}
              onClick={() => { setSelectedSkillId(s.id); setAddOpen(false); }}
              style={{ padding: '6px 14px', borderRadius: 'var(--r-xl)', fontSize: 13, fontWeight: 600,
                background: selectedSkillId === s.id ? 'var(--teal)' : 'var(--bg-hover)',
                color: selectedSkillId === s.id ? '#fff' : 'var(--text-2)' }}>
              🎯 {s.name}
            </button>
          ))}
        </div>

        {/* Section header */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, justifyContent: 'space-between' }}>
          <div style={{ fontWeight: 600, fontSize: 14 }}>
            {activeSkillName} Knowledge
            <span style={{ marginLeft: 8, fontSize: 12, color: 'var(--text-muted)', fontWeight: 400 }}>
              {displayDocs.length} doc{displayDocs.length !== 1 ? 's' : ''}
            </span>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            {/* Hidden file input */}
            <input
              ref={fileInputRef}
              type="file"
              accept=".pdf,.docx,.xlsx,.xls"
              style={{ display: 'none' }}
              onChange={handleFileUpload}
            />
            <button

  function generateIframeHtml(agent, { title, accent, radius, widgetHeight, placeholder }) {
    const systemPrompt = buildSystemPrompt(agent);
    const apiKey = (agent.apiConfig && agent.apiConfig.apiKey) || '';
    const provider = (agent.apiConfig && agent.apiConfig.provider) || 'claude';
    const model = (agent.apiConfig && agent.apiConfig.model) || 'claude-sonnet-4-5';
    const titleStr = title || agent.name || 'Agent';
    const placeholderStr = placeholder || 'Type a message…';
    const avatarStr = agent.avatar || '🤖';
    const openingStr = agent.openingMessage || 'Hello!';

    // Use JSON.stringify for all user-controlled strings to avoid escaping issues
    const jsSystem = JSON.stringify(systemPrompt);
    const jsApiKey = JSON.stringify(apiKey);
    const jsProvider = JSON.stringify(provider);
    const jsModel = JSON.stringify(model);
    const jsOpening = JSON.stringify(openingStr);

    // HTML-escape helper for attribute/text values
    function he(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#f0f0f5;font-family:'Segoe UI',Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#header{background:${accent};padding:12px 16px;display:flex;align-items:center;gap:10px}
#header .av{font-size:22px}
#header .nm{font-weight:700;color:#fff;font-size:15px}
#messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
#messages::-webkit-scrollbar{width:4px}
#messages::-webkit-scrollbar-thumb{background:#2a2d3e;border-radius:2px}
.bubble-wrap{display:flex;flex-direction:column}
.bubble-wrap.user{align-items:flex-end}
.bubble-wrap.agent,.bubble-wrap.error{align-items:flex-start}
.bubble{max-width:80%;padding:10px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.bubble.user{background:${accent};color:#fff;border-radius:18px 18px 4px 18px}
.bubble.agent{background:#1e2130;color:#f0f0f5;border-radius:18px 18px 18px 4px}
.bubble.error{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#ef4444;border-radius:18px 18px 18px 4px}
.meta{font-size:11px;color:#5c6380;padding:2px 4px}
.meta.err{color:#ef4444}
.typing{display:flex;gap:5px;padding:12px 16px;background:#1e2130;border-radius:18px 18px 18px 4px;width:fit-content}
.dot{width:8px;height:8px;background:#9ca3af;border-radius:50%;animation:pd 1.2s infinite ease-in-out}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes pd{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
#inputbar{padding:10px 12px;background:#1e2130;border-top:1px solid #2a2d3e;display:flex;gap:8px}
textarea{flex:1;background:#252837;color:#f0f0f5;border:1px solid #2a2d3e;border-radius:12px;padding:8px 12px;font-family:inherit;font-size:13px;outline:none;resize:none}
textarea:focus{border-color:${accent}}
button{background:${accent};color:#fff;border:none;padding:0 14px;border-radius:12px;font-size:18px;cursor:pointer;font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div id="header"><span class="av">${he(avatarStr)}</span><span class="nm">${he(titleStr)}</span></div>
<div id="messages"></div>
<div id="inputbar">
  <textarea id="inp" placeholder="${he(placeholderStr)}" rows="1" onkeydown="if(event.key==='Enter'&amp;&amp;!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
  <button onclick="sendMsg()">&#x27A4;</button>
</div>
<script>
var SYSTEM=${jsSystem};
var API_KEY=${jsApiKey};
var PROVIDER=${jsProvider};
var MODEL=${jsModel};
var history=[];
var pending=false;
function isHeb(t){return /^[\\u0590-\\u05FF]/.test((t||'').trim())}
function fmt(d){return new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false})}
var msgs=document.getElementById('messages');
function addMsg(role,content,ts,dt){
  var wrap=document.createElement('div');
  wrap.className='bubble-wrap '+role;
  var b=document.createElement('div');
  b.className='bubble '+role;
  b.textContent=content;
  b.dir=isHeb(content)?'rtl':'ltr';
  wrap.appendChild(b);
  if(role==='agent'||role==='error'){
    var m=document.createElement('div');
    m.className='meta'+(role==='error'?' err':'');
    m.textContent=role==='error'?('⚠ Failed after '+dt+'   •   🕐 '+fmt(ts)):(dt?('⏱ '+dt+'   •   🕐 '+fmt(ts)):('🕐 '+fmt(ts)));
    wrap.appendChild(m);
  }
  msgs.appendChild(wrap);
  msgs.scrollTop=msgs.scrollHeight;
}
function showTyping(){
  var d=document.createElement('div');d.id='typing';d.className='typing';
  d.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
}
function hideTyping(){var d=document.getElementById('typing');if(d)d.remove()}
addMsg('agent',${jsOpening},new Date());
async function sendMsg(){
  var inp=document.getElementById('inp');
  var text=inp.value.trim();
  if(!text||pending)return;
  inp.value='';inp.style.height='auto';
  history.push({role:'user',content:text});
  addMsg('user',text);
  pending=true;
  var t0=performance.now();
  showTyping();
  try{
    var body,url,hdrs;
    if(PROVIDER==='claude'){
      url='https://api.anthropic.com/v1/messages';
      hdrs={'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
      body=JSON.stringify({model:MODEL,max_tokens:1024,system:SYSTEM,messages:history});
    }else{
      url='https://api.openai.com/v1/chat/completions';
      hdrs={'Content-Type':'application/json','Authorization':'Bearer '+API_KEY};
      body=JSON.stringify({model:MODEL,messages:[{role:'system',content:SYSTEM},...history]});
    }
    var r=await fetch(url,{method:'POST',headers:hdrs,body:body});
    var data=await r.json();
    if(!r.ok)throw new Error(data.error?.message||JSON.stringify(data));
    var content=PROVIDER==='claude'?data.content[0].text:data.choices[0].message.content;
    var dt=((performance.now()-t0)/1000).toFixed(2)+'s';
    history.push({role:'assistant',content:content});
    hideTyping();addMsg('agent',content,new Date(),dt);
  }catch(e){
    var dt=((performance.now()-t0)/1000).toFixed(2)+'s';
    hideTyping();addMsg('error',e.message,new Date(),dt);
    history.pop();
  }
  pending=false;
}
<\/script>
</body>
</html>`;
  }

  /* ─────────────────── CHAT TEST DRAWER ─────────────────── */
  function ChatTestDrawer({ agent, onClose }) {
    const historyKey = `agentforge_history_${agent.id}`;
    const openingMsg = { id: uid(), role: 'agent', content: agent.openingMessage || 'Hello!', timestamp: new Date(), isOpening: true };
    const [messages, setMessages] = useState([openingMsg]);
    const [input, setInput] = useState('');
    const [pending, setPending] = useState(false);
    const [activeSkillId, setActiveSkillId] = useState(null);
    const [showHistory, setShowHistory] = useState(false);
    const [viewingSession, setViewingSession] = useState(null); // { startedAt, messages }
    const [historyTick, setHistoryTick] = useState(0);
    const listRef = useRef(null);
    const inputRef = useRef(null);
    const currentSessionIdRef = useRef(uid());

    // Save session to history on close (if has real messages)
    const messagesRef = useRef(messages);
    useEffect(() => { messagesRef.current = messages; }, [messages]);
    useEffect(() => {
      return () => {
        const msgs = messagesRef.current.filter(m => m.role !== 'typing');
        const hasReal = msgs.some(m => m.role === 'user');
        if (!hasReal) return;
        try {
          const saved = JSON.parse(localStorage.getItem(historyKey) || '[]');
          // avoid duplicate session saves
          const filtered = saved.filter(s => s.id !== currentSessionIdRef.current);
          const session = { id: currentSessionIdRef.current, startedAt: msgs[0]?.timestamp || new Date(), messages: msgs };
          localStorage.setItem(historyKey, JSON.stringify([session, ...filtered].slice(0, 50)));
        } catch (_) {}
      };
    }, [historyKey]);

    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(historyKey) || '[]').map(s => ({ ...s, startedAt: new Date(s.startedAt), messages: s.messages.map(m => ({ ...m, timestamp: new Date(m.timestamp) })) })); }
      catch (_) { return []; }
    }

    function deleteSession(sid) {
      try {
        const updated = loadHistory().filter(s => s.id !== sid);
        localStorage.setItem(historyKey, JSON.stringify(updated));
        if (viewingSession?.id === sid) setViewingSession(null);
        setHistoryTick(t => t + 1);
      } catch (_) {}
    }

    useEffect(() => {
      function onKey(e) { if (e.key === 'Escape') onClose(); }
      document.addEventListener('keydown', onKey);
      return () => document.removeEventListener('keydown', onKey);
    }, [onClose]);

    useEffect(() => {
      if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
    }, [messages]);

    useEffect(() => {
      if (!pending && inputRef.current) inputRef.current.focus();
    }, [pending]);

    async function sendMessage() {
      const text = input.trim();
      if (!text || pending) return;
      setInput('');
      inputRef.current?.focus();
      const t0 = performance.now();

      // Skill switch detection
      const skillMatch = text.match(/^#(\w+)/);
      let skillBanner = null;
      if (skillMatch) {
        const skill = agent.skills.find(s => s.name.toLowerCase() === skillMatch[1].toLowerCase());
        if (skill) { skillBanner = skill.name; setActiveSkillId(skill.id); }
      }

      const typingId = uid();
      const newMsgs = [...messages, { id: uid(), role: 'user', content: text, timestamp: new Date() }];
      if (skillBanner) newMsgs.push({ id: uid(), role: 'skill', content: `Switched to skill: ${skillBanner}`, timestamp: new Date() });
      newMsgs.push({ id: typingId, role: 'typing' });
      setMessages(newMsgs);
      setPending(true);

      const history = messages.filter(m => m.role === 'user' || m.role === 'agent').map(m => ({
        role: m.role === 'agent' ? 'assistant' : 'user', content: m.content,
      }));
      history.push({ role: 'user', content: text });

      try {
        const content = await callWithTools(agent, history, async (toolName, toolInput) => {
          setMessages(m => m.filter(x => x.id !== typingId).concat(
            { id: uid(), role: 'tool', content: `@${toolName}(${JSON.stringify(toolInput)})`, timestamp: new Date() },
            { id: typingId, role: 'typing' }
          ));
        }, activeSkillId);
        const dt = performance.now() - t0;
        setMessages(m => m.filter(x => x.id !== typingId).concat({ id: uid(), role: 'agent', content, timestamp: new Date(), durationMs: dt }));
      } catch (err) {
        const dt = performance.now() - t0;
        setMessages(m => m.filter(x => x.id !== typingId).concat({ id: uid(), role: 'error', content: err.message, timestamp: new Date(), durationMs: dt }));
      } finally {
        setPending(false);
      }
    }

    const hasKey = !!agent.apiConfig.apiKey;

    return (
      <>
        {/* Backdrop */}
        <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', zIndex: 200 }} />
        {/* Drawer */}
        <div className="slide-in-right" style={{ position: 'fixed', top: 0, right: 0, bottom: 0, width: 420, background: 'var(--bg-sidebar)', borderLeft: '1px solid var(--border)', zIndex: 201, display: 'flex', flexDirection: 'column', boxShadow: '-4px 0 24px rgba(0,0,0,0.5)', overflow: 'hidden' }}>
          {/* Header */}
          <div style={{ padding: '16px 20px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{ width: 40, height: 40, borderRadius: '50%', background: '#1e1e1e', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20, flexShrink: 0 }}>{agent.avatar}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 700, fontSize: 15 }}>{agent.name}</div>
              <div style={{ fontSize: 12, color: hasKey ? 'var(--success)' : 'var(--danger)', display: 'flex', alignItems: 'center', gap: 4 }}>
                <span style={{ width: 7, height: 7, borderRadius: '50%', background: hasKey ? 'var(--success)' : 'var(--danger)', display: 'inline-block' }} />
                {hasKey ? 'Connected' : 'No API key'}
              </div>
            </div>
            <IconBtn onClick={() => setShowHistory(h => !h)} title="Chat history" style={{ background: showHistory ? 'var(--bg-hover)' : undefined }}>🕐</IconBtn>
            <IconBtn onClick={onClose} title="Close">✕</IconBtn>
          </div>

          {/* History Panel */}
          {showHistory && (() => {
            const sessions = loadHistory();
            return (
              <div style={{ position: 'absolute', top: 73, right: 0, width: 420, bottom: 0, background: 'var(--bg-app)', zIndex: 10, display: 'flex', flexDirection: 'column', borderLeft: '1px solid var(--border)' }}>
                <div style={{ padding: '12px 16px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  {viewingSession
                    ? <><button onClick={() => setViewingSession(null)} style={{ background: 'none', border: 'none', color: 'var(--primary)', cursor: 'pointer', fontSize: 13, padding: 0 }}>← Back</button>
                        <span style={{ fontSize: 12, color: 'var(--text-2)' }}>{viewingSession.startedAt.toLocaleDateString()} {viewingSession.startedAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></>
                    : <><span style={{ fontWeight: 600, fontSize: 14 }}>Previous conversations</span>
                        <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>{sessions.length} saved</span></>
                  }
                </div>
                <div style={{ flex: 1, overflowY: 'auto', padding: viewingSession ? '12px 16px' : 8, display: 'flex', flexDirection: 'column', gap: viewingSession ? 10 : 4 }}>
                  {viewingSession
                    ? viewingSession.messages.map(msg => {
                        if (msg.role === 'tool') return <div key={msg.id} style={{ fontSize: 12, color: 'var(--warning)', fontFamily: 'monospace', background: 'rgba(245,158,11,0.08)', padding: '6px 10px', borderRadius: 8 }}>⚙️ {msg.content}</div>;
                        if (msg.role === 'skill') return <div key={msg.id} style={{ textAlign: 'center', fontSize: 12, color: 'var(--teal)' }}>⚡ {msg.content}</div>;
                        if (msg.role === 'error') return <div key={msg.id} style={{ fontSize: 12, color: 'var(--danger)', background: 'rgba(239,68,68,0.08)', padding: '6px 10px', borderRadius: 8 }}>⚠ {msg.content}</div>;
                        const isUser = msg.role === 'user';
                        const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
                        return (
                          <div key={msg.id} style={{ display: 'flex', justifyContent: isUser ? 'flex-end' : 'flex-start' }}>
                            <div dir={dir} style={{ maxWidth: '85%', background: isUser ? 'var(--primary)' : 'var(--bg-panel)', color: 'var(--text)', padding: '8px 12px', borderRadius: isUser ? '14px 14px 4px 14px' : '14px 14px 14px 4px', fontSize: 13, lineHeight: 1.5 }}>
                              {msg.content}
                              <div style={{ fontSize: 10, color: isUser ? 'rgba(255,255,255,0.6)' : 'var(--text-muted)', marginTop: 3, textAlign: isUser ? 'right' : 'left' }}>
                                🕐 {new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                              </div>
                            </div>
                          </div>
                        );
                      })
                    : sessions.length === 0
                      ? <div style={{ textAlign: 'center', color: 'var(--text-muted)', fontSize: 13, marginTop: 40 }}>No previous conversations</div>
                      : sessions.map(s => {
                          const firstUser = s.messages.find(m => m.role === 'user');
                          const preview = firstUser?.content?.slice(0, 60) || '—';
                          const d = new Date(s.startedAt);
                          return (
                            <div key={s.id} onClick={() => setViewingSession(s)} style={{ padding: '10px 12px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', cursor: 'pointer', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 10 }}
                              onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                              onMouseLeave={e => e.currentTarget.style.background = 'var(--bg-card)'}>
                              <div style={{ flex: 1, minWidth: 0 }}>
                                <div style={{ fontSize: 11, color: 'var(--text-muted)', marginBottom: 3 }}>{d.toLocaleDateString()} {d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} · {s.messages.filter(m => m.role === 'user').length} messages</div>
                                <div style={{ fontSize: 13, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{preview}</div>
                              </div>
                              <button onClick={e => { e.stopPropagation(); deleteSession(s.id); }} title="Delete" style={{ background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer', fontSize: 14, padding: '2px 4px', borderRadius: 4, flexShrink: 0 }}
                                onMouseEnter={e => e.currentTarget.style.color = 'var(--danger)'}
                                onMouseLeave={e => e.currentTarget.style.color = 'var(--text-muted)'}>🗑</button>
                            </div>
                          );
                        })
                  }
                </div>
              </div>
            );
          })()}

          {/* Messages */}
          <div ref={listRef} style={{ flex: 1, overflowY: 'auto', padding: '16px 20px', display: 'flex', flexDirection: 'column', gap: 12 }}>
            {messages.map(msg => {
              if (msg.role === 'typing') return (
                <div key={msg.id} style={{ display: 'flex', gap: 6 }}>
                  <div style={{ background: 'var(--bg-panel)', padding: '12px 16px', borderRadius: '18px 18px 18px 4px', display: 'flex', gap: 5, alignItems: 'center' }}>
                    <span className="typing-dot" /><span className="typing-dot" /><span className="typing-dot" />
                  </div>
                </div>
              );
              if (msg.role === 'tool') return (
                <div key={msg.id} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <div style={{ background: 'rgba(245,158,11,0.12)', border: '1px solid rgba(245,158,11,0.3)', color: 'var(--warning)', padding: '8px 14px', borderRadius: 12, fontSize: 12, fontFamily: 'monospace' }}>
                    ⚙️ {msg.content}
                  </div>
                </div>
              );
              if (msg.role === 'skill') return (
                <div key={msg.id} style={{ textAlign: 'center' }}>
                  <span style={{ background: 'rgba(20,184,166,0.15)', color: 'var(--teal)', borderRadius: 'var(--r-xl)', padding: '4px 14px', fontSize: 12, border: '1px solid rgba(20,184,166,0.3)' }}>⚡ {msg.content}</span>
                </div>
              );
              if (msg.role === 'user') {
                const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
                return (
                  <div key={msg.id} style={{ display: 'flex', justifyContent: 'flex-end' }}>
                    <div style={{ maxWidth: '78%', background: 'var(--primary)', color: '#fff', padding: '10px 14px', borderRadius: '18px 18px 4px 18px', fontSize: 14, lineHeight: 1.5 }} dir={dir}>{msg.content}</div>
                  </div>
                );
              }
              if (msg.role === 'error') return (
                <div key={msg.id} style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                  <div style={{ maxWidth: '80%', background: 'rgba(239,68,68,0.12)', border: '1px solid rgba(239,68,68,0.3)', color: 'var(--danger)', padding: '10px 14px', borderRadius: '18px 18px 18px 4px', fontSize: 13 }}>⚠ {msg.content}</div>
                  <div style={{ fontSize: 11, color: 'var(--danger)', paddingLeft: 4 }}>⚠ Failed after {fmtDuration(msg.durationMs)} &nbsp;•&nbsp; 🕐 {fmtTime(msg.timestamp)}</div>
                </div>
              );
              // agent
              const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
              return (
                <div key={msg.id} style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                  <div style={{ maxWidth: '80%', background: 'var(--bg-panel)', color: 'var(--text)', padding: '10px 14px', borderRadius: '18px 18px 18px 4px', fontSize: 14, lineHeight: 1.5, whiteSpace: 'pre-wrap' }} dir={dir}>{msg.content}</div>
                  <div style={{ fontSize: 11, color: 'var(--text-muted)', paddingLeft: 4 }}>
                    {msg.isOpening ? `🕐 ${fmtTime(msg.timestamp)}` : `⏱ ${fmtDuration(msg.durationMs)}   •   🕐 ${fmtTime(msg.timestamp)}`}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Input */}
          <div style={{ padding: '12px 16px', borderTop: '1px solid var(--border)', background: 'var(--bg-app)' }}>
            <div style={{ display: 'flex', gap: 8, marginBottom: 6 }}>
              <textarea
                ref={inputRef}
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
                dir="auto"
                rows={1}
                disabled={pending}
                placeholder="Message…"
                style={{ flex: 1, resize: 'none', fontSize: 14 }}
              />
              <button onClick={sendMessage} disabled={pending || !input.trim()} style={{ background: 'var(--primary)', color: '#fff', padding: '0 14px', borderRadius: 'var(--r-md)', fontWeight: 700, fontSize: 18 }}>➤</button>
            </div>
            <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>Use #SkillName to switch skills &nbsp;•&nbsp; @toolName to call tools</div>
          </div>
        </div>
      </>
    );
  }

  /* ─────────────────── AGENT EDITOR ─────────────────── */
  function AgentEditor({ agent, onUpdate, onBack }) {
    const [tab, setTab] = useState('configuration');
    const TABS = ['configuration','skills','tools','knowledge','export'];

    return (
      <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
        {/* Back + title */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
          <button onClick={onBack} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13 }}>← Back</button>
          <span style={{ fontSize: 22 }}>{agent.avatar}</span>
          <span style={{ fontWeight: 700, fontSize: 18 }}>{agent.name}</span>
        </div>
        {/* Tab bar */}
        <div style={{ display: 'flex', gap: 4, marginBottom: 20, background: 'var(--bg-panel)', padding: 4, borderRadius: 'var(--r-md)', width: 'fit-content', border: '1px solid var(--border)' }}>
          {TABS.map(t => (
            <button key={t} onClick={() => setTab(t)}
              style={{ padding: '6px 16px', borderRadius: 'var(--r-sm)', fontWeight: 600, fontSize: 13, textTransform: 'capitalize', background: tab === t ? 'var(--primary)' : 'transparent', color: tab === t ? '#fff' : 'var(--text-2)' }}>
              {t}
            </button>
          ))}
        </div>
        {/* Content */}
        <div style={{ flex: 1, overflowY: 'auto', paddingRight: 4 }}>
          {tab === 'configuration' && <ConfigurationTab agent={agent} onUpdate={onUpdate} />}
          {tab === 'skills' && <SkillsTab agent={agent} onUpdate={onUpdate} />}
          {tab === 'tools' && <ToolsTab agent={agent} onUpdate={onUpdate} />}
          {tab === 'knowledge' && <KnowledgeTab agent={agent} />}
          {tab === 'export' && <ExportTab agent={agent} />}
        </div>
      </div>
    );
  }

  /* ─────────────────── AGENT CARD ─────────────────── */
  function AgentCard({ agent, onEdit, onTest, onDuplicate, onDelete, onExport, isNew }) {
    const [hovered, setHovered] = useState(false);

    return (
      <div
        className={isNew ? 'card-highlight fade-in' : 'fade-in'}
        onMouseEnter={() => setHovered(true)}
        onMouseLeave={() => setHovered(false)}
        style={{
          background: 'var(--bg-card)',
          borderRadius: 'var(--r-lg)',
          border: `1px solid ${hovered ? 'var(--primary)' : 'var(--border)'}`,
          boxShadow: hovered ? '0 0 16px rgba(239,159,39,0.2), var(--shadow)' : 'var(--shadow)',
          padding: 20,
          display: 'flex',
          flexDirection: 'column',
          gap: 14,
          transition: 'border-color 0.2s, box-shadow 0.2s',
          cursor: 'pointer',
        }}
        onClick={onEdit}
      >
        {/* Avatar + name */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <div style={{ width: 52, height: 52, borderRadius: '50%', background: '#1e1e1e', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24, flexShrink: 0 }}>
            {agent.avatar}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontWeight: 700, fontSize: 15, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{agent.name}</div>
            <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 2 }}>{new Date(agent.createdAt).toLocaleDateString()}</div>
          </div>
        </div>
        {/* Badges */}
        <div style={{ display: 'flex', gap: 6 }}>
          <span style={{ background: 'rgba(239,159,39,0.15)', color: 'var(--primary)', borderRadius: 'var(--r-sm)', padding: '2px 8px', fontSize: 12, fontWeight: 600 }}>🎯 {agent.skills.length} skills</span>
          <span style={{ background: 'rgba(20,184,166,0.15)', color: 'var(--teal)', borderRadius: 'var(--r-sm)', padding: '2px 8px', fontSize: 12, fontWeight: 600 }}>⚙️ {agent.tools.length} tools</span>
        </div>
        {/* Actions */}
        <div style={{ display: 'flex', gap: 4, borderTop: '1px solid var(--border)', paddingTop: 12 }} onClick={e => e.stopPropagation()}>
          {[
            { label: '✏️ Edit', fn: onEdit },
            { label: '💬 Test', fn: onTest },
            { label: '📋 Copy', fn: onDuplicate },
            { label: '📤 Export', fn: onExport },
            { label: '🗑', fn: onDelete, danger: true },
          ].map(({ label, fn, danger }) => (
            <button key={label} onClick={fn}
              style={{ flex: label === '🗑' ? 0 : 1, padding: '6px 4px', borderRadius: 'var(--r-sm)', fontSize: 12, fontWeight: 500, background: 'var(--bg-hover)', color: danger ? 'var(--danger)' : 'var(--text-2)', border: 'none' }}
              onMouseEnter={e => e.currentTarget.style.background = danger ? 'rgba(239,68,68,0.1)' : 'var(--bg-input)'}
              onMouseLeave={e => e.currentTarget.style.background = 'var(--bg-hover)'}
            >{label}</button>
          ))}
        </div>
      </div>
    );
  }
