  /* ─────────────────── INTERACTIONS ─────────────────── */
  function fmtSessionDuration(seconds) {
    const sec = Math.max(0, Math.round(seconds || 0));
    if (sec < 60) return `${sec}s`;
    const m = Math.floor(sec / 60), rest = sec % 60;
    if (m < 60) return rest ? `${m}m ${rest}s` : `${m}m`;
    const h = Math.floor(m / 60);
    return `${h}h ${m % 60}m`;
  }

  const SOURCE_LABELS = { widget: 'Widget', whatsapp: 'WhatsApp', test: 'Test chat' };

  const EMPTY_FILTERS = {
    q: '', agentId: '', source: '', from: '', to: '',
    minSeconds: '', maxSeconds: '', minMessages: '',
  };

  function InteractionsView({ agents, user, onOpenAgent, stacked }) {
    const PAGE_SIZE = 25;
    const [filters, setFilters] = useState(EMPTY_FILTERS);
    const [sort, setSort]       = useState({ sort: 'started', dir: 'desc' });
    const [offset, setOffset]   = useState(0);
    const [scopeAll, setScopeAll] = useState(false);
    const [data, setData]      = useState(null);
    const [error, setError]    = useState(null);
    const [loading, setLoading] = useState(true);
    const [openSession, setOpenSession] = useState(null);
    const [filtersOpen, setFiltersOpen] = useState(false);   // the phone's filter sheet
    const [moreOpen, setMoreOpen] = useState(false);         // the exact filters, on desktop

    const set = (key, val) => { setFilters(f => ({ ...f, [key]: val })); setOffset(0); };
    const activeFilters = Object.keys(EMPTY_FILTERS).filter(k => filters[k] !== '').length;

    // Filters are typed into, so debounce before hitting the API.
    useEffect(() => {
      let live = true;
      setLoading(true);
      const t = setTimeout(() => {
        apiListInteractions({
          ...filters,
          sort: sort.sort, dir: sort.dir,
          limit: PAGE_SIZE, offset,
          scope: scopeAll ? 'all' : '',
        })
          .then(d => { if (live) { setData(d); setError(null); setLoading(false); } })
          .catch(err => { if (live) { setError(err.message); setLoading(false); } });
      }, 300);
      return () => { live = false; clearTimeout(t); };
    }, [filters, sort, offset, scopeAll]);

    /* ---- one conversation ---- */
    if (openSession) {
      const msgs = (openSession.messages || []).filter(m => m.role === 'user' || m.role === 'assistant');
      return (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24, flexWrap: 'wrap' }}>
            <button onClick={() => setOpenSession(null)} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13, border: '1px solid var(--border)' }}>← Back</button>
            <div style={{ width: 1, height: 20, background: 'var(--border)' }} />
            <AvatarDisplay value={openSession.agent_avatar} size={28} />
            <div>
              <div style={{ fontWeight: 800, fontSize: 18 }}>{openSession.agent_name}</div>
              <div style={{ color: 'var(--text-muted)', fontSize: 12, marginTop: 2 }}>
                {SOURCE_LABELS[openSession.source] || openSession.source}
                &nbsp;·&nbsp;{new Date(openSession.started_at).toLocaleString()}
                &nbsp;·&nbsp;{fmtSessionDuration(openSession.duration_seconds)}
                &nbsp;·&nbsp;{msgs.length} messages
              </div>
            </div>
            {onOpenAgent && (
              <button onClick={() => onOpenAgent(openSession.agent_id)}
                style={{ marginLeft: 'auto', background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13, border: '1px solid var(--border)' }}>
                Open AI Chatbot
              </button>
            )}
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, width: '100%' }}>
            {msgs.map((m, i) => (
              <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: m.role === 'user' ? 'flex-end' : 'flex-start' }}>
                <div style={{
                  maxWidth: '72%', padding: '10px 14px', fontSize: 14, lineHeight: 1.5,
                  whiteSpace: 'pre-wrap', wordBreak: 'break-word',
                  borderRadius: m.role === 'user' ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
                  background: m.role === 'user' ? 'var(--primary)' : 'var(--bg-card)',
                  color: m.role === 'user' ? '#0a0a0a' : 'var(--text)',
                  border: m.role === 'assistant' ? '1px solid var(--border)' : 'none',
                }}>{typeof m.content === 'string' ? m.content : JSON.stringify(m.content)}</div>
                <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 3, padding: '0 4px' }}>
                  {m.role === 'user' ? 'User' : openSession.agent_name}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ---- list ---- */
    const sessions = data?.sessions || [];
    const total = data?.total || 0;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    const currentPage = Math.floor(offset / PAGE_SIZE);

    // Agent options: the user's own agents, plus any agent seen in the current
    // page (an admin looking at every user's conversations).
    const agentOptions = [...(agents || []).map(a => ({ id: a.id, name: a.name }))];
    sessions.forEach(sx => {
      if (!agentOptions.some(o => o.id === sx.agent_id)) agentOptions.push({ id: sx.agent_id, name: sx.agent_name || sx.agent_id });
    });

    const sourceOptions = (data?.sources || []).map(sx => sx.source);

    const inputStyle = {
      width: '100%', fontSize: 12, padding: '5px 7px', borderRadius: 'var(--r-sm)',
      background: 'var(--bg-input)', border: '1px solid var(--border)', color: 'var(--text)',
    };

    /* ---- phone: cards, a search box, the filters in a sheet ---- */
    if (stacked) {
      const chip = (label, on, onClick) => (
        <button key={label} onClick={onClick}
          style={{ flexShrink: 0, height: 34, padding: '0 12px', borderRadius: 999, fontSize: 12.5, fontWeight: 600, whiteSpace: 'nowrap',
                   background: on ? 'var(--primary-dim)' : 'var(--bg-card)', color: on ? 'var(--primary)' : 'var(--text-2)',
                   border: `1px solid ${on ? 'rgba(239,159,39,0.35)' : 'var(--border)'}` }}>{label}</button>
      );
      const agentName = filters.agentId ? (agentOptions.find(o => o.id === filters.agentId) || {}).name : '';
      const sheetField = (label, control) => (
        <div><label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 5, display: 'block' }}>{label}</label>{control}</div>
      );
      const selStyle = { width: '100%', height: 44, borderRadius: 'var(--r-md)', padding: '0 12px' };
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
            <div style={{ fontWeight: 800, fontSize: 32, letterSpacing: '-0.035em' }}>Interactions</div>
            <CountLabel n={total} noun="CHAT" />
          </div>
          {user?.isAdmin && (
            <div>{chip(scopeAll ? 'All users' : 'My AI Chatbots', scopeAll, () => { setScopeAll(v => !v); setOffset(0); })}</div>
          )}

          <SearchField value={filters.q} onChange={v => set('q', v)} placeholder="Search every message" style={{ height: 48, flex: 'none' }} />

          <div className="m-scroll-x" style={{ display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 2 }}>
            {chip(`⚙ Filters${activeFilters ? ` (${activeFilters})` : ''}`, activeFilters > 0, () => setFiltersOpen(true))}
            {chip(agentName ? agentName : 'All AI Chatbots ▾', !!filters.agentId, () => setFiltersOpen(true))}
            {sourceOptions.map(sx => chip(SOURCE_LABELS[sx] || sx, filters.source === sx, () => set('source', filters.source === sx ? '' : sx)))}
            {activeFilters > 0 && chip('✕ Clear', false, () => { setFilters(EMPTY_FILTERS); setOffset(0); })}
          </div>

          {error && <div style={{ background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.3)', color: 'var(--danger)', padding: '9px 13px', borderRadius: 'var(--r-md)', fontSize: 12.5 }}>{error}</div>}

          {loading && !data ? (
            <div style={{ color: 'var(--text-muted)', fontSize: 13, padding: 20, textAlign: 'center' }}>Loading…</div>
          ) : sessions.length === 0 ? (
            <div style={{ padding: '40px 20px', textAlign: 'center', background: 'var(--bg-card)', border: '1px dashed var(--border)', borderRadius: 'var(--r-lg)', color: 'var(--text-muted)', fontSize: 13 }}>
              {activeFilters ? 'No conversations match these filters.' : 'No conversations yet.'}
            </div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {sessions.map(sx => {
                const msgs = sx.messages || [];
                const firstUser = msgs.find(m => m.role === 'user');
                const preview = typeof firstUser?.content === 'string' ? firstUser.content : '—';
                const chColor = sx.source === 'whatsapp' ? '#25D366' : 'var(--teal)';
                return (
                  <button key={sx.id} onClick={() => setOpenSession(sx)}
                    style={{ width: '100%', textAlign: 'left', display: 'flex', gap: 12, alignItems: 'flex-start', padding: '13px 14px', background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 14, color: 'var(--text)' }}>
                      <AvatarDisplay value={sx.agent_avatar} size={22} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
                        <span dir="auto" style={{ fontWeight: 700, fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{sx.agent_name}</span>
                        <span style={{ fontSize: 10.5, fontWeight: 700, color: chColor, background: sx.source === 'whatsapp' ? 'rgba(37,211,102,0.12)' : 'var(--teal-dim)', padding: '2px 7px', borderRadius: 6, flexShrink: 0 }}>{SOURCE_LABELS[sx.source] || sx.source}</span>
                        {scopeAll && sx.owner_username && <span style={{ fontSize: 10.5, color: 'var(--text-muted)', flexShrink: 0 }}>@{sx.owner_username}</span>}
                      </div>
                      <div dir="auto" style={{ fontSize: 13, color: 'var(--text-2)', marginTop: 4, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{preview}</div>
                      <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 5 }}>
                        {new Date(sx.started_at).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })} · {fmtSessionDuration(sx.duration_seconds)} · {sx.message_count} messages
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
          )}

          {totalPages > 1 && (
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 12, padding: '6px 0' }}>
              <button disabled={currentPage === 0} onClick={() => setOffset(o => Math.max(0, o - PAGE_SIZE))}
                style={{ height: 40, padding: '0 16px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: 'var(--text-2)', opacity: currentPage === 0 ? 0.4 : 1 }}>‹ Prev</button>
              <span style={{ fontSize: 12.5, color: 'var(--text-muted)' }}>{currentPage + 1} / {totalPages}</span>
              <button disabled={currentPage + 1 >= totalPages} onClick={() => setOffset(o => o + PAGE_SIZE)}
                style={{ height: 40, padding: '0 16px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: 'var(--text-2)', opacity: currentPage + 1 >= totalPages ? 0.4 : 1 }}>Next ›</button>
            </div>
          )}

          <MobileSheet open={filtersOpen} onClose={() => setFiltersOpen(false)} title="Filters"
            right={activeFilters > 0 && (
              <button onClick={() => { setFilters(EMPTY_FILTERS); setOffset(0); }} style={{ height: 36, padding: '0 12px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: 'var(--text-2)', fontSize: 12.5, fontWeight: 600 }}>Clear all</button>
            )}>
            <div style={{ padding: '14px 16px 20px', display: 'flex', flexDirection: 'column', gap: 14, overflowY: 'auto' }}>
              {sheetField('Agent',
                <select value={filters.agentId} onChange={e => set('agentId', e.target.value)} style={selStyle}>
                  <option value="">All AI Chatbots</option>
                  {agentOptions.map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
                </select>)}
              {sheetField('Channel',
                <select value={filters.source} onChange={e => set('source', e.target.value)} style={selStyle}>
                  <option value="">All channels</option>
                  {sourceOptions.map(sx => <option key={sx} value={sx}>{SOURCE_LABELS[sx] || sx}</option>)}
                </select>)}
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                {sheetField('From', <input type="date" value={filters.from} onChange={e => set('from', e.target.value)} style={selStyle} />)}
                {sheetField('To', <input type="date" value={filters.to} onChange={e => set('to', e.target.value)} style={selStyle} />)}
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                {sheetField('Min seconds', <input type="number" min="0" inputMode="numeric" value={filters.minSeconds} onChange={e => set('minSeconds', e.target.value)} style={selStyle} />)}

              {sheetField('Min messages', <input type="number" min="0" inputMode="numeric" value={filters.minMessages} onChange={e => set('minMessages', e.target.value)} style={selStyle} />)}

    /* The two filters people actually reach for are "when" and "how long", so
       they get presets; the exact numbers stay one click away under "More". */
    const today = new Date();
    const iso = d => d.toISOString().slice(0, 10);
    const daysAgo = n => { const d = new Date(today); d.setDate(d.getDate() - n); return iso(d); };
    const DATE_PRESETS = {
      today: { label: 'Today',        from: iso(today),  to: '' },
      '7':   { label: 'Last 7 days',  from: daysAgo(7),  to: '' },
      '30':  { label: 'Last 30 days', from: daysAgo(30), to: '' },
      '365': { label: 'Last year',    from: daysAgo(365), to: '' },
    };

      short:  { label: 'Under a minute', minSeconds: '',    maxSeconds: '60' },
      medium: { label: '1 – 5 minutes',  minSeconds: '60',  maxSeconds: '300' },
      long:   { label: 'Over 5 minutes', minSeconds: '300', maxSeconds: '' },
    };

      const v = table[key] || { from: '', to: '', minSeconds: '', maxSeconds: '' };
      setFilters(f => ({ ...f, ...Object.fromEntries(Object.entries(v).filter(([k]) => k !== 'label')) }));

    function exportCsv() {
      const cell = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
      const rows = [['Agent', 'Channel', 'Started', 'Duration', 'Messages', 'Opening message']];
      sessions.forEach(sx => {
        const firstUser = (sx.messages || []).find(m => m.role === 'user');
        rows.push([
          sx.agent_name || '', SOURCE_LABELS[sx.source] || sx.source,
          new Date(sx.started_at).toISOString(), fmtSessionDuration(sx.duration_seconds),
          sx.message_count, typeof firstUser?.content === 'string' ? firstUser.content : '',
        ]);
      });
      const blob = new Blob(['\ufeff' + rows.map(r => r.map(cell).join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `interactions-${iso(today)}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);

                    const started = new Date(sx.started_at);

              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, marginTop: 20 }}>
                <Btn size="sm" onClick={() => setOffset(Math.max(0, (currentPage - 1) * PAGE_SIZE))} disabled={currentPage === 0}>← Prev</Btn>

              </div>
            )}
          </React.Fragment>
        )}
      </div>
    );

  /* ─────────────────── PLATFORM ASSISTANT ─────────────────── */

  // A tool-calling loop over the account's provider for assistants that are not
  // tied to one agent. `execute` receives (name, input) and returns a string.
  async function callWithToolDefs({ system, history, tools, execute, maxRounds = 8, maxTokens = 4096 }) {
    const { apiKey, provider, model } = accountApi();

    if (provider === 'claude') {
      let msgs = [...history];
      for (let round = 0; round < maxRounds; round++) {
        const r = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true',
          },
          body: JSON.stringify({
            model, max_tokens: maxTokens, system, messages: msgs,
            tools: tools.map(t => ({ name: t.name, description: t.description, input_schema: t.input_schema })),
          }),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error?.message || JSON.stringify(d));

        if (d.stop_reason !== 'tool_use') {
          return d.content.filter(c => c.type === 'text').map(c => c.text).join('\n').trim();
        }
        const uses = d.content.filter(c => c.type === 'tool_use');
        const results = [];
        for (const u of uses) {
          results.push({ type: 'tool_result', tool_use_id: u.id, content: await execute(u.name, u.input || {}) });
        }
        msgs = [...msgs, { role: 'assistant', content: d.content }, { role: 'user', content: results }];
      }
      throw new Error(L('Too many tool rounds — try breaking the request up', 'יותר מדי סבבי כלים — נסה לפרק את הבקשה'));
    }

    // OpenAI and Ollama share the chat-completions shape.
    const fnTools = tools.map(t => ({ type: 'function', function: { name: t.name, description: t.description, parameters: t.input_schema } }));
    let msgs = [{ role: 'system', content: system }, ...history];
    for (let round = 0; round < maxRounds; round++) {
      const body = { model, messages: msgs, tools: fnTools };
      const r = provider === 'ollama'
        ? await fetch('/api/ollama-proxy', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ host: (accountApi().ollamaHost || '').replace(/\/$/, ''), path: '/v1/chat/completions', body }),
          })
        : await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${apiKey}` },
            body: JSON.stringify(body),
          });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error?.message || JSON.stringify(d));

      const choice = d.choices[0];
      if (choice.finish_reason !== 'tool_calls') return choice.message.content || '';

      const toolMsgs = [];
      for (const tc of choice.message.tool_calls || []) {
        let inputs = {};
        try { inputs = JSON.parse(tc.function.arguments || '{}'); } catch (_) { /* keep {} */ }
        toolMsgs.push({ role: 'tool', tool_call_id: tc.id, content: await execute(tc.function.name, inputs) });
      }
      msgs = [...msgs, choice.message, ...toolMsgs];
    }
    throw new Error(L('Too many tool rounds — try breaking the request up', 'יותר מדי סבבי כלים — נסה לפרק את הבקשה'));
  }

          row_id: STR('To change a row, its row_id from read_table. Leave out to add a new one.'),
          row: { type: 'object', description: 'The columns to set, as column name to value' },

        required: ['table', 'row'],
      },
    },
  ];

  const PLATFORM_REFERENCE = [
    'The platform (8Legs.ai) — what you are operating:',
    '- An AI CHATBOT has: a name and avatar, an opening message, a base prompt, skills, Python tools, a knowledge base, and channels.',

  function buildPlatformAssistantPrompt(agents, language) {

    const cfg = accountApi();

    return [

      '',
      language === 'en'
        ? 'Reply in English, briefly and concretely, with no preamble.'
        : 'ענה בעברית, בקצרה ולעניין, בלי הקדמות. מונחי הממשק (Tools, Skills, Settings, Interactions) נשארים באנגלית.',
      '',
      `The account runs on ${cfg.provider} · ${cfg.model}.`,

      inventory,

  /**
   * The platform assistant as an engine: the conversation, the tool loop and
   * the saving, with no opinion about how any of it looks. Two screens dress
   * it — the Assistant chat and the home screen.
   *
   * `systemExtra` is appended to the system prompt (the home screen adds the
   * first-agent interview), and `focusAgentId` is whichever agent this
   * conversation last created or changed, so a screen can show it being built.
   */
  function usePlatformAssistant({ agents, onAgentsChanged, language, seed, systemExtra, onSaved, onSeedUsed }) {
    const [messages, setMessages] = useState([]);   // { id, role: user|assistant|tool|error, … }
    const [input, setInput] = useState('');
    const [pending, setPending] = useState(false);
    const [focusAgentId, setFocusAgentId] = useState(null);
    const listRef = useRef(null);
    const sessionIdRef = useRef(uid());
    const [sessionId, setSessionId] = useState(sessionIdRef.current);
    const agentsRef = useRef(agents);
    useEffect(() => { agentsRef.current = agents; }, [agents]);

    useEffect(() => {
      if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
    }, [messages, pending]);

    // A question handed in from outside (an example chip, or "build with the
    // assistant") is asked straight away. The nonce is what makes a repeat of
    // the same text ask again.
    const seededRef = useRef(null);
    useEffect(() => {
      if (!seed || !seed.text || seed.nonce === seededRef.current) return;
      seededRef.current = seed.nonce;
      if (accountApiUsable()) send(seed.text, { fresh: seed.fresh, seeded: true });
      else setInput(seed.text);
      /* Used up. A question that outlives the screen it was asked on gets
         asked again the next time the screen is opened — and pays for it. */
      if (onSeedUsed) onSeedUsed();
    }, [seed]);

    const noKey = !accountApiUsable();

    function persist(all) {
      const real = all.filter(m => m.role === 'user' || m.role === 'assistant' || m.role === 'tool');
      if (!real.some(m => m.role === 'user')) return;
      saveAssistantSession({
        id: sessionIdRef.current,
        kind: 'platform',
        subject: '',
        title: sessionTitle(all),
        messages: real.map(m => m.role === 'tool'
          ? { role: 'tool', name: m.name, input: m.input, result: m.result }
          : { role: m.role, content: m.content, ...(m.seeded ? { seeded: true } : {}) }),
      });
      if (onSaved) onSaved();
    }

    function startNewChat() {
      setMessages([]);
      setInput('');
      setFocusAgentId(null);
      sessionIdRef.current = uid();
      setSessionId(sessionIdRef.current);
    }

    /* Reopening a saved conversation: its rows become the same message shapes
       the live chat uses, and further turns keep writing to that same row. */
    function loadSession(session) {
      if (!session) return;
      sessionIdRef.current = session.id;
      setSessionId(session.id);
      setInput('');
      setFocusAgentId(null);
      setMessages((session.messages || []).map(m => m.role === 'tool'
        ? { id: uid(), role: 'tool', name: m.name, input: m.input, result: m.result }
        : { id: uid(), role: m.role, content: m.content, seeded: !!m.seeded }));
    }

    function findAgent(id) {
      return (agentsRef.current || []).find(a => a.id === id) || null;
    }

    function toolShape(tool) {
      return {
        id: uid(),
        name: tool.name || 'new_tool',
        description: tool.description || '',
        parameters: (tool.parameters || []).filter(p => p && p.name).map(p => ({
          name: p.name,
          type: PARAM_TYPES.includes((p.type || '').toLowerCase()) ? p.type.toLowerCase() : 'string',
          description: p.description || '',
        })),
        packages: tool.packages || '',
        envVars: [],
        code: tool.code || DEFAULT_TOOL_CODE,
      };
    }

    function skillShape(skill) {
      return { id: uid(), name: skill.name || 'New Skill', description: skill.description || '', prompt: skill.prompt || '' };
    }

    async function execute(name, input) {
      const step = { id: uid(), role: 'tool', name, input };
      setMessages(m => [...m, step]);
      const done = (result) => {
        setMessages(m => m.map(x => x.id === step.id ? { ...x, result } : x));
        return result;
      };

      try {
        if (name === 'list_agents') {
          const list = (agentsRef.current || []).map(a => ({
            id: a.id, name: a.name, opening_message: a.openingMessage,
            skills: (a.skills || []).map(s => s.name),
            tools: (a.tools || []).map(t => t.name),
            email_enabled: !!a.emailEnabled,
            whatsapp_enabled: !!(a.whatsapp && a.whatsapp.enabled),
          }));
          return done(JSON.stringify(list, null, 1));
        }

        if (name === 'get_agent') {
          const agent = findAgent(input.agent_id);
          if (!agent) return done(`No agent with id ${input.agent_id}. Call list_agents.`);
          return done(JSON.stringify(stripUiFields(agent), null, 1));
        }

        if (name === 'create_agent') {
          const created = makeAgent({
            name: input.name || 'New AI Chatbot',
            avatar: input.avatar || DEFAULT_AVATAR,
            basePrompt: input.base_prompt || '',
            openingMessage: input.opening_message || 'Hello! How can I help you today?',
            skills: (input.skills || []).map(skillShape),
            tools: (input.tools || []).map(toolShape),
          });
          await apiCreate(created);
          setFocusAgentId(created.id);
          await onAgentsChanged();
          return done(`Created agent "${created.name}" with id ${created.id}.`);
        }

        if (name === 'update_agent') {
          const agent = findAgent(input.agent_id);
          if (!agent) return done(`No agent with id ${input.agent_id}. Call list_agents.`);
          const updated = { ...stripUiFields(agent) };
          if (input.name !== undefined) updated.name = input.name;
          if (input.avatar !== undefined) updated.avatar = input.avatar;
          if (input.base_prompt !== undefined) updated.basePrompt = input.base_prompt;
          if (input.opening_message !== undefined) updated.openingMessage = input.opening_message;
          if (input.email_enabled !== undefined) updated.emailEnabled = !!input.email_enabled;
          if (input.dlp_credit_card !== undefined || input.dlp_israeli_id !== undefined) {
            updated.dlp = {
              ...(agent.dlp || {}),
              ...(input.dlp_credit_card !== undefined ? { creditCard: !!input.dlp_credit_card } : {}),
              ...(input.dlp_israeli_id !== undefined ? { israeliId: !!input.dlp_israeli_id } : {}),
            };
          }
          if (input.skills !== undefined) {
            updated.skills = (input.skills || []).map(s => {
              const existing = (agent.skills || []).find(x => x.name === s.name);
              return { ...skillShape(s), id: existing ? existing.id : uid(), ...(existing ? { prompt: s.prompt !== undefined ? s.prompt : existing.prompt, description: s.description !== undefined ? s.description : existing.description } : {}) };
            });
          }
          if (input.tools !== undefined) {
            updated.tools = (input.tools || []).map(t => {
              const existing = (agent.tools || []).find(x => x.name === t.name);
              const shaped = toolShape(t);
              return existing
                ? { ...existing, ...shaped, id: existing.id, envVars: existing.envVars || [], code: t.code !== undefined ? t.code : existing.code }
                : shaped;
            });
          }
          await apiUpdate(updated);
          setFocusAgentId(updated.id);
          await onAgentsChanged();
          const touched = Object.keys(input).filter(k => k !== 'agent_id');
          return done(`Updated "${updated.name}" (${touched.join(', ') || 'nothing'}).`);
        }

        if (name === 'delete_agent') {
          const agent = findAgent(input.agent_id);
          if (!agent) return done(`No agent with id ${input.agent_id}.`);
          const ok = window.confirm(L(`Delete the AI Chatbot "${agent.name}" and everything it owns?`, `למחוק את ה-AI Chatbot "${agent.name}" וכל מה ששייך לו?`));
          if (!ok) return done('The user declined the deletion. Nothing was deleted.');
          await apiDelete(agent.id);
          await onAgentsChanged();
          return done(`Deleted "${agent.name}".`);
        }

        if (name === 'run_tool') {
          const agent = findAgent(input.agent_id);
          if (!agent) return done(`No agent with id ${input.agent_id}.`);
          const tool = (agent.tools || []).find(t => t.name === input.tool_name);
          if (!tool) return done(`Agent "${agent.name}" has no tool named ${input.tool_name}.`);
          const resp = await fetch('/api/run-tool', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              code: tool.code || '',
              inputs: input.inputs || {},
              packages: (tool.packages || '').split(',').map(x => x.trim()).filter(Boolean),
              env_vars: Object.fromEntries((tool.envVars || []).filter(e => e.key).map(e => [e.key, e.value])),
            }),
          });
          const data = await resp.json();
          return done(data.error ? `Error: ${data.error}` : `Output: ${data.result}`);
        }

        if (name === 'get_recent_errors') {
          const limit = Math.min(Math.max(parseInt(input.limit, 10) || 15, 1), 50);
          const server = await fetchServerErrors({ agentId: input.agent_id || '', source: input.source || '', limit });
          const local = sessionErrors({ agentId: input.agent_id || null, limit }).filter(e => !input.source || e.source === input.source);
          if (server.length === 0 && local.length === 0) {
            return done('No failures recorded. Note this only covers the last 14 days on the server plus this browser session.');
          }
          return done([
            `From the server (widget, WhatsApp, tools in production) — ${server.length}:`,
            formatErrors(server),
            '',
            `From this browser session (test runs, provider errors) — ${local.length}:`,
            formatErrors(local),
          ].join('\n'));
        }

        if (name === 'get_test_conversations') {
          const data = await apiListTestSessions(input.agent_id, {
            q: input.search || '',
            limit: Math.min(Math.max(parseInt(input.limit, 10) || 5, 1), 20),
          });
          const rows = data.sessions || [];
          if (rows.length === 0) return done('No manual test conversations for that agent yet.');
          return done(formatTestConversations(rows, 20));
        }

        /* Tables. The assistant works on the account's own, so it is not
           bound by what any one AI Chatbot has ticked — but it says which
           chatbots can reach a table, because that is the thing people
           forget after making one. */
        if (name === 'list_tables') {
          const { tables } = await apiListTables();
          if (!tables.length) return done('The account has no tables yet.');
          const known = agentsRef.current || [];
          return done(JSON.stringify(tables.map(t => ({
            table: t.name,
            about: t.description || undefined,
            columns: (t.columns || []).map(c => `${c.name} (${c.type})`),
            rows: t.row_count,
            used_by: known.filter(a => (a.tables || []).includes(t.id)).map(a => a.name),
          })), null, 1));
        }

        if (name === 'create_table') {
          const made = await apiCreateTable({
            name: input.name,
            description: input.description || '',
            columns: (input.columns || []).map(c => ({ name: c.name, type: c.type || 'text' })),
          });
          return done(`Created the table "${input.name}" with columns ${made.columns.map(c => c.name).join(', ')}. `
            + 'It is not attached to any AI Chatbot yet — use update_agent with its tables list, or tell the user to tick it in the chatbot\'s Tables tab.');
        }

        if (name === 'read_table' || name === 'write_table_row') {
          const { tables } = await apiListTables();
          const wanted = String(input.table || '').trim().toLowerCase();
          const table = tables.find(t => t.id === input.table)
                     || tables.find(t => (t.name || '').trim().toLowerCase() === wanted);
          if (!table) return done(`No table called "${input.table}". There is: ${tables.map(t => t.name).join(', ') || 'none'}.`);

          if (name === 'read_table') {
            const data = await apiTableRows(table.id, {
              q: input.search || '', limit: Math.min(parseInt(input.limit, 10) || 20, 100),
            });
            if (!data.rows.length) return done(`No rows in "${table.name}" match that.`);
            return done(JSON.stringify({
              total: data.total,
              rows: data.rows.map(r => ({ row_id: r.id, ...r.data })),
            }, null, 1));
          }

          const saved = input.row_id
            ? await apiUpdateTableRow(table.id, input.row_id, input.row || {})
            : await apiAddTableRow(table.id, input.row || {});
          return done(`${input.row_id ? 'Updated' : 'Added'} a row in "${table.name}" (row_id ${saved.id}): ${JSON.stringify(saved.data)}`);
        }

        if (name === 'list_interactions') {
          const data = await apiListInteractions({
            agentId: input.agent_id || '',
            q: input.search || '',
            limit: Math.min(Math.max(parseInt(input.limit, 10) || 10, 1), 50),
          });
          const rows = (data.sessions || []).map(s => ({
            agent: s.agent_name, channel: s.source,
            started: s.started_at, duration_seconds: s.duration_seconds,
            messages: s.message_count,
            first_user_message: ((s.messages || []).find(m => m.role === 'user') || {}).content || '',
          }));
          return done(JSON.stringify({ total: data.total, showing: rows.length, conversations: rows }, null, 1));
        }

        return done(`Unknown tool: ${name}`);
      } catch (err) {
        return done(`Error: ${err.message}`);
      }
    }

    /* `fresh` asks the question in a conversation of its own: a link from
       somewhere else in the app means a new chat, not a turn inside whatever
       was left open here. */
    async function send(text, { fresh, seeded } = {}) {
      const question = (text || '').trim();
      if (!question || pending || noKey) return;
      setInput('');
      const history = fresh
        ? [{ role: 'user', content: question }]
        : [
            ...messages.filter(m => m.role === 'user' || m.role === 'assistant').map(m => ({ role: m.role, content: m.content })),
            { role: 'user', content: question },
          ];
      const asked = { id: uid(), role: 'user', content: question, seeded: !!seeded };
      if (fresh) {
        sessionIdRef.current = uid();
        setSessionId(sessionIdRef.current);
        setFocusAgentId(null);
        setMessages([asked]);
      } else {
        setMessages(m => [...m, asked]);
      }
      setPending(true);
      try {
        const reply = await callWithToolDefs({
          system: buildPlatformAssistantPrompt(agentsRef.current, language) + (systemExtra ? '\n\n' + systemExtra : ''),
          history,
          tools: PLATFORM_TOOLS,
          execute,
        });
        setMessages(m => {
          const next = [...m, { id: uid(), role: 'assistant', content: reply || '—' }];
          persist(next);
          return next;
        });
      } catch (err) {
        recordError('assistant', err.message, { kind: 'platform' });
        setMessages(m => [...m, { id: uid(), role: 'error', content: err.message }]);
      } finally {
        setPending(false);
      }
    }

    return { messages, input, setInput, pending, send, noKey, startNewChat, loadSession, listRef, focusAgentId, sessionId };
  }

  /* ─────────────────── ASSISTANT CHAT ─────────────────── */
  function PlatformAssistantView({ agents, onAgentsChanged, language, compact, seed }) {
    const { messages, input, setInput, pending, send, noKey, startNewChat, listRef } =
      usePlatformAssistant({ agents, onAgentsChanged, language, seed });

    const opening = PLATFORM_OPENING[language === 'en' ? 'en' : 'he'];
    const dir = language === 'en' ? 'ltr' : 'rtl';

    return (
      <div style={{ display: 'flex', flexDirection: 'column', height: '100%', minHeight: compact ? 0 : 560, maxWidth: compact ? 'none' : 900 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: compact ? 10 : 16, flexShrink: 0 }}>
          {!compact && <div style={{ width: 38, height: 38, borderRadius: 11, background: 'var(--primary-dim)', border: '1px solid rgba(239,159,39,0.3)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--primary)' }}>{Icons.sparkle}</div>}
          <div style={{ flex: 1, minWidth: 0 }}>
            {!compact && <div style={{ fontWeight: 800, fontSize: 22, letterSpacing: '-0.02em' }}>Assistant</div>}
            <div style={{ fontSize: compact ? 11 : 12, color: 'var(--text-muted)', marginTop: compact ? 0 : 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {L('Operates the platform for you', 'מתפעל את המערכת בשבילך')} · {accountApi().model || 'no model'}
            </div>
          </div>
          {messages.length > 0 && (
            <button onClick={startNewChat}
              style={{ fontSize: 11.5, fontWeight: 600, padding: '5px 11px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: 'var(--text-2)', flexShrink: 0 }}>
              {L('New chat', 'שיחה חדשה')}

          )}
        </div>

        {noKey && (
          <div style={{ background: 'rgba(245,158,11,0.12)', border: '1px solid rgba(245,158,11,0.35)', borderRadius: 'var(--r-md)', padding: '10px 14px', fontSize: 13, color: 'var(--warning)', marginBottom: 12 }}>
            {L('Set an API key in Settings to use the assistant.',
                'כדי להשתמש באסיסטנט צריך להגדיר מפתח API במסך Settings.')}
          </div>
        )}

        <div ref={listRef} style={{ flex: 1, minHeight: 0, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 12, padding: '4px 2px' }}>
          <div dir={dir} style={{ background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 'var(--r-lg)', padding: '14px 16px', fontSize: 13, lineHeight: 1.75, whiteSpace: 'pre-wrap', color: 'var(--text-2)' }}>
            {opening}
          </div>

          {messages.map(msg => {
            if (msg.role === 'user') {
              return (
                <div key={msg.id} dir="auto" style={{ alignSelf: 'flex-end', maxWidth: '85%', background: 'var(--primary)', color: '#0a0a0a', padding: '9px 13px', borderRadius: '16px 16px 4px 16px', fontSize: 13.5, whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>
                  {msg.content}
                </div>
              );
            }
            if (msg.role === 'tool') {
              const args = Object.entries(msg.input || {})
                .map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : String(v)}`)
                .join(', ');
              return (
                <div key={msg.id} dir="ltr" style={{ alignSelf: 'stretch', background: 'var(--bg-panel)', border: '1px solid var(--border)', borderRadius: 'var(--r-md)', padding: '8px 12px', fontSize: 11.5, fontFamily: "'JetBrains Mono','Fira Code',monospace", color: 'var(--text-muted)' }}>
                  <div style={{ color: 'var(--teal)' }}>🔧 {msg.name}({args.length > 160 ? args.slice(0, 160) + '…' : args})</div>
                  {msg.result !== undefined && (
                    <div style={{ marginTop: 4, whiteSpace: 'pre-wrap', wordBreak: 'break-word', maxHeight: 160, overflowY: 'auto' }}>
                      {msg.result.length > 1200 ? msg.result.slice(0, 1200) + '…' : msg.result}
                    </div>
                  )}
                </div>
              );
            }
            if (msg.role === 'error') {
              return (
                <div key={msg.id} style={{ background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.3)', color: 'var(--danger)', padding: '9px 13px', borderRadius: 'var(--r-md)', fontSize: 12.5, wordBreak: 'break-word' }}>
                  {msg.content}

            return (
              <div key={msg.id} dir="auto" style={{ alignSelf: 'stretch', background: 'var(--bg-card)', border: '1px solid var(--border)', padding: '11px 14px', borderRadius: '16px 16px 16px 4px', fontSize: 13.5, lineHeight: 1.7, whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>
                {msg.content}
              </div>
            );
          })}

          {pending && <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{L('Working…', 'עובד…')}</div>}
        </div>

        <div style={{ display: 'flex', gap: 8, marginTop: 12, flexShrink: 0 }}>
          <textarea
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input); } }}
            dir="auto"
            rows={2}
            disabled={pending || noKey}
            placeholder={L('Ask for anything — build an AI Chatbot, change one, or ask how something works…', 'בקש כל דבר — לבנות AI Chatbot, לשנות AI Chatbot, או לשאול איך משהו עובד…')}
            style={{ flex: 1, resize: 'none', fontSize: 13.5, padding: '10px 14px', borderRadius: 'var(--r-md)' }}
          />

            style={{ background: 'var(--primary)', color: '#0a0a0a', padding: '0 18px', borderRadius: 'var(--r-md)', fontWeight: 700, fontSize: 17, opacity: pending || noKey || !input.trim() ? 0.5 : 1 }}>➤</button>
        </div>
      </div>
    );
  }

  /* ─────────────────── HOME ─────────────────── */
  /*
   * The first screen of the product is a conversation, not a list. An empty
   * account is walked through building its first agent one question at a time;
   * an account that already has agents gets the same chat with the assistant's
   * full run of the platform behind it.
   */

  /** What "build it for me" asks, in the language the interface is in. */
  const FIRST_ASK = { en: 'Build me my first AI Chatbot. Ask me what it needs to do.',
                      he: 'בנה לי AI Chatbot ראשון. שאל אותי מה הוא צריך לעשות.' };
  const NEW_ASK   = { en: 'Build me a new AI Chatbot. Ask me what it needs to do.',
                      he: 'בנה לי AI Chatbot חדש. שאל אותי מה הוא צריך לעשות.' };
  function FIRST_AGENT_ASK() { return L(FIRST_ASK.en, FIRST_ASK.he); }
  function NEW_AGENT_ASK()   { return L(NEW_ASK.en, NEW_ASK.he); }
  /* Conversations are recognised by these words rather than by a flag, which
     they were saved without. The wording the product used before the rename
     stays on the list: those conversations are still in the database, and a
     list of them all titled "build me an agent" is what this avoids. */
  const CANNED_ASKS = [
    FIRST_ASK.en, FIRST_ASK.he, NEW_ASK.en, NEW_ASK.he,
    'Build me my first agent. Ask me what it needs to do.',
    'Build me a new agent. Ask me what it needs to do.',
    'בנה לי סוכן ראשון. שאל אותי מה הוא צריך לעשות.',
    'בנה לי סוכן חדש. שאל אותי מה הוא צריך לעשות.',
  ];
  function isCannedAsk(text) { return CANNED_ASKS.includes((text || '').trim()); }

  /**
   * The time of day, by the clock on this machine. Night belongs to the
   * evening — "good night" is a goodbye, not a greeting.
   */
  function greeting(name) {
    const h = new Date().getHours();
    const part = (h >= 5 && h < 12) ? L('Good morning', 'בוקר טוב')
               : (h >= 12 && h < 17) ? L('Good afternoon', 'אחר הצהריים טובים')
               : L('Good evening', 'ערב טוב');
    return name ? `${part}, ${name}` : part;
  }

  /**
   * What the home screen adds to the assistant's own system prompt. Only the
   * first-agent case changes how it behaves; an account that already has
   * agents gets the assistant it always had.
   */
  function homeSystemExtra(firstAgent, language) {
    const lines = [
      'You are answering inside the 8Legs.ai home screen — the first thing the user sees, a single conversation.',
      'When a question of yours has a small set of likely answers, end that message with one final line of exactly this form, and nothing after it:',
      '::options:: first | second | third',
      'The screen turns that line into buttons, so keep each option to a few words, at most four of them, and never put anything the user must read there.',
      '',
      'Which of these two the turn is decides everything about how you answer:',
      '',
      'A NEW AI CHATBOT is wanted — the user asks you to build, create or set up an AI Chatbot, however they word it, whether it is their first or their tenth. Run the interview:',
      '- Ask ONE question per message, short, and never more than five questions before the AI Chatbot exists.',
      '- Start from what the AI Chatbot should do and who it serves. Then cover, in this order and only as far as they matter: the language it speaks to its users, where its answers come from (an API, documents the user will upload, or nothing yet), and the channel it will live on (the website widget, WhatsApp, or email).',
      '- Do not wait for every answer. As soon as you know the job and the language, call create_agent and say in one line what you built; keep refining it with update_agent as the remaining answers come in.',
      '- Never open with a menu of what you can do. Ask the next question.',
      '',
      'ANYTHING ELSE — a question about the platform, or a change to an AI Chatbot that already exists. Do NOT interview:',
      '- Answer it, or make the change with your tools, in one turn.',
      '- Ask a question back only when you genuinely cannot proceed without the answer, and then only that one.',
      '- Never turn a change into a questionnaire. "Make it friendlier" is a change, not a new AI Chatbot.',
    ];
    if (firstAgent) {
      lines.push(
        '',
        'This account has no AI Chatbots at all yet, so the user is new here: no jargon without a half-sentence of explanation the first time it appears.',
      );
    }
    lines.push('', language === 'en' ? 'Speak English.' : 'דבר עברית.');
    return lines.join('\n');
  }

  /**
   * What a conversation is called in the list beside it.
   *
   * Two things ruin the obvious answer of "the first thing the user said". A
   * conversation opened from a "build it for me" button starts with the same
   * canned sentence every time, so every row reads alike; and the sentence
   * carries an instruction to the model ("ask me what it needs to do") that
   * says nothing about which conversation this is. So: the first thing the
   * user typed themselves, and only its first sentence.
   */
  function sessionTitle(messages) {
    const said = (messages || []).filter(m => m.role === 'user');
    const own = said.find(m => !m.seeded && !isCannedAsk(m.content)) || said[0];
    let text = ((own && own.content) || '').trim().replace(/\s+/g, ' ');
    const stop = text.search(/[.!?…](\s|$)/);
    if (stop >= 12) text = text.slice(0, stop + 1);
    return text.slice(0, 140);
  }

  /* The assistant marks its suggested answers with a final ::options:: line.
     A model that ignores it simply produces a message with no buttons. */
  function splitOptions(content) {
    const text = content || '';
    const m = text.match(/\n?::options::[ \t]*(.+?)[ \t]*$/);
    if (!m) return { body: text, options: [] };
    const options = m[1].split('|').map(o => o.trim()).filter(Boolean).slice(0, 4);
    return { body: text.slice(0, m.index).trimEnd(), options };
  }

  /* The first line of the base prompt that reads like a sentence — enough to
     show on the card what this agent is for. */
  function agentRoleLine(agent) {
    const line = (agent.basePrompt || '')
      .split('\n')
      .map(l => l.replace(/^#+\s*/, '').trim())
      .find(l => l.length > 12);
    if (!line) return '';
    return line.length > 74 ? line.slice(0, 74) + '…' : line;
  }

  /** The agent this conversation is building, filling in as answers arrive. */
  function AgentBuildCard({ agent, copy, dir, onOpen, onTest, compact }) {
    const c = copy.card;
    const skills = agent ? (agent.skills || []).map(s => s.name).filter(Boolean) : [];
    const tools = agent ? (agent.tools || []).map(t => t.name).filter(Boolean) : [];
    const channel = !agent ? '' :
      (agent.whatsapp && agent.whatsapp.enabled) ? 'WhatsApp' :
      agent.emailEnabled ? 'Email' : '';
    const role = agent ? agentRoleLine(agent) : '';

    const rows = [
      { k: c.role,      v: role,                   on: !!role },
      { k: c.skills,    v: skills.join(', '),      on: skills.length > 0 },
      { k: c.tools,     v: tools.join(', '),       on: tools.length > 0 },
      { k: c.channel,   v: channel || c.noChannel, on: !!channel },
    ];
    const done = rows.filter(r => r.on).length + (agent ? 1 : 0);
    const pct = Math.round((done / (rows.length + 1)) * 100);

    return (
      <div dir={dir} style={{
        background: 'var(--bg-card)', border: '1px solid var(--border)',
        borderRadius: 'var(--r-lg)', padding: 14, boxShadow: 'var(--shadow)',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12, minWidth: 0 }}>
          {agent ? <AvatarDisplay value={agent.avatar} size={38} /> : (
            <div style={{
              width: 38, height: 38, borderRadius: 11, flexShrink: 0, background: 'var(--primary-dim)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>
              <span style={{ color: 'var(--primary)', display: 'flex' }}>{Icons.sparkle}</span>
            </div>
          )}
          <div style={{ minWidth: 0, flex: 1 }}>
            <div style={{ fontWeight: 800, fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {agent ? agent.name : c.pendingName}
            </div>
            <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 2 }}>
              {agent ? c.draft : c.waiting}
            </div>
          </div>
        </div>

        {rows.map(r => (
          <div key={r.k} style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '8px 0', borderTop: '1px solid var(--border)', fontSize: 12 }}>
            <span style={{
              width: 15, height: 15, borderRadius: '50%', flexShrink: 0, fontSize: 9,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              background: r.on ? 'var(--success)' : 'var(--bg-input)',
              color: r.on ? '#fff' : 'var(--text-muted)',
              border: r.on ? 'none' : '1px solid var(--border)',
            }}>{r.on ? '✓' : '·'}</span>
            <span style={{ color: 'var(--text-muted)', width: 66, flexShrink: 0 }}>{r.k}</span>
            <span dir="auto" style={{
              flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
              color: r.on ? 'var(--text)' : 'var(--text-muted)',
              fontWeight: r.on ? 600 : 500, fontStyle: r.on ? 'normal' : 'italic',
            }}>{r.on ? r.v : (r.v || c.none)}</span>
          </div>
        ))}

        <div style={{ height: 5, borderRadius: 999, background: 'var(--bg-input)', overflow: 'hidden', marginTop: 12 }}>
          <div style={{ height: '100%', width: `${pct}%`, background: 'var(--primary)', borderRadius: 999, transition: 'width 0.4s ease' }} />
        </div>

        {agent && (
          <div style={{ display: 'flex', gap: 7, marginTop: 12 }}>
            <Btn size="sm" icon={Icons.edit} onClick={() => onOpen(agent.id)}>{c.open}</Btn>
            <Btn size="sm" icon={Icons.chat} onClick={() => onTest(agent.id)}>{c.test}</Btn>
          </div>
        )}
        {!compact && <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 10, lineHeight: 1.6 }}>{c.note}</div>}
      </div>
    );
  }

  /** The one input, centred on an empty screen and docked once a chat starts. */
  function HomeComposer({ value, onChange, onSend, disabled, placeholder, dir, width = 720 }) {
    const [focus, setFocus] = useState(false);
    return (
      <div dir={dir} style={{
        width: `min(${width}px, 100%)`, margin: '0 auto',
