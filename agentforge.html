            <li><strong>Claude</strong> — <Code>claude-opus-4-5</Code>, <Code>claude-sonnet-4-5</Code>, <Code>claude-haiku-4-5</Code>. דורש מפתח Anthropic.</li>
            <li><strong>OpenAI</strong> — <Code>gpt-4o</Code>, <Code>gpt-4o-mini</Code>, <Code>gpt-4-turbo</Code>, <Code>gpt-3.5-turbo</Code>. דורש מפתח OpenAI.</li>
            <li><strong>Ollama</strong> — מודל מקומי. במקום מפתח מזינים כתובת שרת, והקריאות עוברות דרך פרוקסי בשרת.</li>
          </UL>
          <P>באותו מסך בוחרים גם את <strong>שפת האסיסטנט</strong> — עברית או אנגלית.</P>
          <Warn>בלי מפתח (או בלי כתובת Ollama) אף סוכן לא יענה בשום ערוץ, והאסיסטנטים חסומים. ההערה בפינה הימנית העליונה מציגה את המצב בכל מסך.</Warn>

          <H3>DLP — מניעת דליפת מידע</H3>
          <P>שני מסננים אופציונליים: <strong>מספרי כרטיס אשראי</strong> (16 ספרות עם או בלי מפרידים) ו-<strong>תעודת זהות</strong> (9 ספרות). כשהם דולקים:</P>
          <UL>
            <li>הטקסט של המשתמש ממוסך ל-<Code>[MASKED]</Code> לפני שהוא נשלח למודל</li>
            <li>ההיסטוריה נשמרת ממוסכת, כך שגם ב-Interactions לא יופיע המקור</li>
            <li>נוספת לפרומפט הוראת אבטחה שלא לחזור על מידע מזהה</li>
          </UL>
        </div>
      ),

      /* ─────────────── SKILLS ─────────────── */
      skills: (
        <div dir="rtl">
          <H2>Skills</H2>
          <P>סקיל הוא מצב ממוקד של הסוכן — למשל "בדיקת מזג אוויר" או "פתיחת קריאת שירות" — עם פרומפט משלו. לחיצה על הלשונית פותחת מסך עבודה: רשימת הסקילים בצד, עורך הפרומפט במרכז, ופאנל הגדרות בצד.</P>

          <H3>מה מגדירים בסקיל</H3>
          <UL>
            <li><strong>Name</strong> — השם המדויק שדרכו הסוכן עובר לסקיל</li>
            <li><strong>Description</strong> — <em>מתי</em> להשתמש בסקיל. זה מה שהמודל קורא כדי להחליט לעבור אליו, ולכן הוא החלק הכי חשוב</li>
            <li><strong>Skill Prompt</strong> — ההוראות שהסוכן מבצע כשהסקיל פעיל</li>
          </UL>

          <H3>איך הסוכן עובר בין סקילים</H3>
          <P>כשלסוכן יש סקילים, המודל מקבל כלי פנימי בשם <Code>switch_skill</Code> שמקבל <Code>skill_name</Code>. הוא קורא לו כשהמשתמש מגיע לתחום של סקיל מסוים. בטקסט הפרומפט הקונבנציה היא לכתוב <Code>#SkillName</Code> בלי רווחים, וכדי לקרוא לכלי — <Code>@tool_name</Code>.</P>
          <P>כל הסקילים נמצאים בפרומפט המערכת מהרגע הראשון, כל אחד תחת <Code>## Skill: שם</Code> עם התיאור מעליו. כשסקיל פעיל בצ'אט הבדיקה, שליפת הידע מצטמצמת למסמכים של אותו סקיל.</P>

          <H3>עורך הפרומפט</H3>
          <UL>
            <li><Code>## Heading</Code> מוסיף כותרת סקציה; Collapse All / Expand All מקפלים אותן</li>
            <li>מצב <strong>Preview</strong> מציג את הפרומפט לפי סקציות ומדגיש <Code>@tool</Code> ו-<Code>#Skill</Code></li>
            <li>מונה התווים בפינה עוזר לשמור על פרומפט קצר</li>
          </UL>
          <Tip>עדיף כמה סקילים קצרים וממוקדים על סקיל אחד ארוך. התיאור צריך להיות "מתי", לא "מה".</Tip>
        </div>
      ),

      /* ─────────────── TOOLS ─────────────── */
      tools: (
        <div dir="rtl">
          <H2>Tools</H2>
          <P>לשונית Tools נפתחת ישר במסך עבודה: רשימת הכלים בצד, עורך קוד במרכז, פאנל הרצה מתחתיו, ופאנל הגדרות בצד עם שלוש לשוניות.</P>

          <H3>send_email — הכלי המובנה</H3>
          <P>בסקציית <strong>BUILT-IN</strong> בסייד-בר. מתג אחד מפעיל אותו, ומתחתיו מחברים חשבון Gmail <strong>לסוכן הזה</strong> — כל סוכן שולח מהכתובת שלו. אחרי החיבור הכלי זמין בצ'אט הבדיקה, בווידג'ט וב-WhatsApp, והמודל קורא לו עם <Code>to</Code>, <Code>subject</Code> ו-<Code>body</Code>.</P>

          <H3>כלי Python — חוזה ההרצה</H3>
          <P>הקוד רץ ב-serverless מבודד, וחייב להגדיר פונקציה בשם <Code>run</Code>:</P>
          <Block>{`import os
import urllib.request, json

def run(**kwargs):
    city = kwargs.get("city", "")
    key  = os.environ.get("WEATHER_KEY", "")
    url  = f"https://api.example.com/w?city={city}&key={key}"
    try:
        with urllib.request.urlopen(url, timeout=10) as r:
            data = json.loads(r.read())
        return f"{data['temp']}°C, {data['desc']}"
    except Exception as e:
        return f"Could not fetch the weather: {e}"`}</Block>
          <UL>
            <li>הפרמטרים המוצהרים מגיעים כ-<Code>kwargs</Code> — קרא אותם עם <Code>kwargs.get</Code></li>
            <li>מה שהפונקציה מחזירה עובר ל-<Code>str()</Code> ונמסר למודל כתוצאה</li>
            <li>זמינות ספריית התקן, ובנוסף כל חבילה שרשמת ב-Packages</li>
            <li>אין דיסק מתמיד ואין רשת פנימית; HTTPS יוצא מותר</li>
            <li>מוטב להחזיר מחרוזת שגיאה קריאה מלזרוק חריגה</li>
          </UL>

          <H3>Configuration</H3>
          <UL>
            <li><strong>Name</strong> — שם באנגלית בסגנון <Code>snake_case</Code>; זה השם שהמודל קורא לו</li>
            <li><strong>Description</strong> — משפט שאומר מתי להשתמש בכלי</li>
            <li><strong>Parameters</strong> — שם, טיפוס (string / number / integer / boolean) ותיאור לכל פרמטר. אלה בדיוק המפתחות שיגיעו ל-<Code>kwargs</Code></li>
            <li><strong>Packages</strong> — חבילות pip מופרדות בפסיק, למשל <Code>requests, beautifulsoup4</Code></li>
          </UL>

          <H3>Secrets</H3>
          <P>זוגות מפתח–ערך שנחשפים לקוד דרך <Code>os.environ["KEY"]</Code>. שם המפתח נשלח לאסיסטנט כדי שידע להשתמש בו; <strong>הערך עצמו לא נשלח</strong>.</P>

          <H3>הרצה ובדיקה</H3>
          <P>הפאנל התחתון מריץ את הכלי בלי לצאת מהמסך: <strong>Input</strong> מציג שדה לכל פרמטר מוצהר, <strong>Run</strong> מריץ, וזמן הריצה מוצג ליד הכפתור. אחרי הרצה הפאנל עובר ל-<strong>Output</strong> אם הצליח או ל-<strong>Errors</strong> אם נפל, ונקודה צבעונית מסמנת איפה יש תוכן.</P>

          <H3>שימוש בכלי מתוך פרומפט</H3>
          <P>הכלים נמסרים למודל כפונקציות אמיתיות, כך שהוא יכול לקרוא להם מעצמו. כדי לכוון אותו, כתוב את שם הכלי עם <Code>@</Code> בפרומפט הבסיס או בפרומפט של סקיל, וציין אילו פרמטרים להעביר.</P>
          <Warn>שינוי שם כלי אחרי שהזכרת אותו בפרומפט שובר את ההפניה — עדכן גם את הפרומפט.</Warn>
        </div>
      ),

      /* ─────────────── PLATFORM ASSISTANT ─────────────── */
      platform: (
        <div dir="rtl">
          <H2>אסיסטנט המערכת</H2>
          <P>הכפתור <strong>שאל את האסיסטנט</strong> בפינה הימנית התחתונה, בכל מסך. אפשר להגיע אליו גם מ-<strong>Build with the assistant</strong> בראש עמוד הסוכנים. לחיצה פותחת צ'אט צף ולחיצה נוספת מקפלת אותו — כך שאפשר לבקש שינוי בזמן שרואים את מה שרוצים לשנות. זה לא סוכן שאתה בונה אלא אסיסטנט שמתפעל את המערכת בשבילך — הוא מבצע פעולות, לא רק מסביר איפה ללחוץ.</P>

          <H3>מה הוא עושה</H3>
          <UL>
            <li>בונה סוכן חדש מאפס — פרומפט, סקילים, כלי Python והודעת פתיחה, בפעולה אחת</li>
            <li>משנה סוכן קיים — משפר פרומפט, מוסיף או מתקן סקיל, כותב כלי</li>
            <li>מריץ כלי שכתב כדי לבדוק שהוא עובד, ומתקן לפי השגיאה</li>
            <li>מדליק <Code>send_email</Code>, מגדיר DLP, משנה שם ואווטאר</li>
            <li>עונה על שאלות על הפלטפורמה — איך סקילים עוברים, מה חוזה ההרצה של כלי, איך מחברים WhatsApp</li>
            <li>שולף מה קרה בשיחות לפי סוכן, ערוץ או מילת חיפוש</li>
            <li>מוחק סוכן — עם שאלה בצ'אט ואישור בדפדפן לפני</li>
          </UL>

          <H3>מה הוא לא יכול</H3>
          <P>לחבר Gmail, להעלות קבצים לבסיס הידע, ולהזין את מפתח ה-API. אלה פעולות שדורשות אותך בממשק, והוא יגיד לך בדיוק לאן ללכת.</P>

          <H3>שפה</H3>
          <P>ההודעה הפותחת שלו מפרטת את כל מה שהוא יודע לעשות, ואפשר לבחור בין <strong>אסיסטנט בעברית</strong> ל<strong>אסיסטנט באנגלית</strong> במסך Settings.</P>

          <H3>הוא רואה מה נשבר</H3>
          <P>יש לו כלי <Code>get_recent_errors</Code> שמחזיר כשלים אמיתיים משבועיים אחורה: כלי שזרק חריגה בשיחה אמיתית, תשובה שהווידג'ט לא הצליח לייצר, טוקן WhatsApp שפג, שגיאת ספק. כשאומרים לו "משהו לא עובד" הוא מונחה לבדוק את הלוג לפני שהוא מנחש, ואחרי שהוא מתקן כלי — להריץ אותו ולבדוק.</P>

          <H3>שקיפות</H3>
          <P>כל קריאה לכלי מוצגת בשיחה עם הפרמטרים והתוצאה, כך שרואים בדיוק מה הוא עשה. הוא רץ על המפתח והמודל של החשבון, ומודל חזק יותר נותן תוצאות טובות יותר במשימות מורכבות.</P>
          <Tip>נסה: "בנה סוכן שירות לקוחות לחברת ביטוח, עם סקיל לפתיחת תביעה" או "תוסיף לסוכן weather כלי לתחזית חמישה ימים ותריץ אותו".</Tip>
        </div>
      ),

      /* ─────────────── ASSISTANT ─────────────── */
      assistant: (
        <div dir="rtl">
          <H2>אסיסטנט הבנייה</H2>
          <P>גם ב-Tools וגם ב-Skills יש לשונית <strong>Assistant</strong> בפאנל הצד, וכפתור <strong>Ask AI</strong> ליד העורך שמקפיץ אליה. זה צ'אט שכותב בשבילך — והתוצאה נכתבת ישר לתוך העורך והשדות, לא כטקסט שצריך להעתיק.</P>

          <H3>איך זה עובד</H3>
          <UL>
            <li>הוא משתמש ב-<strong>מפתח ובמודל של הסוכן עצמו</strong>, בלי כלים ובלי בסיס הידע</li>
            <li>כל תשובה שמכילה קוד או פרומפט מוחלת מיד, עם כפתור <strong>Undo</strong> שמחזיר בדיוק את מה שהיה</li>
            <li>השיחה נשמרת כשעוברים לשונית, ומתאפסת כשעוברים לכלי או לסקיל אחר</li>
            <li>שאלה בלי בקשת שינוי מקבלת תשובה בלי לגעת בעורך</li>
          </UL>

          <H3>מה הוא יודע על הסוכן שלך</H3>
          <UL>
            <li><strong>בכלי:</strong> השם, התיאור, הפרמטרים המוצהרים, ה-Packages, <em>שמות</em> ה-Secrets, והקוד הנוכחי — כולל עריכות שעשית ידנית בין הודעה להודעה</li>
            <li><strong>בסקיל:</strong> השם, התיאור, הפרומפט הנוכחי, הפרומפט הבסיס של הסוכן, ורשימת הכלים והסקילים האמיתיים שלו — כדי שכל <Code>@tool</Code> ו-<Code>#Skill</Code> שהוא כותב יצביע על משהו שקיים</li>
          </UL>

          <H3>מה הוא ממלא</H3>
          <P>בכלי הוא כותב את הקוד וגם את השם, התיאור, הפרמטרים וה-Packages. בסקיל הוא כותב את הפרומפט וגם את השם והתיאור. הפרומפט של סקיל נכתב <strong>תמיד באנגלית</strong>, חוץ ממשפטים שהסוכן אמור לומר למשתמש מילה-במילה בשפה אחרת.</P>
          <P>רשימת הפרמטרים שהוא מחזיר מחליפה את הרשימה כולה, כך שההצהרה והקוד תמיד מסכימים על ה-<Code>kwargs</Code>.</P>

          <H3>הם רואים את השגיאות</H3>
          <P>אסיסטנט הכלי מקבל אוטומטית את <strong>ההרצה האחרונה</strong> של הכלי — הקלטים, ההצלחה או הכשל, וטקסט השגיאה המלא — ואת הכשלים שנרשמו לכלי הזה בשיחות אמיתיות. אסיסטנט הסקיל מקבל את הכשלים של הסוכן. כלומר אחרי הרצה שנפלה אפשר לכתוב פשוט "תתקן" — בלי להעתיק traceback.</P>

          <H3>קיצורי דרך</H3>
          <UL>
            <li><strong>Write it for me</strong> — כתיבה מאפס לפי השם והתיאור</li>
            <li><strong>Explain the code</strong> / <strong>Add steps</strong> — הסבר על הקוד, או פירוק הפרומפט לשלבים</li>
            <li><strong>Add error handling</strong> / <strong>Tighten it</strong> — חיסון הקוד, או צמצום הפרומפט</li>
            <li><strong>Review it</strong> — ביקורת ותיקון</li>
          </UL>
          <Tip>תאר את המשימה בשפה חופשית ("כלי שמביא מזג אוויר לפי עיר") ותן לו למלא שם, תיאור, פרמטרים וקוד בבת אחת. מודל חזק יותר בהגדרות הסוכן נותן קוד טוב יותר.</Tip>
        </div>
      ),

      /* ─────────────── ASSISTANT HISTORY ─────────────── */
      history: (
        <div dir="rtl">
          <H2>היסטוריית אסיסטנטים</H2>
          <P>לשונית <strong>Assistant chats</strong> בסייד-בר שומרת כל שיחה עם כל אחד משלושת האסיסטנטים — של המערכת, של הכלים ושל הסקילים.</P>

          <H3>מה יש בה</H3>
          <UL>
            <li>סינון לפי סוג האסיסטנט: מערכת, כלים, סקילים או הכל</li>
            <li>חיפוש בתוך כל תוכן השיחות</li>
            <li>לכל שיחה: על איזה סוכן ואיזה כלי או סקיל היא הייתה, מספר הודעות ומתי</li>
            <li>פתיחת שיחה מציגה את התמלול המלא — כולל <strong>כל קריאה לכלי</strong> עם הפרמטרים והתוצאה, וסימון על מה שנכתב לעורך</li>
            <li>קפיצה לסוכן שהשיחה עסקה בו, ומחיקת שיחה מההיסטוריה</li>
          </UL>
          <P>השיחה נשמרת אוטומטית אחרי כל תור. שיחה חדשה מתחילה כשלוחצים "שיחה חדשה" בצ'אט הצף, או כשעוברים לכלי או לסקיל אחר.</P>
          <Tip>ההיסטוריה שימושית במיוחד כדי לחזור לקוד או לפרומפט שאסיסטנט כתב לך לפני שבוע, ולראות מה בדיוק הוא שינה ולמה.</Tip>
        </div>
      ),

      /* ─────────────── KNOWLEDGE ─────────────── */
      knowledge: (
        <div dir="rtl">
          <H2>Knowledge (RAG)</H2>
          <P>בסיס הידע הוא אוסף מסמכים שהסוכן שולף מהם קטעים רלוונטיים לכל הודעה, ומקבל אותם בפרומפט תחת <Code>## Relevant Context</Code>.</P>

          <H3>איך מוסיפים מסמכים</H3>
          <UL>
            <li><strong>הדבקת טקסט</strong> — כותרת ותוכן</li>
            <li><strong>העלאת קובץ</strong> — PDF או DOCX; הטקסט מחולץ בשרת ונשמר כמסמך</li>
            <li><strong>סריקת אתר</strong> — ראה למטה</li>
          </UL>

          <H3>ידע גלובלי מול ידע של סקיל</H3>
          <P>מסמך יכול להיות משויך לכל הסוכן או לסקיל מסוים. בצ'אט הבדיקה השליפה מצטמצמת למסמכים הגלובליים ולאלה של הסקיל הפעיל. בווידג'ט וב-WhatsApp כל הסקילים פעילים במקביל, ולכן נשלפים שם המסמכים של כולם.</P>

          <H3>סידור אוטומטי בהעלאה</H3>
          <P>כשמוסיפים מסמך, הוא עובר פעם אחת דרך המודל של החשבון ונכתב מחדש לצורה שאפשר למצוא בה: סעיפים קצרים תחת כותרות, כל סעיף על נושא אחד, הפניות מפוענחות (<Code>הוא</Code>, <Code>החברה</Code> מוחלפים בשם עצמו), ובסוף כל סעיף שורת <strong>מילות מפתח בעברית ובאנגלית</strong>.</P>
          <P>שורת מילות המפתח היא הסיבה שאפשר לשאול בעברית על מסמך שכתוב באנגלית — החיפוש הוא לקסיקלי ולא סמנטי, ובלי המילים בעברית לא הייתה חפיפה בכלל.</P>
          <UL>
            <li>המקור נשמר תמיד. הכפתור <Code>↩</Code> בכרטיס המסמך מחזיר אותו</li>
            <li>כפתור הסידור מריץ אותו שוב, תמיד מהמקור ולא מעל סידור קודם</li>
            <li>אם אין מפתח API או שהמודל נכשל, המסמך נשמר כמו שהוא ומסומן <strong>גולמי</strong></li>
            <li>דפים שנסרקו מאתר מחולקים לקטעים אבל לא עוברים סידור — סריקה יכולה להיות מאה דפים, וזה מאה קריאות מודל</li>
          </UL>

          <H3>איך השליפה עובדת</H3>
          <P>כל מסמך מחולק לקטעי חיפוש של כמה מאות תווים, עם חפיפה קלה ביניהם וכותרת הסעיף נגררת לתוך כל קטע. השליפה מחזירה קטעים, לא את המסמך כולו — כך הסוכן מקבל את מה שרלוונטי במקום קובץ שלם.</P>
          <P>החיפוש הוא <Code>tsvector</Code> של PostgreSQL על ההודעה האחרונה. המילים בשאלה מחוברות ב-<strong>OR</strong> ולא ב-AND, והאינדקס מחזיק כל מסמך גם ב-<Code>simple</Code> (מילים כפי שנכתבו — מה שעברית צריכה) וגם ב-<Code>english</Code> (גזעי מילים — כך ש-<Code>experience</Code> מוצא <Code>experiences</Code>).</P>
          <Tip>עדיין שווה לתת למסמך כותרת תיאורית ולפצל לפי נושא. הסידור האוטומטי עושה הרבה, אבל מסמך שמאורגן היטב מלכתחילה תמיד יימצא טוב יותר.</Tip>

          <H3>סריקת אתרים</H3>
          <P>מזינים כתובת אחת או יותר, והסורק עובר על האתר ושומר כל דף כמסמך מסומן <Code>web</Code>. הכותרות (<Code>h1</Code>-<Code>h6</Code>) נשמרות כסעיפים, וכל דף מחולק לקטעי חיפוש כמו כל מסמך אחר. הסריקה מתרעננת אוטומטית פעמיים ביום.</P>
          <Warn>הסורק קורא את ה-HTML שהשרת מחזיר — הוא <strong>לא מריץ JavaScript</strong>. אתר שנבנה בדפדפן (React, Vue, Angular) יחזיר דפים כמעט ריקים, והממשק יסמן כמה דפים כאלה נמצאו. במקרה כזה עדיף להדביק את התוכן ידנית.</Warn>
          <UL>
            <li>דפים שנסרקו <strong>לא</strong> עוברים את הסידור האוטומטי — סריקה יכולה להיות מאה דפים. אפשר להריץ את הסידור על דף בודד ידנית</li>
            <li>עמוד גדול במיוחד נחתך ב-60 אלף תווים</li>
            <li>סריקה נעצרת לבד לפני שנגמר הזמן ומסמנת <strong>נעצר מוקדם</strong> — הרצה חוזרת ממשיכה</li>
          </UL>
          <P>בנוסף, כשמשתמש שולח כתובת בצ'אט הבדיקה, עד שלוש כתובות מההודעה נסרקות מיד ונמסרות למודל תחת <Code>## Fetched Web Pages</Code> — בלי להישמר בבסיס הידע.</P>
        </div>
      ),

      /* ─────────────── TEST ─────────────── */
      test: (
        <div dir="rtl">
          <H2>בדיקת הסוכן</H2>
          <P>יש שתי דרכים לדבר עם סוכן, והן לא אותו דבר:</P>
          <UL>
            <li><strong>Test במסך הסוכנים</strong> — שיחה אמיתית. היא רצה בשרת דרך אותו ערוץ שהווידג'ט משתמש בו, מנותבת לבראנץ' לפי אחוזי התנועה, ונשמרת ב-<strong>Interactions</strong> ככל שיחה אחרת.</li>
            <li><strong>Test בתוך עורך הסוכן</strong> — בדיקה ידנית מול ההגדרות שעל המסך, כולל הבראנץ' שאתה נמצא עליו כרגע, בלי לפרסם כלום. נשמרת ב-<strong>Manual tests</strong>.</li>
          </UL>
          <P>הבדיקה הידנית היא זו שמראה קריאות לכלים, מעבר סקילים וזמני תגובה — היא רצה בדפדפן, ולכן היא יכולה להראות את מה שקורה בדרך.</P>

          <H3>מה רואים בצ'אט</H3>
          <UL>
            <li><strong>קריאות לכלים</strong> — כל קריאה מוצגת עם הפרמטרים שנשלחו והתוצאה שחזרה</li>
            <li><strong>מעבר סקיל</strong> — כשהסוכן עובר לסקיל, מוצג כרטיס עם שמו והתיאור</li>
            <li><strong>זמני תגובה</strong> — משך כל תשובה במילישניות</li>
            <li><strong>מיסוך DLP</strong> — הודעה שמוסכה מסומנת ככזו</li>
          </UL>

          <H3>היסטוריה — לשונית Manual tests</H3>
          <P>כל שיחת בדיקה נשמרת בשרת אוטומטית, אחרי כל תור, כך שסגירת טאב באמצע לא מאבדת את ההרצה. אייקון השעון בכותרת הצ'אט מציג אותן, ואותן שיחות בדיוק מופיעות בלשונית <strong>Manual tests</strong> של הסוכן — עם חיפוש בכל התמלילים, משך זמן, ומחיקה.</P>
          <P>הן <strong>לא</strong> מופיעות ב-<strong>Interactions</strong>, ובכוונה: שם יושבות שיחות של משתמשי קצה אמיתיים דרך הווידג'ט או WhatsApp, ואלה השיחות שלך עם הסוכן שלך.</P>
          <P><strong>כל האסיסטנטים קוראים אותן.</strong> האסיסטנטים של הכלים, הסקילים והבייס-פרומט מקבלים את ההרצות האחרונות כחלק מהקונטקסט, ואסיסטנט המערכת יכול לבקש אותן בעצמו דרך <Code>get_test_conversations</Code>. לכן אפשר לומר לאסיסטנט "הסוכן ענה לא נכון, תתקן" בלי להעתיק לו את השיחה.</P>
          <Warn>כל שיחה מתחילה מאפס — הסוכן לא זוכר שיחות קודמות. מה שצריך שיהיה זמין תמיד צריך להיות בפרומפט או בבסיס הידע.</Warn>
        </div>
      ),

      /* ─────────────── CLI ─────────────── */
      cli: (
        <div dir="rtl">
          <H2>עריכה מ-IDE</H2>
          <P>אותו סוכן שאתה עורך בממשק אפשר למשוך לתיקייה, לערוך בעורך שלך, ולדחוף בחזרה. לכל סוכן יש גם ריפו פרטי ב-GitHub, ו-<Code>git push</Code> אליו מופעל בדיוק כמו <Code>8legs push</Code>.</P>

          <H3>התקנה</H3>
          <Block>{`npm i -g @8legs/cli     # ואז 8legs <פקודה> מכל תיקייה
npx @8legs/cli <פקודה>   # בלי להתקין כלום`}</Block>
          <P>דורש Node 18 ומעלה. אין לחבילה שום תלות חיצונית.</P>

          <H3>התחברות</H3>
          <P>צור טוקן ב-<strong>Settings → Personal access tokens</strong>: תן לו שם שתזהה (המחשב, הסביבה) ולחץ צור. הוא מוצג פעם אחת בלבד — בשרת נשמר רק ה-hash שלו, והשם הוא מה שיעזור לדעת איזה טוקן לבטל.</P>
          <Block>{`8legs login
8legs list`}</Block>

          <H3>כל הפקודות</H3>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, marginBottom: 16 }}>
            <tbody>
              {[
                ['login', 'שומר טוקן. --token <t> מדלג על ההדבקה'],
                ['logout', 'מוחק את הטוקן השמור'],
                ['whoami', 'לאיזו התקנה אתה מחובר, וכמה סוכנים יש'],
                ['list', 'הסוכנים שלך, עם ה-id של כל אחד'],
                ['pull <סוכן>', 'מוריד סוכן לתיקייה. לפי id או לפי שם'],
                ['pull', 'מרענן את התיקייה שאתה בתוכה'],
                ['status', 'מה שונה מקומית, ואם הסוכן זז בפלטפורמה'],
                ['diff [קובץ]', 'השינויים עצמם, שורה-שורה'],
                ['validate', 'בודק את התיקייה לפני דחיפה'],
                ['push', 'שולח את השינויים'],
                ['open', 'פותח את הסוכן בדפדפן'],
                ['git', 'מכוון את ה-origin של התיקייה לריפו של הסוכן'],
                ['branches', 'הבראנצ׳ים, ואחוז השיחות של כל אחד'],
                ['branch <שם>', 'פותח בראנץ׳ ומעביר אליו את התיקייה'],
                ['checkout <שם>', 'מחליף את התיקייה לבראנץ׳ אחר'],
                ['merge [שם]', 'מחיל את הבראנץ׳ על main — כלומר מפעיל אותו'],
                ['traffic <שם> <%>', 'שולח אחוז מהשיחות האמיתיות לבראנץ׳'],
                ['traffic --stop', 'כל השיחות חוזרות ל-main'],
              ].map(([cmd, what]) => (
                <tr key={cmd} style={{ borderBottom: '1px solid var(--border)' }}>
                  <td dir="ltr" style={{ padding: '7px 10px 7px 0', fontFamily: 'monospace', color: 'var(--teal)',
                                         whiteSpace: 'nowrap', verticalAlign: 'top', textAlign: 'left' }}>{cmd}</td>
                  <td style={{ padding: '7px 0 7px 14px', color: 'var(--text-2)', lineHeight: 1.6 }}>{what}</td>
                </tr>
              ))}
            </tbody>
          </table>

          <H3>דגלים</H3>
          <UL>
            <li><Code>--branch &lt;שם&gt;</Code> — למשוך בראנץ׳ במקום main</li>
            <li><Code>--dir &lt;נתיב&gt;</Code> — לאיזו תיקייה למשוך</li>
            <li><Code>--force</Code> — מרשה ל-pull או ל-checkout לדרוס שינויים מקומיים</li>
            <li><Code>--host &lt;url&gt;</Code> — התקנה אחרת של הפלטפורמה</li>
            <li><Code>--token &lt;טוקן&gt;</Code> — התחברות בלי prompt</li>
          </UL>

          <H3>מבנה התיקייה</H3>
          <Block>{`config.json              זהות, ערוצים, מיסוך מידע
prompt.md                הפרומפט הבסיסי
skills/<שם>/skill.json   למה הסקיל, ואילו כלים שלו
skills/<שם>/prompts/skill.md   ההוראות שלו
tools/<שם>/tool.json     פרמטרים, חבילות, שמות משתני סביבה
tools/<שם>/run.py        הקוד
AGENTS.md                איך לערוך את הסוכן — בשביל Claude Code
.8legs/lock.json         id, בראנץ׳, גרסה`}</Block>

          <Warn>אל תשנה <Code>id</Code> באף קובץ. זה איך שהפלטפורמה מזהה את הדבר שכבר קיים אצלה — שינוי שלו מוחק סקיל ויוצר אחר במקומו.</Warn>

          <H3>מה לא נמצא בתיקייה</H3>
          <UL>
            <li><strong>סודות.</strong> מפתח ה-API, טוקני WhatsApp וערכי משתני הסביבה של כלים נשארים בפלטפורמה. <Code>config.json</Code> מפנה אליהם בצורת <Code>{'{{global.NAME}}'}</Code>; אל תחליף הפניה בערך אמיתי, push מתעלם ממנו.</li>
            <li><strong>מסמכי ידע.</strong> יש להם מחזור חיים משלהם — העלאה, פיצול לקטעים, אינדוקס — וקרול של מאות עמודים לא אמור להיות קומיט.</li>
          </UL>

          <H3>עבודה עם git</H3>
          <Block>{`8legs pull <id>
8legs git                # מכוון את origin לריפו של הסוכן
# ערוך, ואז
git add -A && git commit -m "…" && git push`}</Block>
          <P>הריפו נוצר ב-pull הראשון. קומיט שעובר ולידציה מסומן ✓ ב-GitHub והופך לחי; קומיט שנופל מסומן ✗ עם הסיבה, <strong>והסוכן החי לא זז</strong>. git כבר קיבל את הדחיפה, אז אי אפשר לדחות אותה — רק לא להפעיל אותה.</P>

          <H3>בראנצ׳ים וניתוב שיחות</H3>
          <Block>{`8legs branch warmer-tone      # פותח בראנץ׳ ועובר אליו
# ערוך ודחוף — main לא זז
8legs traffic warmer-tone 20  # 20% מהשיחות האמיתיות אליו
8legs branches                # לראות את החלוקה
8legs merge warmer-tone       # להפעיל אותו על כולם
8legs traffic --stop          # או להחזיר הכל ל-main`}</Block>
          <P>הבראנץ׳ של שיחה מוגרל פעם אחת, בהודעה הראשונה, ונשמר עליה. אף אחד לא רואה את הסוכן מתחלף באמצע שיחה.</P>

          <H3>כשדחיפה נדחית</H3>
          <UL>
            <li><strong>"The agent changed on the platform"</strong> — מישהו ערך בממשק. <Code>8legs pull</Code> לוקח את הגרסה שלו, ואז תחזור על העריכה ותדחוף שוב. שום דבר לא נכתב.</li>
            <li><strong>קובץ שלא נפרס</strong> — גם כאן שום דבר לא נכתב. דחיפה היא הכל-או-כלום: JSON שבור לא יכול להשאיר סוכן חי מעודכן בחצי.</li>
          </UL>

          <Tip>עריכה בממשק נכנסת ל<strong>טיוטה</strong>, לא לסוכן החי — הפס בראש עורך הסוכן הוא מה שמפרסם אותה. ב-CLI הטיוטה היא בראנץ׳ בשם <Code>draft</Code>.</Tip>
        </div>
      ),

      /* ─────────────── WIDGET ─────────────── */
      widget: (
        <div dir="rtl">
          <H2>הטמעה באתר</H2>
          <P>לשונית <strong>Export</strong> מייצרת קוד הטמעה מוכן, עם תצוגה מקדימה חיה של הווידג'ט.</P>

          <H3>מה אפשר לעצב</H3>
          <UL>
            <li>כותרת, צבע ראשי וצבע הכותרת</li>
            <li>טקסט ה-placeholder בתיבת ההקלדה</li>
            <li>גובה ורדיוס פינות</li>
          </UL>

          <H3>שתי דרכי הטמעה</H3>
          <UL>
            <li><strong>iframe</strong> — הטמעה קבועה בתוך הדף</li>
            <li><strong>כפתור צף</strong> — קטע script שמוסיף בועה בפינה שנפתחת ונסגרת, עם האווטאר של הסוכן</li>
          </UL>

          <H3>מה קורה מאחורי הקלעים</H3>
          <P>הווידג'ט מדבר עם נקודת קצה ציבורית של הסוכן. היא מחזירה רק את מה שדרוש לתצוגה — שם, אווטאר והודעת פתיחה — ולא את המפתחות או ההגדרות. הסוכן עונה בצד השרת עם המפתח שלו, כולל כלים, בסיס ידע ו-DLP, וכל שיחה נשמרת ומופיעה ב-Interactions כערוץ <Code>Widget</Code>.</P>
          <Warn>הווידג'ט פתוח לכל מי שמגיע לדף שבו הטמעת אותו, וכל שיחה מחויבת למפתח ה-API של הסוכן. אל תטמיע סוכן יקר בדף ציבורי בלי מעקב ב-Interactions.</Warn>
        </div>
      ),

      /* ─────────────── WHATSAPP ─────────────── */
      whatsapp: (
        <div dir="rtl">
          <H2>ערוץ WhatsApp</H2>
          <P>לשונית <strong>Whatsapp</strong> מחברת את הסוכן למספר WhatsApp Business דרך Meta Cloud API. אנשים כותבים למספר, והסוכן עונה עם אותו פרומפט, כלים וידע.</P>

          <H3>מה צריך מ-Meta</H3>
          <UL>
            <li><strong>Phone Number ID</strong> — מזהה המספר ב-WhatsApp Business</li>
            <li><strong>Access Token</strong> — טוקן קבוע לשליחת הודעות</li>
            <li><strong>App Secret</strong> — לאימות שכל הודעה נכנסת באמת מ-Meta</li>
            <li><strong>Verify Token</strong> — מחרוזת שאתה בוחר (יש כפתור שמגריל אותה) ומזין גם ב-Meta</li>
          </UL>

          <H3>שלבי החיבור</H3>
          <UL>
            <li>מלא את ארבעת השדות ולחץ <strong>Test connection</strong> — הבדיקה מאמתת מול Meta ומחזירה את שם התצוגה של המספר</li>
            <li>העתק את כתובת ה-Webhook מהמסך והדבק אותה ב-Meta יחד עם ה-Verify Token</li>
            <li>הפעל את המתג בראש הלשונית</li>
          </UL>

          <H3>מה קורה בכל הודעה</H3>
          <UL>
            <li>החתימה של Meta מאומתת מול ה-App Secret; בקשה בלי חתימה תקפה נדחית</li>
            <li>הודעה מטופלת פעם אחת בלבד, גם אם Meta שולחת אותה שוב</li>
            <li>ההיסטוריה נשמרת פר שולח, ועשרים ההודעות האחרונות נשלחות למודל כהקשר</li>
            <li>תשובה ארוכה מפוצלת לכמה הודעות; הודעות שאינן טקסט מקבלות תשובה מנומסת</li>
          </UL>
          <Warn>מספר WhatsApp יכול להיות מחובר לסוכן אחד בלבד. אם תזין מספר שכבר מחובר לסוכן אחר, השמירה תידחה עם הודעה.</Warn>
        </div>

      /* ─────────────── INTERACTIONS ─────────────── */
      interactions: (

          <H3>העמודות</H3>
          <UL>
            <li><strong>Agent</strong> — הסוכן שענה</li>
            <li><strong>Channel</strong> — Widget, WhatsApp או Test chat</li>
            <li><strong>Started</strong> — מתי השיחה התחילה</li>
            <li><strong>Duration</strong> — מהפעילות הראשונה עד האחרונה בשיחה</li>

          <P>מתחת לכל כותרת יש פילטר: בחירת סוכן, ערוץ, טווח תאריכים, מינימום ומקסימום שניות, ומינימום הודעות. תיבת החיפוש בעמודת Conversation מחפשת בתוך <strong>כל תוכן ההודעות</strong>, לא רק בתצוגה המקדימה. Started, Duration ו-Messages ניתנים למיון בלחיצה, ו-Clear filters מאפס הכול.</P>

            <li>טבלה עם שם משתמש, טלפון, הרשאה, מספר סוכנים והתחברות אחרונה</li>
            <li><strong>View Agents</strong> — צפייה ועריכה של הסוכנים של אותו משתמש, כולל שכפול סוכן משלך אליו</li>
            <li><strong>Reset Password</strong> — מגריל סיסמה זמנית ומציג אותה פעם אחת</li>
            <li><strong>Delete User</strong> — מוחק את המשתמש, הסוכנים שלו, השיחות והמסמכים. דורש הקלדת שם המשתמש לאישור, ואי אפשר למחוק את עצמך</li>
          </UL>

      /* ─────────────── OPS ─────────────── */
      ops: (
        <div dir="rtl">

            <li><Code>GOOGLE_CLIENT_ID</Code> / <Code>GOOGLE_CLIENT_SECRET</Code> — נדרשים לחיבור Gmail</li>
            <li><Code>APP_URL</Code> — כתובת הבסיס לחזרה מ-OAuth (אם לא מוגדר, נגזרת מהבקשה)</li>

          <Block>{`npm install
npm run migrate -- --dry   # מה יורץ
npm run migrate            # הרצה בפועל`}</Block>
          <P>הריצה קוראת <Code>DATABASE_URL</Code> מהסביבה או מקובץ <Code>.env</Code>, מריצה כל קובץ פעם אחת ורושמת אותו בטבלת <Code>schema_migrations</Code>. הקבצים כתובים כך שהרצה חוזרת לא מזיקה.</P>

          <H3>משימות מתוזמנות</H3>
          <P>סריקת האתרים של כל הסוכנים רצה פעמיים ביום דרך Vercel Cron. ל-webhook של WhatsApp ולסריקות יש חלונות זמן ארוכים יותר מברירת המחדל.</P>

      /* ─────────────── SECURITY ─────────────── */
      security: (
        <div dir="rtl">
          <H2>אבטחה ופרטיות</H2>

          <H3>מה מופרד בין משתמשים</H3>
          <UL>
            <li>סוכן שייך למשתמש, וכל קריאה לשרת מאמתת בעלות לפני שהיא מחזירה או משנה משהו</li>
            <li>חיבור Gmail הוא פר סוכן, וניתן לגישה רק לבעל הסוכן</li>
            <li>מספר WhatsApp הוא בלעדי לסוכן אחד, וניתוב הודעה נקבע לפי הוכחת ה-App Secret — לא לפי מי שהזין את המספר אחרון</li>
          </UL>

          <H3>מה חשוב לדעת על סודות</H3>
          <UL>
            <li>מפתחות ה-API, טוקני WhatsApp וה-Secrets של הכלים נשמרים בהגדרות הסוכן בבסיס הנתונים</li>
            <li>ערכי Secrets נחשפים לקוד הכלי שלך בזמן ריצה — כל מי שיכול לערוך את הכלי יכול לקרוא אותם</li>
            <li>האסיסטנט מקבל את שמות ה-Secrets בלבד, לא את הערכים</li>
          </UL>

          <H3>מה חשוף לציבור</H3>
          <UL>
            <li>הווידג'ט וה-webhook של WhatsApp פונים לעולם; שיחה דרכם מחויבת למפתח שלך</li>
            <li>בסיס הידע נשלף לתוך התשובות — אל תכניס אליו מה שלא מוכן להיאמר ללקוח</li>
            <li>DLP מסתיר תבניות של כרטיס אשראי ותעודת זהות, ולא כל מידע מזהה. הוא שכבת הגנה, לא ערובה</li>
          </UL>
          <Tip>עקוב אחרי Interactions כדי לראות מה באמת נשאל ומה הסוכן ענה. זה הכלי הכי טוב לתפוס גם דליפות וגם תשובות שגויות.</Tip>
        </div>

    };

    return (
      <div style={stacked ? { display: 'flex', flexDirection: 'column', gap: 16 } : { display: 'flex', gap: 32, maxWidth: 1000, margin: '0 auto' }}>
        {/* Sidebar nav — on a phone, a strip of chips above the text */}
        <div style={{ width: stacked ? '100%' : 200, flexShrink: 0 }}>
          {!stacked && <div style={{ fontWeight: 700, fontSize: 11, color: 'var(--text-muted)', letterSpacing: 1, marginBottom: 10, textTransform: 'uppercase' }}>תוכן עניינים</div>}
          <div className={stacked ? 'm-scroll-x' : undefined} dir={stacked ? 'rtl' : undefined} style={stacked ? { display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 4 } : { display: 'flex', flexDirection: 'column', gap: 2 }}>
            {sections.map(s => (
              <button key={s.id} onClick={() => setActive(s.id)}
                style={stacked ? {
                  flexShrink: 0, whiteSpace: 'nowrap', height: 36, padding: '0 13px', borderRadius: 999, fontSize: 13,
                  background: active === s.id ? 'var(--primary-dim)' : 'var(--bg-card)',
                  color: active === s.id ? 'var(--primary)' : 'var(--text-2)',
                  fontWeight: active === s.id ? 700 : 500,
                  border: `1px solid ${active === s.id ? 'rgba(239,159,39,0.35)' : 'var(--border)'}`,
                } : {
                  textAlign: 'right', padding: '8px 10px', borderRadius: 'var(--r-sm)', fontSize: 13,
                  background: active === s.id ? 'rgba(239,159,39,0.10)' : 'transparent',
                  color: active === s.id ? 'var(--primary)' : 'var(--text-2)',
                  fontWeight: active === s.id ? 600 : 400,
                  borderRight: `3px solid ${active === s.id ? 'var(--primary)' : 'transparent'}`,
                }}
                onMouseEnter={e => { if (active !== s.id) e.currentTarget.style.background = 'var(--bg-hover)'; }}
                onMouseLeave={e => { if (active !== s.id) e.currentTarget.style.background = 'transparent'; }}
              >{s.label}</button>
            ))}
          </div>
        </div>
        {/* Content */}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ marginBottom: 6, fontSize: 11, color: 'var(--text-muted)', letterSpacing: 1, textTransform: 'uppercase' }}>תיעוד</div>
          <div style={{ fontWeight: 800, fontSize: 28, marginBottom: 24, color: 'var(--text)' }}>📖 מדריך 8Legs.ai</div>
          {content[active]}
        </div>
      </div>
    );
  }

  /* ─────────────────── AGENT LIST VIEW ─────────────────── */
  function AgentListView({ agents, onNew, onEdit, onTest, onDuplicate, onDelete, onExport }) {
    const [query, setQuery]   = useState('');
    const [branch, setBranch] = useState('');
    const [channel, setChannel] = useState('');
    /* The chosen shape of the list outlives the session — it is a preference,
       not state. */
    const [view, setView] = useState(() => localStorage.getItem('agentforge_agents_view') || 'grid');
    function pickView(v) { setView(v); localStorage.setItem('agentforge_agents_view', v); }

    const branches = Array.from(new Set(agents.map(agentBranch))).sort();
    const channels = Array.from(new Set(agents.map(agentChannel))).sort();

    const shown = agents.filter(a =>
      (!query || a.name.toLowerCase().includes(query.toLowerCase())) &&
      (!branch || agentBranch(a) === branch) &&
      (!channel || agentChannel(a) === channel));

    const cardProps = a => ({
      key: a.id, agent: a, isNew: a._isNew,
      onEdit: () => onEdit(a.id),
      onTest: () => onTest(a.id),
      onDuplicate: () => onDuplicate(a.id),
      onDelete: () => onDelete(a.id),
      onExport: () => onExport(a.id),
    });

    const viewBtn = (id, icon, label) => {
      const on = view === id;
      return (
        <button onClick={() => pickView(id)} title={label} aria-label={label}
          style={{
            width: 34, height: 34, display: 'flex', alignItems: 'center', justifyContent: 'center',
            borderRadius: 8, cursor: 'pointer',
            background: on ? 'var(--sel)' : 'transparent',
            color: on ? 'var(--sel-ink)' : 'var(--text-muted)',
            border: '1px solid transparent',
          }}>{icon}</button>
      );
    };

    return (
      <div style={{ position: 'relative', height: '100%' }}>
        <PageHeader
          eyebrow="Agent studio"
          title="Agents"
          actions={
            <React.Fragment>
              {/* The moment someone wants an agent is the moment to mention
                  that something here can build one for them. */}
              <Btn icon={Icons.sparkle}
                title="Let the assistant build an agent for you"
                onClick={() => askAssistant('בנה לי סוכן חדש. שאל אותי מה הוא צריך לעשות.')}>
                Build with the assistant
              </Btn>
              <Btn variant="primary" icon={Icons.plus} onClick={onNew}>New agent</Btn>
            </React.Fragment>
          }
        />

        {agents.length > 0 && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 20, flexWrap: 'wrap' }}>
            <SearchField value={query} onChange={setQuery} placeholder="Search agents" style={{ maxWidth: 300 }} />
            <SelectPill value={branch} onChange={setBranch} icon={Icons.branch}
              placeholder="All branches" width={172}
              options={branches.map(b => ({ value: b, label: b }))} />
            <SelectPill value={channel} onChange={setChannel} icon={Icons.filter}
              placeholder="All channels" width={168}
              options={channels.map(c => ({ value: c, label: c }))} />
            <div style={{ marginInlineStart: 'auto', display: 'flex', alignItems: 'center', gap: 14 }}>
              <CountLabel n={shown.length} noun="AGENT" />
              <div style={{ display: 'flex', gap: 2, padding: 3, borderRadius: 10, background: 'var(--bg-panel)', border: '1px solid var(--border)' }}>
                {viewBtn('grid', Icons.grid, 'Grid')}
                {viewBtn('rows', Icons.rows, 'List')}
              </div>
            </div>
          </div>
        )}

        {agents.length === 0 ? (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16, padding: '64px 48px', background: 'var(--bg-card)', borderRadius: 'var(--r-xl)', border: '1px dashed var(--border)' }}>
            <div style={{ width: 56, height: 56, borderRadius: 16, background: 'var(--bg-panel)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-muted)' }}>
              {Icons.bot}
            </div>
            <div>
              <div style={{ color: 'var(--text)', fontWeight: 700, fontSize: 15, textAlign: 'center', marginBottom: 6 }}>No agents yet</div>
              <div style={{ color: 'var(--text-muted)', fontSize: 13, textAlign: 'center', lineHeight: 1.6 }}>
                Not sure where to start? Describe what you want in plain words<br />and the assistant will build the agent for you.
              </div>
            </div>
            <Btn variant="primary" icon={Icons.sparkle}
              onClick={() => askAssistant('בנה לי סוכן ראשון. שאל אותי מה הוא צריך לעשות.')}>
              Build my first agent with the assistant
            </Btn>
            <div style={{ color: 'var(--text-muted)', fontSize: 12 }}>or press “New agent” to build it yourself</div>
          </div>
        ) : view === 'grid' ? (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(358px,1fr))', gap: 16 }}>
            {/* Searching is looking for something that exists — the tile for
                making a new one only gets in the way then. */}
            {!query && !branch && !channel && (
              <NewAgentTile onNew={onNew} onAssistant={() => askAssistant('בנה לי סוכן חדש. שאל אותי מה הוא צריך לעשות.')} />
            )}
            {shown.map(a => <AgentCard {...cardProps(a)} />)}
          </div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {shown.map(a => <AgentRow {...cardProps(a)} />)}
          </div>
        )}

        {agents.length > 0 && shown.length === 0 && (
          <div style={{ marginTop: 18, padding: '28px 20px', textAlign: 'center', color: 'var(--text-muted)', fontSize: 13, background: 'var(--bg-card)', border: '1px dashed var(--border)', borderRadius: 'var(--r-lg)' }}>
            No agent matches this search.
          </div>
        )}
      </div>
    );
  }

  /* ─────────────────── INTERACTIONS ─────────────────── */
  function fmtSessionDuration(seconds) {
    const sec = Math.max(0, Math.round(seconds || 0));
    if (sec < 60) return `${sec}s`;
    const m = Math.floor(sec / 60), rest = sec % 60;
    if (m < 60) return rest ? `${m}m ${rest}s` : `${m}m`;
    const h = Math.floor(m / 60);
    return `${h}h ${m % 60}m`;
  }

  const SOURCE_LABELS = { widget: 'Widget', whatsapp: 'WhatsApp', test: 'Test chat' };

  const EMPTY_FILTERS = {
    q: '', agentId: '', source: '', from: '', to: '',
    minSeconds: '', maxSeconds: '', minMessages: '',
  };

  function InteractionsView({ agents, user, onOpenAgent, stacked }) {
    const PAGE_SIZE = 25;
    const [filters, setFilters] = useState(EMPTY_FILTERS);
    const [sort, setSort]       = useState({ sort: 'started', dir: 'desc' });
    const [offset, setOffset]   = useState(0);
    const [scopeAll, setScopeAll] = useState(false);
    const [data, setData]      = useState(null);
    const [error, setError]    = useState(null);
    const [loading, setLoading] = useState(true);
    const [openSession, setOpenSession] = useState(null);
    const [filtersOpen, setFiltersOpen] = useState(false);   // the phone's filter sheet
    const [moreOpen, setMoreOpen] = useState(false);         // the exact filters, on desktop

    const set = (key, val) => { setFilters(f => ({ ...f, [key]: val })); setOffset(0); };
    const activeFilters = Object.keys(EMPTY_FILTERS).filter(k => filters[k] !== '').length;

    // Filters are typed into, so debounce before hitting the API.
    useEffect(() => {
      let live = true;
      setLoading(true);
      const t = setTimeout(() => {
        apiListInteractions({
          ...filters,
          sort: sort.sort, dir: sort.dir,
          limit: PAGE_SIZE, offset,
          scope: scopeAll ? 'all' : '',
        })
          .then(d => { if (live) { setData(d); setError(null); setLoading(false); } })
          .catch(err => { if (live) { setError(err.message); setLoading(false); } });
      }, 300);
      return () => { live = false; clearTimeout(t); };
    }, [filters, sort, offset, scopeAll]);

    /* ---- one conversation ---- */
    if (openSession) {
      const msgs = (openSession.messages || []).filter(m => m.role === 'user' || m.role === 'assistant');
      return (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24, flexWrap: 'wrap' }}>
            <button onClick={() => setOpenSession(null)} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13, border: '1px solid var(--border)' }}>← Back</button>
            <div style={{ width: 1, height: 20, background: 'var(--border)' }} />
            <AvatarDisplay value={openSession.agent_avatar || '🤖'} size={28} />
            <div>
              <div style={{ fontWeight: 800, fontSize: 18 }}>{openSession.agent_name}</div>
              <div style={{ color: 'var(--text-muted)', fontSize: 12, marginTop: 2 }}>
                {SOURCE_LABELS[openSession.source] || openSession.source}
                &nbsp;·&nbsp;{new Date(openSession.started_at).toLocaleString()}
                &nbsp;·&nbsp;{fmtSessionDuration(openSession.duration_seconds)}
                &nbsp;·&nbsp;{msgs.length} messages
              </div>
            </div>
            {onOpenAgent && (
              <button onClick={() => onOpenAgent(openSession.agent_id)}
                style={{ marginLeft: 'auto', background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13, border: '1px solid var(--border)' }}>
                Open agent
              </button>
            )}
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, width: '100%' }}>
            {msgs.map((m, i) => (
              <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: m.role === 'user' ? 'flex-end' : 'flex-start' }}>
                <div style={{
                  maxWidth: '72%', padding: '10px 14px', fontSize: 14, lineHeight: 1.5,
                  whiteSpace: 'pre-wrap', wordBreak: 'break-word',
                  borderRadius: m.role === 'user' ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
                  background: m.role === 'user' ? 'var(--primary)' : 'var(--bg-card)',
                  color: m.role === 'user' ? '#0a0a0a' : 'var(--text)',
                  border: m.role === 'assistant' ? '1px solid var(--border)' : 'none',
                }}>{typeof m.content === 'string' ? m.content : JSON.stringify(m.content)}</div>
                <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 3, padding: '0 4px' }}>
                  {m.role === 'user' ? 'User' : openSession.agent_name}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ---- list ---- */
    const sessions = data?.sessions || [];
    const total = data?.total || 0;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    const currentPage = Math.floor(offset / PAGE_SIZE);

    // Agent options: the user's own agents, plus any agent seen in the current
    // page (an admin looking at every user's conversations).
    const agentOptions = [...(agents || []).map(a => ({ id: a.id, name: a.name }))];
    sessions.forEach(sx => {
      if (!agentOptions.some(o => o.id === sx.agent_id)) agentOptions.push({ id: sx.agent_id, name: sx.agent_name || sx.agent_id });
    });

    const sourceOptions = (data?.sources || []).map(sx => sx.source);

    const inputStyle = {
      width: '100%', fontSize: 12, padding: '5px 7px', borderRadius: 'var(--r-sm)',
      background: 'var(--bg-input)', border: '1px solid var(--border)', color: 'var(--text)',

    /* ---- phone: cards, a search box, the filters in a sheet ---- */

      const chip = (label, on, onClick) => (
        <button key={label} onClick={onClick}
          style={{ flexShrink: 0, height: 34, padding: '0 12px', borderRadius: 999, fontSize: 12.5, fontWeight: 600, whiteSpace: 'nowrap',
                   background: on ? 'var(--primary-dim)' : 'var(--bg-card)', color: on ? 'var(--primary)' : 'var(--text-2)',
                   border: `1px solid ${on ? 'rgba(239,159,39,0.35)' : 'var(--border)'}` }}>{label}</button>
      );
      const agentName = filters.agentId ? (agentOptions.find(o => o.id === filters.agentId) || {}).name : '';
      const sheetField = (label, control) => (
        <div><label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 5, display: 'block' }}>{label}</label>{control}</div>
      );
      const selStyle = { width: '100%', height: 44, borderRadius: 'var(--r-md)', padding: '0 12px' };
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
            <div style={{ fontWeight: 800, fontSize: 32, letterSpacing: '-0.035em' }}>Interactions</div>
            <CountLabel n={total} noun="CHAT" />
          </div>
          {user?.isAdmin && (
            <div>{chip(scopeAll ? 'All users' : 'My agents', scopeAll, () => { setScopeAll(v => !v); setOffset(0); })}</div>
          )}

          <SearchField value={filters.q} onChange={v => set('q', v)} placeholder="Search every message" style={{ height: 48, flex: 'none' }} />

          <div className="m-scroll-x" style={{ display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 2 }}>
            {chip(`⚙ Filters${activeFilters ? ` (${activeFilters})` : ''}`, activeFilters > 0, () => setFiltersOpen(true))}
            {chip(agentName ? agentName : 'All agents ▾', !!filters.agentId, () => setFiltersOpen(true))}
            {sourceOptions.map(sx => chip(SOURCE_LABELS[sx] || sx, filters.source === sx, () => set('source', filters.source === sx ? '' : sx)))}
            {activeFilters > 0 && chip('✕ Clear', false, () => { setFilters(EMPTY_FILTERS); setOffset(0); })}
          </div>

          {error && <div style={{ background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.3)', color: 'var(--danger)', padding: '9px 13px', borderRadius: 'var(--r-md)', fontSize: 12.5 }}>{error}</div>}

          {loading && !data ? (
            <div style={{ color: 'var(--text-muted)', fontSize: 13, padding: 20, textAlign: 'center' }}>Loading…</div>
          ) : sessions.length === 0 ? (
            <div style={{ padding: '40px 20px', textAlign: 'center', background: 'var(--bg-card)', border: '1px dashed var(--border)', borderRadius: 'var(--r-lg)', color: 'var(--text-muted)', fontSize: 13 }}>
              {activeFilters ? 'No conversations match these filters.' : 'No conversations yet.'}
            </div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {sessions.map(sx => {
                const msgs = sx.messages || [];
                const firstUser = msgs.find(m => m.role === 'user');
                const preview = typeof firstUser?.content === 'string' ? firstUser.content : '—';
                const chColor = sx.source === 'whatsapp' ? '#25D366' : 'var(--teal)';
                return (
                  <button key={sx.id} onClick={() => setOpenSession(sx)}
                    style={{ width: '100%', textAlign: 'left', display: 'flex', gap: 12, alignItems: 'flex-start', padding: '13px 14px', background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 14, color: 'var(--text)' }}>
                    <div style={{ width: 40, height: 40, borderRadius: 12, background: 'var(--bg-panel)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                      <AvatarDisplay value={sx.agent_avatar || '🤖'} size={22} />
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
                        <span dir="auto" style={{ fontWeight: 700, fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{sx.agent_name}</span>
                        <span style={{ fontSize: 10.5, fontWeight: 700, color: chColor, background: sx.source === 'whatsapp' ? 'rgba(37,211,102,0.12)' : 'var(--teal-dim)', padding: '2px 7px', borderRadius: 6, flexShrink: 0 }}>{SOURCE_LABELS[sx.source] || sx.source}</span>
                        {scopeAll && sx.owner_username && <span style={{ fontSize: 10.5, color: 'var(--text-muted)', flexShrink: 0 }}>@{sx.owner_username}</span>}
                      </div>
                      <div dir="auto" style={{ fontSize: 13, color: 'var(--text-2)', marginTop: 4, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{preview}</div>
                      <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 5 }}>
                        {new Date(sx.started_at).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })} · {fmtSessionDuration(sx.duration_seconds)} · {sx.message_count} messages
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
          )}

          {totalPages > 1 && (
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 12, padding: '6px 0' }}>
              <button disabled={currentPage === 0} onClick={() => setOffset(o => Math.max(0, o - PAGE_SIZE))}
                style={{ height: 40, padding: '0 16px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: 'var(--text-2)', opacity: currentPage === 0 ? 0.4 : 1 }}>‹ Prev</button>
              <span style={{ fontSize: 12.5, color: 'var(--text-muted)' }}>{currentPage + 1} / {totalPages}</span>
              <button disabled={currentPage + 1 >= totalPages} onClick={() => setOffset(o => o + PAGE_SIZE)}
                style={{ height: 40, padding: '0 16px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: 'var(--text-2)', opacity: currentPage + 1 >= totalPages ? 0.4 : 1 }}>Next ›</button>
            </div>
          )}

          <MobileSheet open={filtersOpen} onClose={() => setFiltersOpen(false)} title="Filters"
            right={activeFilters > 0 && (
              <button onClick={() => { setFilters(EMPTY_FILTERS); setOffset(0); }} style={{ height: 36, padding: '0 12px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: 'var(--text-2)', fontSize: 12.5, fontWeight: 600 }}>Clear all</button>
            )}>
            <div style={{ padding: '14px 16px 20px', display: 'flex', flexDirection: 'column', gap: 14, overflowY: 'auto' }}>

                </select>)}
              {sheetField('Channel',
                <select value={filters.source} onChange={e => set('source', e.target.value)} style={selStyle}>
                  <option value="">All channels</option>
                  {sourceOptions.map(sx => <option key={sx} value={sx}>{SOURCE_LABELS[sx] || sx}</option>)}
                </select>)}
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                {sheetField('From', <input type="date" value={filters.from} onChange={e => set('from', e.target.value)} style={selStyle} />)}
                {sheetField('To', <input type="date" value={filters.to} onChange={e => set('to', e.target.value)} style={selStyle} />)}

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                {sheetField('Min seconds', <input type="number" min="0" inputMode="numeric" value={filters.minSeconds} onChange={e => set('minSeconds', e.target.value)} style={selStyle} />)}
                {sheetField('Max seconds', <input type="number" min="0" inputMode="numeric" value={filters.maxSeconds} onChange={e => set('maxSeconds', e.target.value)} style={selStyle} />)}
              </div>
              {sheetField('Min messages', <input type="number" min="0" inputMode="numeric" value={filters.minMessages} onChange={e => set('minMessages', e.target.value)} style={selStyle} />)}

                  <option value="duration:desc">Longest first</option>

    }

    /* The two filters people actually reach for are "when" and "how long", so
       they get presets; the exact numbers stay one click away under "More". */
    const today = new Date();
    const iso = d => d.toISOString().slice(0, 10);
    const daysAgo = n => { const d = new Date(today); d.setDate(d.getDate() - n); return iso(d); };
    const DATE_PRESETS = {
      today: { label: 'Today',        from: iso(today),  to: '' },
      '7':   { label: 'Last 7 days',  from: daysAgo(7),  to: '' },
      '30':  { label: 'Last 30 days', from: daysAgo(30), to: '' },
      '365': { label: 'Last year',    from: daysAgo(365), to: '' },
    };
    const LENGTH_PRESETS = {
      short:  { label: 'Under a minute', minSeconds: '',    maxSeconds: '60' },
      medium: { label: '1 – 5 minutes',  minSeconds: '60',  maxSeconds: '300' },
      long:   { label: 'Over 5 minutes', minSeconds: '300', maxSeconds: '' },
    };
    const datePreset = Object.keys(DATE_PRESETS).find(k => DATE_PRESETS[k].from === filters.from && DATE_PRESETS[k].to === filters.to) || '';
    const lengthPreset = Object.keys(LENGTH_PRESETS).find(k => LENGTH_PRESETS[k].minSeconds === filters.minSeconds && LENGTH_PRESETS[k].maxSeconds === filters.maxSeconds) || '';
    const applyPreset = (table, key) => {
      const v = table[key] || { from: '', to: '', minSeconds: '', maxSeconds: '' };
      setFilters(f => ({ ...f, ...Object.fromEntries(Object.entries(v).filter(([k]) => k !== 'label')) }));
      setOffset(0);
    };

    /* Exports exactly what is on screen — the filters are the query. */
    function exportCsv() {
      const cell = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
      const rows = [['Agent', 'Channel', 'Started', 'Duration', 'Messages', 'Opening message']];
      sessions.forEach(sx => {
        const firstUser = (sx.messages || []).find(m => m.role === 'user');
        rows.push([
          sx.agent_name || '', SOURCE_LABELS[sx.source] || sx.source,
          new Date(sx.started_at).toISOString(), fmtSessionDuration(sx.duration_seconds),
          sx.message_count, typeof firstUser?.content === 'string' ? firstUser.content : '',
        ]);
      });
      const blob = new Blob(['\ufeff' + rows.map(r => r.map(cell).join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `interactions-${iso(today)}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    const th = { padding: '0 16px 11px', textAlign: 'start', whiteSpace: 'nowrap' };

    const colHead = (key, label) => {
      const active = sort.sort === key;

          <button onClick={() => setSort(sx => ({ sort: key, dir: sx.sort === key && sx.dir === 'desc' ? 'asc' : 'desc' }))}

          <SelectPill value={filters.source} onChange={v => set('source', v)} icon={Icons.filter} placeholder="All channels" width={168}

          <SelectPill value={datePreset} onChange={v => applyPreset(DATE_PRESETS, v)} icon={Icons.calendar} placeholder="Any date" width={160}

          <SelectPill value={lengthPreset} onChange={v => applyPreset(LENGTH_PRESETS, v)} icon={Icons.clock} placeholder="Any length" width={165}
            options={Object.entries(LENGTH_PRESETS).map(([k, v]) => ({ value: k, label: v.label }))} />
          <div style={{ marginInlineStart: 'auto', display: 'flex', alignItems: 'center', gap: 14 }}>
            {activeFilters > 0 && (
              <Btn size="sm" onClick={() => { setFilters(EMPTY_FILTERS); setOffset(0); setMoreOpen(false); }}>Clear filters</Btn>

              ['Min messages', 'minMessages', 'number']].map(([label, key, type]) => (
              <div key={key}>
                <Eyebrow style={{ marginBottom: 5 }}>{label}</Eyebrow>
                <input type={type} min="0" value={filters[key]} onChange={e => set(key, e.target.value)}
                  style={{ height: 36, borderRadius: 'var(--r-sm)', padding: '0 10px', fontSize: 12.5, width: 140 }} />

          </div>

        {error ? (

        ) : (
          <React.Fragment>
            <div style={{ background: 'var(--bg-card)', borderRadius: 'var(--r-lg)', border: '1px solid var(--border)', overflowX: 'auto' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 900 }}>
                <thead>
                  <tr style={{ borderBottom: '1px solid var(--border)' }}>
                    <th style={{ ...th, paddingTop: 15 }}><Eyebrow>Agent</Eyebrow></th>
                    {scopeAll && <th style={{ ...th, paddingTop: 15 }}><Eyebrow>Owner</Eyebrow></th>}
                    <th style={{ ...th, paddingTop: 15 }}><Eyebrow>Channel</Eyebrow></th>
                    {colHead('started', 'Started')}
                    {colHead('duration', 'Duration')}
                    {colHead('messages', 'Messages')}
                    <th style={{ ...th, paddingTop: 15 }}><Eyebrow>Opening message</Eyebrow></th>
                    <th style={{ ...th, paddingTop: 15, width: 34 }} />
                  </tr>
                </thead>
                <tbody>
                  {loading && (
                    <tr><td colSpan={scopeAll ? 8 : 7} style={{ ...td, color: 'var(--text-muted)', padding: 28, textAlign: 'center' }}>Loading…</td></tr>

                  {!loading && sessions.length === 0 && (
                    <tr><td colSpan={scopeAll ? 8 : 7} style={{ ...td, color: 'var(--text-muted)', padding: 40, textAlign: 'center' }}>
                      {activeFilters ? 'No conversations match these filters.' : 'No conversations yet.'}
                    </td></tr>

                  {!loading && sessions.map((sx, i) => {
                    const msgs = sx.messages || [];
                    const firstUser = msgs.find(m => m.role === 'user');
                    const preview = typeof firstUser?.content === 'string' ? firstUser.content : '—';
                    const started = new Date(sx.started_at);
                    return (
                      <tr key={sx.id}
                        onClick={() => setOpenSession(sx)}
                        style={{ borderTop: '1px solid var(--border)', cursor: 'pointer' }}
                        onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                        onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                      >
                        <td style={td}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                            <div style={{ width: 30, height: 30, borderRadius: 9, flexShrink: 0, background: 'var(--bg-panel)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                              <AvatarDisplay value={sx.agent_avatar || '🤖'} size={18} />
                            </div>
                            <span dir="auto" style={{ fontWeight: 650 }}>{sx.agent_name || '—'}</span>
                          </div>
                        </td>
                        {scopeAll && <td style={{ ...td, color: 'var(--text-2)' }}>{sx.owner_username || '—'}</td>}
                        <td style={td}>
                          <Chip tone={sx.source === 'whatsapp' ? 'live' : 'neutral'}>{SOURCE_LABELS[sx.source] || sx.source}</Chip>
                        </td>
                        <td style={{ ...td, whiteSpace: 'nowrap' }}>
                          <div style={{ color: 'var(--text-2)' }}>{started.toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' })}</div>
                          <div style={{ fontFamily: MONO, fontSize: 11, color: 'var(--text-muted)', marginTop: 2 }}>
                            {started.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}

                        </td>
                        <td style={{ ...td, color: 'var(--text-2)', fontFamily: MONO, fontSize: 12.5, whiteSpace: 'nowrap' }}>{fmtSessionDuration(sx.duration_seconds)}</td>
                        <td style={{ ...td, color: 'var(--text-2)', fontFamily: MONO, fontSize: 12.5 }}>{sx.message_count}</td>
                        <td style={{ ...td, maxWidth: 320 }}>
                          <div dir="auto" style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: 'var(--text-2)' }}>{preview}</div>
                        </td>
                        <td style={{ ...td, color: 'var(--text-muted)', textAlign: 'end' }}>›</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {totalPages > 1 && (
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, marginTop: 20 }}>
                <Btn size="sm" onClick={() => setOffset(Math.max(0, (currentPage - 1) * PAGE_SIZE))} disabled={currentPage === 0}>← Prev</Btn>
                <span style={{ fontSize: 12.5, fontFamily: MONO, color: 'var(--text-2)' }}>{currentPage + 1} / {totalPages}</span>
                <Btn size="sm" onClick={() => setOffset((currentPage + 1) * PAGE_SIZE)} disabled={currentPage >= totalPages - 1}>Next →</Btn>
              </div>
            )}
          </React.Fragment>
        )}
      </div>
    );
  }

  /* ─────────────────── PLATFORM ASSISTANT ─────────────────── */

  // A tool-calling loop over the account's provider for assistants that are not
  // tied to one agent. `execute` receives (name, input) and returns a string.
  async function callWithToolDefs({ system, history, tools, execute, maxRounds = 8, maxTokens = 4096 }) {
    const { apiKey, provider, model } = accountApi();

    if (provider === 'claude') {
      let msgs = [...history];
      for (let round = 0; round < maxRounds; round++) {
        const r = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true',
          },
          body: JSON.stringify({
            model, max_tokens: maxTokens, system, messages: msgs,
            tools: tools.map(t => ({ name: t.name, description: t.description, input_schema: t.input_schema })),
          }),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error?.message || JSON.stringify(d));

        if (d.stop_reason !== 'tool_use') {
          return d.content.filter(c => c.type === 'text').map(c => c.text).join('\n').trim();
        }
        const uses = d.content.filter(c => c.type === 'tool_use');
        const results = [];
        for (const u of uses) {
          results.push({ type: 'tool_result', tool_use_id: u.id, content: await execute(u.name, u.input || {}) });
        }
        msgs = [...msgs, { role: 'assistant', content: d.content }, { role: 'user', content: results }];
      }
      throw new Error('יותר מדי סבבי כלים — נסה לפרק את הבקשה');
    }

    // OpenAI and Ollama share the chat-completions shape.
    const fnTools = tools.map(t => ({ type: 'function', function: { name: t.name, description: t.description, parameters: t.input_schema } }));
    let msgs = [{ role: 'system', content: system }, ...history];
    for (let round = 0; round < maxRounds; round++) {
      const body = { model, messages: msgs, tools: fnTools };
      const r = provider === 'ollama'
        ? await fetch('/api/ollama-proxy', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ host: (accountApi().ollamaHost || '').replace(/\/$/, ''), path: '/v1/chat/completions', body }),
          })
        : await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${apiKey}` },
            body: JSON.stringify(body),
          });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error?.message || JSON.stringify(d));

      const choice = d.choices[0];
      if (choice.finish_reason !== 'tool_calls') return choice.message.content || '';

      const toolMsgs = [];
      for (const tc of choice.message.tool_calls || []) {
        let inputs = {};
        try { inputs = JSON.parse(tc.function.arguments || '{}'); } catch (_) { /* keep {} */ }
        toolMsgs.push({ role: 'tool', tool_call_id: tc.id, content: await execute(tc.function.name, inputs) });
      }
      msgs = [...msgs, choice.message, ...toolMsgs];
    }
    throw new Error('יותר מדי סבבי כלים — נסה לפרק את הבקשה');
  }

  const STR = (desc) => ({ type: 'string', description: desc });

  const PLATFORM_TOOLS = [
    {

  const PLATFORM_REFERENCE = [
    'The platform (8Legs.ai) — what you are operating:',
    '- An AGENT has: a name and avatar, an opening message, a base prompt, skills, Python tools, a knowledge base, and channels.',

  function buildPlatformAssistantPrompt(agents, language) {
    const inventory = (agents || []).length
      ? (agents || []).map(a => `- ${a.name} (id ${a.id}) — ${(a.skills || []).length} skills, ${(a.tools || []).length} tools`).join('\n')
      : '(the account has no agents yet)';
    const cfg = accountApi();

    return [
      'You are the assistant built into the 8Legs.ai builder. You operate the platform on the user\'s behalf: you answer questions about it, and you create and change their agents through the tools you have.',
      '',
      PLATFORM_REFERENCE,
      '',
      'How to work:',
      '- Do the work with your tools rather than describing what the user should click. Only explain where to click for the things you cannot do: connecting Gmail, uploading files, WhatsApp credentials, and the account API key.',
      '- Before changing an existing agent, call get_agent. When you send skills or tools you are replacing the whole list, so include the ones you are keeping.',
      '- Write tool code that satisfies the runtime contract, and declare exactly the parameters the code reads. Offer to run_tool it afterwards.',
      "- When you build an agent, split the work: identity and always-on rules go in base_prompt, and EVERY task procedure becomes a skill passed in the same create_agent call. Apply this test to each ## section you are about to write into a base prompt — if it is a sequence of steps for one task ('ask X, then collect Y, then send Z'), it is a skill, not base prompt. An agent that performs one task still gets one skill for it; the base prompt then says who it is and when to switch to that skill.",
      "- Do not build a skill for something that is not a procedure: tone, language, a refusal rule or a single fact belongs in the base prompt.",
      "- EVERY prompt you write is in English — the base prompt and every skill prompt — whatever language you and the user are speaking. The one exception is a sentence the agent must say to its users verbatim in another language: that stays in that language, quoted, and the prompt states which language the agent replies in.",
      "- What is NOT in English: the agent's name, its opening_message, and anything the agent says to end users. Those are in the language the agent serves its users in — so a Hebrew-speaking agent gets an English prompt that instructs it to answer in Hebrew, and a Hebrew opening message.",
      '- Never delete anything without asking in chat first.',
      '- When you have changed something, say in one line what changed and where to see it.',
      '- If a tool call fails, explain what failed and what you need in order to retry — do not silently give up.',
      '- When the user reports that something is broken, call get_recent_errors before theorising, and after you change a tool offer to run_tool it and check.',
      '',
      language === 'en'
        ? 'Reply in English, briefly and concretely, with no preamble.'
        : 'ענה בעברית, בקצרה ולעניין, בלי הקדמות. מונחי הממשק (Tools, Skills, Settings, Interactions) נשארים באנגלית.',
      '',
      `The account runs on ${cfg.provider} · ${cfg.model}.`,

      inventory,
    ].join('\n');

  const PLATFORM_OPENING = {
