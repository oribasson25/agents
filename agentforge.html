  function ChatTestDrawer({ agent, onClose, initialSessionId }) {
    const historyKey = `agentforge_history_${agent.id}`;
    const openingMsg = { id: uid(), role: 'agent', content: agent.openingMessage || 'Hello!', timestamp: new Date(), isOpening: true };
    const [messages, setMessages] = useState([openingMsg]);
    const [input, setInput] = useState('');
    const [pending, setPending] = useState(false);
    const [activeSkillId, setActiveSkillId] = useState(null);
    const [showHistory, setShowHistory] = useState(!!initialSessionId);
    const [viewingSession, setViewingSession] = useState(null); // { startedAt, messages }
    const [historyTick, setHistoryTick] = useState(0);
    const listRef = useRef(null);
    const inputRef = useRef(null);
    const currentSessionIdRef = useRef(uid());

    // Save session to history on close (if has real messages)
    const messagesRef = useRef(messages);
    useEffect(() => { messagesRef.current = messages; }, [messages]);
    useEffect(() => {
      return () => {
        const msgs = messagesRef.current.filter(m => m.role !== 'typing');
        const hasReal = msgs.some(m => m.role === 'user');
        if (!hasReal) return;
        try {
          const saved = JSON.parse(localStorage.getItem(historyKey) || '[]');
          // avoid duplicate session saves
          const filtered = saved.filter(s => s.id !== currentSessionIdRef.current);
          const session = { id: currentSessionIdRef.current, startedAt: msgs[0]?.timestamp || new Date(), messages: msgs };
          localStorage.setItem(historyKey, JSON.stringify([session, ...filtered].slice(0, 50)));
        } catch (_) {}
      };
    }, [historyKey]);

    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(historyKey) || '[]').map(s => ({ ...s, startedAt: new Date(s.startedAt), messages: s.messages.map(m => ({ ...m, timestamp: new Date(m.timestamp) })) })); }
      catch (_) { return []; }
    }

    // Auto-open a specific session from sidebar click
    useEffect(() => {
      if (!initialSessionId) return;
      const sessions = loadHistory();
      const target = sessions.find(s => s.id === initialSessionId);
      if (target) setViewingSession(target);
    }, [initialSessionId]); // eslint-disable-line react-hooks/exhaustive-deps

    function deleteSession(sid) {
      try {
        const updated = loadHistory().filter(s => s.id !== sid);
        localStorage.setItem(historyKey, JSON.stringify(updated));
        if (viewingSession?.id === sid) setViewingSession(null);
        setHistoryTick(t => t + 1);
      } catch (_) {}
    }

    useEffect(() => {
      function onKey(e) { if (e.key === 'Escape') onClose(); }
      document.addEventListener('keydown', onKey);
      return () => document.removeEventListener('keydown', onKey);
    }, [onClose]);

    useEffect(() => {
      if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
    }, [messages]);

    useEffect(() => {
      if (!pending && inputRef.current) inputRef.current.focus();
    }, [pending]);

    async function sendMessage() {
      const text = input.trim();
      if (!text || pending) return;
      setInput('');
      inputRef.current?.focus();
      const t0 = performance.now();

      // Skill switch detection
      const skillMatch = text.match(/^#(\w+)/);
      let skillBanner = null;
      if (skillMatch) {
        const skill = agent.skills.find(s => s.name.toLowerCase() === skillMatch[1].toLowerCase());
        if (skill) { skillBanner = skill; setActiveSkillId(skill.id); }
      }

      const typingId = uid();
      const dlpMasked = applyDlp(text, agent.dlp || {}) !== text;
      const newMsgs = [...messages, { id: uid(), role: 'user', content: text, timestamp: new Date(), dlpMasked }];
      if (skillBanner) newMsgs.push({ id: uid(), role: 'skill', name: skillBanner.name, description: skillBanner.description, prompt: skillBanner.prompt, timestamp: new Date() });
      newMsgs.push({ id: typingId, role: 'typing' });
      setMessages(newMsgs);
      setPending(true);

      const history = messages.filter(m => m.role === 'user' || m.role === 'agent').map(m => ({
        role: m.role === 'agent' ? 'assistant' : 'user', content: m.content,
      }));
      history.push({ role: 'user', content: text });

      try {
        const content = await callWithTools(agent, history, async (toolName, toolInput) => {
          if (toolName === 'switch_skill') {
            const skill = (agent.skills || []).find(s => s.name.toLowerCase() === (toolInput.skill_name || '').toLowerCase());
            if (skill) {
              setActiveSkillId(skill.id);
              setMessages(m => m.filter(x => x.id !== typingId).concat(
                { id: uid(), role: 'skill', name: skill.name, description: skill.description, prompt: skill.prompt, timestamp: new Date() },
                { id: typingId, role: 'typing' }
              ));
            }
            return null;
          }
          const msgId = uid();
          setMessages(m => m.filter(x => x.id !== typingId).concat(
            { id: msgId, role: 'tool', name: toolName, input: toolInput, timestamp: new Date() },
            { id: typingId, role: 'typing' }
          ));
          return (result) => setMessages(m => m.map(x => x.id === msgId ? { ...x, result } : x));
        }, activeSkillId);
        const dt = performance.now() - t0;
        const next = m => m.filter(x => x.id !== typingId);
        setMessages(m => content?.trim() ? next(m).concat({ id: uid(), role: 'agent', content, timestamp: new Date(), durationMs: dt }) : next(m));
      } catch (err) {
        const dt = performance.now() - t0;
        setMessages(m => m.filter(x => x.id !== typingId).concat({ id: uid(), role: 'error', content: err.message, timestamp: new Date(), durationMs: dt }));
      } finally {
        setPending(false);
      }
    }

    const hasKey = agent.apiConfig.provider === 'ollama' ? !!agent.apiConfig.ollamaHost : !!agent.apiConfig.apiKey;

    return (

        <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', zIndex: 200 }} />

            <div style={{ width: 40, height: 40, borderRadius: '50%', background: '#1e1e1e', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, overflow: 'hidden' }}><AvatarDisplay value={agent.avatar} size={40} /></div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 700, fontSize: 15 }}>{agent.name}</div>
              <div style={{ fontSize: 12, color: hasKey ? 'var(--success)' : 'var(--danger)', display: 'flex', alignItems: 'center', gap: 4 }}>
                <span style={{ width: 7, height: 7, borderRadius: '50%', background: hasKey ? 'var(--success)' : 'var(--danger)', display: 'inline-block' }} />
                {hasKey ? (agent.apiConfig.provider === 'ollama' ? `🦙 ${agent.apiConfig.ollamaHost}` : 'Connected') : (agent.apiConfig.provider === 'ollama' ? 'No Ollama host set' : 'No API key')}
              </div>

          {showHistory && (() => {
            const sessions = loadHistory();
            return (
              <div style={{ position: 'absolute', top: 73, right: 0, width: 420, bottom: 0, background: 'var(--bg-app)', zIndex: 10, display: 'flex', flexDirection: 'column', borderLeft: '1px solid var(--border)' }}>
                <div style={{ padding: '12px 16px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  {viewingSession
                    ? <><button onClick={() => setViewingSession(null)} style={{ background: 'none', border: 'none', color: 'var(--primary)', cursor: 'pointer', fontSize: 13, padding: 0 }}>← Back</button>
                        <span style={{ fontSize: 12, color: 'var(--text-2)' }}>{viewingSession.startedAt.toLocaleDateString()} {viewingSession.startedAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></>
                    : <><span style={{ fontWeight: 600, fontSize: 14 }}>Previous conversations</span>
                        <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>{sessions.length} saved</span></>
                  }
                </div>
                <div style={{ flex: 1, overflowY: 'auto', padding: viewingSession ? '12px 16px' : 8, display: 'flex', flexDirection: 'column', gap: viewingSession ? 10 : 4 }}>
                  {viewingSession
                    ? viewingSession.messages.map(msg => {
                        if (msg.role === 'tool') return <div key={msg.id}><InvocationChip msg={msg} /></div>;
                        if (msg.role === 'skill') return <div key={msg.id}><SkillBanner msg={msg} /></div>;
                        if (msg.role === 'error') return <div key={msg.id} style={{ fontSize: 12, color: 'var(--danger)', background: 'rgba(239,68,68,0.08)', padding: '6px 10px', borderRadius: 8 }}>⚠ {msg.content}</div>;
                        const isUser = msg.role === 'user';
                        const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
                        return (
                          <div key={msg.id} style={{ display: 'flex', justifyContent: isUser ? 'flex-end' : 'flex-start' }}>
                            <div dir={dir} style={{ maxWidth: '85%', background: isUser ? 'var(--primary)' : 'var(--bg-panel)', color: 'var(--text)', padding: '8px 12px', borderRadius: isUser ? '14px 14px 4px 14px' : '14px 14px 14px 4px', fontSize: 13, lineHeight: 1.5 }}>
                              {msg.content}
                              <div style={{ fontSize: 10, color: isUser ? 'rgba(255,255,255,0.6)' : 'var(--text-muted)', marginTop: 3, textAlign: isUser ? 'right' : 'left' }}>
                                🕐 {new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                              </div>
                            </div>
                          </div>
                        );
                      })
                    : sessions.length === 0
                      ? <div style={{ textAlign: 'center', color: 'var(--text-muted)', fontSize: 13, marginTop: 40 }}>No previous conversations</div>
                      : sessions.map(s => {
                          const firstUser = s.messages.find(m => m.role === 'user');
                          const preview = firstUser?.content?.slice(0, 60) || '—';
                          const d = new Date(s.startedAt);
                          return (
                            <div key={s.id} onClick={() => setViewingSession(s)} style={{ padding: '10px 12px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', cursor: 'pointer', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 10 }}
                              onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                              onMouseLeave={e => e.currentTarget.style.background = 'var(--bg-card)'}>
                              <div style={{ flex: 1, minWidth: 0 }}>
                                <div style={{ fontSize: 11, color: 'var(--text-muted)', marginBottom: 3 }}>{d.toLocaleDateString()} {d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} · {s.messages.filter(m => m.role === 'user').length} messages</div>
                                <div style={{ fontSize: 13, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{preview}</div>
                              </div>
                              <button onClick={e => { e.stopPropagation(); deleteSession(s.id); }} title="Delete" style={{ background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer', fontSize: 14, padding: '2px 4px', borderRadius: 4, flexShrink: 0 }}
                                onMouseEnter={e => e.currentTarget.style.color = 'var(--danger)'}
                                onMouseLeave={e => e.currentTarget.style.color = 'var(--text-muted)'}>🗑</button>
                            </div>
                          );
                        })
                  }
                </div>
              </div>
            );
          })()}

          {/* Messages */}
          <div ref={listRef} style={{ flex: 1, overflowY: 'auto', padding: '16px 20px', display: 'flex', flexDirection: 'column', gap: 12 }}>
            {messages.map(msg => {
              if (msg.role === 'typing') return (
                <div key={msg.id} style={{ display: 'flex', gap: 6 }}>
                  <div style={{ background: 'var(--bg-panel)', padding: '12px 16px', borderRadius: '18px 18px 18px 4px', display: 'flex', gap: 5, alignItems: 'center' }}>
                    <span className="typing-dot" /><span className="typing-dot" /><span className="typing-dot" />
                  </div>
                </div>
              );
              if (msg.role === 'tool') return (
                <div key={msg.id} style={{ display: 'flex', alignItems: 'flex-start' }}>
                  <InvocationChip msg={msg} />
                </div>
              );
              if (msg.role === 'skill') return (
                <div key={msg.id}>
                  <SkillBanner msg={msg} />
                </div>
              );
              if (msg.role === 'user') {
                const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
                return (
                  <div key={msg.id} style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
                    <div style={{ maxWidth: '78%', background: 'var(--primary)', color: '#fff', padding: '10px 14px', borderRadius: '18px 18px 4px 18px', fontSize: 14, lineHeight: 1.5 }} dir={dir}>{msg.content}</div>
                    {msg.dlpMasked && <div style={{ fontSize: 11, color: 'var(--warning)', display: 'flex', alignItems: 'center', gap: 4 }}>🔒 נא לא לחשוף מידע רגיש</div>}
                  </div>
                );
              }
              if (msg.role === 'error') return (
                <div key={msg.id} style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                  <div style={{ maxWidth: '80%', background: 'rgba(239,68,68,0.12)', border: '1px solid rgba(239,68,68,0.3)', color: 'var(--danger)', padding: '10px 14px', borderRadius: '18px 18px 18px 4px', fontSize: 13 }}>⚠ {msg.content}</div>
                  <div style={{ fontSize: 11, color: 'var(--danger)', paddingLeft: 4 }}>⚠ Failed after {fmtDuration(msg.durationMs)} &nbsp;•&nbsp; 🕐 {fmtTime(msg.timestamp)}</div>
                </div>
              );
              // agent
              const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
              return (
                <div key={msg.id} style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                  <div style={{ maxWidth: '80%', background: 'var(--bg-panel)', color: 'var(--text)', padding: '10px 14px', borderRadius: '18px 18px 18px 4px', fontSize: 14, lineHeight: 1.5, whiteSpace: 'pre-wrap' }} dir={dir}>{msg.content}</div>
                  <div style={{ fontSize: 11, color: 'var(--text-muted)', paddingLeft: 4 }}>
                    {msg.isOpening ? `🕐 ${fmtTime(msg.timestamp)}` : `⏱ ${fmtDuration(msg.durationMs)}   •   🕐 ${fmtTime(msg.timestamp)}`}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Input */}
          <div style={{ padding: '12px 16px', borderTop: '1px solid var(--border)', background: 'var(--bg-app)' }}>
            <div style={{ display: 'flex', gap: 8, marginBottom: 6 }}>
              <textarea
                ref={inputRef}
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
                dir="auto"
                rows={1}
                disabled={pending}
                placeholder="Message…"
                style={{ flex: 1, resize: 'none', fontSize: 14 }}
              />
              <button onClick={sendMessage} disabled={pending || !input.trim()} style={{ background: 'var(--primary)', color: '#fff', padding: '0 14px', borderRadius: 'var(--r-md)', fontWeight: 700, fontSize: 18 }}>➤</button>
            </div>
            <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>Use #SkillName to switch skills &nbsp;•&nbsp; @toolName to call tools</div>
          </div>
        </div>
      </>
    );
  }

  /* ─────────────────── AGENT EDITOR ─────────────────── */
  function AgentEditor({ agent, onUpdate, onBack }) {
    const [tab, setTab] = useState('configuration');
    const TABS = ['configuration','skills','tools','knowledge','export'];

    return (
      <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
        {/* Back + title */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
          <button onClick={onBack} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13 }}>← Back</button>
          <AvatarDisplay value={agent.avatar} size={22} />
          <span style={{ fontWeight: 700, fontSize: 18 }}>{agent.name}</span>
        </div>
        {/* Tab bar */}
        <div style={{ display: 'flex', gap: 4, marginBottom: 20, background: 'var(--bg-panel)', padding: 4, borderRadius: 'var(--r-md)', width: 'fit-content', border: '1px solid var(--border)' }}>
          {TABS.map(t => (
            <button key={t} onClick={() => setTab(t)}
              style={{ padding: '6px 16px', borderRadius: 'var(--r-sm)', fontWeight: 600, fontSize: 13, textTransform: 'capitalize', background: tab === t ? 'var(--primary)' : 'transparent', color: tab === t ? '#fff' : 'var(--text-2)' }}>
              {t}
            </button>
          ))}
        </div>
        {/* Content */}
        <div style={{ flex: 1, overflowY: 'auto', paddingRight: 4 }}>
          {tab === 'configuration' && <ConfigurationTab agent={agent} onUpdate={onUpdate} />}
          {tab === 'skills' && <SkillsTab agent={agent} onUpdate={onUpdate} />}
          {tab === 'tools' && <ToolsTab agent={agent} onUpdate={onUpdate} />}
          {tab === 'knowledge' && <KnowledgeTab agent={agent} />}
          {tab === 'export' && <ExportTab agent={agent} />}
        </div>
      </div>
    );
  }

  /* ─────────────────── AGENT CARD ─────────────────── */
  function AgentCard({ agent, onEdit, onTest, onDuplicate, onDelete, onExport, isNew }) {
    const [hovered, setHovered] = useState(false);

    return (
      <div
        className={isNew ? 'card-highlight fade-in' : 'fade-in'}
        onMouseEnter={() => setHovered(true)}
        onMouseLeave={() => setHovered(false)}
        style={{
          background: 'var(--bg-card)',
          borderRadius: 'var(--r-lg)',
          border: `1px solid ${hovered ? 'var(--primary)' : 'var(--border)'}`,
          boxShadow: hovered ? '0 0 16px rgba(239,159,39,0.2), var(--shadow)' : 'var(--shadow)',
          padding: 20,
          display: 'flex',
          flexDirection: 'column',
          gap: 14,
          transition: 'border-color 0.2s, box-shadow 0.2s',
          cursor: 'pointer',
        }}
        onClick={onEdit}
      >
        {/* Avatar + name */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <div style={{ width: 52, height: 52, borderRadius: '50%', background: '#1e1e1e', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, overflow: 'hidden' }}>
            <AvatarDisplay value={agent.avatar} size={52} />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontWeight: 700, fontSize: 15, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{agent.name}</div>
            <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 2 }}>{new Date(agent.createdAt).toLocaleDateString()}</div>
          </div>
        </div>
        {/* Badges */}
        <div style={{ display: 'flex', gap: 6 }}>
          <span style={{ background: 'rgba(239,159,39,0.15)', color: 'var(--primary)', borderRadius: 'var(--r-sm)', padding: '2px 8px', fontSize: 12, fontWeight: 600 }}>🎯 {agent.skills.length} skills</span>
          <span style={{ background: 'rgba(20,184,166,0.15)', color: 'var(--teal)', borderRadius: 'var(--r-sm)', padding: '2px 8px', fontSize: 12, fontWeight: 600 }}>⚙️ {agent.tools.length} tools</span>
        </div>
        {/* Actions */}
        <div style={{ display: 'flex', gap: 4, borderTop: '1px solid var(--border)', paddingTop: 12 }} onClick={e => e.stopPropagation()}>
          {[
            { label: '✏️ Edit', fn: onEdit },
            { label: '💬 Test', fn: onTest },
            { label: '📋 Copy', fn: onDuplicate },
            { label: '📤 Export', fn: onExport },
            { label: '🗑', fn: onDelete, danger: true },
          ].map(({ label, fn, danger }) => (
            <button key={label} onClick={fn}
              style={{ flex: label === '🗑' ? 0 : 1, padding: '6px 4px', borderRadius: 'var(--r-sm)', fontSize: 12, fontWeight: 500, background: 'var(--bg-hover)', color: danger ? 'var(--danger)' : 'var(--text-2)', border: 'none' }}
              onMouseEnter={e => e.currentTarget.style.background = danger ? 'rgba(239,68,68,0.1)' : 'var(--bg-input)'}
              onMouseLeave={e => e.currentTarget.style.background = 'var(--bg-hover)'}
            >{label}</button>
          ))}
        </div>
      </div>
    );
  }

def run(**kwargs):

        >＋ New Agent</button>

  /* ─────────────────── CONVERSATIONS VIEW ─────────────────── */
  function ConversationsView({ agents, onOpenChat }) {
    const PAGE_SIZE = 10;
    const [page, setPage] = React.useState(0);

    const allConversations = React.useMemo(() => {
      const result = [];
      for (const agent of (agents || [])) {
        try {
          const raw = localStorage.getItem(`agentforge_history_${agent.id}`);
          if (!raw) continue;
          const sessions = JSON.parse(raw);
          for (const s of sessions) {
            if (!s.messages || !s.messages.some(m => m.role === 'user')) continue;
            const firstUser = s.messages.find(m => m.role === 'user');
            result.push({
              sessionId: s.id,
              agentId: agent.id,
              agentName: agent.name,
              agentAvatar: agent.avatar,
              startedAt: new Date(s.startedAt),
              preview: firstUser?.content?.slice(0, 80) || '—',
              msgCount: s.messages.filter(m => m.role === 'user').length,
              totalMsgs: s.messages.filter(m => m.role === 'user' || m.role === 'agent').length,
            });
          }
        } catch (_) {}
      }
      return result.sort((a, b) => b.startedAt - a.startedAt);
    }, [agents]);

    const totalPages = Math.ceil(allConversations.length / PAGE_SIZE);
    const pageItems = allConversations.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);

    return (
      <div style={{ maxWidth: 720, margin: '0 auto' }}>
        <div style={{ marginBottom: 28 }}>
          <h2 style={{ fontWeight: 700, fontSize: 22, margin: 0 }}>Conversations</h2>
          <div style={{ color: 'var(--text-muted)', fontSize: 13, marginTop: 4 }}>{allConversations.length} total across all agents</div>
        </div>

        {allConversations.length === 0 ? (
          <div style={{ textAlign: 'center', color: 'var(--text-muted)', paddingTop: 60, fontSize: 14 }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>🕐</div>
            No conversations yet. Start chatting with an agent!
          </div>
        ) : (
          <>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {pageItems.map(conv => (
                <div
                  key={conv.agentId + conv.sessionId}
                  onClick={() => onOpenChat(conv.agentId, conv.sessionId)}
                  style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '14px 18px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', cursor: 'pointer' }}
                  onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                  onMouseLeave={e => e.currentTarget.style.background = 'var(--bg-card)'}
                >
                  <div style={{ width: 42, height: 42, borderRadius: '50%', background: 'var(--bg-panel)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 22, flexShrink: 0 }}>{conv.agentAvatar}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 14, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', marginBottom: 3 }}>{conv.preview}</div>
                    <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>
                      <span style={{ color: 'var(--text-2)', fontWeight: 500 }}>{conv.agentName}</span>
                      &nbsp;·&nbsp;{conv.msgCount} {conv.msgCount === 1 ? 'message' : 'messages'}
                      &nbsp;·&nbsp;{conv.startedAt.toLocaleDateString()} {conv.startedAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                    </div>
                  </div>
                  <div style={{ fontSize: 16, color: 'var(--text-muted)', flexShrink: 0 }}>›</div>
                </div>
              ))}
            </div>

            {totalPages > 1 && (
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, marginTop: 24 }}>
                <button
                  onClick={() => setPage(p => Math.max(0, p - 1))}
                  disabled={page === 0}
                  style={{ padding: '6px 14px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: page === 0 ? 'var(--text-muted)' : 'var(--text)', cursor: page === 0 ? 'default' : 'pointer', fontSize: 13 }}
                >← Prev</button>
                {Array.from({ length: totalPages }, (_, i) => (
                  <button
                    key={i}
                    onClick={() => setPage(i)}
                    style={{ width: 32, height: 32, borderRadius: 'var(--r-md)', background: i === page ? 'var(--primary)' : 'var(--bg-card)', border: `1px solid ${i === page ? 'var(--primary)' : 'var(--border)'}`, color: i === page ? '#fff' : 'var(--text)', cursor: 'pointer', fontSize: 13, fontWeight: i === page ? 700 : 400 }}
                  >{i + 1}</button>
                ))}
                <button
                  onClick={() => setPage(p => Math.min(totalPages - 1, p + 1))}
                  disabled={page === totalPages - 1}
                  style={{ padding: '6px 14px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: page === totalPages - 1 ? 'var(--text-muted)' : 'var(--text)', cursor: page === totalPages - 1 ? 'default' : 'pointer', fontSize: 13 }}
                >Next →</button>
              </div>
            )}
          </>
        )}
      </div>
    );
  }

          </span>
        </div>
      </div>
    );
  }

  /* ─────────────────── LOGIN GATE ─────────────────── */
  function LoginGate({ onLogin }) {
    const [mode, setMode] = useState('login'); // 'login' | 'register'
    const [username, setUsername] = useState('');
    const [password, setPassword] = useState('');
    const [phone, setPhone] = useState('');
    const [error, setError] = useState('');
    const [loading, setLoading] = useState(false);

    function switchMode(m) {
      setMode(m);
      setError('');
      setUsername('');
      setPassword('');
      setPhone('');
    }

    async function handleLogin() {
      if (!username || !password) return;
      setLoading(true);
      setError('');
      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (resp.ok) {
          const data = await resp.json();
          sessionStorage.setItem('agentforge_auth', JSON.stringify(data));
          onLogin(data);
        } else {
          setError('Invalid username or password.');
        }
      } catch {
        setError('Could not connect to server.');
      } finally {
        setLoading(false);
      }
    }

    async function handleRegister() {
      if (!username || !password || !phone) return;
      setLoading(true);
      setError('');
      try {
        const resp = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, phone }),
        });
        if (resp.ok) {
          const data = await resp.json();
          sessionStorage.setItem('agentforge_auth', JSON.stringify(data));
          onLogin(data);
        } else {
          const body = await resp.json().catch(() => ({}));
          setError(body.error || 'Registration failed.');
        }
      } catch {
        setError('Could not connect to server.');
      } finally {
        setLoading(false);
      }
    }

    const isLogin = mode === 'login';
    const canSubmit = isLogin ? (username && password) : (username && password && phone);

    return (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', background: 'var(--bg-app)' }}>
        <div style={{ background: 'var(--bg-card)', borderRadius: 'var(--r-xl)', padding: 40, width: 380, boxShadow: 'var(--shadow)', border: '1px solid var(--border)' }}>
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', marginBottom: 24 }}>

              <ellipse cx="340" cy="108" rx="21" ry="29" fill="#EF9F27"/>
              <ellipse cx="340" cy="72" rx="14" ry="14" fill="#EF9F27"/>
              <circle cx="335" cy="70" r="3.5" fill="#854F0B"/>
              <circle cx="345" cy="70" r="3.5" fill="#854F0B"/>
              <path d="M345,136 C372,138 390,122 390,98 C390,72 374,56 379,38" fill="none" stroke="#EF9F27" strokeWidth="8" strokeLinecap="round"/>
              <polygon points="375,40 382,24 389,40" fill="#D85A30"/>
              <polyline points="319,95 293,80 278,72" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
              <polyline points="319,105 291,102 276,100" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
              <polyline points="319,115 291,119 276,124" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
              <polyline points="319,125 293,136 281,146" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
              <polyline points="361,95 387,80 402,72" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
              <polyline points="361,105 389,102 404,100" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
              <polyline points="361,115 389,119 404,124" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
              <polyline points="361,125 387,136 399,146" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
              <path d="M328,62 L313,48" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round"/>
              <path d="M313,48 L304,40" fill="none" stroke="#EF9F27" strokeWidth="4" strokeLinecap="round"/>
              <path d="M313,48 L309,57" fill="none" stroke="#EF9F27" strokeWidth="4" strokeLinecap="round"/>
              <path d="M352,62 L367,48" fill="none" stroke="#EF9F27" strokeWidth="4.5" strokeLinecap="round"/>
              <path d="M367,48 L376,40" fill="none" stroke="#EF9F27" strokeWidth="4" strokeLinecap="round"/>

                <tspan fill="#f0f0f5">8Legs</tspan><tspan fill="#EF9F27">.ai</tspan>
              </text>
              <text x="340" y="242" textAnchor="middle" fontFamily="'Segoe UI',Arial,sans-serif" fontSize="13" fontWeight="400" fill="#5c6380" letterSpacing="2">YOUR AGENTS. YOUR RULES.</text>
            </svg>
            <div style={{ fontSize: 13, color: 'var(--text-2)', marginTop: 4 }}>{isLogin ? 'Sign in to continue' : 'Create an account'}</div>
          </div>

          {/* Tab toggle */}
          <div style={{ display: 'flex', gap: 0, marginBottom: 20, background: 'var(--bg-panel)', borderRadius: 'var(--r-md)', padding: 4 }}>
            {['login', 'register'].map(m => (
              <button key={m} onClick={() => switchMode(m)}
                style={{ flex: 1, padding: '7px 0', borderRadius: 'var(--r-sm)', fontWeight: 600, fontSize: 13,
                  background: mode === m ? 'var(--primary)' : 'transparent',
                  color: mode === m ? '#fff' : 'var(--text-2)',
                  transition: 'background 0.15s' }}>
                {m === 'login' ? 'Sign in' : 'Register'}
              </button>
            ))}
          </div>

          <input
            type="text"
            value={username}
            onChange={e => setUsername(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && (isLogin ? handleLogin() : handleRegister())}

            autoFocus

            value={password}
            onChange={e => setPassword(e.target.value)}

            placeholder="Password"
            style={{ marginBottom: 10 }}
          />
          {!isLogin && (
            <input
              type="tel"
              value={phone}
              onChange={e => setPhone(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && handleRegister()}
              placeholder="Phone number"
              style={{ marginBottom: 10 }}
            />
          )}
          {error && <div style={{ color: 'var(--danger)', fontSize: 13, marginBottom: 10 }}>⚠ {error}</div>}
          <button onClick={isLogin ? handleLogin : handleRegister} disabled={loading || !canSubmit}
            style={{ width: '100%', background: 'var(--primary)', color: '#fff', padding: '11px 16px', borderRadius: 'var(--r-md)', fontWeight: 700, fontSize: 15, marginTop: 2 }}>
            {loading ? (isLogin ? 'Signing in…' : 'Registering…') : (isLogin ? 'Sign in →' : 'Create account →')}
          </button>
        </div>
      </div>
    );
  }

  /* ─────────────────── ADMIN: CHAT HISTORY ─────────────────── */
  function AdminChatHistoryView({ onBack }) {
    const PAGE_SIZE = 20;
    const [data, setData]           = useState(null);
    const [offset, setOffset]       = useState(0);
    const [openSession, setOpenSession] = useState(null);

    function load(off) {
      setData(null);
      adminListChatSessions({ limit: PAGE_SIZE, offset: off })
        .then(d => { setData(d); setOffset(off); })
        .catch(() => setData({ sessions: [], total: 0 }));
    }

    useEffect(() => { load(0); }, []);

    if (openSession) {
      const msgs = openSession.messages || [];
      return (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
            <button onClick={() => setOpenSession(null)} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13 }}>← Back</button>
            <div>
              <div style={{ fontWeight: 700, fontSize: 20 }}>{openSession.agent_avatar} {openSession.agent_name}</div>
              <div style={{ color: 'var(--text-2)', fontSize: 12, marginTop: 2 }}>
                {new Date(openSession.started_at).toLocaleString()} · {msgs.filter(m => m.role === 'user').length} user messages
              </div>
            </div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, maxWidth: 720 }}>
            {msgs.filter(m => m.role === 'user' || m.role === 'assistant').map((m, i) => (
              <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: m.role === 'user' ? 'flex-end' : 'flex-start' }}>
                <div style={{
                  maxWidth: '80%', padding: '10px 14px', fontSize: 14, lineHeight: 1.5,
                  whiteSpace: 'pre-wrap', wordBreak: 'break-word', borderRadius: m.role === 'user' ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
                  background: m.role === 'user' ? 'var(--primary)' : 'var(--bg-card)',
                  color: m.role === 'user' ? '#fff' : 'var(--text)',
                  border: m.role === 'assistant' ? '1px solid var(--border)' : 'none',
                }}>{m.content}</div>
                <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 3, padding: '0 4px' }}>
                  {m.role === 'user' ? 'User' : openSession.agent_name}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const total = data?.total || 0;
    const totalPages = Math.ceil(total / PAGE_SIZE);
    const currentPage = Math.floor(offset / PAGE_SIZE);

    return (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
          <button onClick={onBack} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13 }}>← Back</button>
          <div>
            <div style={{ fontWeight: 700, fontSize: 22 }}>Chat History</div>
            {data && <div style={{ color: 'var(--text-2)', fontSize: 13, marginTop: 2 }}>{total} conversation{total !== 1 ? 's' : ''} across all agents</div>}
          </div>
        </div>

        {!data ? (
          <div style={{ color: 'var(--text-2)', padding: 40 }}>Loading…</div>
        ) : data.sessions.length === 0 ? (
          <div style={{ textAlign: 'center', color: 'var(--text-muted)', paddingTop: 60, fontSize: 14 }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>💬</div>
            No conversations yet.
          </div>
        ) : (
          <>
            <div style={{ background: 'var(--bg-card)', borderRadius: 'var(--r-lg)', border: '1px solid var(--border)', overflow: 'hidden' }}>
              {data.sessions.map((s, i) => {
                const msgs = s.messages || [];
                const userMsgs = msgs.filter(m => m.role === 'user');
                const preview = userMsgs[0]?.content?.slice(0, 80) || '—';
                return (
                  <div key={s.id}
                    onClick={() => setOpenSession(s)}
                    style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '14px 18px', cursor: 'pointer', borderBottom: i < data.sessions.length - 1 ? '1px solid var(--border)' : 'none' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                  >
                    <div style={{ width: 40, height: 40, borderRadius: '50%', background: 'var(--bg-panel)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20, flexShrink: 0 }}>{s.agent_avatar || '🤖'}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 14, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', marginBottom: 3 }}>{preview}</div>
                      <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>
                        <span style={{ color: 'var(--text-2)', fontWeight: 500 }}>{s.agent_name}</span>
                        &nbsp;·&nbsp;{userMsgs.length} message{userMsgs.length !== 1 ? 's' : ''}
                        &nbsp;·&nbsp;{new Date(s.started_at).toLocaleDateString()} {new Date(s.started_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                      </div>
                    </div>
                    <div style={{ fontSize: 16, color: 'var(--text-muted)', flexShrink: 0 }}>›</div>
                  </div>
                );
              })}
            </div>

            {totalPages > 1 && (
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, marginTop: 20 }}>
                <button onClick={() => load((currentPage - 1) * PAGE_SIZE)} disabled={currentPage === 0}
                  style={{ padding: '6px 14px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: currentPage === 0 ? 'var(--text-muted)' : 'var(--text)', cursor: currentPage === 0 ? 'default' : 'pointer', fontSize: 13 }}>← Prev</button>
                <span style={{ fontSize: 13, color: 'var(--text-2)' }}>{currentPage + 1} / {totalPages}</span>
                <button onClick={() => load((currentPage + 1) * PAGE_SIZE)} disabled={currentPage >= totalPages - 1}
                  style={{ padding: '6px 14px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: currentPage >= totalPages - 1 ? 'var(--text-muted)' : 'var(--text)', cursor: currentPage >= totalPages - 1 ? 'default' : 'pointer', fontSize: 13 }}>Next →</button>
              </div>
            )}
          </>
        )}
      </div>
    );
  }

  /* ─────────────────── ADMIN: USERS LIST ─────────────────── */

  /* ─────────────────── ADMIN: USER AGENTS ─────────────────── */
  function UserAgentsView({ targetUser, myAgents, onBack }) {
    const [agents, setAgents] = useState(null);
    const [duplicating, setDuplicating] = useState(false);
    const [showDupPicker, setShowDupPicker] = useState(false);
    const [editingAgent, setEditingAgent] = useState(null);

    useEffect(() => {
      reload();
    }, [targetUser.id]);

    function reload() {
      adminListUserAgents(targetUser.id).then(setAgents).catch(() => setAgents([]));
    }

    const saveAdminAgent = useCallback(async (agent) => {
      await adminUpdateAgent(agent).catch(() => {});
    }, []);
    const saveAdminAgentDebounced = useDebounce(saveAdminAgent, 600);

    function handleAdminUpdate(agent) {
      setEditingAgent(agent);
      saveAdminAgentDebounced(agent);
    }

    async function handleDelete(agentId) {
      if (!confirm('Delete this agent?')) return;
      await adminDeleteAgent(agentId).catch(() => {});
      reload();
    }

    async function handleDuplicateTo(sourceAgentId) {
      setDuplicating(true);
      setShowDupPicker(false);
      try {
        await adminDuplicateTo(sourceAgentId, targetUser.id);
        reload();
      } catch {
        alert('Failed to duplicate agent.');
      } finally {
        setDuplicating(false);
      }
    }

    if (editingAgent) {
      return (
        <AgentEditor
          agent={editingAgent}
          onUpdate={handleAdminUpdate}
          onBack={() => { setEditingAgent(null); reload(); }}
        />
      );
    }

    return (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
          <button onClick={onBack} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13 }}>← Back</button>
          <div>
            <div style={{ fontWeight: 700, fontSize: 22 }}>Agents of {targetUser.username}</div>
            {agents && <div style={{ color: 'var(--text-2)', fontSize: 13 }}>{agents.length} agent{agents.length !== 1 ? 's' : ''}</div>}
          </div>
          <div style={{ marginLeft: 'auto', position: 'relative' }}>
            <button onClick={() => setShowDupPicker(v => !v)} disabled={duplicating}
              style={{ background: 'var(--primary)', color: '#fff', padding: '8px 16px', borderRadius: 'var(--r-md)', fontWeight: 600, fontSize: 13 }}>
              {duplicating ? 'Duplicating…' : '＋ Duplicate My Agent Here'}
            </button>
            {showDupPicker && (
              <div style={{ position: 'absolute', right: 0, top: '110%', background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 'var(--r-lg)', padding: 8, minWidth: 220, zIndex: 100, boxShadow: 'var(--shadow)' }}>
                <div style={{ fontSize: 12, color: 'var(--text-2)', padding: '4px 8px 8px' }}>Pick one of your agents to copy:</div>
                {myAgents.length === 0 && <div style={{ fontSize: 13, color: 'var(--text-muted)', padding: '8px' }}>No agents to copy</div>}
                {myAgents.map(a => (
                  <button key={a.id} onClick={() => handleDuplicateTo(a.id)}
                    style={{ display: 'block', width: '100%', textAlign: 'left', padding: '8px 12px', borderRadius: 'var(--r-md)', fontSize: 13, background: 'transparent', color: 'var(--text)' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                  >
                    {a.avatar || '🤖'} {a.name}
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>

        {!agents ? (
          <div style={{ color: 'var(--text-2)' }}>Loading…</div>
        ) : agents.length === 0 ? (
          <EmptyState icon="🤖" title="No agents" subtitle="This user has no agents yet" />
        ) : (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(260px,1fr))', gap: 16 }}>
            {agents.map(a => (
              <div key={a.id} style={{ background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 'var(--r-lg)', padding: 20 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
                  <AvatarDisplay value={a.avatar || '🤖'} size={28} />
                  <div style={{ fontWeight: 600, flex: 1 }}>{a.name}</div>
                </div>
                <div style={{ color: 'var(--text-2)', fontSize: 12, marginBottom: 14, lineHeight: 1.4, minHeight: 32 }}>
                  {a.basePrompt ? a.basePrompt.slice(0, 80) + (a.basePrompt.length > 80 ? '…' : '') : <i>No description</i>}
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button onClick={() => setEditingAgent(a)}
                    style={{ flex: 1, fontSize: 12, padding: '6px', borderRadius: 'var(--r-sm)', background: 'var(--bg-hover)', color: 'var(--text-2)', border: '1px solid var(--border)' }}>
                    ✏️ Edit
                  </button>
                  <button onClick={() => handleDelete(a.id)}
                    style={{ flex: 1, fontSize: 12, padding: '6px', borderRadius: 'var(--r-sm)', background: 'transparent', color: 'var(--danger)', border: '1px solid var(--danger)' }}>
                    🗑️ Delete
                  </button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  /* ─────────────────── APP ─────────────────── */
  function App({ user, onLogout }) {
    const [state, dispatch] = useReducer(reducer, {
      agents: [],
      view: 'list',
      editingId: null,
      chatAgentId: null,
      chatInitialSessionId: null,
    });
    const [nav, setNav] = useState('home');
    const [loading, setLoading] = useState(true);
    const [adminSelectedUser, setAdminSelectedUser] = useState(null);

    // Load agents on mount
    useEffect(() => {
      apiList().then(agents => {
        dispatch({ type: 'HYDRATE', agents });
        setLoading(false);
      }).catch(() => {
        setLoading(false);
      });
    }, []);

    // Debounced save
    const saveAgent = useCallback(async (agent) => {
      dispatch({ type: 'UPDATE_AGENT', agent });
      await apiUpdate(agent).catch(() => {});
    }, []);
    const saveAgentDebounced = useDebounce(saveAgent, 600);

    function handleUpdate(agent) {
      dispatch({ type: 'UPDATE_AGENT', agent });
      saveAgentDebounced(agent);
    }

    async function handleCreate() {
      const agent = makeAgent();
      dispatch({ type: 'UPDATE_AGENT', agent });
      dispatch({ type: 'SET_VIEW', view: 'editor', editingId: agent.id });
      await apiCreate(agent).catch(() => {});
      dispatch({ type: 'HYDRATE', agents: [] });
      apiList().then(agents => dispatch({ type: 'HYDRATE', agents })).catch(() => {});
    }

    async function handleDelete(id) {
      dispatch({ type: 'DELETE_AGENT', id });
      await apiDelete(id).catch(() => {});
    }

    async function handleDuplicate(id) {
      const src = state.agents.find(a => a.id === id);
      if (!src) return;
      const copy = { ...JSON.parse(JSON.stringify(src)), id: uid(), name: src.name + ' (Copy)', _isNew: true, createdAt: new Date().toISOString() };
      dispatch({ type: 'UPDATE_AGENT', agent: copy });
      dispatch({ type: 'HYDRATE', agents: [copy, ...state.agents] });
      await apiCreate(copy).catch(() => {});
    }

    const editingAgent = state.agents.find(a => a.id === state.editingId);
    const chatAgent = state.agents.find(a => a.id === state.chatAgentId);

    if (loading) return (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', background: 'var(--bg-app)', flexDirection: 'column', gap: 16 }}>
        <div style={{ width: 40, height: 40, border: '3px solid var(--border)', borderTop: '3px solid var(--primary)', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />
        <div style={{ color: 'var(--text-2)', fontSize: 14 }}>Loading agents…</div>
      </div>
    );

    function handleNav(id) {
      setNav(id);
      if (id === 'home') { dispatch({ type: 'SET_VIEW', view: 'list' }); setAdminSelectedUser(null); }
      if (id === 'admin') setAdminSelectedUser(null);
      if (id === 'conversations') dispatch({ type: 'SET_VIEW', view: 'list' });
    }

    return (
      <React.Fragment>
      <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
        <Sidebar activeNav={nav} onNav={handleNav} user={user} onLogout={onLogout} />
        <div style={{ flex: 1, overflowY: 'auto', padding: '32px 32px 80px', background: 'var(--bg-app)' }}>
          {nav === 'conversations' ? (
            <ConversationsView agents={state.agents} onOpenChat={(id, sessionId) => dispatch({ type: 'OPEN_CHAT', id, sessionId })} />
          ) : nav === 'docs' ? (
            <DocsView />
          ) : nav === 'admin' ? (
            adminSelectedUser ? (
              <UserAgentsView
                targetUser={adminSelectedUser}
                myAgents={state.agents}
                onBack={() => setAdminSelectedUser(null)}
              />
            ) : (
              <AdminView
                onSelectUser={setAdminSelectedUser}
                myAgents={state.agents}
              />
            )
          ) : nav === 'settings' ? (
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', paddingTop: 60, gap: 12 }}>
              <div style={{ fontSize: 48 }}>⚙️</div>
              <div style={{ fontWeight: 700, fontSize: 20 }}>Settings</div>
              <div style={{ color: 'var(--text-2)', fontSize: 14 }}>Coming soon</div>
            </div>
          ) : state.view === 'editor' && editingAgent ? (
            <AgentEditor
              agent={editingAgent}
              onUpdate={handleUpdate}
              onBack={() => dispatch({ type: 'SET_VIEW', view: 'list' })}
            />
          ) : (
            <AgentListView
              agents={state.agents}
              onNew={handleCreate}
              onEdit={id => dispatch({ type: 'SET_VIEW', view: 'editor', editingId: id })}
              onTest={id => dispatch({ type: 'OPEN_CHAT', id })}
              onDuplicate={handleDuplicate}
              onDelete={handleDelete}
              onExport={id => dispatch({ type: 'SET_VIEW', view: 'editor', editingId: id })}
            />
          )}
        </div>

        {chatAgent && <ChatTestDrawer agent={chatAgent} initialSessionId={state.chatInitialSessionId} onClose={() => dispatch({ type: 'CLOSE_CHAT' })} />}
      </div>
      <div style={{ position: 'fixed', bottom: 10, left: '50%', transform: 'translateX(-50%)', fontSize: 11, color: '#2a2a2a', letterSpacing: '2px', fontWeight: 500, pointerEvents: 'none', userSelect: 'none', zIndex: 1 }}>
        YOUR AGENTS. YOUR RULES.
      </div>
      </React.Fragment>
    );
  }

  /* ─────────────────── ROOT ─────────────────── */
  function Root() {
    const [user, setUser] = useState(() => getAuth());

    function handleLogin(data) { setUser(data); }
    function handleLogout() {
      sessionStorage.removeItem('agentforge_auth');
      setUser(null);
    }

    if (!user) return <LoginGate onLogin={handleLogin} />;
    return <App user={user} onLogout={handleLogout} />;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
