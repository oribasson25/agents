  /* ─────────────────── MINI CHAT WIDGET ─────────────────── */
  function MiniChatWidget({ agent, accent, titleColor, radius, height, placeholder, title }) {
    const [messages, setMessages] = useState(() => {
      const ts = new Date();
      return [{ id: uid(), role: 'agent', content: agent.openingMessage || 'Hello!', timestamp: ts, isOpening: true }];
    });
    const [input, setInput] = useState('');
    const [pending, setPending] = useState(false);
    const listRef = useRef(null);

    useEffect(() => {
      if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
    }, [messages]);

    async function sendMessage() {
      const text = input.trim();
      if (!text || pending) return;
      setInput('');
      const t0 = performance.now();
      const typingId = uid();
      const maskedText = applyDlp(text, agent.dlp || {});
      const dlpMasked = maskedText !== text;
      setMessages(m => [...m, { id: uid(), role: 'user', content: maskedText, timestamp: new Date(), dlpMasked }, { id: typingId, role: 'typing' }]);
      setPending(true);

      const history = messages.filter(m => m.role === 'user' || m.role === 'agent').map(m => ({
        role: m.role === 'agent' ? 'assistant' : 'user', content: m.content,
      }));
      history.push({ role: 'user', content: maskedText });

      try {
        const content = await callWithTools(agent, history, async (toolName, toolInput) => {
          const msgId = uid();
          setMessages(m => m.filter(x => x.id !== typingId).concat(
            { id: msgId, role: 'tool', name: toolName, input: toolInput, timestamp: new Date() },
            { id: typingId, role: 'typing' }
          ));
          return (result) => setMessages(m => m.map(x => x.id === msgId ? { ...x, result } : x));
        });
        const dt = performance.now() - t0;
        setMessages(m => m.filter(x => x.id !== typingId).concat({ id: uid(), role: 'agent', content, timestamp: new Date(), durationMs: dt }));
      } catch (err) {
        const dt = performance.now() - t0;
        setMessages(m => m.filter(x => x.id !== typingId).concat({ id: uid(), role: 'error', content: err.message, timestamp: new Date(), durationMs: dt }));
      } finally {
        setPending(false);
      }
    }

    const noKey = agent.apiConfig.provider === 'ollama' ? !agent.apiConfig.ollamaHost : !agent.apiConfig.apiKey;

    return (
      <div style={{ display: 'flex', flexDirection: 'column', height, borderRadius: radius, overflow: 'hidden', border: `1px solid ${accent}44`, boxShadow: `0 4px 24px rgba(0,0,0,0.4)` }}>
        {/* Header */}
        <div style={{ background: accent, padding: '12px 16px', display: 'flex', alignItems: 'center', gap: 10 }}>
          <AvatarDisplay value={agent.avatar} size={22} />
          <span style={{ fontWeight: 700, color: titleColor || '#fff', fontSize: 15 }}>{title || agent.name}</span>
        </div>
        {noKey && (
          <div style={{ background: 'rgba(245,158,11,0.15)', borderBottom: '1px solid rgba(245,158,11,0.3)', padding: '8px 16px', fontSize: 12, color: 'var(--warning)', textAlign: 'center' }}>
            {agent.apiConfig.provider === 'ollama' ? 'Add Ollama Server IP in Configuration to test live' : 'Add an API key in Configuration to test live'}
          </div>
        )}
        {/* Messages */}
        <div ref={listRef} style={{ flex: 1, overflowY: 'auto', padding: '12px 16px', display: 'flex', flexDirection: 'column', gap: 10, background: 'var(--bg-app)' }}>
          {messages.map(msg => <ChatBubble key={msg.id} msg={msg} accent={accent} />)}
        </div>
        {/* Input */}
        <div style={{ padding: '10px 12px', background: 'var(--bg-panel)', borderTop: '1px solid var(--border)' }}>
          <div style={{ display: 'flex', gap: 8 }}>
            <textarea
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
              dir="auto"
              rows={1}
              disabled={pending || noKey}
              placeholder={placeholder || 'Type a message…'}
              style={{ flex: 1, resize: 'none', fontSize: 13, padding: '8px 12px', borderRadius: 'var(--r-md)' }}
            />
            <button onClick={sendMessage} disabled={pending || noKey || !input.trim()} style={{ background: accent, color: '#fff', padding: '0 14px', borderRadius: 'var(--r-md)', fontWeight: 700, fontSize: 18 }}>➤</button>
          </div>
        </div>
      </div>
    );
  }

  // Parse legacy tool messages stored as "@name({...})" strings
  function parseLegacyTool(msg) {
    if (msg.name) return { name: msg.name, input: msg.input };
    const m = (msg.content || '').match(/^@(\w+)\(([\s\S]*)\)$/);
    if (m) { try { return { name: m[1], input: JSON.parse(m[2]) }; } catch (_) {} }
    return { name: msg.content || '?', input: null };
  }

  function SkillBanner({ msg }) {
    return (
      <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
        <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>⚡</span>
        <span style={{ fontSize: 12, fontFamily: 'monospace', color: 'var(--text-muted)' }}>{msg.name || ''}</span>
      </div>
    );
  }

  function InvocationChip({ msg }) {
    const [open, setOpen] = React.useState(false);
    const isSkill = msg.role === 'skill';
    const name = isSkill ? (msg.name || (msg.content || '').replace('Switched to skill: ', '')) : parseLegacyTool(msg).name;
    const input = isSkill ? null : parseLegacyTool(msg).input;
    const hasParams = !isSkill && input && Object.keys(input).length > 0;
    const result = msg.result;
    const skillContent = isSkill ? [msg.description, msg.prompt].filter(Boolean).join('\n\n') : null;
    const hasToggle = hasParams || result !== undefined || !!skillContent;
    return (
      <div style={{ display: 'inline-flex', flexDirection: 'column', maxWidth: '100%', gap: 2 }}>
        <div
          onClick={hasToggle ? () => setOpen(o => !o) : undefined}
          style={{ display: 'inline-flex', alignItems: 'center', gap: 5, cursor: hasToggle ? 'pointer' : 'default', userSelect: 'none' }}>
          <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>{isSkill ? '⚡' : '⚙'}</span>
          <span style={{ fontSize: 12, fontFamily: 'monospace', color: isSkill ? 'var(--teal)' : 'var(--text-2)' }}>{name}</span>
          {hasToggle && <span style={{ fontSize: 10, color: 'var(--text-muted)' }}>{open ? '▾' : '▸'}</span>}
        </div>
        {open && hasToggle && (
          <pre style={{ margin: '2px 0 0 16px', padding: '6px 10px', background: 'var(--bg-panel)', border: '1px solid var(--border)', borderRadius: 6, fontSize: 11, color: 'var(--text-2)', overflow: 'auto', maxWidth: 320, maxHeight: 180 }}>
            {isSkill ? skillContent : (
              <>
                {hasParams && JSON.stringify(input, null, 2)}
                {hasParams && result !== undefined && '\n\n→ '}
                {result !== undefined && (typeof result === 'object' ? JSON.stringify(result, null, 2) : result)}
              </>
            )}
          </pre>
        )}
      </div>
    );
  }

  function ChatBubble({ msg, accent }) {
    if (msg.role === 'tool') return (
      <div style={{ display: 'flex', alignItems: 'flex-start' }}>
        <InvocationChip msg={msg} />
      </div>
    );
    if (msg.role === 'typing') {
      return (
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          <div style={{ background: 'var(--bg-panel)', padding: '12px 16px', borderRadius: '18px 18px 18px 4px', display: 'flex', gap: 5, alignItems: 'center' }}>
            <span className="typing-dot" />
            <span className="typing-dot" />
            <span className="typing-dot" />
          </div>
        </div>
      );
    }
    if (msg.role === 'user') {
      const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
      return (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
          <div style={{ maxWidth: '75%', background: accent || 'var(--primary)', color: '#fff', padding: '10px 14px', borderRadius: '18px 18px 4px 18px', fontSize: 14, lineHeight: 1.5 }} dir={dir}>{msg.content}</div>
          {msg.dlpMasked && <div style={{ fontSize: 11, color: 'var(--warning)', display: 'flex', alignItems: 'center', gap: 4 }}>🔒 נא לא לחשוף מידע רגיש</div>}
        </div>
      );
    }
    if (msg.role === 'error') {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 3, alignItems: 'flex-start' }}>
          <div style={{ maxWidth: '80%', background: 'rgba(239,68,68,0.15)', border: '1px solid rgba(239,68,68,0.3)', color: 'var(--danger)', padding: '10px 14px', borderRadius: '18px 18px 18px 4px', fontSize: 13 }}>⚠ {msg.content}</div>
          <div style={{ fontSize: 11, color: 'var(--danger)', paddingLeft: 4 }}>⚠ Failed after {fmtDuration(msg.durationMs)} &nbsp;•&nbsp; 🕐 {fmtTime(msg.timestamp)}</div>
        </div>
      );
    }
    // agent
    const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
    return (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 3, alignItems: 'flex-start' }}>
        <div style={{ maxWidth: '80%', background: 'var(--bg-panel)', color: 'var(--text)', padding: '10px 14px', borderRadius: '18px 18px 18px 4px', fontSize: 14, lineHeight: 1.5, whiteSpace: 'pre-wrap' }} dir={dir}>{msg.content}</div>
        <div style={{ fontSize: 11, color: 'var(--text-muted)', paddingLeft: 4 }}>
          {msg.isOpening ? `🕐 ${fmtTime(msg.timestamp)}` : `⏱ ${fmtDuration(msg.durationMs)}   •   🕐 ${fmtTime(msg.timestamp)}`}
        </div>
      </div>
    );
  }

  function buildSystemPrompt(agent, ragChunks = [], webChunks = []) {
    let system = agent.basePrompt || '';
    if (ragChunks && ragChunks.length > 0) {
      system += '\n\n## Relevant Context\n' + ragChunks.map(c => `--- ${c.title}\n${c.content}`).join('\n\n');
    }
    if (webChunks && webChunks.length > 0) {
      system += '\n\n## Fetched Web Pages\nThe following web pages were automatically fetched and are available for you to use. Answer questions about these URLs using the content below — do NOT say you cannot access the internet.\n\n' + webChunks.map(c => `--- ${c.title}\n${c.content}`).join('\n\n');
    }
    if (agent.skills && agent.skills.length > 0) {
      system += '\n\n' + agent.skills.map(s => `## Skill: ${s.name}\n${s.description ? s.description + '\n' : ''}${s.prompt}`).join('\n\n');
    }
    const dlp = agent.dlp || {};
    if (dlp.creditCard || dlp.israeliId) {
      system += '\n\n[SECURITY NOTICE] Never process, repeat, or store personal identifiable information (PII). If the user provides sensitive data such as credit card numbers or ID numbers, refuse to repeat it and treat it as [MASKED].';
    }
    return system.trim();
  }

  /* ─────────────────── DLP ─────────────────── */
  function applyDlp(text, dlp) {
    if (!dlp || typeof text !== 'string') return text;
    let out = text;
    if (dlp.creditCard) {
      // with dashes/spaces or without, 16 digits
      out = out.replace(/\b\d{4}[-\s]?\d{4}[-\s]?\d{4}[-\s]?\d{4}\b/g, '[MASKED]');
    }
    if (dlp.israeliId) {
      // exactly 9 digits, not part of a longer number
      out = out.replace(/\b\d{9}\b/g, '[MASKED]');
    }
    return out;
  }

  function dlpMessages(messages, dlp) {
    if (!dlp) return messages;
    return messages.map(m => {
      if (m.role !== 'user' || typeof m.content !== 'string') return m;
      return { ...m, content: applyDlp(m.content, dlp) };
    });
  }

  /* ─────────────────── TOOL CALLING ENGINE ─────────────────── */
  // onToolCall(name, inputs) — called before executing, so the UI can show a bubble
  async function callWithTools(agent, history, onToolCall, activeSkillId = null) {
    const { apiKey, provider, model } = agent.apiConfig;

    // RAG retrieval — inject relevant knowledge into system prompt
    let ragChunks = [];
    const lastUserMsg = (history.filter(m => m.role === 'user').at(-1) || {}).content || '';
    try {
      if (lastUserMsg.trim()) {
        const ragResp = await apiFetch(`/api/agents/${agent.id}/retrieve`, {
          method: 'POST',
          body: JSON.stringify({ query: lastUserMsg, skill_id: activeSkillId }),
        });
        if (ragResp.ok) {
          const ragData = await ragResp.json();
          ragChunks = ragData.chunks || [];
        }
      }
    } catch (_) {}

    // Auto-scrape any URLs mentioned in the user's message (browser-rendered)
    let webChunks = [];
    try {
      const urlRegex = /https?:\/\/[^\s"'<>)]+/g;
      const urls = [...new Set((lastUserMsg.match(urlRegex) || []).slice(0, 3))];
      if (urls.length > 0) {
        const results = await Promise.allSettled(
          urls.map(url =>
            fetch('/api/scrape-browser', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url }),
            }).then(r => r.json())
          )
        );
        webChunks = results
          .filter(r => r.status === 'fulfilled' && !r.value.error)
          .map(r => ({ title: r.value.title || r.value.url, content: r.value.text }));
      }
    } catch (_) {}

    const systemPrompt = buildSystemPrompt(agent, ragChunks, webChunks);
    const toolDefs = (agent.tools || []);
    const dlp = agent.dlp || {};

    const skillNames = (agent.skills || []).map(s => s.name);

    function buildClaudeTools() {
      const tools = toolDefs.map(t => {
        const hasPredefinedUrl = t.name === 'scrape_website' && (agent.scrapeUrls || (agent.scrapeUrl ? [agent.scrapeUrl] : [])).some(u => u.trim());
        const params = hasPredefinedUrl ? (t.parameters || []).filter(p => p.name !== 'url') : (t.parameters || []);
        return {
          name: t.name,
          description: t.description + (hasPredefinedUrl ? ' (URL is preconfigured; call with no arguments.)' : ''),
          input_schema: {
            type: 'object',
            properties: Object.fromEntries(params.map(p => [p.name, { type: p.type || 'string', description: p.description || '' }])),
            required: params.map(p => p.name),
          },
        };
      });
      if (skillNames.length > 0 && !activeSkillId) tools.push({
        name: 'switch_skill',
        description: 'Switch to a skill ONLY when the user explicitly asks about that skill\'s specific domain. Do NOT call for greetings, small talk, or ambiguous messages. Call at most once.',
        input_schema: { type: 'object', properties: { skill_name: { type: 'string', description: 'Skill to activate', enum: skillNames } }, required: ['skill_name'] },
      });
      if (agent.emailEnabled) tools.push({
        name: 'send_email',
        description: 'Send an email via the connected Gmail account. Use when explicitly instructed to send an email.',
        input_schema: {
          type: 'object',
          properties: {
            to:      { type: 'string', description: 'Recipient email address' },
            subject: { type: 'string', description: 'Email subject line' },
            body:    { type: 'string', description: 'Email body text' },
          },
          required: ['to', 'subject', 'body'],
        },
      });
      return tools;
    }

    function buildOpenAITools() {
      const tools = toolDefs.map(t => {
        const hasPredefinedUrl = t.name === 'scrape_website' && (agent.scrapeUrls || (agent.scrapeUrl ? [agent.scrapeUrl] : [])).some(u => u.trim());
        const params = hasPredefinedUrl ? (t.parameters || []).filter(p => p.name !== 'url') : (t.parameters || []);
        return {
          type: 'function',
          function: {
            name: t.name,
            description: t.description + (hasPredefinedUrl ? ' (URL is preconfigured; call with no arguments.)' : ''),
            parameters: {
              type: 'object',
              properties: Object.fromEntries(params.map(p => [p.name, { type: p.type || 'string', description: p.description || '' }])),
              required: params.map(p => p.name),
            },
          },
        };
      });
      if (skillNames.length > 0 && !activeSkillId) tools.push({
        type: 'function',
        function: {
          name: 'switch_skill',
          description: 'Switch to a skill ONLY when the user explicitly asks about that skill\'s specific domain. Do NOT call for greetings, small talk, or ambiguous messages. Call at most once.',
          parameters: { type: 'object', properties: { skill_name: { type: 'string', description: 'Skill to activate', enum: skillNames } }, required: ['skill_name'] },
        },
      });
      if (agent.emailEnabled) tools.push({
        type: 'function',
        function: {
          name: 'send_email',
          description: 'Send an email via the connected Gmail account. Use when explicitly instructed to send an email.',
          parameters: {
            type: 'object',
            properties: {
              to:      { type: 'string', description: 'Recipient email address' },
              subject: { type: 'string', description: 'Email subject line' },
              body:    { type: 'string', description: 'Email body text' },
            },
            required: ['to', 'subject', 'body'],
          },
        },
      });
      return tools;
    }

    async function executeTool(toolName, inputs) {
      if (toolName === 'switch_skill') return 'OK';
      if (toolName === 'send_email') {
        const r = await apiFetch('/api/gmail/send', { method: 'POST', body: JSON.stringify({ ...inputs, agentId: agent.id }) });
        const d = await r.json();
        return r.ok ? `Email sent to ${inputs.to}` : `Error: ${d.error}`;
      }
      const tool = (agent.tools || []).find(t => t.name === toolName);
      const predefinedUrls = (agent.scrapeUrls || (agent.scrapeUrl ? [agent.scrapeUrl] : [])).map(u => u.trim()).filter(Boolean);
      if (toolName === 'scrape_website' && predefinedUrls.length > 0) {
        if (predefinedUrls.length === 1) {
          inputs = { ...inputs, url: predefinedUrls[0] };
        } else {
          const results = await Promise.allSettled(
            predefinedUrls.map(url =>
              fetch('/api/scrape-browser', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) }).then(r => r.json())
            )
          );
          const combined = results.map((r, i) => {
            const d = r.status === 'fulfilled' ? r.value : { error: r.reason?.message };
            return `=== ${predefinedUrls[i]} ===\n${d.error ? 'Error: ' + d.error : (d.title ? 'Title: ' + d.title + '\n' : '') + (d.text || '')}`;
          }).join('\n\n');
          return combined;
        }
      }
      const packages = (tool?.packages || '').split(',').map(s => s.trim()).filter(Boolean);
      const envVars = Object.fromEntries((tool?.envVars || []).filter(e => e.key).map(e => [e.key, e.value]));
      const resp = await fetch('/api/run-tool', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: tool?.code || '', inputs, packages, env_vars: envVars }),
      });
      const data = await resp.json();
      return String(data.result ?? data.error ?? 'No output');
    }

    if (provider === 'claude') {
      const claudeHeaders = { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
      let msgs = dlpMessages([...history], dlp);

      for (let round = 0; round < 10; round++) {
        const body = { model, max_tokens: 1024, system: systemPrompt, messages: msgs };
        if (toolDefs.length > 0) body.tools = buildClaudeTools();

        const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: claudeHeaders, body: JSON.stringify(body) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error?.message || JSON.stringify(d));

        if (d.stop_reason !== 'tool_use') return d.content.find(c => c.type === 'text')?.text || '';

        // Execute all tool_use blocks (may be multiple)
        const toolUses = d.content.filter(c => c.type === 'tool_use');
        const toolResults = await Promise.all(toolUses.map(async tu => {
          const onResult = await onToolCall(tu.name, tu.input);
          const result = await executeTool(tu.name, tu.input);
          if (onResult) onResult(result);
          return { type: 'tool_result', tool_use_id: tu.id, content: result };
        }));

        msgs = [...msgs, { role: 'assistant', content: d.content }, { role: 'user', content: toolResults }];
      }
      throw new Error('Too many tool call rounds (max 10)');

    } else if (provider === 'ollama') {
      const ollamaHost = (agent.apiConfig.ollamaHost || 'http://localhost:11434').replace(/\/$/, '');
      let msgs = [{ role: 'system', content: systemPrompt }, ...dlpMessages(history, dlp)];

      for (let round = 0; round < 10; round++) {
        const body = { model, messages: msgs };
        if (toolDefs.length > 0) body.tools = buildOpenAITools();

        // Route through server-side proxy to avoid mixed-content and CORS issues
        const r = await fetch('/api/ollama-proxy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ host: ollamaHost, path: '/v1/chat/completions', body }),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error?.message || JSON.stringify(d));

        const choice = d.choices[0];
        if (choice.finish_reason !== 'tool_calls') return choice.message.content;

        const toolResultMsgs = await Promise.all((choice.message.tool_calls || []).map(async tc => {
          const inputs = JSON.parse(tc.function.arguments);
          const onResult = await onToolCall(tc.function.name, inputs);
          const result = await executeTool(tc.function.name, inputs);
          if (onResult) onResult(result);
          return { role: 'tool', tool_call_id: tc.id, content: result };
        }));

        msgs = [...msgs, choice.message, ...toolResultMsgs];
      }
      throw new Error('Too many tool call rounds (max 10)');

    } else {
      // OpenAI
      const oaiHeaders = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
      let msgs = [{ role: 'system', content: systemPrompt }, ...dlpMessages(history, dlp)];

      for (let round = 0; round < 10; round++) {
        const body = { model, messages: msgs };
        if (toolDefs.length > 0) body.tools = buildOpenAITools();

        const r = await fetch('https://api.openai.com/v1/chat/completions', { method: 'POST', headers: oaiHeaders, body: JSON.stringify(body) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error?.message || JSON.stringify(d));

        const choice = d.choices[0];
        if (choice.finish_reason !== 'tool_calls') return choice.message.content;

        // Execute all tool_calls (may be multiple)
        const toolResultMsgs = await Promise.all((choice.message.tool_calls || []).map(async tc => {
          const inputs = JSON.parse(tc.function.arguments);
          const onResult = await onToolCall(tc.function.name, inputs);
          const result = await executeTool(tc.function.name, inputs);
          if (onResult) onResult(result);
          return { role: 'tool', tool_call_id: tc.id, content: result };
        }));

        msgs = [...msgs, choice.message, ...toolResultMsgs];
      }
      throw new Error('Too many tool call rounds (max 10)');
    }
  }

  /* ─────────────────── KNOWLEDGE TAB ─────────────────── */
  function KnowledgeTab({ agent }) {
    const [docs, setDocs] = useState([]);
    const [loading, setLoading] = useState(true);
    const [selectedSkillId, setSelectedSkillId] = useState('__global__');
    const [addOpen, setAddOpen] = useState(false);
    const [newDoc, setNewDoc] = useState({ title: '', content: '' });
    const [saving, setSaving] = useState(false);
    const [uploading, setUploading] = useState(false);
    const [uploadError, setUploadError] = useState('');
    const [uploadProgress, setUploadProgress] = useState('');
    const [editingDocId, setEditingDocId] = useState(null);
    const [editDoc, setEditDoc] = useState({ title: '', content: '' });
    const fileInputRef = useRef(null);

    // Web Crawler state
    const [crawlConfig, setCrawlConfig] = useState(agent.crawlConfig || { urls: [], status: 'idle' });
    const [crawlUrlInput, setCrawlUrlInput] = useState('');
    const [crawlUrlError, setCrawlUrlError] = useState('');
    const crawlPollRef = useRef(null);

    useEffect(() => {
      // Poll for crawl status while running
      if (crawlConfig.status === 'running') {
        crawlPollRef.current = setInterval(async () => {
          try {
            const r = await apiFetch(`/api/agents/${agent.id}/crawl`);
            if (r.ok) {
              const cfg = await r.json();
              setCrawlConfig(cfg);
              if (cfg.status !== 'running') {
                clearInterval(crawlPollRef.current);
                // Reload docs list to show newly crawled pages
                apiFetch(`/api/agents/${agent.id}/documents`)
                  .then(r => r.json()).then(rows => setDocs(rows)).catch(() => {});
              }
            }
          } catch {}
        }, 2000);
      }
      return () => clearInterval(crawlPollRef.current);
    }, [crawlConfig.status]);

    async function addCrawlUrl() {
      const url = crawlUrlInput.trim();
      if (!url) return;
      try { new URL(url); } catch {
        setCrawlUrlError('כתובת URL לא תקינה');
        return;
      }
      setCrawlUrlError('');
      setCrawlUrlInput('');
      await startCrawl(url);
    }

    async function startCrawl(url) {
      setCrawlConfig(c => ({ ...c, status: 'running' }));
      try {
        const r = await apiFetch(`/api/agents/${agent.id}/crawl`, {
          method: 'POST',
          body: JSON.stringify({ url, maxPages: crawlConfig.maxPages || 100 }),
        });
        const data = await r.json();
        if (r.ok) {
          setCrawlConfig(c => ({ ...c, ...data.crawlConfig, status: 'done', pagesCrawled: data.pagesCrawled }));
          apiFetch(`/api/agents/${agent.id}/documents`)
            .then(r => r.json()).then(rows => setDocs(rows)).catch(() => {});
          // Reload agent crawlConfig from server
          const cfg = await apiFetch(`/api/agents/${agent.id}/crawl`).then(r => r.json()).catch(() => null);
          if (cfg) setCrawlConfig(cfg);
        } else {
          setCrawlConfig(c => ({ ...c, status: 'error', errorMessage: data.error }));
        }
      } catch (err) {
        setCrawlConfig(c => ({ ...c, status: 'error', errorMessage: err.message }));
      }
    }

    async function removeCrawlUrl(url) {
      try {
        await apiFetch(`/api/agents/${agent.id}/crawl`, {
          method: 'DELETE',
          body: JSON.stringify({ url }),
        });
        setCrawlConfig(c => ({ ...c, urls: (c.urls || []).filter(u => u !== url) }));
        // Reload docs
        apiFetch(`/api/agents/${agent.id}/documents`)
          .then(r => r.json()).then(rows => setDocs(rows)).catch(() => {});
      } catch {}
    }

    function formatCrawlTime(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleDateString('he-IL') + ' ' + d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    }

    useEffect(() => {
      apiFetch(`/api/agents/${agent.id}/documents`)
        .then(r => r.json())
        .then(rows => { setDocs(rows); setLoading(false); })
        .catch(() => setLoading(false));
    }, [agent.id]);

    const displayDocs = selectedSkillId === '__global__'
      ? docs.filter(d => !d.skill_id)
      : docs.filter(d => d.skill_id === selectedSkillId);

    async function addDoc() {
      if (!newDoc.title.trim() || !newDoc.content.trim()) return;
      setSaving(true);
      const docId = uid();
      const skillId = selectedSkillId === '__global__' ? null : selectedSkillId;
      try {
        const resp = await apiFetch(`/api/agents/${agent.id}/documents`, {
          method: 'POST',
          body: JSON.stringify({ docId, skillId, title: newDoc.title, content: newDoc.content }),
        });
        if (resp.ok) {
          const doc = await resp.json();
          setDocs(d => [doc, ...d]);
          setNewDoc({ title: '', content: '' });
          setAddOpen(false);
        }
      } finally {
        setSaving(false);
      }
    }

    async function deleteDoc(docId) {
      await apiFetch(`/api/documents/${docId}`, { method: 'DELETE' });
      setDocs(d => d.filter(x => x.id !== docId));
    }

    async function updateDoc(docId) {
      if (!editDoc.title.trim() || !editDoc.content.trim()) return;
      setSaving(true);
      try {
        const resp = await apiFetch(`/api/documents/${docId}`, {
          method: 'PATCH',
          body: JSON.stringify({ title: editDoc.title, content: editDoc.content }),
        });
        if (resp.ok) {
          setDocs(d => d.map(x => x.id === docId ? { ...x, title: editDoc.title, content: editDoc.content } : x));
          setEditingDocId(null);
          setEditDoc({ title: '', content: '' });
        }
      } finally {
        setSaving(false);
      }
    }

    async function handleFileUpload(e) {
      const files = Array.from(e.target.files || []);
      if (fileInputRef.current) fileInputRef.current.value = '';
      if (!files.length) return;

      setUploadError('');
      setUploadProgress('');
      setUploading(true);

      const skillId = selectedSkillId === '__global__' ? null : selectedSkillId;
      const errors = [];
      const saved = [];

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        setUploadProgress(`מעבד ${file.name} (${i + 1}/${files.length})…`);

        try {
          // Read file as base64
          const arrayBuf = await file.arrayBuffer();
          const bytes = new Uint8Array(arrayBuf);
          const chunkSize = 0x8000;
          let binary = '';
          for (let j = 0; j < bytes.length; j += chunkSize) {
            binary += String.fromCharCode(...bytes.subarray(j, j + chunkSize));
          }
          const content_b64 = btoa(binary);

          // Extract text via Python
          const extractResp = await apiFetch('/api/extract-file', {
            method: 'POST',
            body: JSON.stringify({ filename: file.name, content_b64 }),
          });
          const data = await extractResp.json();

          if (data.error) {
            errors.push(`${file.name}: ${data.error}`);
            continue;
          }

          const text = (data.text || '').trim();
          if (!text) {
            errors.push(`${file.name}: לא נמצא טקסט בקובץ`);
            continue;
          }

          // Auto-save directly to database
          const docId = uid();
          const saveResp = await apiFetch(`/api/agents/${agent.id}/documents`, {
            method: 'POST',
            body: JSON.stringify({ docId, skillId, title: data.title || file.name, content: text }),
          });

          if (saveResp.ok) {
            const doc = await saveResp.json();
            saved.push(doc);
          } else {
            const err = await saveResp.json().catch(() => ({}));
            errors.push(`${file.name}: ${err.error || 'שגיאה בשמירה'}`);
          }
        } catch (err) {
          errors.push(`${file.name}: ${err.message}`);
        }
      }

      if (saved.length > 0) {
        setDocs(d => [...saved.reverse(), ...d]);
      }
      if (errors.length > 0) {
        setUploadError(errors.join(' | '));
      }
      setUploading(false);
      setUploadProgress('');
    }

    const activeSkillName = selectedSkillId === '__global__'
      ? 'Global'
      : (agent.skills.find(s => s.id === selectedSkillId) || {}).name || '';

    return (
      <div style={{ maxWidth: 720, display: 'flex', flexDirection: 'column', gap: 16 }}>
        <div style={{ fontSize: 12, color: 'var(--text-muted)', background: 'var(--bg-panel)', borderRadius: 'var(--r-md)', padding: '10px 14px', border: '1px solid var(--border)', lineHeight: 1.6 }}>
          📚 Documents are retrieved automatically via full-text search and injected into the system prompt.
          <br />
          <span style={{ color: 'var(--primary)' }}>Global</span> docs apply to all conversations.
          <span style={{ color: 'var(--teal)' }}> Skill docs</span> are only retrieved when that skill is active.
        </div>

        {/* Scope selector */}
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <button
            onClick={() => { setSelectedSkillId('__global__'); setAddOpen(false); }}
            style={{ padding: '6px 14px', borderRadius: 'var(--r-xl)', fontSize: 13, fontWeight: 600,
              background: selectedSkillId === '__global__' ? 'var(--primary)' : 'var(--bg-hover)',
              color: selectedSkillId === '__global__' ? '#fff' : 'var(--text-2)' }}>
            🌐 Global
          </button>
          {agent.skills.map(s => (
            <button key={s.id}
              onClick={() => { setSelectedSkillId(s.id); setAddOpen(false); }}
              style={{ padding: '6px 14px', borderRadius: 'var(--r-xl)', fontSize: 13, fontWeight: 600,
                background: selectedSkillId === s.id ? 'var(--teal)' : 'var(--bg-hover)',
                color: selectedSkillId === s.id ? '#fff' : 'var(--text-2)' }}>
              🎯 {s.name}
            </button>
          ))}
        </div>

        {/* Section header */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, justifyContent: 'space-between' }}>
          <div style={{ fontWeight: 600, fontSize: 14 }}>
            {activeSkillName} Knowledge
            <span style={{ marginLeft: 8, fontSize: 12, color: 'var(--text-muted)', fontWeight: 400 }}>
              {displayDocs.length} doc{displayDocs.length !== 1 ? 's' : ''}
            </span>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            {/* Hidden file input */}
            <input
              ref={fileInputRef}
              type="file"
              accept=".pdf,.docx"
              multiple
              style={{ display: 'none' }}
              onChange={handleFileUpload}
            />
            <button
              onClick={() => fileInputRef.current?.click()}
              disabled={uploading}
              title="העלה קבצי PDF או Word (ניתן לבחור מספר קבצים)"
              style={{ background: 'var(--bg-panel)', color: 'var(--teal)', border: '1px solid var(--teal)', padding: '8px 14px', borderRadius: 'var(--r-xl)', fontWeight: 600, fontSize: 13, display: 'flex', alignItems: 'center', gap: 6 }}>
              {uploading ? (uploadProgress || '⏳ מעבד…') : '📎 העלה מסמך'}
            </button>
            <button onClick={() => setAddOpen(v => !v)}
              style={{ background: 'var(--primary)', color: '#fff', padding: '8px 16px', borderRadius: 'var(--r-xl)', fontWeight: 600, fontSize: 13 }}>
              ＋ Add Document
            </button>
          </div>
        </div>

        {/* Upload error */}
        {uploadError && (
          <div style={{ background: 'rgba(239,68,68,0.1)', border: '1px solid var(--danger)', borderRadius: 'var(--r-md)', padding: '10px 14px', fontSize: 13, color: 'var(--danger)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span>⚠ {uploadError}</span>
            <button onClick={() => setUploadError('')} style={{ background: 'none', color: 'var(--text-muted)', fontSize: 16, padding: 0 }}>✕</button>
          </div>
        )}

        {/* Add / edit panel */}
        {addOpen && (
          <div style={{ background: 'var(--bg-panel)', border: '1px solid var(--primary)', borderRadius: 'var(--r-lg)', padding: 20, display: 'flex', flexDirection: 'column', gap: 12 }}>
            <div style={{ fontWeight: 700, fontSize: 14 }}>New Document — {activeSkillName}</div>
            <div>
              <label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 4, display: 'block' }}>Title</label>
              <input value={newDoc.title} onChange={e => setNewDoc(v => ({...v, title: e.target.value}))} dir="auto" placeholder="e.g. Company Policy 2025" />
            </div>
            <div>
              <label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 4, display: 'block' }}>Content</label>
              <textarea value={newDoc.content} onChange={e => setNewDoc(v => ({...v, content: e.target.value}))} dir="auto" rows={7}
                placeholder="Paste document text here…"
                style={{ resize: 'vertical', fontFamily: 'inherit', fontSize: 13, lineHeight: 1.6 }} />
            </div>
            {newDoc.content.length > 0 && (
              <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>
                {newDoc.content.length.toLocaleString()} characters
              </div>
            )}
            <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
              <button onClick={() => { setAddOpen(false); setNewDoc({ title: '', content: '' }); }}
                style={{ background: 'var(--bg-input)', color: 'var(--text-2)', padding: '8px 16px', borderRadius: 'var(--r-md)' }}>Cancel</button>
              <button onClick={addDoc} disabled={saving || !newDoc.title.trim() || !newDoc.content.trim()}
                style={{ background: 'var(--primary)', color: '#fff', padding: '8px 16px', borderRadius: 'var(--r-md)', fontWeight: 600 }}>
                {saving ? 'Saving…' : 'Save Document'}
              </button>
            </div>
          </div>
        )}

        {/* ─── Web Crawler Section ─── */}
        <div style={{ background: 'var(--bg-panel)', border: '1px solid var(--border)', borderRadius: 'var(--r-lg)', padding: 18 }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 12, display: 'flex', alignItems: 'center', gap: 8 }}>
            🌐 Web Crawler
            <span style={{ fontSize: 11, fontWeight: 400, color: 'var(--text-muted)', background: 'var(--bg-hover)', padding: '2px 8px', borderRadius: 'var(--r-xl)' }}>
              סריקה אוטומטית 07:00 + 13:00
            </span>
          </div>

          {/* URL input row */}
          <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
            <input
              value={crawlUrlInput}
              onChange={e => { setCrawlUrlInput(e.target.value); setCrawlUrlError(''); }}
              onKeyDown={e => e.key === 'Enter' && addCrawlUrl()}
              placeholder="https://example.com"
              dir="ltr"
              style={{ flex: 1, fontSize: 13 }}
              disabled={crawlConfig.status === 'running'}
            />
            <button
              onClick={addCrawlUrl}
              disabled={crawlConfig.status === 'running' || !crawlUrlInput.trim()}
              style={{ background: 'var(--primary)', color: '#fff', padding: '8px 16px', borderRadius: 'var(--r-md)', fontWeight: 600, fontSize: 13, whiteSpace: 'nowrap' }}>
              {crawlConfig.status === 'running' ? '⏳ סורק…' : '＋ הוסף וסרוק'}
            </button>
          </div>

          {crawlUrlError && (
            <div style={{ fontSize: 12, color: 'var(--danger)', marginBottom: 8 }}>{crawlUrlError}</div>
          )}

          {/* Configured URLs list */}
          {(crawlConfig.urls || []).length > 0 && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 10 }}>
              {(crawlConfig.urls || []).map(url => (
                <div key={url} style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'var(--bg-input)', borderRadius: 'var(--r-md)', padding: '6px 10px', fontSize: 12 }}>
                  <span style={{ flex: 1, color: 'var(--text-2)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', direction: 'ltr' }}>{url}</span>
                  <button
                    onClick={() => startCrawl(url)}
                    disabled={crawlConfig.status === 'running'}
                    title="סרוק עכשיו"
                    style={{ background: 'var(--bg-hover)', color: 'var(--primary)', border: '1px solid var(--primary)', padding: '3px 10px', borderRadius: 'var(--r-md)', fontSize: 11, fontWeight: 600 }}>
                    {crawlConfig.status === 'running' ? '⏳' : '↺ סרוק'}
                  </button>
                  <IconBtn onClick={() => removeCrawlUrl(url)} danger title="הסר URL">{Icons.trash}</IconBtn>
                </div>
              ))}
            </div>
          )}

          {/* Status row */}
          <div style={{ fontSize: 12, color: 'var(--text-muted)', display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
            {crawlConfig.status === 'running' && (
              <span style={{ color: 'var(--primary)', display: 'flex', alignItems: 'center', gap: 4 }}>
                <span style={{ animation: 'spin 1s linear infinite', display: 'inline-block' }}>⏳</span> סורק…
              </span>
            )}
            {crawlConfig.status === 'done' && (
              <span style={{ color: 'var(--teal)' }}>✓ סריקה אחרונה: {formatCrawlTime(crawlConfig.lastCrawledAt)} | {crawlConfig.pagesCrawled || 0} עמודים</span>
            )}
            {crawlConfig.status === 'error' && (
              <span style={{ color: 'var(--danger)' }}>✗ שגיאה: {crawlConfig.errorMessage}</span>
            )}
            {(!crawlConfig.status || crawlConfig.status === 'idle') && (crawlConfig.urls || []).length === 0 && (
              <span>הוסף URL לסריקה אוטומטית של אתר שלם</span>
            )}
            {crawlConfig.status !== 'running' && (crawlConfig.urls || []).length > 0 && !crawlConfig.lastCrawledAt && (
              <span>ממתין לסריקה ראשונה</span>
            )}
          </div>
        </div>

        {/* Doc list */}
        {loading ? (
          <div style={{ color: 'var(--text-muted)', fontSize: 13, padding: 8 }}>Loading…</div>
        ) : displayDocs.length === 0 && !addOpen ? (
          <EmptyState icon="📄" title="No documents yet" subtitle="Upload a PDF, Word, or Excel file — or paste text directly" />
        ) : (
          displayDocs.map(doc => (
            <div key={doc.id} style={{ background: 'var(--bg-panel)', border: `1px solid ${editingDocId === doc.id ? 'var(--primary)' : 'var(--border)'}`, borderRadius: 'var(--r-lg)', padding: '14px 16px' }}>
              {editingDocId === doc.id ? (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>Edit Document</div>
                  <div>
                    <label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 4, display: 'block' }}>Title</label>
                    <input value={editDoc.title} onChange={e => setEditDoc(v => ({...v, title: e.target.value}))} dir="auto" />
                  </div>
                  <div>
                    <label style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 4, display: 'block' }}>Content</label>
                    <textarea value={editDoc.content} onChange={e => setEditDoc(v => ({...v, content: e.target.value}))} dir="auto" rows={8}
                      style={{ resize: 'vertical', fontFamily: 'inherit', fontSize: 13, lineHeight: 1.6 }} />
                  </div>
                  {editDoc.content.length > 0 && (
                    <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>{editDoc.content.length.toLocaleString()} characters</div>
                  )}
                  <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>

                      style={{ background: 'var(--bg-input)', color: 'var(--text-2)', padding: '8px 16px', borderRadius: 'var(--r-md)' }}>Cancel</button>
                    <button onClick={() => updateDoc(doc.id)} disabled={saving || !editDoc.title.trim() || !editDoc.content.trim()}
                      style={{ background: 'var(--primary)', color: '#fff', padding: '8px 16px', borderRadius: 'var(--r-md)', fontWeight: 600 }}>
                      {saving ? 'Saving…' : 'Save Changes'}
                    </button>
                  </div>
                </div>
              ) : (
                <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 6 }}>

                    </div>
                    <div style={{ fontSize: 12, color: 'var(--text-2)', lineHeight: 1.6, maxHeight: 64, overflow: 'hidden', display: '-webkit-box', WebkitLineClamp: 3, WebkitBoxOrient: 'vertical' }}>

                    <IconBtn onClick={() => deleteDoc(doc.id)} danger title="Delete document">{Icons.trash}</IconBtn>
                  </div>
                </div>
              )}
            </div>
          ))
        )}
      </div>
    );
  }

    const webhookUrl = `${baseUrl}/api/whatsapp/webhook`;

    function copy(text) {
      navigator.clipboard.writeText(text).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      });
    }

    function generateVerifyToken() {
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      const token = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
      set('verifyToken', token);
    }

    async function testConnection() {
      if (!wa.phoneNumberId || !wa.accessToken) return;

        });
        const d = await r.json();
        setTestResult(d);
      } catch (err) {
        setTestResult({ ok: false, error: err.message });
      } finally {
        setTesting(false);
      }

        <div style={{ background: 'var(--bg-panel)', borderRadius: 'var(--r-lg)', padding: 24, border: '1px solid var(--border)' }}>
          <div style={{ fontWeight: 700, marginBottom: 12, fontSize: 15 }}>Setup Instructions</div>
          <ol style={{ fontSize: 13, color: 'var(--text-2)', lineHeight: 1.9, paddingLeft: 20 }}>
            <li>Create an app at <span style={{ color: 'var(--primary)' }}>developers.facebook.com</span> and add the <b>WhatsApp</b> product.</li>
            <li>Copy the <b>Phone Number ID</b> from WhatsApp → API Setup and paste it above.</li>
            <li>Generate a permanent token for a system user and paste it as the <b>Access Token</b>.</li>
            <li>Copy the <b>App Secret</b> from App Settings → Basic.</li>
            <li>Fill in a <b>Verify Token</b> (or click Generate) — changes save automatically.</li>
            <li>In Meta's dashboard, set the <b>Callback URL</b> above and the same <b>Verify Token</b>, then click Verify and Save.</li>

            Note: the access token and app secret are stored as-is in the database, same as the agent's API key.
          </div>
        </div>
      </div>
    );
  }

    return `<!DOCTYPE html>

.dot{width:8px;height:8px;background:#9ca3af;border-radius:50%;animation:pd 1.2s infinite ease-in-out}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes pd{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
#inputbar{padding:10px 12px;background:#1e2130;border-top:1px solid #2a2d3e;display:flex;gap:8px}
textarea{flex:1;background:#252837;color:#f0f0f5;border:1px solid #2a2d3e;border-radius:12px;padding:8px 12px;font-family:inherit;font-size:13px;outline:none;resize:none}
textarea:focus{border-color:${accent}}
button{background:${accent};color:#fff;border:none;padding:0 14px;border-radius:12px;font-size:18px;cursor:pointer;font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div id="header"><span class="av">${he(avatarStr)}</span><span class="nm">${he(titleStr)}</span></div>
<div id="messages"></div>
<div id="inputbar">
  <textarea id="inp" placeholder="${he(placeholderStr)}" rows="1" onkeydown="if(event.key==='Enter'&amp;&amp;!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
  <button onclick="sendMsg()">&#x27A4;</button>
</div>
<script>
var SYSTEM=${jsSystem};
var API_KEY=${jsApiKey};
var PROVIDER=${jsProvider};
var MODEL=${jsModel};
var OLLAMA_HOST=${jsOllamaHost};
var history=[];
var pending=false;
function isHeb(t){return /^[\\u0590-\\u05FF]/.test((t||'').trim())}
function fmt(d){return new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false})}
var msgs=document.getElementById('messages');
function addMsg(role,content,ts,dt){
  var wrap=document.createElement('div');
  wrap.className='bubble-wrap '+role;
  var b=document.createElement('div');
  b.className='bubble '+role;
  b.textContent=content;
  b.dir=isHeb(content)?'rtl':'ltr';
  wrap.appendChild(b);
  if(role==='agent'||role==='error'){
    var m=document.createElement('div');
    m.className='meta'+(role==='error'?' err':'');
    m.textContent=role==='error'?('⚠ Failed after '+dt+'   •   🕐 '+fmt(ts)):(dt?('⏱ '+dt+'   •   🕐 '+fmt(ts)):('🕐 '+fmt(ts)));
    wrap.appendChild(m);
  }
  msgs.appendChild(wrap);
  msgs.scrollTop=msgs.scrollHeight;
}
function showTyping(){
  var d=document.createElement('div');d.id='typing';d.className='typing';
  d.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
}
function hideTyping(){var d=document.getElementById('typing');if(d)d.remove()}
addMsg('agent',${jsOpening},new Date());
async function sendMsg(){
  var inp=document.getElementById('inp');
  var text=inp.value.trim();
  if(!text||pending)return;
  inp.value='';inp.style.height='auto';
  history.push({role:'user',content:text});
  addMsg('user',text);
  pending=true;
  var t0=performance.now();
  showTyping();
  try{
    var body,url,hdrs;
    if(PROVIDER==='claude'){
      url='https://api.anthropic.com/v1/messages';
      hdrs={'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
      body=JSON.stringify({model:MODEL,max_tokens:1024,system:SYSTEM,messages:history});
    }else if(PROVIDER==='ollama'){
      url=OLLAMA_HOST+'/v1/chat/completions';
      hdrs={'Content-Type':'application/json'};
      body=JSON.stringify({model:MODEL,messages:[{role:'system',content:SYSTEM},...history]});
    }else{
      url='https://api.openai.com/v1/chat/completions';
      hdrs={'Content-Type':'application/json','Authorization':'Bearer '+API_KEY};
      body=JSON.stringify({model:MODEL,messages:[{role:'system',content:SYSTEM},...history]});
    }
    var r=await fetch(url,{method:'POST',headers:hdrs,body:body});
    var data=await r.json();
    if(!r.ok)throw new Error(data.error?.message||JSON.stringify(data));
    var content=PROVIDER==='claude'?data.content[0].text:data.choices[0].message.content;
    var dt=((performance.now()-t0)/1000).toFixed(2)+'s';
    history.push({role:'assistant',content:content});
    hideTyping();addMsg('agent',content,new Date(),dt);
  }catch(e){
    var dt=((performance.now()-t0)/1000).toFixed(2)+'s';
    hideTyping();addMsg('error',e.message,new Date(),dt);
    history.pop();
  }
  pending=false;
}
<\/script>
</body>
</html>`;
  }

  /* ─────────────────── CHAT TEST DRAWER ─────────────────── */
  function ChatTestDrawer({ agent, onClose, initialSessionId }) {
    const historyKey = `agentforge_history_${agent.id}`;
    const openingMsg = { id: uid(), role: 'agent', content: agent.openingMessage || 'Hello!', timestamp: new Date(), isOpening: true };
    const [messages, setMessages] = useState([openingMsg]);
    const [input, setInput] = useState('');
    const [pending, setPending] = useState(false);
    const [activeSkillId, setActiveSkillId] = useState(null);
    const [showHistory, setShowHistory] = useState(!!initialSessionId);
    const [viewingSession, setViewingSession] = useState(null); // { startedAt, messages }
    const [historyTick, setHistoryTick] = useState(0);
    const listRef = useRef(null);
    const inputRef = useRef(null);
    const currentSessionIdRef = useRef(uid());

    // Save session to history on close (if has real messages)
    const messagesRef = useRef(messages);
    useEffect(() => { messagesRef.current = messages; }, [messages]);
    useEffect(() => {
      return () => {
        const msgs = messagesRef.current.filter(m => m.role !== 'typing');
        const hasReal = msgs.some(m => m.role === 'user');
        if (!hasReal) return;
        try {
          const saved = JSON.parse(localStorage.getItem(historyKey) || '[]');
          // avoid duplicate session saves
          const filtered = saved.filter(s => s.id !== currentSessionIdRef.current);
          const session = { id: currentSessionIdRef.current, startedAt: msgs[0]?.timestamp || new Date(), messages: msgs };
          localStorage.setItem(historyKey, JSON.stringify([session, ...filtered].slice(0, 50)));
        } catch (_) {}
      };
    }, [historyKey]);

    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(historyKey) || '[]').map(s => ({ ...s, startedAt: new Date(s.startedAt), messages: s.messages.map(m => ({ ...m, timestamp: new Date(m.timestamp) })) })); }
      catch (_) { return []; }
    }

    // Auto-open a specific session from sidebar click
    useEffect(() => {
      if (!initialSessionId) return;
      const sessions = loadHistory();
      const target = sessions.find(s => s.id === initialSessionId);
      if (target) setViewingSession(target);
    }, [initialSessionId]); // eslint-disable-line react-hooks/exhaustive-deps

    function deleteSession(sid) {
      try {
        const updated = loadHistory().filter(s => s.id !== sid);
        localStorage.setItem(historyKey, JSON.stringify(updated));
        if (viewingSession?.id === sid) setViewingSession(null);
        setHistoryTick(t => t + 1);
      } catch (_) {}
    }

    useEffect(() => {
      function onKey(e) { if (e.key === 'Escape') onClose(); }
      document.addEventListener('keydown', onKey);
      return () => document.removeEventListener('keydown', onKey);
    }, [onClose]);

    useEffect(() => {
      if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
    }, [messages]);

    useEffect(() => {
      if (!pending && inputRef.current) inputRef.current.focus();
    }, [pending]);

    async function sendMessage() {
      const text = input.trim();
      if (!text || pending) return;
      setInput('');
      inputRef.current?.focus();
      const t0 = performance.now();

      // Skill switch detection
      const skillMatch = text.match(/^#(\w+)/);
      let skillBanner = null;
      if (skillMatch) {
        const skill = agent.skills.find(s => s.name.toLowerCase() === skillMatch[1].toLowerCase());
        if (skill) { skillBanner = skill; setActiveSkillId(skill.id); }
      }

      const typingId = uid();
      const maskedText = applyDlp(text, agent.dlp || {});
      const dlpMasked = maskedText !== text;
      const newMsgs = [...messages, { id: uid(), role: 'user', content: maskedText, timestamp: new Date(), dlpMasked }];
      if (skillBanner) newMsgs.push({ id: uid(), role: 'skill', name: skillBanner.name, description: skillBanner.description, prompt: skillBanner.prompt, timestamp: new Date() });
      newMsgs.push({ id: typingId, role: 'typing' });
      setMessages(newMsgs);
      setPending(true);

      const history = messages.filter(m => m.role === 'user' || m.role === 'agent').map(m => ({
        role: m.role === 'agent' ? 'assistant' : 'user', content: m.content,
      }));
      history.push({ role: 'user', content: maskedText });

      try {
        const content = await callWithTools(agent, history, async (toolName, toolInput) => {
          if (toolName === 'switch_skill') {
            const skill = (agent.skills || []).find(s => s.name.toLowerCase() === (toolInput.skill_name || '').toLowerCase());
            if (skill) {
              setActiveSkillId(skill.id);
              setMessages(m => m.filter(x => x.id !== typingId).concat(
                { id: uid(), role: 'skill', name: skill.name, description: skill.description, prompt: skill.prompt, timestamp: new Date() },
                { id: typingId, role: 'typing' }
              ));
            }
            return null;
          }
          const msgId = uid();
          setMessages(m => m.filter(x => x.id !== typingId).concat(
            { id: msgId, role: 'tool', name: toolName, input: toolInput, timestamp: new Date() },
            { id: typingId, role: 'typing' }
          ));
          return (result) => setMessages(m => m.map(x => x.id === msgId ? { ...x, result } : x));
        }, activeSkillId);
        const dt = performance.now() - t0;
        const next = m => m.filter(x => x.id !== typingId);
        setMessages(m => content?.trim() ? next(m).concat({ id: uid(), role: 'agent', content, timestamp: new Date(), durationMs: dt }) : next(m));
      } catch (err) {
        const dt = performance.now() - t0;
        setMessages(m => m.filter(x => x.id !== typingId).concat({ id: uid(), role: 'error', content: err.message, timestamp: new Date(), durationMs: dt }));
      } finally {
        setPending(false);
      }
    }

    const hasKey = agent.apiConfig.provider === 'ollama' ? !!agent.apiConfig.ollamaHost : !!agent.apiConfig.apiKey;

    return (
      <>
        {/* Backdrop */}
        <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', zIndex: 200 }} />
        {/* Drawer */}
        <div className="slide-in-right" style={{ position: 'fixed', top: 0, right: 0, bottom: 0, width: 420, background: 'var(--bg-sidebar)', borderLeft: '1px solid var(--border)', zIndex: 201, display: 'flex', flexDirection: 'column', boxShadow: '-4px 0 24px rgba(0,0,0,0.5)', overflow: 'hidden' }}>
          {/* Header */}
          <div style={{ padding: '16px 20px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{ width: 40, height: 40, borderRadius: '50%', background: '#1e1e1e', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, overflow: 'hidden' }}><AvatarDisplay value={agent.avatar} size={40} /></div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 700, fontSize: 15 }}>{agent.name}</div>
              <div style={{ fontSize: 12, color: hasKey ? 'var(--success)' : 'var(--danger)', display: 'flex', alignItems: 'center', gap: 4 }}>
                <span style={{ width: 7, height: 7, borderRadius: '50%', background: hasKey ? 'var(--success)' : 'var(--danger)', display: 'inline-block' }} />
                {hasKey ? (agent.apiConfig.provider === 'ollama' ? `🦙 ${agent.apiConfig.ollamaHost}` : 'Connected') : (agent.apiConfig.provider === 'ollama' ? 'No Ollama host set' : 'No API key')}
              </div>
            </div>
            <IconBtn onClick={() => setShowHistory(h => !h)} title="Chat history" style={{ background: showHistory ? 'var(--bg-hover)' : undefined }}>🕐</IconBtn>
            <IconBtn onClick={onClose} title="Close">✕</IconBtn>
          </div>

          {/* History Panel */}
          {showHistory && (() => {
            const sessions = loadHistory();
            return (
              <div style={{ position: 'absolute', top: 73, right: 0, width: 420, bottom: 0, background: 'var(--bg-app)', zIndex: 10, display: 'flex', flexDirection: 'column', borderLeft: '1px solid var(--border)' }}>
                <div style={{ padding: '12px 16px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  {viewingSession
                    ? <><button onClick={() => setViewingSession(null)} style={{ background: 'none', border: 'none', color: 'var(--primary)', cursor: 'pointer', fontSize: 13, padding: 0 }}>← Back</button>
                        <span style={{ fontSize: 12, color: 'var(--text-2)' }}>{viewingSession.startedAt.toLocaleDateString()} {viewingSession.startedAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></>
                    : <><span style={{ fontWeight: 600, fontSize: 14 }}>Previous conversations</span>
                        <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>{sessions.length} saved</span></>
                  }
                </div>
                <div style={{ flex: 1, overflowY: 'auto', padding: viewingSession ? '12px 16px' : 8, display: 'flex', flexDirection: 'column', gap: viewingSession ? 10 : 4 }}>
                  {viewingSession
                    ? viewingSession.messages.map(msg => {
                        if (msg.role === 'tool') return <div key={msg.id}><InvocationChip msg={msg} /></div>;
                        if (msg.role === 'skill') return <div key={msg.id}><SkillBanner msg={msg} /></div>;
                        if (msg.role === 'error') return <div key={msg.id} style={{ fontSize: 12, color: 'var(--danger)', background: 'rgba(239,68,68,0.08)', padding: '6px 10px', borderRadius: 8 }}>⚠ {msg.content}</div>;
                        const isUser = msg.role === 'user';
                        const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
                        return (
                          <div key={msg.id} style={{ display: 'flex', justifyContent: isUser ? 'flex-end' : 'flex-start' }}>
                            <div dir={dir} style={{ maxWidth: '85%', background: isUser ? 'var(--primary)' : 'var(--bg-panel)', color: 'var(--text)', padding: '8px 12px', borderRadius: isUser ? '14px 14px 4px 14px' : '14px 14px 14px 4px', fontSize: 13, lineHeight: 1.5 }}>
                              {msg.content}
                              <div style={{ fontSize: 10, color: isUser ? 'rgba(255,255,255,0.6)' : 'var(--text-muted)', marginTop: 3, textAlign: isUser ? 'right' : 'left' }}>
                                🕐 {new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                              </div>
                            </div>
                          </div>
                        );
                      })
                    : sessions.length === 0
                      ? <div style={{ textAlign: 'center', color: 'var(--text-muted)', fontSize: 13, marginTop: 40 }}>No previous conversations</div>
                      : sessions.map(s => {
                          const firstUser = s.messages.find(m => m.role === 'user');
                          const preview = firstUser?.content?.slice(0, 60) || '—';
                          const d = new Date(s.startedAt);
                          return (
                            <div key={s.id} onClick={() => setViewingSession(s)} style={{ padding: '10px 12px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', cursor: 'pointer', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 10 }}
                              onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                              onMouseLeave={e => e.currentTarget.style.background = 'var(--bg-card)'}>
                              <div style={{ flex: 1, minWidth: 0 }}>
                                <div style={{ fontSize: 11, color: 'var(--text-muted)', marginBottom: 3 }}>{d.toLocaleDateString()} {d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} · {s.messages.filter(m => m.role === 'user').length} messages</div>
                                <div style={{ fontSize: 13, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{preview}</div>
                              </div>
                              <button onClick={e => { e.stopPropagation(); deleteSession(s.id); }} title="Delete" style={{ background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer', fontSize: 14, padding: '2px 4px', borderRadius: 4, flexShrink: 0 }}
                                onMouseEnter={e => e.currentTarget.style.color = 'var(--danger)'}
                                onMouseLeave={e => e.currentTarget.style.color = 'var(--text-muted)'}>🗑</button>
                            </div>
                          );
                        })
                  }
                </div>
              </div>
            );
          })()}

          {/* Messages */}
          <div ref={listRef} style={{ flex: 1, overflowY: 'auto', padding: '16px 20px', display: 'flex', flexDirection: 'column', gap: 12 }}>
            {messages.map(msg => {
              if (msg.role === 'typing') return (
                <div key={msg.id} style={{ display: 'flex', gap: 6 }}>
                  <div style={{ background: 'var(--bg-panel)', padding: '12px 16px', borderRadius: '18px 18px 18px 4px', display: 'flex', gap: 5, alignItems: 'center' }}>
                    <span className="typing-dot" /><span className="typing-dot" /><span className="typing-dot" />
                  </div>
                </div>
              );
              if (msg.role === 'tool') return (
                <div key={msg.id} style={{ display: 'flex', alignItems: 'flex-start' }}>
                  <InvocationChip msg={msg} />
                </div>
              );
              if (msg.role === 'skill') return (
                <div key={msg.id}>
                  <SkillBanner msg={msg} />
                </div>
              );
              if (msg.role === 'user') {
                const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
                return (
                  <div key={msg.id} style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
                    <div style={{ maxWidth: '78%', background: 'var(--primary)', color: '#fff', padding: '10px 14px', borderRadius: '18px 18px 4px 18px', fontSize: 14, lineHeight: 1.5 }} dir={dir}>{msg.content}</div>
                    {msg.dlpMasked && <div style={{ fontSize: 11, color: 'var(--warning)', display: 'flex', alignItems: 'center', gap: 4 }}>🔒 נא לא לחשוף מידע רגיש</div>}
                  </div>
                );
              }
              if (msg.role === 'error') return (
                <div key={msg.id} style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                  <div style={{ maxWidth: '80%', background: 'rgba(239,68,68,0.12)', border: '1px solid rgba(239,68,68,0.3)', color: 'var(--danger)', padding: '10px 14px', borderRadius: '18px 18px 18px 4px', fontSize: 13 }}>⚠ {msg.content}</div>
                  <div style={{ fontSize: 11, color: 'var(--danger)', paddingLeft: 4 }}>⚠ Failed after {fmtDuration(msg.durationMs)} &nbsp;•&nbsp; 🕐 {fmtTime(msg.timestamp)}</div>
                </div>
              );
              // agent
              const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
              return (
                <div key={msg.id} style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                  <div style={{ maxWidth: '80%', background: 'var(--bg-panel)', color: 'var(--text)', padding: '10px 14px', borderRadius: '18px 18px 18px 4px', fontSize: 14, lineHeight: 1.5, whiteSpace: 'pre-wrap' }} dir={dir}>{msg.content}</div>
                  <div style={{ fontSize: 11, color: 'var(--text-muted)', paddingLeft: 4 }}>
                    {msg.isOpening ? `🕐 ${fmtTime(msg.timestamp)}` : `⏱ ${fmtDuration(msg.durationMs)}   •   🕐 ${fmtTime(msg.timestamp)}`}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Input */}
          <div style={{ padding: '12px 16px', borderTop: '1px solid var(--border)', background: 'var(--bg-app)' }}>
            <div style={{ display: 'flex', gap: 8, marginBottom: 6 }}>
              <textarea
                ref={inputRef}
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
                dir="auto"
                rows={1}
                disabled={pending}
                placeholder="Message…"
                style={{ flex: 1, resize: 'none', fontSize: 14 }}
              />
              <button onClick={sendMessage} disabled={pending || !input.trim()} style={{ background: 'var(--primary)', color: '#fff', padding: '0 14px', borderRadius: 'var(--r-md)', fontWeight: 700, fontSize: 18 }}>➤</button>
            </div>
            <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>Use #SkillName to switch skills &nbsp;•&nbsp; @toolName to call tools</div>
          </div>
        </div>
      </>
    );
  }

  /* ─────────────────── GMAIL CONNECTION (PER AGENT) ─────────────────── */
  function GmailAgentConnection({ agent }) {
    const [state, setState] = useState({ loaded: false, connected: false, email: null });
    const [busy, setBusy]   = useState(false);

    useEffect(() => {
      let live = true;
      gmailStatus(agent.id)
        .then(d => { if (live) setState({ loaded: true, connected: !!d.connected, email: d.email }); })
        .catch(() => { if (live) setState({ loaded: true, connected: false, email: null }); });
      return () => { live = false; };
    }, [agent.id]);

    async function disconnect() {
      setBusy(true);
      try {
        await gmailDisconnect(agent.id);
        setState({ loaded: true, connected: false, email: null });
      } finally {
        setBusy(false);
      }
    }

    const dotColor = !state.loaded ? 'var(--text-muted)' : state.connected ? 'var(--success)' : 'var(--text-muted)';

    return (
      <div style={{ borderTop: '1px solid var(--border)', padding: '12px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0 }}>
          <div style={{ width: 8, height: 8, borderRadius: '50%', background: dotColor, flexShrink: 0 }} />
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 12, fontWeight: 600 }}>Gmail account</div>
            <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {!state.loaded ? 'Checking…' : state.connected ? `Connected as ${state.email}` : 'Not connected — this agent cannot send email yet'}
            </div>
          </div>
        </div>
        {state.loaded && (
          state.connected ? (
            <button onClick={disconnect} disabled={busy}
              style={{ padding: '6px 12px', borderRadius: 'var(--r-sm)', background: 'var(--bg-hover)', border: '1px solid var(--border)', color: 'var(--text-2)', fontSize: 12, fontWeight: 600, opacity: busy ? 0.6 : 1 }}>
              {busy ? '…' : 'Disconnect'}
            </button>
          ) : (
            <button onClick={() => { window.location.href = gmailConnectUrl(agent.id); }}
              style={{ padding: '6px 12px', borderRadius: 'var(--r-sm)', background: 'var(--primary)', border: 'none', color: '#0a0a0a', fontSize: 12, fontWeight: 700 }}>
              Connect Gmail
            </button>
          )
        )}
      </div>
    );
  }

  /* ─────────────────── AGENT EDITOR ─────────────────── */
  function AgentEditor({ agent, onUpdate, onBack, initialTab }) {
    const [tab, setTab] = useState(initialTab || 'configuration');
    const TABS = ['configuration','skills','tools','knowledge','export','whatsapp'];

    return (
      <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
        {/* Back + title */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 22 }}>
          <button onClick={onBack}

  function AgentCard({ agent, onEdit, onTest, onDuplicate, onDelete, onExport, isNew }) {
    const [hovered, setHovered] = useState(false);

    const actions = [
      { icon: Icons.edit, label: 'Edit', fn: onEdit, labelled: true },
      { icon: Icons.chat, label: 'Test', fn: onTest, labelled: true },
      { icon: Icons.copy, label: 'Duplicate', fn: onDuplicate },
      { icon: Icons.export, label: 'Export', fn: onExport },
      { icon: Icons.trash, label: 'Delete', fn: onDelete, danger: true },
    ];

    return (
      <div
        className={isNew ? 'card-highlight fade-in' : 'fade-in'}
        onMouseEnter={() => setHovered(true)}
        onMouseLeave={() => setHovered(false)}
        style={{
          background: 'var(--bg-card)',
          borderRadius: 'var(--r-lg)',
          border: `1px solid ${hovered ? 'rgba(239,159,39,0.35)' : 'var(--border)'}`,
          boxShadow: hovered ? '0 0 24px rgba(239,159,39,0.12), var(--shadow)' : 'var(--shadow)',
          padding: 20,
          display: 'flex',
          flexDirection: 'column',
          gap: 14,
          transition: 'border-color 0.2s, box-shadow 0.2s',
          cursor: 'pointer',
        }}
        onClick={onEdit}
      >
        {/* Avatar + name */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <div style={{ width: 48, height: 48, borderRadius: 14, background: 'var(--bg-panel)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, overflow: 'hidden' }}>
            <AvatarDisplay value={agent.avatar} size={48} />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontWeight: 700, fontSize: 15, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', letterSpacing: '-0.01em' }}>{agent.name}</div>
            <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 3, fontWeight: 500 }}>{new Date(agent.createdAt).toLocaleDateString()}</div>

        </div>
        {/* Badges */}
        <div style={{ display: 'flex', gap: 6 }}>

            {Icons.target} {agent.skills.length} skills
          </span>
          <span style={{ display: 'flex', alignItems: 'center', gap: 5, background: 'var(--teal-dim)', color: 'var(--teal)', borderRadius: 'var(--r-sm)', padding: '3px 9px', fontSize: 11, fontWeight: 700, border: '1px solid rgba(20,184,166,0.15)' }}>
            {Icons.tool} {agent.tools.length} tools
          </span>
        </div>
        {/* Actions — only the two primary ones carry a label; the rest are
            icon-only so nothing gets clipped at narrow card widths. */}
        <div style={{ display: 'flex', gap: 4, borderTop: '1px solid var(--border)', paddingTop: 12 }} onClick={e => e.stopPropagation()}>
          {actions.map(({ icon, label, fn, danger, labelled }) => (
            <button key={label} onClick={fn} title={label} aria-label={label}
              style={{
                flex: labelled ? '1 1 0' : '0 0 34px',
                minWidth: 0,
                padding: '7px 4px', borderRadius: 'var(--r-sm)',
                fontSize: 11, fontWeight: 600, background: 'var(--bg-hover)',
                color: danger ? 'var(--danger)' : 'var(--text-2)',
                display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 5,
                transition: 'background 0.15s, color 0.15s',

              onMouseEnter={e => { e.currentTarget.style.background = danger ? 'rgba(239,68,68,0.12)' : 'var(--bg-input)'; if (!danger) e.currentTarget.style.color = 'var(--text)'; }}
              onMouseLeave={e => { e.currentTarget.style.background = 'var(--bg-hover)'; e.currentTarget.style.color = danger ? 'var(--danger)' : 'var(--text-2)'; }}
            >
              {icon}
              {labelled && <span style={{ whiteSpace: 'nowrap' }}>{label}</span>}
            </button>
          ))}
        </div>
      </div>
    );
  }
