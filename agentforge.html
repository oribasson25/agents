          <ul style={{ color: 'var(--text-2)', fontSize: 14, lineHeight: 2, paddingRight: 20, marginBottom: 12 }}>
            <li>✅ הסוכן עונה בשפה הנכונה</li>
            <li>✅ הסוכן לא ממציא מידע שלא קיים במסמכים</li>
            <li>✅ הכלים מופעלים כשצריך</li>
            <li>✅ תשובות על אתרים מכילות תוכן אמיתי מהאתר</li>
            <li>✅ הסוכן מתנהג לפי ה-System Prompt</li>
          </ul>
          <Tip>שמור שאלות בדיקה קבועות ובדוק אותן אחרי כל שינוי.</Tip>
        </div>
      ),
      tips: (
        <div dir="rtl">
          <H2>טיפים מתקדמים</H2>
          <H3>System Prompt אפקטיבי</H3>
          <Block>{`// מבנה מומלץ:
## תפקיד
אתה [תפקיד] של [חברה/שירות].

## הוראות
- [הוראה 1]
- [הוראה 2]

## מגבלות
- אל תענה על [נושא]
- תמיד [התנהגות]

## פורמט תשובה
[תאר איך להציג תשובות]`}</Block>

          <H3>כלים יעילים</H3>
          <P>כלים טובים:</P>
          <ul style={{ color: 'var(--text-2)', fontSize: 14, lineHeight: 2, paddingRight: 20, marginBottom: 12 }}>
            <li>עושים דבר אחד בלבד, עושים אותו טוב</li>
            <li>מחזירים מחרוזת ברורה שהסוכן יכול לפרש</li>
            <li>כוללים טיפול בשגיאות</li>
            <li>משתמשים ב-env vars למפתחות API</li>
          </ul>

          <H3>RAG איכותי</H3>
          <ul style={{ color: 'var(--text-2)', fontSize: 14, lineHeight: 2, paddingRight: 20, marginBottom: 12 }}>
            <li>חלק מסמכים גדולים לחלקים קטנים (topic per document)</li>
            <li>שמות מסמכים תיאוריים — הסוכן מזכיר אותם</li>
            <li>אותה שפה שהמשתמשים ישאלו בה</li>
          </ul>

          <H3>שימוש ב-Skills</H3>
          <P>Skills הם זרימות עבודה מובנות — שילוב של prompt + כלים + מסמכים לתרחיש מסוים. מומלץ לסוכנים עם כמה "מצבים".</P>

          <Tip>צור סוכן נפרד לכל תחום שימוש — סוכן מכירות, סוכן תמיכה, סוכן מחקר — במקום סוכן אחד שעושה הכל.</Tip>
          <Warn>כל שיחה מתחילה מחדש — הסוכן לא זוכר שיחות קודמות אלא אם כן מוסיפים את ההיסטוריה לבסיס הידע.</Warn>
        </div>
      ),
    };

    return (
      <div style={{ display: 'flex', gap: 32, maxWidth: 960, margin: '0 auto' }}>
        {/* Sidebar nav */}
        <div style={{ width: 200, flexShrink: 0 }}>
          <div style={{ fontWeight: 700, fontSize: 11, color: 'var(--text-muted)', letterSpacing: 1, marginBottom: 10, textTransform: 'uppercase' }}>תוכן עניינים</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
            {sections.map(s => (
              <button key={s.id} onClick={() => setActive(s.id)}
                style={{
                  textAlign: 'right', padding: '8px 10px', borderRadius: 'var(--r-sm)', fontSize: 13,
                  background: active === s.id ? 'rgba(239,159,39,0.10)' : 'transparent',
                  color: active === s.id ? 'var(--primary)' : 'var(--text-2)',
                  fontWeight: active === s.id ? 600 : 400,
                  borderRight: `3px solid ${active === s.id ? 'var(--primary)' : 'transparent'}`,
                }}
                onMouseEnter={e => { if (active !== s.id) e.currentTarget.style.background = 'var(--bg-hover)'; }}
                onMouseLeave={e => { if (active !== s.id) e.currentTarget.style.background = 'transparent'; }}
              >{s.label}</button>
            ))}
          </div>
        </div>
        {/* Content */}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ marginBottom: 6, fontSize: 11, color: 'var(--text-muted)', letterSpacing: 1, textTransform: 'uppercase' }}>תיעוד</div>
          <div style={{ fontWeight: 800, fontSize: 28, marginBottom: 24, color: 'var(--text)' }}>📖 מדריך AgentForge</div>
          {content[active]}
        </div>
      </div>
    );
  }

  /* ─────────────────── AGENT LIST VIEW ─────────────────── */
  function AgentListView({ agents, onNew, onEdit, onTest, onDuplicate, onDelete, onExport }) {
    return (
      <div style={{ position: 'relative', height: '100%' }}>
        <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginBottom: 28 }}>
          <div>
            <div style={{ fontWeight: 800, fontSize: 26, letterSpacing: '-0.02em', color: 'var(--text)' }}>Agents</div>
            <div style={{ color: 'var(--text-muted)', fontSize: 13, marginTop: 4, fontWeight: 500 }}>
              {agents.length === 0 ? 'No agents yet' : `${agents.length} agent${agents.length !== 1 ? 's' : ''} configured`}
            </div>
          </div>
          <button onClick={onNew}
            style={{
              display: 'flex', alignItems: 'center', gap: 7,
              background: 'var(--primary)', color: '#0a0a0a',
              padding: '9px 18px', borderRadius: 'var(--r-md)',
              fontWeight: 700, fontSize: 13,
              boxShadow: '0 2px 12px var(--primary-glow)',
              transition: 'all 0.18s ease',
            }}
            onMouseEnter={e => { e.currentTarget.style.background = 'var(--primary-hover)'; e.currentTarget.style.boxShadow = '0 4px 20px var(--primary-glow)'; e.currentTarget.style.transform = 'translateY(-1px)'; }}
            onMouseLeave={e => { e.currentTarget.style.background = 'var(--primary)'; e.currentTarget.style.boxShadow = '0 2px 12px var(--primary-glow)'; e.currentTarget.style.transform = 'none'; }}
          >
            {Icons.plus} New Agent
          </button>
        </div>
        {agents.length === 0 ? (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16, padding: '64px 48px', background: 'var(--bg-card)', borderRadius: 'var(--r-xl)', border: '1px dashed var(--border)' }}>
            <div style={{ width: 56, height: 56, borderRadius: 16, background: 'var(--bg-panel)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-muted)' }}>
              {Icons.bot}
            </div>
            <div>
              <div style={{ color: 'var(--text)', fontWeight: 700, fontSize: 15, textAlign: 'center', marginBottom: 6 }}>No agents yet</div>
              <div style={{ color: 'var(--text-muted)', fontSize: 13, textAlign: 'center' }}>Click "New Agent" to create your first agent</div>
            </div>
          </div>
        ) : (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(268px,1fr))', gap: 14 }}>
            {agents.map(a => (
              <AgentCard
                key={a.id}
                agent={a}
                isNew={a._isNew}
                onEdit={() => onEdit(a.id)}
                onTest={() => onTest(a.id)}
                onDuplicate={() => onDuplicate(a.id)}
                onDelete={() => onDelete(a.id)}
                onExport={() => onEdit(a.id)}
              />
            ))}
          </div>
        )}
      </div>
    );
  }

  /* ─────────────────── INTERACTIONS ─────────────────── */
  function fmtSessionDuration(seconds) {
    const sec = Math.max(0, Math.round(seconds || 0));
    if (sec < 60) return `${sec}s`;
    const m = Math.floor(sec / 60), rest = sec % 60;
    if (m < 60) return rest ? `${m}m ${rest}s` : `${m}m`;
    const h = Math.floor(m / 60);
    return `${h}h ${m % 60}m`;
  }

  const SOURCE_LABELS = { widget: 'Widget', whatsapp: 'WhatsApp', test: 'Test chat' };

  const EMPTY_FILTERS = {
    q: '', agentId: '', source: '', from: '', to: '',
    minSeconds: '', maxSeconds: '', minMessages: '',
  };

  function InteractionsView({ agents, user, onOpenAgent }) {
    const PAGE_SIZE = 25;
    const [filters, setFilters] = useState(EMPTY_FILTERS);
    const [sort, setSort]       = useState({ sort: 'started', dir: 'desc' });
    const [offset, setOffset]   = useState(0);
    const [scopeAll, setScopeAll] = useState(false);
    const [data, setData]      = useState(null);
    const [error, setError]    = useState(null);
    const [loading, setLoading] = useState(true);
    const [openSession, setOpenSession] = useState(null);

    const set = (key, val) => { setFilters(f => ({ ...f, [key]: val })); setOffset(0); };
    const activeFilters = Object.keys(EMPTY_FILTERS).filter(k => filters[k] !== '').length;

    // Filters are typed into, so debounce before hitting the API.
    useEffect(() => {
      let live = true;
      setLoading(true);
      const t = setTimeout(() => {
        apiListInteractions({
          ...filters,
          sort: sort.sort, dir: sort.dir,
          limit: PAGE_SIZE, offset,
          scope: scopeAll ? 'all' : '',
        })
          .then(d => { if (live) { setData(d); setError(null); setLoading(false); } })
          .catch(err => { if (live) { setError(err.message); setLoading(false); } });
      }, 300);
      return () => { live = false; clearTimeout(t); };
    }, [filters, sort, offset, scopeAll]);

    /* ---- one conversation ---- */
    if (openSession) {
      const msgs = (openSession.messages || []).filter(m => m.role === 'user' || m.role === 'assistant');
      return (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24, flexWrap: 'wrap' }}>
            <button onClick={() => setOpenSession(null)} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13, border: '1px solid var(--border)' }}>← Back</button>
            <div style={{ width: 1, height: 20, background: 'var(--border)' }} />
            <AvatarDisplay value={openSession.agent_avatar || '🤖'} size={28} />
            <div>
              <div style={{ fontWeight: 800, fontSize: 18 }}>{openSession.agent_name}</div>
              <div style={{ color: 'var(--text-muted)', fontSize: 12, marginTop: 2 }}>
                {SOURCE_LABELS[openSession.source] || openSession.source}
                &nbsp;·&nbsp;{new Date(openSession.started_at).toLocaleString()}
                &nbsp;·&nbsp;{fmtSessionDuration(openSession.duration_seconds)}
                &nbsp;·&nbsp;{msgs.length} messages
              </div>
            </div>
            {onOpenAgent && (
              <button onClick={() => onOpenAgent(openSession.agent_id)}
                style={{ marginLeft: 'auto', background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13, border: '1px solid var(--border)' }}>
                Open agent
              </button>
            )}
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, maxWidth: 760 }}>
            {msgs.map((m, i) => (
              <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: m.role === 'user' ? 'flex-end' : 'flex-start' }}>
                <div style={{
                  maxWidth: '80%', padding: '10px 14px', fontSize: 14, lineHeight: 1.5,
                  whiteSpace: 'pre-wrap', wordBreak: 'break-word',
                  borderRadius: m.role === 'user' ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
                  background: m.role === 'user' ? 'var(--primary)' : 'var(--bg-card)',
                  color: m.role === 'user' ? '#0a0a0a' : 'var(--text)',
                  border: m.role === 'assistant' ? '1px solid var(--border)' : 'none',
                }}>{typeof m.content === 'string' ? m.content : JSON.stringify(m.content)}</div>
                <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 3, padding: '0 4px' }}>
                  {m.role === 'user' ? 'User' : openSession.agent_name}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ---- list ---- */
    const sessions = data?.sessions || [];
    const total = data?.total || 0;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    const currentPage = Math.floor(offset / PAGE_SIZE);

    // Agent options: the user's own agents, plus any agent seen in the current
    // page (an admin looking at every user's conversations).
    const agentOptions = [...(agents || []).map(a => ({ id: a.id, name: a.name }))];
    sessions.forEach(sx => {
      if (!agentOptions.some(o => o.id === sx.agent_id)) agentOptions.push({ id: sx.agent_id, name: sx.agent_name || sx.agent_id });
    });

    const sourceOptions = (data?.sources || []).map(sx => sx.source);

    const inputStyle = {
      width: '100%', fontSize: 12, padding: '5px 7px', borderRadius: 'var(--r-sm)',
      background: 'var(--bg-input)', border: '1px solid var(--border)', color: 'var(--text)',
    };
    const thStyle = { padding: '10px 14px', textAlign: 'left', fontSize: 12, color: 'var(--text-2)', fontWeight: 700, whiteSpace: 'nowrap' };
    const tdStyle = { padding: '11px 14px', fontSize: 13, verticalAlign: 'middle' };

    function sortable(key, label) {
      const active = sort.sort === key;
      return (
        <button
          onClick={() => setSort(sx => ({ sort: key, dir: sx.sort === key && sx.dir === 'desc' ? 'asc' : 'desc' }))}
          title={`Sort by ${label.toLowerCase()}`}
          style={{ background: 'transparent', padding: 0, color: active ? 'var(--primary)' : 'var(--text-2)', fontSize: 12, fontWeight: 700, display: 'inline-flex', alignItems: 'center', gap: 4 }}
        >
          {label}<span style={{ opacity: active ? 1 : 0.25 }}>{active && sort.dir === 'asc' ? '↑' : '↓'}</span>
        </button>
      );
    }

    return (
      <div>
        <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginBottom: 22, gap: 16, flexWrap: 'wrap' }}>
          <div>
            <div style={{ fontWeight: 800, fontSize: 26, letterSpacing: '-0.02em' }}>Interactions</div>
            <div style={{ color: 'var(--text-muted)', fontSize: 13, marginTop: 4, fontWeight: 500 }}>
              {loading && !data ? 'Loading…'
                : `${total} conversation${total !== 1 ? 's' : ''}${activeFilters ? ` matching ${activeFilters} filter${activeFilters !== 1 ? 's' : ''}` : ''}`}
            </div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            {user?.isAdmin && (
              <button onClick={() => { setScopeAll(v => !v); setOffset(0); }}
                title="Admins can list conversations across every user"
                style={{ fontSize: 12, fontWeight: 600, padding: '6px 12px', borderRadius: 'var(--r-md)', border: `1px solid ${scopeAll ? 'var(--primary)' : 'var(--border)'}`, background: scopeAll ? 'var(--primary-dim)' : 'var(--bg-card)', color: scopeAll ? 'var(--primary)' : 'var(--text-2)' }}>
                {scopeAll ? 'All users' : 'My agents'}
              </button>
            )}
            {activeFilters > 0 && (
              <button onClick={() => { setFilters(EMPTY_FILTERS); setOffset(0); }}
                style={{ fontSize: 12, fontWeight: 600, padding: '6px 12px', borderRadius: 'var(--r-md)', border: '1px solid var(--border)', background: 'var(--bg-card)', color: 'var(--text-2)' }}>
                Clear filters
              </button>
            )}
          </div>
        </div>

        {error ? (
          <div style={{ padding: 20, borderRadius: 'var(--r-lg)', border: '1px solid rgba(239,68,68,0.3)', background: 'rgba(239,68,68,0.08)', color: 'var(--danger)', fontSize: 13 }}>{error}</div>
        ) : (
          <>
            <div style={{ background: 'var(--bg-card)', borderRadius: 'var(--r-lg)', border: '1px solid var(--border)', overflowX: 'auto' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 900 }}>
                <thead>
                  <tr style={{ borderBottom: '1px solid var(--border)', background: 'var(--bg-panel)' }}>
                    <th style={thStyle}>Agent</th>
                    {scopeAll && <th style={thStyle}>Owner</th>}
                    <th style={thStyle}>Channel</th>
                    <th style={thStyle}>{sortable('started', 'Started')}</th>
                    <th style={thStyle}>{sortable('duration', 'Duration')}</th>
                    <th style={thStyle}>{sortable('messages', 'Messages')}</th>
                    <th style={thStyle}>Conversation</th>
                  </tr>
                  {/* per-column filters */}
                  <tr style={{ borderBottom: '1px solid var(--border)', background: 'var(--bg-panel)' }}>
                    <th style={{ padding: '0 14px 10px' }}>
                      <select value={filters.agentId} onChange={e => set('agentId', e.target.value)} style={inputStyle}>
                        <option value="">All agents</option>
                        {agentOptions.map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
                      </select>
                    </th>
                    {scopeAll && <th style={{ padding: '0 14px 10px' }} />}
                    <th style={{ padding: '0 14px 10px' }}>
                      <select value={filters.source} onChange={e => set('source', e.target.value)} style={inputStyle}>
                        <option value="">All</option>
                        {sourceOptions.map(sx => <option key={sx} value={sx}>{SOURCE_LABELS[sx] || sx}</option>)}
                      </select>
                    </th>
                    <th style={{ padding: '0 14px 10px' }}>
                      <div style={{ display: 'flex', gap: 4 }}>
                        <input type="date" value={filters.from} onChange={e => set('from', e.target.value)} title="From" style={inputStyle} />
                        <input type="date" value={filters.to} onChange={e => set('to', e.target.value)} title="To" style={inputStyle} />
                      </div>
                    </th>
                    <th style={{ padding: '0 14px 10px' }}>
                      <div style={{ display: 'flex', gap: 4 }}>
                        <input type="number" min="0" placeholder="min s" value={filters.minSeconds} onChange={e => set('minSeconds', e.target.value)} style={inputStyle} />
                        <input type="number" min="0" placeholder="max s" value={filters.maxSeconds} onChange={e => set('maxSeconds', e.target.value)} style={inputStyle} />
                      </div>
                    </th>
                    <th style={{ padding: '0 14px 10px' }}>
                      <input type="number" min="0" placeholder="min" value={filters.minMessages} onChange={e => set('minMessages', e.target.value)} style={inputStyle} />
                    </th>
                    <th style={{ padding: '0 14px 10px' }}>
                      <input type="search" placeholder="Search every message…" value={filters.q} onChange={e => set('q', e.target.value)} style={inputStyle} />
                    </th>
                  </tr>
                </thead>
                <tbody>
                  {loading && (
                    <tr><td colSpan={scopeAll ? 7 : 6} style={{ ...tdStyle, color: 'var(--text-muted)', padding: 28, textAlign: 'center' }}>Loading…</td></tr>
                  )}
                  {!loading && sessions.length === 0 && (
                    <tr><td colSpan={scopeAll ? 7 : 6} style={{ ...tdStyle, color: 'var(--text-muted)', padding: 40, textAlign: 'center' }}>
                      {activeFilters ? 'No conversations match these filters.' : 'No conversations yet.'}
                    </td></tr>
                  )}
                  {!loading && sessions.map((sx, i) => {
                    const msgs = sx.messages || [];
                    const firstUser = msgs.find(m => m.role === 'user');
                    const preview = typeof firstUser?.content === 'string' ? firstUser.content : '—';
                    return (
                      <tr key={sx.id}
                        onClick={() => setOpenSession(sx)}
                        style={{ borderBottom: i < sessions.length - 1 ? '1px solid var(--border)' : 'none', cursor: 'pointer' }}
                        onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                        onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                      >
                        <td style={tdStyle}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
                            <AvatarDisplay value={sx.agent_avatar || '🤖'} size={26} />
                            <span style={{ fontWeight: 600 }}>{sx.agent_name || '—'}</span>
                          </div>
                        </td>
                        {scopeAll && <td style={{ ...tdStyle, color: 'var(--text-2)' }}>{sx.owner_username || '—'}</td>}
                        <td style={tdStyle}>
                          <span style={{ fontSize: 11, fontWeight: 700, padding: '3px 8px', borderRadius: 'var(--r-sm)', background: 'var(--bg-hover)', color: 'var(--text-2)', border: '1px solid var(--border)', whiteSpace: 'nowrap' }}>
                            {SOURCE_LABELS[sx.source] || sx.source}
                          </span>
                        </td>
                        <td style={{ ...tdStyle, color: 'var(--text-2)', whiteSpace: 'nowrap' }}>
                          {new Date(sx.started_at).toLocaleDateString()} {new Date(sx.started_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                        </td>
                        <td style={{ ...tdStyle, color: 'var(--text-2)', whiteSpace: 'nowrap' }}>{fmtSessionDuration(sx.duration_seconds)}</td>
                        <td style={{ ...tdStyle, color: 'var(--text-2)' }}>{sx.message_count}</td>
                        <td style={{ ...tdStyle, maxWidth: 340 }}>
                          <div style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: 'var(--text-2)' }}>{preview}</div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {totalPages > 1 && (
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, marginTop: 20 }}>
                <button onClick={() => setOffset(Math.max(0, (currentPage - 1) * PAGE_SIZE))} disabled={currentPage === 0}
                  style={{ padding: '6px 14px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: currentPage === 0 ? 'var(--text-muted)' : 'var(--text)', fontSize: 13 }}>← Prev</button>
                <span style={{ fontSize: 13, color: 'var(--text-2)' }}>{currentPage + 1} / {totalPages}</span>
                <button onClick={() => setOffset((currentPage + 1) * PAGE_SIZE)} disabled={currentPage >= totalPages - 1}
                  style={{ padding: '6px 14px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: currentPage >= totalPages - 1 ? 'var(--text-muted)' : 'var(--text)', fontSize: 13 }}>Next →</button>
              </div>
            )}
          </>
        )}
      </div>
    );
  }

  /* ─────────────────── SIDEBAR ─────────────────── */
  function Sidebar({ activeNav, onNav, user, onLogout }) {
    const items = [
      { id: 'home', label: 'Home', icon: Icons.home },
      { id: 'interactions', label: 'Interactions', icon: Icons.interactions },
      { id: 'docs', label: 'Documentation', icon: Icons.docs },
      { id: 'settings', label: 'Settings', icon: Icons.settings },
      ...(user && user.isAdmin ? [{ id: 'admin', label: 'Admin', icon: Icons.admin }] : []),

  /* ─────────────────── LOGIN GATE ─────────────────── */
  function LoginGate({ onLogin }) {
    const [mode, setMode] = useState('login'); // 'login' | 'register'
    const [username, setUsername] = useState('');
    const [password, setPassword] = useState('');
    const [phone, setPhone] = useState('');
    const [error, setError] = useState('');
    const [loading, setLoading] = useState(false);

    function switchMode(m) {
      setMode(m);
      setError('');
      setUsername('');
      setPassword('');
      setPhone('');
    }

    async function handleLogin() {
      if (!username || !password) return;
      setLoading(true);
      setError('');
      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (resp.ok) {
          const data = await resp.json();
          sessionStorage.setItem('agentforge_auth', JSON.stringify(data));
          onLogin(data);
        } else {
          setError('Invalid username or password.');
        }
      } catch {
        setError('Could not connect to server.');
      } finally {
        setLoading(false);
      }
    }

    async function handleRegister() {
      if (!username || !password || !phone) return;
      setLoading(true);
      setError('');
      try {
        const resp = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, phone }),
        });
        if (resp.ok) {
          const data = await resp.json();
          sessionStorage.setItem('agentforge_auth', JSON.stringify(data));
          onLogin(data);
        } else {
          const body = await resp.json().catch(() => ({}));
          setError(body.error || 'Registration failed.');
        }
      } catch {
        setError('Could not connect to server.');
      } finally {
        setLoading(false);
      }
    }

    const isLogin = mode === 'login';
    const canSubmit = isLogin ? (username && password) : (username && password && phone);

  /* ─────────────────── ADMIN: CHAT HISTORY ─────────────────── */
  function AdminChatHistoryView({ onBack }) {
    const PAGE_SIZE = 20;
    const [data, setData]           = useState(null);
    const [offset, setOffset]       = useState(0);
    const [openSession, setOpenSession] = useState(null);

    function load(off) {
      setData(null);
      adminListChatSessions({ limit: PAGE_SIZE, offset: off })
        .then(d => { setData(d); setOffset(off); })
        .catch(() => setData({ sessions: [], total: 0 }));
    }

    useEffect(() => { load(0); }, []);

    if (openSession) {
      const msgs = openSession.messages || [];
      return (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
            <button onClick={() => setOpenSession(null)} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13 }}>← Back</button>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, fontWeight: 700, fontSize: 20 }}>
                <div style={{ width: 32, height: 32, borderRadius: '50%', background: 'var(--bg-panel)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, overflow: 'hidden' }}><AvatarDisplay value={openSession.agent_avatar || '🤖'} size={32} /></div>
                {openSession.agent_name}
              </div>
              <div style={{ color: 'var(--text-2)', fontSize: 12, marginTop: 2 }}>
                {new Date(openSession.started_at).toLocaleString()} · {msgs.filter(m => m.role === 'user').length} user messages
              </div>
            </div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, maxWidth: 720 }}>
            {msgs.filter(m => m.role === 'user' || m.role === 'assistant').map((m, i) => (
              <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: m.role === 'user' ? 'flex-end' : 'flex-start' }}>
                <div style={{
                  maxWidth: '80%', padding: '10px 14px', fontSize: 14, lineHeight: 1.5,
                  whiteSpace: 'pre-wrap', wordBreak: 'break-word', borderRadius: m.role === 'user' ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
                  background: m.role === 'user' ? 'var(--primary)' : 'var(--bg-card)',
                  color: m.role === 'user' ? '#fff' : 'var(--text)',
                  border: m.role === 'assistant' ? '1px solid var(--border)' : 'none',
                }}>{m.content}</div>
                <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 3, padding: '0 4px' }}>
                  {m.role === 'user' ? 'User' : openSession.agent_name}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const total = data?.total || 0;
    const totalPages = Math.ceil(total / PAGE_SIZE);
    const currentPage = Math.floor(offset / PAGE_SIZE);

    return (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
          <button onClick={onBack} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13 }}>← Back</button>
          <div>
            <div style={{ fontWeight: 700, fontSize: 22 }}>Chat History</div>
            {data && <div style={{ color: 'var(--text-2)', fontSize: 13, marginTop: 2 }}>{total} conversation{total !== 1 ? 's' : ''} across all agents</div>}
          </div>
        </div>

        {!data ? (
          <div style={{ color: 'var(--text-2)', padding: 40 }}>Loading…</div>
        ) : data.sessions.length === 0 ? (
          <div style={{ textAlign: 'center', color: 'var(--text-muted)', paddingTop: 60, fontSize: 14 }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>💬</div>
            No conversations yet.
          </div>
        ) : (
          <>
            <div style={{ background: 'var(--bg-card)', borderRadius: 'var(--r-lg)', border: '1px solid var(--border)', overflow: 'hidden' }}>
              {data.sessions.map((s, i) => {
                const msgs = s.messages || [];
                const userMsgs = msgs.filter(m => m.role === 'user');
                const preview = userMsgs[0]?.content?.slice(0, 80) || '—';
                return (
                  <div key={s.id}
                    onClick={() => setOpenSession(s)}
                    style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '14px 18px', cursor: 'pointer', borderBottom: i < data.sessions.length - 1 ? '1px solid var(--border)' : 'none' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                  >
                    <div style={{ width: 40, height: 40, borderRadius: '50%', background: 'var(--bg-panel)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, overflow: 'hidden' }}><AvatarDisplay value={s.agent_avatar || '🤖'} size={40} /></div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 14, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', marginBottom: 3 }}>{preview}</div>
                      <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>
                        <span style={{ color: 'var(--text-2)', fontWeight: 500 }}>{s.agent_name}</span>
                        &nbsp;·&nbsp;{userMsgs.length} message{userMsgs.length !== 1 ? 's' : ''}
                        &nbsp;·&nbsp;{new Date(s.started_at).toLocaleDateString()} {new Date(s.started_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                      </div>
                    </div>
                    <div style={{ fontSize: 16, color: 'var(--text-muted)', flexShrink: 0 }}>›</div>
                  </div>
                );
              })}
            </div>

            {totalPages > 1 && (
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, marginTop: 20 }}>
                <button onClick={() => load((currentPage - 1) * PAGE_SIZE)} disabled={currentPage === 0}
                  style={{ padding: '6px 14px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: currentPage === 0 ? 'var(--text-muted)' : 'var(--text)', cursor: currentPage === 0 ? 'default' : 'pointer', fontSize: 13 }}>← Prev</button>
                <span style={{ fontSize: 13, color: 'var(--text-2)' }}>{currentPage + 1} / {totalPages}</span>
                <button onClick={() => load((currentPage + 1) * PAGE_SIZE)} disabled={currentPage >= totalPages - 1}
                  style={{ padding: '6px 14px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', border: '1px solid var(--border)', color: currentPage >= totalPages - 1 ? 'var(--text-muted)' : 'var(--text)', cursor: currentPage >= totalPages - 1 ? 'default' : 'pointer', fontSize: 13 }}>Next →</button>
              </div>
            )}
          </>
        )}
      </div>
    );
  }

    const [tab, setTab]             = useState('users');
    const [users, setUsers]         = useState(null);
    const [resetting, setResetting] = useState(null);
    const [resetResult, setResetResult] = useState({});
    const [deleting, setDeleting]   = useState(null);   // userId awaiting confirmation
    const [confirmText, setConfirmText] = useState('');
    const [deleteBusy, setDeleteBusy] = useState(false);
    const [deleteError, setDeleteError] = useState({});

    useEffect(() => {
      adminListUsers().then(setUsers).catch(() => setUsers([]));
    }, []);

    async function handleDelete(u) {
      setDeleteBusy(true);
      setDeleteError(e => ({ ...e, [u.id]: null }));
      try {
        await adminDeleteUser(u.id, confirmText);
        setUsers(list => list.filter(x => x.id !== u.id));
        setDeleting(null);
        setConfirmText('');
      } catch (err) {
        setDeleteError(e => ({ ...e, [u.id]: err.message }));
      } finally {
        setDeleteBusy(false);
      }
    }

    async function handleReset(userId) {
      setResetting(userId);
      try {
        const { tempPassword } = await adminResetPassword(userId);
        setResetResult(r => ({ ...r, [userId]: tempPassword }));
      } catch {
        setResetResult(r => ({ ...r, [userId]: 'Error' }));
      } finally {
        setResetting(null);
      }
    }

    const tabStyle = (id) => ({
      padding: '7px 18px', borderRadius: 'var(--r-md)', fontSize: 13, fontWeight: tab === id ? 700 : 400,
      background: tab === id ? 'var(--primary)' : 'var(--bg-card)',
      color: tab === id ? '#fff' : 'var(--text-2)',
      border: `1px solid ${tab === id ? 'var(--primary)' : 'var(--border)'}`,
      cursor: 'pointer',
    });

    if (tab === 'history') {
      return <AdminChatHistoryView onBack={() => setTab('users')} />;
    }

    if (!users) return <div style={{ color: 'var(--text-2)', padding: 40 }}>Loading…</div>;

    return (
      <div>
        <div style={{ marginBottom: 24 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12 }}>
            <div style={{ fontWeight: 700, fontSize: 24 }}>Admin</div>
            <div style={{ display: 'flex', gap: 8, marginLeft: 'auto' }}>
              <button onClick={() => setTab('users')} style={tabStyle('users')}>Users</button>
              <button onClick={() => setTab('history')} style={tabStyle('history')}>💬 Chat History</button>
            </div>
          </div>
          <div style={{ color: 'var(--text-2)', fontSize: 14 }}>{users.length} registered user{users.length !== 1 ? 's' : ''}</div>
        </div>
        <div style={{ background: 'var(--bg-card)', borderRadius: 'var(--r-lg)', border: '1px solid var(--border)', overflow: 'hidden' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse' }}>
            <thead>
              <tr style={{ borderBottom: '1px solid var(--border)', background: 'var(--bg-panel)' }}>
                {['Username', 'Phone', 'Role', 'Agents', 'Last Login', 'Actions'].map(h => (
                  <th key={h} style={{ padding: '12px 16px', textAlign: 'left', fontSize: 12, color: 'var(--text-2)', fontWeight: 600 }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {users.map((u, i) => (
                <tr key={u.id} style={{ borderBottom: i < users.length - 1 ? '1px solid var(--border)' : 'none' }}>
                  <td style={{ padding: '12px 16px', fontWeight: 600 }}>
                    <button onClick={() => onSelectUser(u)} style={{ background: 'transparent', color: 'var(--text)', fontWeight: 600, textDecoration: 'none', padding: 0 }}>
                      {u.username}
                    </button>
                  </td>
                  <td style={{ padding: '12px 16px', color: 'var(--text-2)', fontSize: 13 }}>{u.phone || '—'}</td>
                  <td style={{ padding: '12px 16px' }}>
                    {u.is_admin
                      ? <span style={{ background: 'rgba(239,159,39,0.15)', color: 'var(--primary)', borderRadius: 'var(--r-sm)', padding: '2px 8px', fontSize: 12 }}>Admin</span>
                      : <span style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', borderRadius: 'var(--r-sm)', padding: '2px 8px', fontSize: 12 }}>User</span>
                    }
                  </td>
                  <td style={{ padding: '12px 16px', color: 'var(--text-2)' }}>{u.agent_count}</td>
                  <td style={{ padding: '12px 16px', color: 'var(--text-2)', fontSize: 13 }}>
                    {u.last_login_at ? new Date(u.last_login_at).toLocaleString() : '—'}
                  </td>
                  <td style={{ padding: '12px 16px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                      <button onClick={() => onSelectUser(u)}
                        style={{ fontSize: 12, padding: '4px 10px', borderRadius: 'var(--r-sm)', background: 'var(--bg-hover)', color: 'var(--text-2)', border: '1px solid var(--border)' }}>
                        View Agents
                      </button>
                      <button onClick={() => handleReset(u.id)} disabled={resetting === u.id}
                        style={{ fontSize: 12, padding: '4px 10px', borderRadius: 'var(--r-sm)', background: 'transparent', color: 'var(--warning)', border: '1px solid var(--warning)' }}>
                        {resetting === u.id ? '…' : 'Reset Password'}
                      </button>
                      {resetResult[u.id] && (
                        <span style={{ fontSize: 12, color: 'var(--success)', background: 'rgba(34,197,94,0.1)', padding: '3px 8px', borderRadius: 'var(--r-sm)' }}>
                          New: {resetResult[u.id]}
                        </span>
                      )}
                      {deleting === u.id ? (
                        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                          <input
                            autoFocus
                            value={confirmText}
                            onChange={e => setConfirmText(e.target.value)}
                            placeholder={`type "${u.username}"`}
                            style={{ fontSize: 12, padding: '4px 8px', borderRadius: 'var(--r-sm)', background: 'var(--bg-input)', border: '1px solid var(--border)', color: 'var(--text)', width: 150 }}
                          />
                          <button onClick={() => handleDelete(u)} disabled={deleteBusy || confirmText !== u.username}
                            style={{ fontSize: 12, padding: '4px 10px', borderRadius: 'var(--r-sm)', background: confirmText === u.username ? 'var(--danger)' : 'var(--bg-hover)', color: confirmText === u.username ? '#fff' : 'var(--text-muted)', border: '1px solid var(--border)' }}>
                            {deleteBusy ? '…' : 'Delete forever'}
                          </button>
                          <button onClick={() => { setDeleting(null); setConfirmText(''); }}
                            style={{ fontSize: 12, padding: '4px 10px', borderRadius: 'var(--r-sm)', background: 'var(--bg-hover)', color: 'var(--text-2)', border: '1px solid var(--border)' }}>
                            Cancel
                          </button>
                        </div>
                      ) : (
                        <button onClick={() => { setDeleting(u.id); setConfirmText(''); setDeleteError(e => ({ ...e, [u.id]: null })); }}
                          title={`Delete ${u.username} with all their agents and conversations`}
                          style={{ fontSize: 12, padding: '4px 10px', borderRadius: 'var(--r-sm)', background: 'transparent', color: 'var(--danger)', border: '1px solid rgba(239,68,68,0.35)' }}>
                          Delete User
                        </button>
                      )}
                      {deleteError[u.id] && (
                        <span style={{ fontSize: 12, color: 'var(--danger)' }}>{deleteError[u.id]}</span>
                      )}
                    </div>
                    {deleting === u.id && (
                      <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 6, maxWidth: 340, lineHeight: 1.5 }}>
                        Deletes the user, their {u.agent_count} agent{u.agent_count !== 1 ? 's' : ''}, and every conversation, document and channel those agents own. This cannot be undone.
                      </div>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  /* ─────────────────── ADMIN: USER AGENTS ─────────────────── */
  function UserAgentsView({ targetUser, myAgents, onBack }) {
    const [agents, setAgents] = useState(null);
    const [duplicating, setDuplicating] = useState(false);
    const [showDupPicker, setShowDupPicker] = useState(false);
    const [editingAgent, setEditingAgent] = useState(null);

    useEffect(() => {
      reload();
    }, [targetUser.id]);

    function reload() {
      adminListUserAgents(targetUser.id).then(setAgents).catch(() => setAgents([]));
    }

    const saveAdminAgent = useCallback(async (agent) => {
      await adminUpdateAgent(agent).catch(() => {});
    }, []);
    const saveAdminAgentDebounced = useDebounce(saveAdminAgent, 600);

    function handleAdminUpdate(agent) {
      setEditingAgent(agent);
      saveAdminAgentDebounced(agent);
    }

    async function handleDelete(agentId) {
      if (!confirm('Delete this agent?')) return;
      await adminDeleteAgent(agentId).catch(() => {});
      reload();
    }

    async function handleDuplicateTo(sourceAgentId) {
      setDuplicating(true);
      setShowDupPicker(false);
      try {
        await adminDuplicateTo(sourceAgentId, targetUser.id);
        reload();
      } catch {
        alert('Failed to duplicate agent.');
      } finally {
        setDuplicating(false);
      }
    }

    if (editingAgent) {
      return (
        <AgentEditor
          agent={editingAgent}
          onUpdate={handleAdminUpdate}
          onBack={() => { setEditingAgent(null); reload(); }}
        />
      );
    }

    return (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
          <button onClick={onBack} style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13 }}>← Back</button>
          <div>
            <div style={{ fontWeight: 700, fontSize: 22 }}>Agents of {targetUser.username}</div>
            {agents && <div style={{ color: 'var(--text-2)', fontSize: 13 }}>{agents.length} agent{agents.length !== 1 ? 's' : ''}</div>}
          </div>
          <div style={{ marginLeft: 'auto', position: 'relative' }}>
            <button onClick={() => setShowDupPicker(v => !v)} disabled={duplicating}
              style={{ background: 'var(--primary)', color: '#fff', padding: '8px 16px', borderRadius: 'var(--r-md)', fontWeight: 600, fontSize: 13 }}>
              {duplicating ? 'Duplicating…' : '＋ Duplicate My Agent Here'}
            </button>
            {showDupPicker && (
              <div style={{ position: 'absolute', right: 0, top: '110%', background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 'var(--r-lg)', padding: 8, minWidth: 220, zIndex: 100, boxShadow: 'var(--shadow)' }}>
                <div style={{ fontSize: 12, color: 'var(--text-2)', padding: '4px 8px 8px' }}>Pick one of your agents to copy:</div>
                {myAgents.length === 0 && <div style={{ fontSize: 13, color: 'var(--text-muted)', padding: '8px' }}>No agents to copy</div>}
                {myAgents.map(a => (
                  <button key={a.id} onClick={() => handleDuplicateTo(a.id)}
                    style={{ display: 'block', width: '100%', textAlign: 'left', padding: '8px 12px', borderRadius: 'var(--r-md)', fontSize: 13, background: 'transparent', color: 'var(--text)' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                  >
                    {a.avatar || '🤖'} {a.name}
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>

        {!agents ? (
          <div style={{ color: 'var(--text-2)' }}>Loading…</div>
        ) : agents.length === 0 ? (
          <EmptyState icon="🤖" title="No agents" subtitle="This user has no agents yet" />
        ) : (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(260px,1fr))', gap: 16 }}>
            {agents.map(a => (
              <div key={a.id} style={{ background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 'var(--r-lg)', padding: 20 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
                  <AvatarDisplay value={a.avatar || '🤖'} size={28} />
                  <div style={{ fontWeight: 600, flex: 1 }}>{a.name}</div>
                </div>
                <div style={{ color: 'var(--text-2)', fontSize: 12, marginBottom: 14, lineHeight: 1.4, minHeight: 32 }}>
                  {a.basePrompt ? a.basePrompt.slice(0, 80) + (a.basePrompt.length > 80 ? '…' : '') : <i>No description</i>}
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button onClick={() => setEditingAgent(a)}
                    style={{ flex: 1, fontSize: 12, padding: '6px', borderRadius: 'var(--r-sm)', background: 'var(--bg-hover)', color: 'var(--text-2)', border: '1px solid var(--border)' }}>
                    ✏️ Edit
                  </button>
                  <button onClick={() => handleDelete(a.id)}
                    style={{ flex: 1, fontSize: 12, padding: '6px', borderRadius: 'var(--r-sm)', background: 'transparent', color: 'var(--danger)', border: '1px solid var(--danger)' }}>
                    🗑️ Delete
                  </button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  /* ─────────────────── APP ─────────────────── */
  /* ─────────────────── SETTINGS PANEL ─────────────────── */

  function App({ user, onLogout, theme, onToggleTheme }) {
    const [state, dispatch] = useReducer(reducer, {
      agents: [],
      view: 'list',
      editingId: null,
      chatAgentId: null,
      chatInitialSessionId: null,
    });
    const [nav, setNav] = useState('home');
    const [loading, setLoading] = useState(true);
    const [adminSelectedUser, setAdminSelectedUser] = useState(null);

    const [editorTab, setEditorTab] = useState(null);

    // Load agents on mount
    useEffect(() => {
      apiList().then(agents => {
        dispatch({ type: 'HYDRATE', agents });
        setLoading(false);
      }).catch(() => {
        setLoading(false);
      });
    }, []);

    // Returning from the Gmail OAuth flow: reopen the agent whose mailbox was
    // just connected, on the tab the button lives on.
    useEffect(() => {
      const params = new URLSearchParams(window.location.search);
      const connectedAgent = params.get('gmail_connected') ? params.get('agent') : null;
      const gmailError = params.get('gmail_error');

      if (connectedAgent) {
        setNav('home');
        setEditorTab('tools');
        dispatch({ type: 'SET_VIEW', view: 'editor', editingId: connectedAgent });
      }
      if (gmailError) alert(`Gmail connection failed: ${gmailError}`);
      if (connectedAgent || gmailError) {
        window.history.replaceState({}, '', window.location.pathname);
      }
    }, []);

    // Debounced save
    const saveErrorRef = useRef('');
    const saveAgent = useCallback(async (agent) => {
      dispatch({ type: 'UPDATE_AGENT', agent });
      try {
        await apiUpdate(agent);
        saveErrorRef.current = '';
      } catch (err) {
        // The save is debounced and otherwise invisible, so a rejected change
        // (e.g. a WhatsApp number already connected to another agent) has to be
        // reported here or the user would think it stuck. Every later keystroke
        // retries the same rejected save, so only report a message once.
        if (err && err.status === 409 && err.message !== saveErrorRef.current) {
          saveErrorRef.current = err.message;
          alert(err.message);
        }
      }
    }, []);
    const saveAgentDebounced = useDebounce(saveAgent, 600);

    function handleUpdate(agent) {
      dispatch({ type: 'UPDATE_AGENT', agent });
      saveAgentDebounced(agent);
    }

    async function handleCreate() {
      const agent = makeAgent();
      dispatch({ type: 'UPDATE_AGENT', agent });
      dispatch({ type: 'SET_VIEW', view: 'editor', editingId: agent.id });
      await apiCreate(agent).catch(() => {});
      dispatch({ type: 'HYDRATE', agents: [] });
      apiList().then(agents => dispatch({ type: 'HYDRATE', agents })).catch(() => {});
    }

    async function handleDelete(id) {
      dispatch({ type: 'DELETE_AGENT', id });
      await apiDelete(id).catch(() => {});
    }

    async function handleDuplicate(id) {
      const src = state.agents.find(a => a.id === id);
      if (!src) return;
      const copy = { ...JSON.parse(JSON.stringify(src)), id: uid(), name: src.name + ' (Copy)', _isNew: true, createdAt: new Date().toISOString() };
      dispatch({ type: 'UPDATE_AGENT', agent: copy });
      dispatch({ type: 'HYDRATE', agents: [copy, ...state.agents] });
      setTimeout(() => dispatch({ type: 'CLEAR_NEW' }), 1400);   // highlight runs for 1.2s
      await apiCreate(copy).catch(() => {});
    }

    const editingAgent = state.agents.find(a => a.id === state.editingId);
    const chatAgent = state.agents.find(a => a.id === state.chatAgentId);

    if (loading) return (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', background: 'var(--bg-app)', flexDirection: 'column', gap: 14 }}>
        <div style={{ width: 36, height: 36, border: '2.5px solid var(--border)', borderTop: '2.5px solid var(--primary)', borderRadius: '50%', animation: 'spin 0.75s linear infinite' }} />
        <div style={{ color: 'var(--text-muted)', fontSize: 13, fontWeight: 500 }}>Loading agents…</div>
      </div>
    );

    function handleNav(id) {
      setNav(id);
      if (id === 'home') { dispatch({ type: 'SET_VIEW', view: 'list' }); setAdminSelectedUser(null); }
      if (id === 'interactions') setAdminSelectedUser(null);
      if (id === 'admin') setAdminSelectedUser(null);
    }

    return (
      <React.Fragment>
      <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
        <Sidebar activeNav={nav} onNav={handleNav} user={user} onLogout={onLogout} />
        <div style={{ flex: 1, overflowY: 'auto', padding: '32px 36px 80px', background: 'var(--bg-app)', position: 'relative' }}>
          <BgLogo size={560} wrapStyle={{ bottom: '-80px', right: '-80px' }} />
          {nav === 'interactions' ? (
            <InteractionsView
              agents={state.agents}
              user={user}
              onOpenAgent={id => { setNav('home'); setEditorTab(null); dispatch({ type: 'SET_VIEW', view: 'editor', editingId: id }); }}
            />
          ) : nav === 'docs' ? (
            <DocsView />
          ) : nav === 'admin' ? (
            adminSelectedUser ? (
              <UserAgentsView
                targetUser={adminSelectedUser}
                myAgents={state.agents}
                onBack={() => setAdminSelectedUser(null)}
              />
            ) : (
              <AdminView
                onSelectUser={setAdminSelectedUser}
                myAgents={state.agents}
              />
            )
          ) : nav === 'settings' ? (
            <SettingsPanel theme={theme} onToggleTheme={onToggleTheme} user={user} onLogout={onLogout} />
          ) : state.view === 'editor' && editingAgent ? (
            <AgentEditor
              agent={editingAgent}
              initialTab={editorTab}
              onUpdate={handleUpdate}
              onBack={() => { setEditorTab(null); dispatch({ type: 'SET_VIEW', view: 'list' }); }}
            />
          ) : (
            <AgentListView
              agents={state.agents}
              onNew={handleCreate}
              onEdit={id => dispatch({ type: 'SET_VIEW', view: 'editor', editingId: id })}
              onTest={id => dispatch({ type: 'OPEN_CHAT', id })}
              onDuplicate={handleDuplicate}
              onDelete={handleDelete}
              onExport={id => dispatch({ type: 'SET_VIEW', view: 'editor', editingId: id })}
            />
          )}
        </div>

        {chatAgent && <ChatTestDrawer agent={chatAgent} initialSessionId={state.chatInitialSessionId} onClose={() => dispatch({ type: 'CLOSE_CHAT' })} />}
      </div>
      <div style={{ position: 'fixed', bottom: 10, left: '50%', transform: 'translateX(-50%)', fontSize: 11, color: '#2a2a2a', letterSpacing: '2px', fontWeight: 500, pointerEvents: 'none', userSelect: 'none', zIndex: 1 }}>
        YOUR AGENTS. YOUR RULES.
      </div>
      </React.Fragment>
    );
  }

  /* ─────────────────── ROOT ─────────────────── */
  function Root() {
    const [user, setUser] = useState(() => getAuth());
    const [theme, setTheme] = useState(() => localStorage.getItem('agentforge_theme') || 'dark');

    useEffect(() => {
      document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : '');
      localStorage.setItem('agentforge_theme', theme);
    }, [theme]);

    function toggleTheme() { setTheme(t => t === 'dark' ? 'light' : 'dark'); }
    function handleLogin(data) { setUser(data); }
    function handleLogout() {
      sessionStorage.removeItem('agentforge_auth');
      setUser(null);
    }

    if (!user) return <LoginGate onLogin={handleLogin} />;
    return <App user={user} onLogout={handleLogout} theme={theme} onToggleTheme={toggleTheme} />;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
