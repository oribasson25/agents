  /* ─────────────────── CHAT TEST DRAWER ─────────────────── */
  function ChatTestDrawer({ agent, onClose, initialSessionId, fullScreen, branch, live }) {
    const openingMsg = { id: uid(), role: 'agent', content: agent.openingMessage || 'Hello!', timestamp: new Date(), isOpening: true };
    const [messages, setMessages] = useState([openingMsg]);
    const [input, setInput] = useState('');
    const [pending, setPending] = useState(false);
    const [activeSkillId, setActiveSkillId] = useState(null);
    const [showHistory, setShowHistory] = useState(!live && !!initialSessionId);
    const [viewingSession, setViewingSession] = useState(null); // { startedAt, messages }
    const [historyTick, setHistoryTick] = useState(0);
    const listRef = useRef(null);
    const inputRef = useRef(null);
    const currentSessionIdRef = useRef(uid());

    // Kept server-side, written after every turn: a tab closed mid-run used to
    // take the conversation with it, and that is exactly the run you wanted.
    const messagesRef = useRef(messages);
    useEffect(() => { messagesRef.current = messages; }, [messages]);
    useEffect(() => {
      if (live) return;   // a live conversation is stored by the server, as an interaction
      const msgs = messages.filter(m => m.role !== 'typing');
      if (!msgs.some(m => m.role === 'user')) return;   // nothing said yet
      saveTestSession(currentSessionIdRef.current, agent.id, msgs)
        .then(() => setHistoryTick(t => t + 1));
    }, [messages, agent.id, live]);

    const [history, setHistory] = useState([]);
    const [historyError, setHistoryError] = useState(null);
    useEffect(() => {
      if (live) return;   // the history panel lists manual tests, and this is not one
      let alive = true;
      apiListTestSessions(agent.id)
        .then(d => { if (alive) { setHistory(d.sessions || []); setHistoryError(null); } })
        .catch(err => { if (alive) setHistoryError(err.message); });
      return () => { alive = false; };
    }, [agent.id, historyTick, live]);

    // Server rows use assistant/user; the drawer renders agent/user.
    function asDrawerSession(row) {
      return {
        id: row.id,
        startedAt: new Date(row.started_at),
        messages: (row.messages || []).map(m => ({
          id: uid(),
          role: m.role === 'assistant' ? 'agent' : m.role,
          content: m.content,
          timestamp: new Date(row.started_at),
        })),
      };
    }

    // Auto-open a specific conversation when one was asked for
    useEffect(() => {
      if (!initialSessionId) return;
      const row = history.find(s => s.id === initialSessionId);
      if (row) setViewingSession(asDrawerSession(row));
    }, [initialSessionId, history]); // eslint-disable-line react-hooks/exhaustive-deps

    async function deleteSession(sid) {
      await deleteChatSession(sid).catch(() => {});
      if (viewingSession?.id === sid) setViewingSession(null);
      setHistoryTick(t => t + 1);
    }

    useEffect(() => {
      function onKey(e) { if (e.key === 'Escape') onClose(); }
      document.addEventListener('keydown', onKey);
      return () => document.removeEventListener('keydown', onKey);
    }, [onClose]);

    useEffect(() => {
      if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
    }, [messages]);

    useEffect(() => {
      if (!pending && inputRef.current) inputRef.current.focus();
    }, [pending]);

    async function sendMessage() {
      const text = input.trim();
      if (!text || pending) return;
      setInput('');
      inputRef.current?.focus();
      const t0 = performance.now();

      // Skill switch detection. A live conversation is run by the server, so
      // whatever it does with #skill is what a real user would see — this
      // banner would only be the browser guessing.
      const skillMatch = live ? null : text.match(/^#(\w+)/);
      let skillBanner = null;
      if (skillMatch) {
        const skill = agent.skills.find(s => s.name.toLowerCase() === skillMatch[1].toLowerCase());
        if (skill) { skillBanner = skill; setActiveSkillId(skill.id); }
      }

      const typingId = uid();
      const maskedText = applyDlp(text, agent.dlp || {});
      const dlpMasked = maskedText !== text;
      const newMsgs = [...messages, { id: uid(), role: 'user', content: maskedText, timestamp: new Date(), dlpMasked }];
      if (skillBanner) newMsgs.push({ id: uid(), role: 'skill', name: skillBanner.name, description: skillBanner.description, prompt: skillBanner.prompt, timestamp: new Date() });
      newMsgs.push({ id: typingId, role: 'typing' });
      setMessages(newMsgs);
      setPending(true);

      const history = messages
        .filter(m => (m.role === 'user' || m.role === 'agent') && !(live && m.isOpening))
        .map(m => ({ role: m.role === 'agent' ? 'assistant' : 'user', content: m.content }));
      history.push({ role: 'user', content: maskedText });

      try {
        /* Live: the server runs the agent, picks the branch by traffic, and
           stores the conversation as an interaction. Nothing of the turn
           happens in this tab beyond showing it. */
        if (live) {
          const answer = await liveChatTurn(agent.id, history, currentSessionIdRef.current);
          const dtLive = performance.now() - t0;
          setMessages(m => m.filter(x => x.id !== typingId).concat({
            id: uid(), role: 'agent', content: answer, timestamp: new Date(), durationMs: dtLive,
          }));
          return;
        }

        const content = await callWithTools(agent, history, async (toolName, toolInput) => {
          if (toolName === 'switch_skill') {
            const skill = (agent.skills || []).find(s => s.name.toLowerCase() === (toolInput.skill_name || '').toLowerCase());
            if (skill) {
              setActiveSkillId(skill.id);
              setMessages(m => m.filter(x => x.id !== typingId).concat(
                { id: uid(), role: 'skill', name: skill.name, description: skill.description, prompt: skill.prompt, timestamp: new Date() },
                { id: typingId, role: 'typing' }
              ));
            }
            return null;
          }
          const msgId = uid();
          setMessages(m => m.filter(x => x.id !== typingId).concat(
            { id: msgId, role: 'tool', name: toolName, input: toolInput, timestamp: new Date() },
            { id: typingId, role: 'typing' }
          ));
          return (result) => setMessages(m => m.map(x => x.id === msgId ? { ...x, result } : x));
        }, activeSkillId);
        const dt = performance.now() - t0;
        const next = m => m.filter(x => x.id !== typingId);
        setMessages(m => content?.trim() ? next(m).concat({ id: uid(), role: 'agent', content, timestamp: new Date(), durationMs: dt }) : next(m));
      } catch (err) {
        const dt = performance.now() - t0;
        setMessages(m => m.filter(x => x.id !== typingId).concat({ id: uid(), role: 'error', content: err.message, timestamp: new Date(), durationMs: dt }));
      } finally {
        setPending(false);
      }
    }

    const hasKey = accountApiUsable();

    return (
      <>
        {/* Backdrop */}
        <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', zIndex: 200 }} />
        {/* Drawer */}
        <div className="slide-in-right" style={{ position: 'fixed', top: 0, right: 0, bottom: 0, width: fullScreen ? '100vw' : 420, background: 'var(--bg-sidebar)', borderLeft: fullScreen ? 'none' : '1px solid var(--border)', zIndex: 201, display: 'flex', flexDirection: 'column', boxShadow: '-4px 0 24px rgba(0,0,0,0.5)', overflow: 'hidden' }}>
          {/* Header */}
          <div style={{ padding: '16px 20px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{ width: 40, height: 40, borderRadius: '50%', background: 'var(--bg-panel)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, overflow: 'hidden' }}><AvatarDisplay value={agent.avatar} size={40} /></div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 7, minWidth: 0 }}>
                <span dir="auto" style={{ fontWeight: 700, fontSize: 15, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{agent.name}</span>
                {live
                  ? <Chip tone="live">Live</Chip>
                  : branch && branch !== 'main'
                    ? <Chip mono tone="neutral">{branch}</Chip>
                    : null}
              </div>
              <div style={{ fontSize: 12, color: hasKey ? 'var(--success)' : 'var(--danger)', display: 'flex', alignItems: 'center', gap: 4 }}>
                <span style={{ width: 7, height: 7, borderRadius: '50%', background: hasKey ? 'var(--success)' : 'var(--danger)', display: 'inline-block' }} />
                {hasKey ? (accountApi().provider === 'ollama' ? `Ollama · ${accountApi().ollamaHost}` : accountApi().model) : (accountApi().provider === 'ollama' ? 'No Ollama host set' : 'No API key in Settings')}
              </div>
              <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 2 }}>
                {live
                  ? 'שיחה אמיתית — עוברת דרך הערוץ החי ונשמרת ב-Interactions'
                  : `בדיקה ידנית${branch && branch !== 'main' ? ` על ${branch}` : ''} — נשמרת ב-Manual tests`}
              </div>
            </div>
            {!live && (
              <IconBtn onClick={() => setShowHistory(h => !h)} title="Chat history" style={{ background: showHistory ? 'var(--bg-hover)' : undefined }}>🕐</IconBtn>
            )}
            <IconBtn onClick={onClose} title="Close">✕</IconBtn>
          </div>

          {/* History Panel */}
          {showHistory && (() => {
            const sessions = history.map(asDrawerSession);
            return (
              <div style={{ position: 'absolute', top: 73, right: 0, width: fullScreen ? '100%' : 420, bottom: 0, background: 'var(--bg-app)', zIndex: 10, display: 'flex', flexDirection: 'column', borderLeft: '1px solid var(--border)' }}>
                <div style={{ padding: '12px 16px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  {viewingSession
                    ? <><button onClick={() => setViewingSession(null)} style={{ background: 'none', border: 'none', color: 'var(--primary)', cursor: 'pointer', fontSize: 13, padding: 0 }}>← Back</button>
                        <span style={{ fontSize: 12, color: 'var(--text-2)' }}>{viewingSession.startedAt.toLocaleDateString()} {viewingSession.startedAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></>
                    : <><span style={{ fontWeight: 600, fontSize: 14 }}>Previous conversations</span>
                        <span style={{ fontSize: 12, color: historyError ? 'var(--danger)' : 'var(--text-muted)' }}>
                          {historyError ? historyError : `${sessions.length} saved`}
                        </span></>
                  }
                </div>
                <div style={{ flex: 1, overflowY: 'auto', padding: viewingSession ? '12px 16px' : 8, display: 'flex', flexDirection: 'column', gap: viewingSession ? 10 : 4 }}>
                  {viewingSession
                    ? viewingSession.messages.map(msg => {
                        if (msg.role === 'tool') return <div key={msg.id}><InvocationChip msg={msg} /></div>;
                        if (msg.role === 'skill') return <div key={msg.id}><SkillBanner msg={msg} /></div>;
                        if (msg.role === 'error') return <div key={msg.id} style={{ fontSize: 12, color: 'var(--danger)', background: 'rgba(239,68,68,0.08)', padding: '6px 10px', borderRadius: 8 }}>⚠ {msg.content}</div>;
                        const isUser = msg.role === 'user';
                        const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
                        return (
                          <div key={msg.id} style={{ display: 'flex', justifyContent: isUser ? 'flex-end' : 'flex-start' }}>
                            <div dir={dir} style={{ maxWidth: '85%', background: isUser ? 'var(--primary)' : 'var(--bg-panel)', color: 'var(--text)', padding: '8px 12px', borderRadius: isUser ? '14px 14px 4px 14px' : '14px 14px 14px 4px', fontSize: 13, lineHeight: 1.5 }}>
                              {msg.content}
                              <div style={{ fontSize: 10, color: isUser ? 'rgba(255,255,255,0.6)' : 'var(--text-muted)', marginTop: 3, textAlign: isUser ? 'right' : 'left' }}>
                                🕐 {new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                              </div>
                            </div>
                          </div>
                        );
                      })
                    : sessions.length === 0
                      ? <div style={{ textAlign: 'center', color: 'var(--text-muted)', fontSize: 13, marginTop: 40 }}>No previous conversations</div>
                      : sessions.map(s => {
                          const firstUser = s.messages.find(m => m.role === 'user');
                          const preview = firstUser?.content?.slice(0, 60) || '—';
                          const d = new Date(s.startedAt);
                          return (
                            <div key={s.id} onClick={() => setViewingSession(s)} style={{ padding: '10px 12px', borderRadius: 'var(--r-md)', background: 'var(--bg-card)', cursor: 'pointer', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 10 }}
                              onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                              onMouseLeave={e => e.currentTarget.style.background = 'var(--bg-card)'}>
                              <div style={{ flex: 1, minWidth: 0 }}>
                                <div style={{ fontSize: 11, color: 'var(--text-muted)', marginBottom: 3 }}>{d.toLocaleDateString()} {d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} · {s.messages.filter(m => m.role === 'user').length} messages</div>
                                <div style={{ fontSize: 13, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{preview}</div>
                              </div>
                              <button onClick={e => { e.stopPropagation(); deleteSession(s.id); }} title="Delete" style={{ background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer', fontSize: 14, padding: '2px 4px', borderRadius: 4, flexShrink: 0 }}
                                onMouseEnter={e => e.currentTarget.style.color = 'var(--danger)'}
                                onMouseLeave={e => e.currentTarget.style.color = 'var(--text-muted)'}>🗑</button>
                            </div>
                          );
                        })
                  }
                </div>
              </div>
            );
          })()}

          {/* Messages */}
          <div ref={listRef} style={{ flex: 1, overflowY: 'auto', padding: '16px 20px', display: 'flex', flexDirection: 'column', gap: 12 }}>
            {messages.map(msg => {
              if (msg.role === 'typing') return (
                <div key={msg.id} style={{ display: 'flex', gap: 6 }}>
                  <div style={{ background: 'var(--bg-panel)', padding: '12px 16px', borderRadius: '18px 18px 18px 4px', display: 'flex', gap: 5, alignItems: 'center' }}>
                    <span className="typing-dot" /><span className="typing-dot" /><span className="typing-dot" />
                  </div>
                </div>
              );
              if (msg.role === 'tool') return (
                <div key={msg.id} style={{ display: 'flex', alignItems: 'flex-start' }}>
                  <InvocationChip msg={msg} />
                </div>
              );
              if (msg.role === 'skill') return (
                <div key={msg.id}>
                  <SkillBanner msg={msg} />
                </div>
              );
              if (msg.role === 'user') {
                const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
                return (
                  <div key={msg.id} style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
                    <div style={{ maxWidth: '78%', background: 'var(--primary)', color: '#fff', padding: '10px 14px', borderRadius: '18px 18px 4px 18px', fontSize: 14, lineHeight: 1.5 }} dir={dir}>{msg.content}</div>
                    {msg.dlpMasked && <div style={{ fontSize: 11, color: 'var(--warning)', display: 'flex', alignItems: 'center', gap: 4 }}>🔒 נא לא לחשוף מידע רגיש</div>}
                  </div>
                );
              }
              if (msg.role === 'error') return (
                <div key={msg.id} style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                  <div style={{ maxWidth: '80%', background: 'rgba(239,68,68,0.12)', border: '1px solid rgba(239,68,68,0.3)', color: 'var(--danger)', padding: '10px 14px', borderRadius: '18px 18px 18px 4px', fontSize: 13 }}>⚠ {msg.content}</div>
                  <div style={{ fontSize: 11, color: 'var(--danger)', paddingLeft: 4 }}>⚠ Failed after {fmtDuration(msg.durationMs)} &nbsp;•&nbsp; 🕐 {fmtTime(msg.timestamp)}</div>
                </div>
              );
              // agent
              const dir = isHebrew(msg.content) ? 'rtl' : 'ltr';
              return (
                <div key={msg.id} style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                  <div style={{ maxWidth: '80%', background: 'var(--bg-panel)', color: 'var(--text)', padding: '10px 14px', borderRadius: '18px 18px 18px 4px', fontSize: 14, lineHeight: 1.5, whiteSpace: 'pre-wrap' }} dir={dir}>{msg.content}</div>
                  <div style={{ fontSize: 11, color: 'var(--text-muted)', paddingLeft: 4 }}>
                    {msg.isOpening ? `🕐 ${fmtTime(msg.timestamp)}` : `⏱ ${fmtDuration(msg.durationMs)}   •   🕐 ${fmtTime(msg.timestamp)}`}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Input */}
          <div style={{ padding: '12px 16px', borderTop: '1px solid var(--border)', background: 'var(--bg-app)' }}>
            <div style={{ display: 'flex', gap: 8, marginBottom: 6 }}>
              <textarea
                ref={inputRef}
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
                dir="auto"
                rows={1}
                disabled={pending}
                placeholder="Message…"
                style={{ flex: 1, resize: 'none', fontSize: 14 }}
              />
              <button onClick={sendMessage} disabled={pending || !input.trim()} style={{ background: 'var(--primary)', color: '#fff', padding: '0 14px', borderRadius: 'var(--r-md)', fontWeight: 700, fontSize: 18 }}>➤</button>
            </div>
            <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>
              {live
                ? 'הסוכן עונה כאן בדיוק כמו למשתמש אמיתי'
                : <React.Fragment>Use #SkillName to switch skills &nbsp;•&nbsp; @toolName to call tools</React.Fragment>}
            </div>
          </div>
        </div>
      </>
    );
  }

  /* ─────────────────── GMAIL CONNECTION (PER AGENT) ─────────────────── */
  function GmailAgentConnection({ agent }) {
    const [state, setState] = useState({ loaded: false, connected: false, email: null });
    const [busy, setBusy]   = useState(false);

    useEffect(() => {
      let live = true;
      gmailStatus(agent.id)
        .then(d => { if (live) setState({ loaded: true, connected: !!d.connected, email: d.email }); })
        .catch(() => { if (live) setState({ loaded: true, connected: false, email: null }); });
      return () => { live = false; };
    }, [agent.id]);

    async function disconnect() {
      setBusy(true);
      try {
        await gmailDisconnect(agent.id);
        setState({ loaded: true, connected: false, email: null });
      } finally {
        setBusy(false);
      }
    }

    const dotColor = !state.loaded ? 'var(--text-muted)' : state.connected ? 'var(--success)' : 'var(--text-muted)';

    return (
      <div style={{ borderTop: '1px solid var(--border)', padding: '12px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0 }}>
          <div style={{ width: 8, height: 8, borderRadius: '50%', background: dotColor, flexShrink: 0 }} />
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 12, fontWeight: 600 }}>Gmail account</div>
            <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {!state.loaded ? 'Checking…' : state.connected ? `Connected as ${state.email}` : 'Not connected — this agent cannot send email yet'}
            </div>
          </div>
        </div>
        {state.loaded && (
          state.connected ? (
            <button onClick={disconnect} disabled={busy}
              style={{ padding: '6px 12px', borderRadius: 'var(--r-sm)', background: 'var(--bg-hover)', border: '1px solid var(--border)', color: 'var(--text-2)', fontSize: 12, fontWeight: 600, opacity: busy ? 0.6 : 1 }}>
              {busy ? '…' : 'Disconnect'}
            </button>
          ) : (
            <button onClick={() => { window.location.href = gmailConnectUrl(agent.id); }}
              style={{ padding: '6px 12px', borderRadius: 'var(--r-sm)', background: 'var(--primary)', border: 'none', color: '#0a0a0a', fontSize: 12, fontWeight: 700 }}>
              Connect Gmail
            </button>
          )
        )}
      </div>
    );
  }

  /* ─────────────────── AGENT EDITOR ─────────────────── */
  /* ─────────────────── MANUAL TESTS TAB ─────────────────── */
  /**
   * Every conversation the builder has had with this agent in the test chat.
   * Deliberately not in Interactions — those are real end users; these are you
   * trying things. Same store, source 'test'.
   */
  function ManualTestsTab({ agent, onTest }) {
    const [sessions, setSessions] = useState(null);
    const [error, setError] = useState(null);
    const [query, setQuery] = useState('');
    const [open, setOpen] = useState(null);
    const [tick, setTick] = useState(0);

    useEffect(() => {
      let live = true;
      setError(null);
      const t = setTimeout(() => {
        apiListTestSessions(agent.id, { q: query })
          .then(d => { if (live) setSessions(d.sessions || []); })
          .catch(err => { if (live) { setError(err.message); setSessions([]); } });
      }, 250);
      return () => { live = false; clearTimeout(t); };
    }, [agent.id, query, tick]);

    async function remove(id) {
      if (!window.confirm('למחוק את שיחת הבדיקה הזאת?\n\nDelete this test conversation?')) return;
      await deleteChatSession(id).catch(() => {});
      if (open && open.id === id) setOpen(null);
      setTick(t => t + 1);
    }

    if (open) {
      const msgs = open.messages || [];
      return (
        <div style={{ maxWidth: 860 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 18, flexWrap: 'wrap' }}>
            <button onClick={() => setOpen(null)}
              style={{ background: 'var(--bg-hover)', color: 'var(--text-2)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13, border: '1px solid var(--border)' }}>← Back</button>
            <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>
              {new Date(open.started_at).toLocaleString()} · {fmtSessionDuration(open.duration_seconds)} · {msgs.length} messages
            </div>
            <button onClick={() => remove(open.id)}
              style={{ marginLeft: 'auto', background: 'var(--bg-hover)', color: 'var(--text-muted)', padding: '6px 12px', borderRadius: 'var(--r-md)', fontSize: 13, border: '1px solid var(--border)' }}>🗑 Delete</button>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {msgs.map((m, i) => {
              const isUser = m.role === 'user';
              return (
                <div key={i} style={{ display: 'flex', justifyContent: isUser ? 'flex-end' : 'flex-start' }}>
                  <div dir="auto" style={{
                    maxWidth: '82%', padding: '9px 13px', fontSize: 13.5, lineHeight: 1.6, whiteSpace: 'pre-wrap', wordBreak: 'break-word',
                    background: isUser ? 'var(--primary)' : 'var(--bg-card)', color: isUser ? '#0a0a0a' : 'var(--text)',
                    border: isUser ? 'none' : '1px solid var(--border)',
                    borderRadius: isUser ? '16px 16px 4px 16px' : '16px 16px 16px 4px',
                  }}>
                    {m.content}
                    {/* dir=ltr, or bidi drags the # and the wrench to the wrong end */}
                    {m.skill && <div dir="ltr" style={{ fontSize: 11, marginTop: 5, opacity: 0.75, textAlign: 'start' }}>#{m.skill}</div>}
                    {(m.tools || []).map((t, j) => (
                      <div key={j} dir="ltr" style={{ fontSize: 11, fontFamily: "'JetBrains Mono','Fira Code',monospace", marginTop: 5, opacity: 0.8, textAlign: 'start' }}>
                        🔧 {t.name}
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    return (
      <div style={{ maxWidth: 860 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16, flexWrap: 'wrap' }}>
          <div style={{ flex: 1, minWidth: 200 }}>
            <div style={{ fontWeight: 700, fontSize: 15 }}>Manual tests</div>
            <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 3 }}>
              השיחות שלך עם הסוכן בצ'אט הבדיקה. לא מופיעות ב-Interactions, וכל האסיסטנטים רואים אותן.
            </div>
          </div>
          {onTest && (
            <button onClick={onTest}
              style={{ background: 'var(--primary)', color: '#0a0a0a', padding: '8px 16px', borderRadius: 'var(--r-md)', fontWeight: 700, fontSize: 13, boxShadow: '0 2px 12px var(--primary-glow)' }}>
              Run a test
            </button>
          )}
        </div>

        <input value={query} onChange={e => setQuery(e.target.value)} dir="auto"
          placeholder="חיפוש בכל שיחות הבדיקה…" style={{ width: '100%', marginBottom: 14 }} />

        {error && (
          <div style={{ background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.3)', color: 'var(--danger)', padding: '9px 13px', borderRadius: 'var(--r-md)', fontSize: 12.5, marginBottom: 12 }}>
            {error}
          </div>
        )}

        {sessions === null ? (
          <div style={{ color: 'var(--text-muted)', fontSize: 13 }}>טוען…</div>
        ) : sessions.length === 0 ? (
          <div style={{ padding: '40px 24px', textAlign: 'center', background: 'var(--bg-card)', border: '1px dashed var(--border)', borderRadius: 'var(--r-lg)' }}>
            <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 6 }}>
              {query ? 'אין שיחת בדיקה שתואמת את החיפוש' : 'עוד לא בדקת את הסוכן הזה'}
            </div>
            <div style={{ fontSize: 12.5, color: 'var(--text-muted)' }}>
              {query ? 'נסה מילה אחרת.' : 'כל שיחה בצ\'אט הבדיקה נשמרת כאן אוטומטית.'}
            </div>
          </div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {sessions.map(s => {
              const first = (s.messages || []).find(m => m.role === 'user');
              return (
                <div key={s.id} onClick={() => setOpen(s)}
                  style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 14px', background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 'var(--r-md)', cursor: 'pointer' }}
                  onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--primary)'; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border)'; }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div dir="auto" style={{ fontSize: 13.5, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                      {(first && first.content) || '—'}
                    </div>
                    <div style={{ fontSize: 11.5, color: 'var(--text-muted)', marginTop: 3 }}>
                      {new Date(s.started_at).toLocaleString()} · {fmtSessionDuration(s.duration_seconds)} · {s.message_count} messages
                    </div>
                  </div>
                  <button onClick={e => { e.stopPropagation(); remove(s.id); }} title="Delete"
                    style={{ background: 'none', border: 'none', color: 'var(--text-muted)', fontSize: 14, padding: '2px 4px', flexShrink: 0 }}
                    onMouseEnter={e => { e.currentTarget.style.color = 'var(--danger)'; }}
                    onMouseLeave={e => { e.currentTarget.style.color = 'var(--text-muted)'; }}>🗑</button>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  /**
   * The one thing someone needs to start editing this agent in an editor: the
   * exact command, with this agent's id already in it. Copying beats typing a
   * uuid, and it is the only place the id is visible at all.
   */
  function PullCommandButton({ agentId }) {
    const [copied, setCopied] = useState(false);
    const command = `npx @8legs/cli pull ${agentId}`;
    return (
      <Btn title={command}
        onClick={() => navigator.clipboard.writeText(command).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2200);
        })}
        style={{ fontFamily: copied ? 'inherit' : MONO, color: copied ? 'var(--success)' : undefined }}>
        {copied ? '✓ הפקודה הועתקה' : <span dir="ltr">{'⌘ 8legs pull'}</span>}
      </Btn>
    );
  }

  /**
   * Which version of the agent you are looking at, and how to move between
   * them: the chip under the agent's name, and the panel it opens — every
   * branch, the share of real conversations each one takes, and the way to
   * start another.
   */
  function BranchChip({ agent, branch, onSwitch, onChanged, onBranches }) {
    const [branches, setBranches] = useState(null);
    const [open, setOpen] = useState(false);
    const [busy, setBusy] = useState(false);
    const [error, setError] = useState(null);

    const current = branch || agent._branch || 'main';
    const onMain = current === 'main';
    const isDraft = current === 'draft';

    const load = useCallback(async () => {
      try {
        const list = (await apiBranches(agent.id)).branches;
        setBranches(list);
        /* The header outside this chip says Live or not, and only the branch
           list knows which versions real conversations reach. */
        if (onBranches) onBranches(list);
      }
      catch (e) { setError(e.message); }
    }, [agent.id, onBranches]);
    useEffect(() => { load(); }, [load, agent._branch]);

    async function act(fn, then) {
      setBusy(true); setError(null);
      try { await fn(); await load(); if (then) then(); }
      catch (e) { setError(e.message); }
      finally { setBusy(false); }
    }

    const newBranch = () => {
      const name = prompt('שם הבראנץ׳ (למשל warmer-tone):');
      if (!name) return;
      act(() => apiBranchAction(agent.id, { name, from: onMain || isDraft ? 'main' : current }),
          () => { setOpen(false); onSwitch(name); });
    };
    const setWeight = (name, weight) => act(() => apiBranchAction(agent.id, { branch: name, weight }, 'PUT'));
    const stopAll = () => act(() => apiBranchAction(agent.id, { action: 'stop' }, 'PUT'));

    return (
      <div style={{ position: 'relative', display: 'inline-flex' }}>
        <Chip mono onClick={() => setOpen(o => !o)} title="החלף בראנץ׳"
              tone={isDraft ? 'draft' : 'neutral'}>
          <span style={{ opacity: 0.7, display: 'flex' }}>{Icons.branch}</span>
          <span dir="ltr">{current}</span>
          <span style={{ opacity: 0.6, display: 'flex' }}>{Icons.caret}</span>
        </Chip>

        {open && branches && (
          <div style={{
            position: 'absolute', top: 'calc(100% + 8px)', insetInlineStart: 0, zIndex: 40, minWidth: 320,
            border: '1px solid var(--border)', borderRadius: 'var(--r-md)',
            background: 'var(--bg-card)', boxShadow: 'var(--shadow-lg)', overflow: 'hidden',
          }}>
            {branches.map(b => (
              <div key={b.name} style={{
                display: 'flex', alignItems: 'center', gap: 10, padding: '9px 14px',
                borderBottom: '1px solid var(--border)',
                background: b.name === current ? 'var(--bg-hover)' : 'transparent',
              }}>
                <button onClick={() => { onSwitch(b.name); setOpen(false); }}
                  style={{ flex: 1, textAlign: 'start', background: 'none', border: 'none', cursor: 'pointer',
                           color: 'var(--text)', fontSize: 13, fontWeight: 600 }}>
                  <span dir="ltr" style={{ fontFamily: MONO }}>{b.name}</span>
                  {b.kind === 'draft' && <span style={{ color: 'var(--text-muted)', fontWeight: 500 }}>  טיוטה</span>}
                  {b.live && <span style={{ color: 'var(--success)', fontWeight: 500 }}>  חי</span>}
                </button>

                {/* A draft is a place to work, never something customers reach. */}
                {b.kind !== 'draft' && (
                  <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: 'var(--text-muted)' }}>
                    {/* main's share is whatever the branches leave over, so it
                        is shown and never typed into. */}
                    <input type="number" min="0" max="100" defaultValue={b.traffic_weight}
                      disabled={b.kind === 'main' || busy}
                      onBlur={e => { const v = Number(e.target.value);
                                     if (v !== b.traffic_weight) setWeight(b.name, v); }}
                      style={{ width: 58, fontSize: 12, padding: '3px 6px' }} />
                    <span>% מהשיחות</span>
                  </label>
                )}
              </div>
            ))}
            <div style={{ display: 'flex', gap: 8, padding: '10px 14px' }}>
              <Btn size="sm" icon={Icons.plus} onClick={newBranch} disabled={busy}>בראנץ׳ חדש</Btn>
              <Btn size="sm" onClick={stopAll} disabled={busy}
                   title="כל השיחות חוזרות ל-main. שיחות פעילות מסיימות היכן שהן.">עצור ניסויים</Btn>
            </div>
            {error && <div style={{ padding: '0 14px 10px', fontSize: 12, color: 'var(--danger)' }}>{error}</div>}
          </div>
        )}
      </div>
    );
  }

  /**
   * Editing never touches the live agent: it lands on a draft. This bar is the
   * only place that says so, and the only way to publish. On any other branch
   * there is nothing to warn about, so it stays out of the way.
   */
  function BranchBar({ agent, branch, onSwitch, onChanged }) {
    const [busy, setBusy] = useState(false);
    const [error, setError] = useState(null);
    const current = branch || agent._branch || 'main';

    if (current !== 'draft') return null;

    async function act(fn) {
      setBusy(true); setError(null);
      try { await fn(); onChanged && onChanged(); }
      catch (e) { setError(e.message); }
      finally { setBusy(false); }
    }

    const publish = () => act(() => apiBranchAction(agent.id, { action: 'publish' }));
    const discard = () => {
      if (!confirm('לבטל את הטיוטה ולחזור לגרסה החיה? השינויים שלא פורסמו יימחקו.')) return;
      act(() => apiDeleteBranch(agent.id, 'draft'));
    };

    return (
      <div style={{ marginBottom: 16 }}>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap',
          padding: '10px 16px', borderRadius: 'var(--r-md)',
          border: '1px solid rgba(250,204,21,0.35)', background: 'rgba(250,204,21,0.08)',
        }}>
          <span style={{ fontSize: 12.5, color: 'var(--text-2)' }}>
            שינויים שלא פורסמו. הסוכן החי עדיין עונה מהגרסה הקודמת.
          </span>
          <div style={{ marginInlineStart: 'auto', display: 'flex', gap: 8 }}>
            <Btn size="sm" onClick={discard} disabled={busy}>בטל טיוטה</Btn>
            <Btn size="sm" variant="primary" onClick={publish} disabled={busy}>{busy ? '…' : 'פרסם'}</Btn>
          </div>
        </div>
        {error && <div style={{ marginTop: 8, fontSize: 12, color: 'var(--danger)' }}>{error}</div>}
      </div>
    );
  }

  /** What a merge would change, field by field, before it changes anything. */
  function MergePanel({ agentId, branch, onClose, onMerged }) {
    const [diff, setDiff] = useState(null);
    const [busy, setBusy] = useState(false);
    const [error, setError] = useState(null);

    useEffect(() => {
      apiBranches(agentId, branch).then(r => setDiff(r.diff)).catch(e => setError(e.message));
    }, [agentId, branch]);

    async function merge() {
      setBusy(true);
      try { await apiBranchAction(agentId, { action: 'merge', branch }); onMerged(); }
      catch (e) { setError(e.message); setBusy(false); }
    }

    const nothing = diff && !diff.fields.length && !diff.skills.length && !diff.tools.length;
    const short = (v) => {
      const text = typeof v === 'string' ? v : JSON.stringify(v);
      return !text ? '(ריק)' : text.length > 160 ? text.slice(0, 160) + '…' : text;
    };

    return (
      <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)',
                                      display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 200 }}>
        <div onClick={e => e.stopPropagation()} style={{
          width: 'min(720px, 92vw)', maxHeight: '82vh', overflowY: 'auto',
          background: 'var(--bg-card)', border: '1px solid var(--border)',
          borderRadius: 'var(--r-lg)', padding: 22,
        }}>
          <div style={{ fontWeight: 800, fontSize: 17, marginBottom: 4 }}>
            מיזוג <span dir="ltr" style={{ fontFamily: 'monospace' }}>{branch}</span> ל-main
          </div>
          <div style={{ fontSize: 12.5, color: 'var(--text-muted)', marginBottom: 16 }}>
            אחרי המיזוג הסוכן החי עונה מהגרסה הזאת. מספר ה-WhatsApp והמפתח נשארים כפי שהם ב-main.
          </div>

          {error && <div style={{ fontSize: 12.5, color: 'var(--danger)', marginBottom: 12 }}>{error}</div>}
          {!diff && !error && <div style={{ color: 'var(--text-muted)', fontSize: 13 }}>טוען…</div>}
          {nothing && <div style={{ color: 'var(--text-muted)', fontSize: 13 }}>אין הבדלים בין הבראנץ׳ ל-main.</div>}

          {diff && diff.fields.map(f => (
            <div key={f.key} style={{ marginBottom: 14 }}>
              <div dir="ltr" style={{ fontSize: 11.5, fontWeight: 700, color: 'var(--text-muted)', marginBottom: 5 }}>{f.key}</div>
              <div style={{ fontSize: 12.5, background: 'rgba(239,68,68,0.08)', padding: '7px 10px',
                            borderRadius: 'var(--r-sm)', marginBottom: 4, whiteSpace: 'pre-wrap' }}>{short(f.main)}</div>
              <div style={{ fontSize: 12.5, background: 'rgba(34,197,94,0.10)', padding: '7px 10px',
                            borderRadius: 'var(--r-sm)', whiteSpace: 'pre-wrap' }}>{short(f.branch)}</div>
            </div>
          ))}

          {diff && [['סקילים', diff.skills], ['כלים', diff.tools]].map(([label, items]) => items.length > 0 && (
            <div key={label} style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 11.5, fontWeight: 700, color: 'var(--text-muted)', marginBottom: 5 }}>{label}</div>
              {items.map(it => (
                <div key={it.id} style={{ fontSize: 12.5, padding: '5px 0' }}>
                  <span style={{ color: it.change === 'added' ? 'var(--success)'
                                       : it.change === 'removed' ? 'var(--danger)' : 'var(--warning)',
                                 fontWeight: 700, marginInlineEnd: 8 }}>
                    {it.change === 'added' ? 'נוסף' : it.change === 'removed' ? 'נמחק' : 'שונה'}
                  </span>
                  {it.name || it.id}
                </div>
              ))}
            </div>
          ))}

          <div style={{ display: 'flex', gap: 10, marginTop: 20 }}>
            <button onClick={merge} disabled={busy || !diff || nothing}
              style={{ padding: '9px 20px', borderRadius: 'var(--r-md)', cursor: 'pointer',
                       background: 'var(--primary)', color: '#0a0a0a', fontWeight: 700, fontSize: 13,
                       opacity: busy || nothing ? 0.5 : 1 }}>
              {busy ? 'ממזג…' : 'מזג והפעל'}
            </button>
            <button onClick={onClose}
              style={{ padding: '9px 18px', borderRadius: 'var(--r-md)', cursor: 'pointer',
                       background: 'transparent', border: '1px solid var(--border)',
                       color: 'var(--text-2)', fontWeight: 600, fontSize: 13 }}>ביטול</button>
          </div>
        </div>
      </div>
    );
  }

  /**
   * What the open section contains, nested under it in the rail: every skill,
   * or every tool, and the way to add one.
   */
  function RailList({ list }) {
    const row = (item) => (
      <button key={item.key} onClick={item.onClick} title={item.label}
        style={{
          display: 'flex', alignItems: 'center', gap: 6, width: '100%', textAlign: 'left',
          padding: '6px 10px', paddingInlineStart: 30, borderRadius: 8, cursor: 'pointer',
          fontSize: 12, fontFamily: item.mono ? MONO : 'inherit',
          background: item.active ? 'var(--primary-dim)' : 'transparent',
          color: item.active ? 'var(--primary)' : 'var(--text-2)',
          fontWeight: item.active ? 700 : 500,
        }}
        onMouseEnter={e => { if (!item.active) e.currentTarget.style.background = 'var(--bg-hover)'; }}
        onMouseLeave={e => { if (!item.active) e.currentTarget.style.background = 'transparent'; }}
      >
        <span style={{ flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{item.label}</span>
        {item.note && <span style={{ fontSize: 10, color: 'var(--text-muted)', flexShrink: 0 }}>{item.note}</span>}
      </button>
    );

    return (
      <div style={{ padding: '4px 0 8px', display: 'flex', flexDirection: 'column', gap: 1 }}>
        {list.sections.map(sec => (
          <React.Fragment key={sec.label}>
            {list.sections.length > 1 && (
              <Eyebrow style={{ fontSize: 9, padding: '6px 10px 3px', paddingInlineStart: 30 }}>{sec.label}</Eyebrow>
            )}
            {sec.items.length === 0
              ? <div style={{ fontSize: 11.5, color: 'var(--text-muted)', padding: '5px 10px', paddingInlineStart: 30 }}>—</div>
              : sec.items.map(row)}
          </React.Fragment>
        ))}
        {list.onNew && (
          <button onClick={list.onNew}
            style={{
              marginTop: 6, marginInlineStart: 30, marginInlineEnd: 4, padding: '6px 8px',
              borderRadius: 8, fontSize: 11.5, fontWeight: 700, cursor: 'pointer',
              background: 'var(--bg-hover)', border: '1px solid var(--border)', color: 'var(--primary)',
            }}>{list.newLabel}</button>
        )}
      </div>
    );
  }

  /** The tabs of an agent, as the rail down the left of the editor. */
  const AGENT_NAV = [
    { id: 'configuration', label: 'Configuration', icon: Icons.sliders },
    { id: 'skills',        label: 'Skills',        icon: Icons.hash },
    { id: 'tools',         label: 'Tools',         icon: Icons.code },
    { id: 'knowledge',     label: 'Knowledge',     icon: Icons.database },
    { id: 'manual tests',  label: 'Manual tests',  icon: Icons.flask },
    { id: 'export',        label: 'Export',        icon: Icons.export },
    { id: 'whatsapp',      label: 'WhatsApp',      icon: Icons.phone },
  ];

  function AgentEditor({ agent: fromApp, onUpdate, onBack, initialTab, onTest, onReload, onCrumbs }) {
    const [tab, setTab] = useState(initialTab || 'configuration');

    /**
     * Which branch this editor is on.
     *
     * null means the one the app already holds — main, or the draft the server
     * hands back once there is one. Choosing anything else loads that branch
     * here and keeps its edits here, so the app's own copy is never quietly
     * replaced by a version that is not live.
     */
    const [picked, setPicked] = useState(null);
    const [loaded, setLoaded] = useState(null);
    const [loadError, setLoadError] = useState(null);
    const [merging, setMerging] = useState(null);
    const [branches, setBranches] = useState(null);
    /* Skills and Tools hand their own list up to the rail, so it sits under
       the section it belongs to instead of eating a column of the editor. */
    const [railList, setRailList] = useState(null);
    const agent = picked ? loaded : fromApp;

    useEffect(() => {
      if (!picked) { setLoaded(null); return; }
      let stale = false;
      setLoadError(null);
      apiAgentOnBranch(fromApp.id, picked)
        .then(a => { if (!stale) setLoaded(a); })
        .catch(e => { if (!stale) { setLoadError(e.message); setPicked(null); } });
      return () => { stale = true; };
    }, [picked, fromApp.id]);

    /* The breadcrumb up top follows the agent and the open tab. */
    const navLabel = (AGENT_NAV.find(n => n.id === tab) || {}).label;
    useEffect(() => {
      if (!onCrumbs) return;
      onCrumbs(['Agents', fromApp.name, navLabel]);
      return () => onCrumbs(null);
    }, [onCrumbs, fromApp.name, navLabel]);

    const saveOnBranch = useCallback(async (next) => {
      try { await apiSaveOnBranch(next, picked); }
      catch (e) { setLoadError(e.message); }
    }, [picked]);
    const saveOnBranchDebounced = useDebounce(saveOnBranch, 600);

    const update = useCallback((next) => {
      if (!picked) return onUpdate(next);
      setLoaded(next);
      saveOnBranchDebounced(next);
    }, [picked, onUpdate, saveOnBranchDebounced]);

    /* Testing runs against the version on screen, branch and all — otherwise
       you would be talking to main while looking at an experiment. */
    const testThis = () => onTest && onTest(agent, picked || agent._branch || 'main');

    /* Picking the branch the app already holds just means "stop overriding". */
    function switchTo(name) {
      setPicked(name === (fromApp._branch || 'main') ? null : name);
    }

    if (picked && !loaded) {
      return (
        <div style={{ padding: 40, color: 'var(--text-muted)', fontSize: 14 }}>
          טוען את <span dir="ltr" style={{ fontFamily: MONO }}>{picked}</span>…
        </div>
      );
    }

    const branchNow = picked || agent._branch || 'main';
    const mergeable = branchNow !== 'main' && branchNow !== 'draft';
    /* A branch is live when real conversations reach it — main always, and any
       experiment a share of the traffic is routed to. */
    const branchInfo = (branches || []).find(b => b.name === branchNow);
    const liveNow = branchInfo ? branchInfo.live : branchNow === 'main';

    return (
      <div style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0 }}>
        {/* Who you are editing, on which branch, and what you can do to it */}
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 14, marginBottom: 20, flexWrap: 'wrap' }}>
          <button onClick={onBack} title="Back to agents" aria-label="Back to agents"
            style={{
              width: 34, height: 34, borderRadius: 10, flexShrink: 0, marginTop: 8, cursor: 'pointer',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              background: 'transparent', border: '1px solid transparent', color: 'var(--text-2)',
            }}
            onMouseEnter={e => { e.currentTarget.style.background = 'var(--bg-hover)'; e.currentTarget.style.color = 'var(--text)'; }}
            onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = 'var(--text-2)'; }}
          >{Icons.back}</button>

          <div style={{
            width: 52, height: 52, borderRadius: 15, flexShrink: 0, overflow: 'hidden',
            background: 'var(--bg-panel)', border: '1px solid var(--border)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <AvatarDisplay value={agent.avatar} size={52} />
          </div>

          <div style={{ minWidth: 0, flex: '1 1 260px' }}>
            <div dir="auto" style={{ fontWeight: 700, fontSize: 28, letterSpacing: '-0.03em', lineHeight: 1.15, overflow: 'hidden', textOverflow: 'ellipsis' }}>
              {agent.name}
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 9, flexWrap: 'wrap' }}>
              <BranchChip agent={agent} branch={picked} onSwitch={switchTo}
                          onBranches={setBranches}
                          onChanged={() => { setPicked(null); onReload && onReload(); }} />
              {branchNow === 'draft'
                ? <Chip tone="draft">Draft</Chip>
                : liveNow
                  ? <Chip tone="live" title="Real conversations reach this version">
                      Live{branchInfo && branchInfo.traffic_weight < 100 ? ` · ${branchInfo.traffic_weight}%` : ''}
                    </Chip>
                  : branchNow === 'main'
                    ? <Chip tone="neutral" title="Experiments are taking every conversation right now">
                        No traffic
                      </Chip>
                    : <Chip tone="neutral">Experiment</Chip>}
              <MadeOf agent={agent} style={{ marginInlineStart: 2 }} />
            </div>
          </div>

          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginInlineStart: 'auto', flexWrap: 'wrap' }}>
            {mergeable && (
              <Btn icon={Icons.merge} onClick={() => setMerging(branchNow)}>Merge to main</Btn>
            )}
            <PullCommandButton agentId={agent.id} />
            {onTest && (
              <Btn variant="primary" icon={Icons.play} onClick={testThis}
                   title={`Talk to ${branchNow} — the conversation is saved in Manual tests`}>
                Test
              </Btn>
            )}
          </div>
        </div>

        <BranchBar agent={agent} branch={picked} onSwitch={switchTo}
                   onChanged={() => { setPicked(null); onReload && onReload(); }} />
        {loadError && (
          <div style={{ marginBottom: 12, fontSize: 12.5, color: 'var(--danger)' }}>{loadError}</div>
        )}

        {merging && (
          <MergePanel agentId={agent.id} branch={merging}
            onClose={() => setMerging(null)}
            onMerged={() => { setMerging(null); switchTo('main'); onReload && onReload(); }} />
        )}

        {/* The rail, then whatever it points at */}
        <div style={{ display: 'flex', gap: 16, flex: 1, minHeight: 0 }}>
          <div style={{
            width: 196, flexShrink: 0, alignSelf: 'flex-start',

            <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
              {AGENT_NAV.map(n => {
                const on = tab === n.id;
                return (
                  <React.Fragment key={n.id}>
                  <button onClick={() => setTab(n.id)}
                    style={{
                      display: 'flex', alignItems: 'center', gap: 10, height: 38, padding: '0 12px',
                      borderRadius: 10, cursor: 'pointer', textAlign: 'left', fontSize: 13,
                      fontWeight: on ? 700 : 500,
                      background: on ? 'var(--sel)' : 'transparent',
                      color: on ? 'var(--sel-ink)' : 'var(--text-2)',
                      transition: 'background 0.16s, color 0.16s',
                    }}
                    onMouseEnter={e => { if (!on) { e.currentTarget.style.background = 'var(--bg-hover)'; e.currentTarget.style.color = 'var(--text)'; }}}
                    onMouseLeave={e => { if (!on) { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = 'var(--text-2)'; }}}
                  >
                    <span style={{ display: 'flex', opacity: on ? 1 : 0.75 }}>{n.icon}</span>
                    {n.label}
                  </button>
                  {on && railList && <RailList list={railList} />}

              })}
            </div>
          </div>

          <div style={{ flex: 1, minWidth: 0, overflowY: 'auto', paddingRight: 4 }}>
            {tab === 'configuration' && <ConfigurationTab agent={agent} onUpdate={update} />}
            {tab === 'skills' && <SkillsTab agent={agent} onUpdate={update} onRailList={setRailList} />}
            {tab === 'tools' && <ToolsTab agent={agent} onUpdate={update} onRailList={setRailList} />}
            {tab === 'knowledge' && <KnowledgeTab agent={agent} />}
            {tab === 'export' && <ExportTab agent={agent} />}
            {tab === 'manual tests' && <ManualTestsTab agent={agent} onTest={testThis} />}

        </div>

  /* ─────────────────── AGENT CARD ─────────────────── */

  /** Which channel answers for this agent, and which branch it is on. */
  function agentChannel(agent) { return agent.whatsapp && agent.whatsapp.enabled ? 'WhatsApp' : 'Widget'; }
  function agentBranch(agent)  { return agent._branch || 'main'; }
  /** An agent with no role written is still a blank — say so with the dot. */
  function agentReady(agent)   { return !!(agent.basePrompt || '').trim(); }

  /**
   * How many skills and how many tools — read, never clicked, so it is text.
   * The number carries the page's ink and the noun stays quiet beside it.
   */
  function MadeOf({ agent, short, style }) {
    const part = (n, word) => (
      <span>
        <span style={{ color: 'var(--text)', fontWeight: 600 }}>{n}</span>{' '}{word}
      </span>
    );
    return (
      <div dir="ltr" style={{
        display: 'flex', alignItems: 'center', gap: 7, fontFamily: MONO,
        fontSize: 12, color: 'var(--text-2)', whiteSpace: 'nowrap', ...style,
      }}>
        {part(agent.skills.length, short ? 'sk' : 'skills')}
        <span style={{ opacity: 0.4 }}>·</span>
        {part(agent.tools.length, short ? 'tl' : 'tools')}
      </div>
    );
  }

  /** The tile that opens a new agent, first in the grid. */
  function NewAgentTile({ onNew, onAssistant }) {
    const [hot, setHot] = useState(false);
    return (
      <div onClick={onNew}
        onMouseEnter={() => setHot(true)} onMouseLeave={() => setHot(false)}
        style={{
          borderRadius: 'var(--r-lg)', cursor: 'pointer', minHeight: 196,
          border: `1px dashed ${hot ? 'rgba(239,159,39,0.5)' : 'var(--border)'}`,
          background: hot ? 'rgba(239,159,39,0.04)' : 'transparent',
          display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
          gap: 12, padding: 20, textAlign: 'center', transition: 'all 0.18s ease',
        }}>
        <div style={{
          width: 44, height: 44, borderRadius: 13, background: 'var(--primary)', color: '#0a0a0a',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: hot ? '0 6px 20px var(--primary-glow)' : '0 2px 10px var(--primary-glow)',
          transform: hot ? 'translateY(-1px)' : 'none', transition: 'all 0.18s ease',
        }}>{Icons.plus}</div>
        <div>
          <div style={{ fontWeight: 700, fontSize: 14.5, color: 'var(--text)' }}>New agent</div>
          <div style={{ fontSize: 11.5, color: 'var(--text-muted)', marginTop: 5, lineHeight: 1.55 }}>
            Start blank, or{' '}
            <span onClick={e => { e.stopPropagation(); onAssistant(); }}
              style={{ color: 'var(--primary)', fontWeight: 600, cursor: 'pointer' }}>
              let the assistant build it
            </span>
          </div>
        </div>
      </div>
    );
  }

  function AgentCard({ agent, onEdit, onTest, onDuplicate, onDelete, onExport, isNew }) {
    const [hovered, setHovered] = useState(false);
    const ready = agentReady(agent);

    const iconActions = [
      { icon: Icons.copy,   label: 'Duplicate', fn: onDuplicate },
      { icon: Icons.export, label: 'Export',    fn: onExport },
      { icon: Icons.trash,  label: 'Delete',    fn: onDelete, danger: true },
    ];

    return (
      <div
        className={isNew ? 'card-highlight fade-in' : 'fade-in'}
        onMouseEnter={() => setHovered(true)}
        onMouseLeave={() => setHovered(false)}
        onClick={onEdit}
        style={{
          background: 'var(--bg-card)',
          borderRadius: 'var(--r-lg)',
          border: `1px solid ${hovered ? 'rgba(239,159,39,0.35)' : 'var(--border)'}`,
          boxShadow: hovered ? '0 0 26px rgba(239,159,39,0.10), var(--shadow)' : 'var(--shadow)',
          padding: '18px 18px 14px',
          display: 'flex', flexDirection: 'column', gap: 14, minHeight: 196,
          transition: 'border-color 0.2s, box-shadow 0.2s',
          cursor: 'pointer',
        }}>
        {/* Identity */}
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>
          <div style={{
            width: 44, height: 44, borderRadius: 13, flexShrink: 0, overflow: 'hidden',
            background: 'var(--bg-panel)', border: '1px solid var(--border)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <AvatarDisplay value={agent.avatar} size={44} />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div dir="auto" style={{ fontWeight: 700, fontSize: 15, letterSpacing: '-0.01em', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {agent.name}
            </div>
            <div dir="ltr" style={{ display: 'flex', alignItems: 'center', gap: 7, marginTop: 5, fontSize: 11, color: 'var(--text-muted)' }}>
              <span style={{ fontFamily: MONO }}>{agentBranch(agent)}</span>
              <span style={{ opacity: 0.5 }}>·</span>
              <span style={{ fontWeight: 600 }}>{agentChannel(agent)}</span>
            </div>
          </div>
          <StatusDot on={ready} />
        </div>

        {/* What it is made of */}
        <MadeOf agent={agent} />

        {/* Actions: the two you reach for carry a label, the rest are icons. */}
        <div style={{ marginTop: 'auto', display: 'flex', alignItems: 'center', gap: 6, borderTop: '1px solid var(--border)', paddingTop: 13 }}
             onClick={e => e.stopPropagation()}>
          <Btn size="sm" icon={Icons.edit} onClick={onEdit}>Edit</Btn>
          <Btn size="sm" icon={Icons.play} onClick={onTest}
               title="A real conversation through the live channel — it lands in Interactions">Test</Btn>
          <div style={{ marginInlineStart: 'auto', display: 'flex', gap: 2 }}>
            {iconActions.map(a => (
              <IconBtn key={a.label} onClick={a.fn} title={a.label} danger={a.danger}
                       style={{ opacity: hovered ? 1 : 0.55, transition: 'opacity 0.16s' }}>
                {a.icon}
              </IconBtn>
            ))}
          </div>
        </div>
      </div>
    );
  }

  /** The same agent as one line, for when the list gets long. */
  function AgentRow({ agent, onEdit, onTest, onDuplicate, onDelete, onExport, isNew }) {
    const [hot, setHot] = useState(false);
    return (
      <div className={isNew ? 'card-highlight fade-in' : 'fade-in'}
        onClick={onEdit}
        onMouseEnter={() => setHot(true)} onMouseLeave={() => setHot(false)}
        style={{
          display: 'flex', alignItems: 'center', gap: 14, padding: '11px 16px', cursor: 'pointer',
          background: 'var(--bg-card)', borderRadius: 'var(--r-md)',
          border: `1px solid ${hot ? 'rgba(239,159,39,0.35)' : 'var(--border)'}`,
          transition: 'border-color 0.16s',
        }}>
        <div style={{ width: 34, height: 34, borderRadius: 10, flexShrink: 0, overflow: 'hidden', background: 'var(--bg-panel)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <AvatarDisplay value={agent.avatar} size={34} />
        </div>
        <StatusDot on={agentReady(agent)} size={6} />
        <div dir="auto" style={{ flex: '1 1 180px', minWidth: 0, fontWeight: 650, fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          {agent.name}
        </div>
        <span dir="ltr" style={{ fontFamily: MONO, fontSize: 11.5, color: 'var(--text-muted)', width: 110, flexShrink: 0, overflow: 'hidden', textOverflow: 'ellipsis' }}>{agentBranch(agent)}</span>
        <span style={{ fontSize: 12, color: 'var(--text-2)', width: 80, flexShrink: 0 }}>{agentChannel(agent)}</span>
        <MadeOf agent={agent} short style={{ flexShrink: 0, fontSize: 11.5 }} />
        <div style={{ display: 'flex', gap: 4, flexShrink: 0 }} onClick={e => e.stopPropagation()}>
          <Btn size="sm" icon={Icons.edit} onClick={onEdit}>Edit</Btn>
          <Btn size="sm" icon={Icons.play} onClick={onTest}
               title="A real conversation through the live channel — it lands in Interactions">Test</Btn>
          <IconBtn onClick={onDuplicate} title="Duplicate">{Icons.copy}</IconBtn>
          <IconBtn onClick={onExport} title="Export">{Icons.export}</IconBtn>
          <IconBtn onClick={onDelete} title="Delete" danger>{Icons.trash}</IconBtn>
        </div>
      </div>
    );
  }
